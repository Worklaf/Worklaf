<style>
  body { font-family: Inter, system-ui, Arial; background:#0b0f16; color:#e6eef8; margin:20px; }

  .btn { background:#1f2937; color:#fff; border:0; padding:8px 12px; border-radius:8px; cursor:pointer; }

  .search { padding:8px 12px; border-radius:8px; border:1px solid #2b3440; background:#071022; color:#dbeafe; }

  .card { background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:12px; padding:12px; border:1px solid rgba(255,255,255,0.03); display:flex; gap:12px; align-items:flex-start; }
  .thumb { width:120px; height:120px; border-radius:8px; background:#071022; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .meta { flex:1; }
  .heading { display:flex; gap:8px; align-items:center; margin-bottom:6px; padding:8px; border-radius:8px; }
  .title { font-weight:700; font-size:16px; }
  .rarity-tag { font-weight:700; padding:6px 10px; border-radius:999px; font-size:13px; color:#071022; }
  .rarity-Mythic .heading { background:#2b0f3a; }
  .rarity-Mythic .rarity-tag { background:#8A2BE2; color:#fff; }
  .rarity-Legendary .heading { background:#2b2608; }
  .rarity-Legendary .rarity-tag { background:#FFD700; color:#000; }
  .rarity-Epic .heading { background:#2b1208; }
  .rarity-Epic .rarity-tag { background:#FF4500; color:#fff; }
  .rarity-Rare .heading { background:#08162b; }
  .rarity-Rare .rarity-tag { background:#1E90FF; color:#fff; }
  .rarity-Common .heading { background:#111214; }
  .rarity-Common .rarity-tag { background:#808080; color:#fff; }
  .attrs { font-size:13px; color:#bcd3ee; margin-top:6px; white-space:pre-wrap; }
  .footer { margin-top:8px; display:flex; gap:8px; align-items:center; }
  .badge { height:20px; }
  .hidden { display:none !important; }
  .topbar { display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .sort-select { padding:8px 10px; border-radius:8px; background:#071022; color:#dbeafe; border:1px solid #2b3440; }
  a.link-btn { background:#0b5cff; color:#fff; padding:6px 10px; border-radius:8px; text-decoration:none; font-size:13px; }
</style>
</head>

const counts = {"Common": 83, "Epic": 27, "Legendary": 17, "Rare": 45, "Mythic": 8};

function rarityColor(r){ const map = {'Mythic':'8A2BE2','Legendary':'FFD700','Epic':'FF4500','Rare':'1E90FF','Common':'808080'}; return map[r] || '808080'; }
function esc_js(s){ return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function createCard(it){
  const card = document.createElement('div');
  card.className = 'card rarity-' + it.rarity;
  card.dataset.rarity = it.rarity;
  card.dataset.num = it.num;
  const img = it.image || '';
  const safeTitle = esc_js(it.title);
  const desc = esc_js(it.description);
  card.innerHTML = `
    <div class="thumb"><img src="${esc_js(img)}" alt="${safeTitle}" onerror="this.style.opacity=.25; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=200 height=200><rect width=100% height=100% fill=%23071022/></svg>'" /></div>
    <div class="meta">
      <div class="heading">
        <div class="title">#${it.num} — ${safeTitle}</div>
        <div style="flex:1"></div>
        <div class="rarity-tag">${it.rarity}</div>
      </div>
      <div class="attrs">${desc}</div>
      <div class="footer">
        <img class="badge" src="https://img.shields.io/badge/${it.rarity}-${counts[it.rarity] || 0}-${rarityColor(it.rarity)}" alt="${it.rarity}" />
        <a class="link-btn" href="https://omnihub.xyz/collection/arc-testnet/0x48cce0BC5b6EC30420De74A75a1C66419db8F114" target="_blank" rel="noopener">Open collection</a>
      </div>
    </div>
  `;
  return card;
}

const listEl = document.getElementById('list');
function render(arr){ listEl.innerHTML = ''; arr.forEach(i => listEl.appendChild(createCard(i))); }
render(items);

document.getElementById('filters').addEventListener('click', e=>{
  if(!e.target.dataset) return;
  const f = e.target.dataset.filter;
  if(!f) return;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  applyFilters();
});
document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('sort').addEventListener('change', applyFilters);

function applyFilters(){
  const active = document.querySelector('.btn.active').dataset.filter;
  const q = document.getElementById('search').value.trim().toLowerCase();
  const sort = document.getElementById('sort').value;
  let filtered = items.filter(it=>{
    if(active !== 'All' && it.rarity !== active) return false;
    if(q){
      return (String(it.num).includes(q) || it.title.toLowerCase().includes(q) || (it.description||'').toLowerCase().includes(q));
    }
    return true;
  });
  if(sort === 'num-asc') filtered.sort((a,b)=>a.num - b.num);
  if(sort === 'num-desc') filtered.sort((a,b)=>b.num - a.num);
  if(sort === 'rarity') {
    const order = {'Mythic':1,'Legendary':2,'Epic':3,'Rare':4,'Common':5};
    filtered.sort((a,b)=> (order[a.rarity]||9) - (order[b.rarity]||9) || a.num - b.num);
  }
  render(filtered);
}
