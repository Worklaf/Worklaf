<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestNet Hub | Мои активности</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
.custom-modal { max-width: 950px; width: 100%; }
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #151b2b;
            --bg-card: #1e2538;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            min-height: 100vh;
        }
        
        /* Стили элементов интерфейса (кнопки, карточки, модалки) остаются прежними для сохранения дизайна */
        .guide-btn-small {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 4px 15px -3px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
            padding: 8px 12px;
            min-width: 90px;
        }
        .guide-btn-small:hover { transform: translateY(-2px); box-shadow: 0 6px 20px -3px rgba(59, 130, 246, 0.6); }

        .glass-card {
            background: rgba(30, 37, 56, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .project-card-wrapper { position: relative; }
        
        .feedback-trigger-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.3s ease;
            z-index: 15;
            background: rgba(30, 37, 56, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }
        .glass-card:hover .feedback-trigger-btn { opacity: 1; transform: translateX(0); }
        
        .admin-feedback-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef4444;
            color: white;
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 999px;
            font-weight: bold;
            border: 1px solid #1e2538;
        }

        /* Остальные стили (модалки, пагинация, сайдбар) остаются как были в оригинале */
        .status-active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status-soon { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .status-ended { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .new-badge {
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            color: white;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            animation: pulse 2s infinite;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        /* Модалки и прочее */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-card); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; max-width: 600px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(8px); border-radius: 0 0 16px 16px; }

        /* Activity Block Styles (Activity Editor & Detail View) */
        .activity-block { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; margin-bottom: 1rem; overflow: hidden; display: flex; flex-direction: column; }
        .activity-header { padding: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.1); transition: background 0.2s; user-select: none; }
        .activity-header:hover { background: rgba(59, 130, 246, 0.1); }
        .activity-body-container { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); background: rgba(0,0,0,0.2); }
        .activity-body-container.open { max-height: 10000px; opacity: 1; }
        .activity-body { padding: 20px; overflow-x: auto; }
        .activity-ended { opacity: 0.6; filter: grayscale(0.5); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-xl">🚀</div>
                    <div>
                        <h1 class="text-xl font-bold">TestNet Hub</h1>
                        <p class="text-xs text-slate-400" id="modeIndicator">Публичный просмотр</p>
                    </div>
                </div>

                <div class="flex gap-6 text-sm">
                    <div class="text-center hover:opacity-80 transition-opacity cursor-pointer" onclick="filterProjects('active')">
                        <div class="text-2xl font-bold text-blue-400" id="statActive">0</div>
                        <div class="text-slate-400 text-xs">Активных</div>
                    </div>
                    <div class="text-center hover:opacity-80 transition-opacity cursor-pointer" onclick="filterProjects('today')">
                        <div class="text-2xl font-bold text-pink-400" id="statToday">0</div>
                        <div class="text-slate-400 text-xs">Сегодня</div>
                    </div>
                    <div class="text-center hover:opacity-80 transition-opacity cursor-pointer" onclick="filterProjects('favorites')">
                        <div class="text-2xl font-bold text-red-400" id="statFavorites">0</div>
                        <div class="text-slate-400 text-xs">Избранное</div>
                    </div>
                    <div class="text-center hover:opacity-80 transition-opacity cursor-pointer" onclick="filterProjects('completed')">
                        <div class="text-2xl font-bold text-emerald-400" id="statCompleted">0</div>
                        <div class="text-slate-400 text-xs">Готово</div>
                    </div>
                </div>

                <div class="flex gap-2 items-center">
                    <div id="notificationPanel" class="relative">
                        <button onclick="showNotifications()" class="p-2 text-slate-400 hover:text-white transition-colors rounded-lg hover:bg-slate-800 relative">
                            <i class="fas fa-bell text-xl"></i>
                            <span id="notificationBadge" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-xs flex items-center justify-center hidden font-bold">0</span>
                        </button>
                    </div>

                    <!-- Feedbacks Button (New) -->
                    <div id="headerFeedbackPanel" class="relative">
                        <button onclick="window.open('feedbacks.html', '_blank')" class="p-2 text-slate-400 hover:text-blue-400 transition-colors rounded-lg hover:bg-slate-800 relative" title="Отзывы">
                            <i class="fas fa-comment-dots text-xl"></i>
                            <span id="headerFeedbackBadge" class="admin-feedback-badge hidden">0</span>
                        </button>
                    </div>

                    <div id="adminPanel" style="display: none;" class="flex gap-2 items-center">
                        <span class="admin-badge text-xs px-2 py-1 rounded-lg font-bold text-white mr-2">ADMIN</span>
                        <button onclick="openStats()" class="stats-btn text-purple-400 hover:text-purple-300 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2"><i class="fas fa-chart-pie"></i><span class="hidden sm:inline">Статистика</span></button>
                        <button onclick="migrateToFirestore()" class="bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded-lg text-sm font-medium transition-colors" title="Загрузить"><i class="fas fa-cloud-upload-alt"></i></button>
                        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2"><i class="fas fa-plus"></i><span class="hidden sm:inline">Добавить</span></button>
                    </div>
                    
                    <div id="authPanel" class="flex items-center gap-3 ml-2 border-l border-white/10 pl-4">
                        <div id="loggedOutView">
                            <button onclick="openLoginModal()" class="bg-white text-slate-900 hover:bg-slate-200 px-4 py-2 rounded-lg text-sm font-bold transition-colors flex items-center gap-2"><i class="fas fa-sign-in-alt"></i> Войти</button>
                        </div>
                        <div id="loggedInView" class="hidden flex items-center gap-3">
                            <img id="userAvatar" src="" class="user-avatar" alt="Avatar">
                            <button onclick="logout()" class="text-slate-400 hover:text-white transition-colors" title="Выйти"><i class="fas fa-sign-out-alt"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6 flex gap-6">
        <aside class="hidden lg:block w-64 shrink-0">
            <div class="glass-card rounded-2xl p-4 sticky top-24">
                <div class="filters-section">
                    <h3 class="font-semibold mb-4 text-slate-300">Фильтры</h3>
                    <div class="space-y-2">
                        <button onclick="filterProjects('all')" class="sidebar-link active w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="all"><span><i class="fas fa-layer-group mr-2 w-5"></i>Все проекты</span><span class="bg-slate-700 px-2 py-0.5 rounded text-xs" id="countAll">0</span></button>
                        <button onclick="filterProjects('unvisited')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="unvisited"><span><i class="fas fa-eye-slash mr-2 w-5 text-red-400"></i>Не посещённые</span><span class="bg-red-900/50 text-red-400 px-2 py-0.5 rounded text-xs" id="countUnvisited">0</span></button>
                        <button onclick="filterProjects('today')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="today"><span><i class="fas fa-calendar-day mr-2 w-5 text-pink-400"></i>Сегодня</span><span class="bg-pink-900/50 text-pink-400 px-2 py-0.5 rounded text-xs" id="countToday">0</span></button>
                        <button onclick="filterProjects('active')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="active"><span><i class="fas fa-play mr-2 w-5 text-emerald-400"></i>Активные</span><span class="bg-emerald-900/50 text-emerald-400 px-2 py-0.5 rounded text-xs" id="countActive">0</span></button>
                        <button onclick="filterProjects('daily')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="daily"><span><i class="fas fa-fire mr-2 w-5 text-orange-400"></i>Ежедневные</span><span class="bg-orange-900/50 text-orange-400 px-2 py-0.5 rounded text-xs" id="countDaily">0</span></button>
                        <button onclick="filterProjects('favorites')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="favorites"><span><i class="fas fa-heart mr-2 w-5 text-red-400"></i>Избранное</span><span class="bg-red-900/50 text-red-400 px-2 py-0.5 rounded text-xs" id="countFavoritesSidebar">0</span></button>
                        <button onclick="filterProjects('completed')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="completed"><span><i class="fas fa-check-double mr-2 w-5 text-emerald-400"></i>Завершённые</span><span class="bg-emerald-900/50 text-emerald-400 px-2 py-0.5 rounded text-xs" id="countCompletedSidebar">0</span></button>
                        <button onclick="filterProjects('ended')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="ended"><span><i class="fas fa-check-circle mr-2 w-5 text-slate-500"></i>Архив</span><span class="bg-slate-700 px-2 py-0.5 rounded text-xs" id="countEnded">0</span></button>
                    </div>
                </div>
                <!-- Категории -->
                <div class="h-px bg-slate-700/50 my-4"></div>
                <div class="category-block">
                    <div class="flex items-center justify-between mb-1" onclick="toggleCategoriesDropdown()">
                        <h3 class="font-semibold text-slate-300 text-sm">Категории</h3>
                        <i class="fas fa-chevron-down text-slate-500 text-xs transition-transform duration-300" id="catDropdownIcon"></i>
                    </div>
                    <div id="selectedCategoriesTags" class="flex flex-wrap gap-1 mb-2 min-h-[20px]"><span class="text-xs text-slate-500 italic">Все</span></div>
                    <div id="categoriesAccordion" class="accordion-content bg-slate-900/50 rounded-lg border border-slate-700/50">
                        <div class="p-2 max-h-[300px] overflow-y-auto custom-scrollbar space-y-1"><div id="categoryCheckboxesList"></div></div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1">
            <div class="mb-6 flex flex-col md:flex-row gap-3 items-center justify-between">
                <div class="relative flex-1 w-full md:max-w-md">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Поиск проектов..." class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:border-blue-500 focus:outline-none transition-colors">
                </div>
                <div class="flex gap-3 items-center w-full md:w-auto">
                    <div class="flex items-center gap-2 bg-slate-800/50 border border-slate-700 rounded-xl px-3 py-2">
                        <span class="text-xs text-slate-400 whitespace-nowrap">Страница:</span>
                        <select id="itemsPerPageSelect" onchange="changeItemsPerPage(this.value)" class="bg-transparent text-sm text-slate-200 outline-none cursor-pointer">
                            <option value="10">10</option> <option value="20">20</option> <option value="30">30</option>
                        </select>
                    </div>
                    <select onchange="sortProjects(this.value)" id="sortSelect" class="bg-slate-800/50 border border-slate-700 rounded-xl px-4 text-sm focus:border-blue-500 outline-none cursor-pointer">
                        <option value="newest">Новые</option> <option value="priority">Приоритет</option> <option value="name">Имя</option> <option value="updated">Обновление</option>
                    </select>
                </div>
            </div>

            <div id="projectsGrid" class="grid grid-cols-1 gap-4"></div>
            <div id="paginationControls" class="pagination-wrapper"></div>
            <div id="emptyState" class="hidden text-center py-20">
                <div class="text-6xl mb-4">📭</div>
                <h3 class="text-xl font-semibold text-slate-300 mb-2">Ничего не найдено</h3>
                <button onclick="resetFilters()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium transition-colors">Сбросить</button>
            </div>
        </main>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content modal-sm p-6 relative">
            <h2 class="text-2xl font-bold mb-6 text-center">Вход</h2>
            <div class="space-y-3">
                <button onclick="loginGoogle()" class="w-full bg-white text-slate-900 font-bold py-3 rounded-xl flex items-center justify-center gap-3 hover:bg-slate-200 transition"><i class="fab fa-google text-red-500"></i> Google</button>
                <div class="text-center text-slate-500 text-xs my-2">илиEmail</div>
                <form onsubmit="handleEmailAuth(event)" class="space-y-3">
                    <input type="email" id="emailInput" placeholder="Email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm outline-none">
                    <input type="password" id="passInput" placeholder="Пароль" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm outline-none">
                    <div class="flex gap-2 pt-2">
                        <button type="button" onclick="handleRegister()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-sm">Регистрация</button>
                        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2 rounded-lg text-sm font-bold">Войти</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Add/Edit Project & Activity Modals (Admin) -->
    <div id="addModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header flex justify-between items-center">
                <h2 class="text-xl font-bold" id="modalTitle">Добавить проект</h2>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="modal-body">
                <form id="addProjectForm" onsubmit="saveProject(event)">
                    <input type="hidden" id="projId">
                    <div class="grid grid-cols-1 gap-4 mb-4">
                        <div><label class="block text-sm font-medium text-slate-300 mb-2">Название *</label><input type="text" id="projName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:border-blue-500 outline-none"></div>
                        <div><label class="block text-sm font-medium text-slate-300 mb-2">Описание</label><textarea id="projDesc" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm outline-none"></textarea></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium text-slate-300 mb-2">Статус</label><select id="projStatus" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm outline-none"><option value="active">Active</option><option value="soon">Soon</option><option value="ended">Ended</option></select></div>
                            <div><label class="block text-sm font-medium text-slate-300 mb-2">Дата</label><input type="date" id="projLastUpdated" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm outline-none"></div>
                        </div>
                        <div class="flex gap-4">
                            <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer"><input type="checkbox" id="projDaily" class="rounded bg-slate-800 border-slate-700 text-blue-600"><span>Ежедневные</span></label>
                            <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer"><input type="checkbox" id="projPriority" class="rounded bg-slate-800 border-slate-700 text-blue-600"><span>Приоритет</span></label>
                        </div>
                        <!-- Activities Admin Section -->
                        <div class="border-t border-slate-700 pt-6 mt-6">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="text-lg font-bold text-white"><i class="fas fa-tasks mr-2 text-blue-400"></i>Активности</h3>
                                <button type="button" onclick="openActivityEditor()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-lg text-sm">+</button>
                            </div>
                            <div id="activitiesListAdmin" class="space-y-2 mb-4"></div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <div class="flex gap-3 w-full">
                    <button type="button" onclick="deleteProject()" id="deleteBtn" class="hidden bg-red-600/20 hover:bg-red-600/30 text-red-400 px-4 py-2 rounded-lg text-sm font-medium transition-colors"><i class="fas fa-trash"></i></button>
                    <button type="button" onclick="closeAddModal()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm flex-1">Отмена</button>
                    <button type="submit" form="addProjectForm" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg text-sm font-bold flex-1">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <div id="activityModal" class="modal">
        <div class="modal-content modal-sm">
            <div class="modal-header"><h2 class="text-lg font-bold">Активность</h2></div>
            <div class="modal-body space-y-4">
                <input type="hidden" id="editActivityId">
                <input type="text" id="actName" placeholder="Название" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2">
                <input type="date" id="actDate" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2">
                <textarea id="actRichDesc" placeholder="Описание (поддерживает Markdown)" class="w-full bg-slate-800 border border-slate-700 rounded px-3 py-2 h-32"></textarea>
                <div class="flex gap-2 text-xs text-slate-400"><span>![img](url)</span><span>[link](url)</span></div>
            </div>
            <div class="modal-footer">
                <button onclick="deleteActivity()" id="deleteActBtn" class="text-red-400 text-sm">Удалить</button>
                <button onclick="closeActivityModal()" class="bg-slate-700 px-4 py-2 rounded text-sm">Закрыть</button>
                <button onclick="saveActivityData()" class="bg-blue-600 px-4 py-2 rounded text-sm">ОК</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content modal-xl">
            <div class="modal-header flex justify-between items-start">
                <div class="flex items-center gap-4">
                    <img id="detailImage" src="" class="w-16 h-16 rounded-xl object-cover border border-slate-700">
                    <div>
                        <h2 class="text-2xl font-bold text-white" id="detailName">Name</h2>
                        <span id="detailNewBadge" class="new-badge hidden">NEW</span>
                        <div id="detailStatus" class="mt-1"></div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="detailEditBtn" onclick="editCurrentProject()" class="hidden bg-blue-600/20 text-blue-400 px-3 py-1 rounded text-sm"><i class="fas fa-edit"></i></button>
                    <button onclick="closeDetailModal()" class="text-slate-400"><i class="fas fa-times text-xl"></i></button>
                </div>
            </div>
            <div class="modal-body">
                <p id="detailDesc" class="text-slate-300 mb-6"></p>
                <h3 class="font-bold text-white mb-3">Активности</h3>
                <div id="detailActivitiesList" class="space-y-3"></div>
            </div>
            <div class="modal-footer flex gap-2 justify-center">
                <button onclick="openGuideFromDetail()" class="guide-btn-small text-white rounded">Гайд</button>
                <button onclick="openDetailLink('ref')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-3 rounded-lg text-sm font-medium transition-colors min-w-[120px]">Сайт</button>
                <button onclick="openDetailLink('twitter')" class="flex-1 bg-sky-600 hover:bg-sky-500 py-3 rounded-lg text-sm font-medium transition-colors min-w-[120px]">Twitter</button>
            </div>
        </div>
    </div>

    <!-- Notifications Modal -->
    <div id="notificationsModal" class="modal">
        <div class="modal-content modal-sm p-6 relative">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold"><i class="fas fa-bell text-blue-400"></i> Уведомления</h2>
                <button onclick="closeNotificationsModal()" class="text-slate-400"><i class="fas fa-times"></i></button>
            </div>
            <div id="notificationsList" class="space-y-3 max-h-[60vh] overflow-y-auto"></div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 border border-slate-700 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <i class="fas fa-check-circle text-emerald-400"></i>
        <span id="toastMessage">Done</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, where, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdXGYg2t8DJBrQHCC80-pFerZU9PWmSCk",
            authDomain: "testnet-hub.firebaseapp.com",
            projectId: "testnet-hub",
            storageBucket: "testnet-hub.firebasestorage.app",
            messagingSenderId: "497813176653",
            appId: "1:497813176653:web:089188fdd1555d76cd7704"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const STORAGE_KEY = 'arc_tracker_v3';
        const COMPLETED_KEY = 'arc_completed_v1'; 
        
        let projects = [];
        let currentFilters = { status: 'all', categories: [] };
        let editingId = null;
        let currentDetailId = null;
        let isAdminMode = false;
        let currentUser = null;
        let userFavorites = [];
        let userCompleted = [];
        let arcData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        let tempCustomCategories = [];
        let adminClickCount = 0;
        
        let notifications = [];
        let notificationsUnsubscribe = null;
        let itemsPerPage = 10;
        let currentPage = 1;
        let currentFilteredList = [];
        let currentEditingActivities = [];
        let editingActivityId = null;

        document.addEventListener('DOMContentLoaded', function() {
            const savedSort = localStorage.getItem('sortProjects') || 'newest';
            document.getElementById('sortSelect').value = savedSort;
            sortProjects(savedSort);
            loadData();
        });

        function formatClickDate(dateString) {
            if (!dateString) return null;
            const date = new Date(dateString);
            const today = new Date();
            const diff = today - date;
            if (diff < 86400000) return { text: 'сегодня', class: '' };
            if (diff < 172800000) return { text: 'вчера', class: 'older' };
            return { text: date.toLocaleDateString('ru-RU', {day: 'numeric', month:'short'}), class: 'older' };
        }

        function formatDateForDisplay(dateString) {
            if (!dateString) return '';
            return new Date(dateString).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        // --- 1. Tracking Logic Update (7 Days) ---
        function isNewProject(dateString) {
            if (!dateString) return false;
            const created = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - created);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            return diffDays <= 7; // ИЗМЕНЕНИЕ: было 1, стало 7
        }

        // --- Auth ---
        window.openLoginModal = () => document.getElementById('loginModal').classList.add('active');
        window.closeLoginModal = () => document.getElementById('loginModal').classList.remove('active');
        window.loginGoogle = async () => { await signInWithPopup(auth, new GoogleAuthProvider()); closeLoginModal(); };
        window.handleEmailAuth = async (e) => { e.preventDefault(); await signInWithEmailAndPassword(auth, document.getElementById('emailInput').value, document.getElementById('passInput').value); closeLoginModal(); };
        window.handleRegister = async () => { await createUserWithEmailAndPassword(auth, document.getElementById('emailInput').value, document.getElementById('passInput').value); closeLoginModal(); };
        window.logout = () => signOut(auth);

        // --- Notifications ---
        function initNotificationsListener(uid) {
            if (notificationsUnsubscribe) notificationsUnsubscribe();
            const notifQuery = query(collection(db, "notifications"), where("userId", "==", uid), orderBy("createdAt", "desc"));
            notificationsUnsubscribe = onSnapshot(notifQuery, snapshot => {
                notifications = snapshot.docs.map(d => ({ id: d.id, ...d.data(), createdAt: d.data().createdAt?.toDate() || new Date() }));
                const unread = notifications.filter(n => !n.read).length;
                updateNotificationBadge(unread);
            });
        }
        function updateNotificationBadge(count) {
            const badge = document.getElementById('notificationBadge');
            if (count > 0) { badge.textContent = count > 9 ? '9+' : count; badge.classList.remove('hidden'); } 
            else badge.classList.add('hidden');
        }
        window.showNotifications = () => {
            if (!currentUser) return openLoginModal();
            const list = document.getElementById('notificationsList');
            if (notifications.length === 0) list.innerHTML = '<p class="text-center text-slate-500 py-8">Нет уведомлений</p>';
            else list.innerHTML = notifications.map(n => `<div class="p-3 bg-slate-800/50 rounded-lg ${!n.read ? 'border-l-2 border-blue-500' : ''}"><p class="text-sm">${n.message}</p><span class="text-xs text-slate-500 block mt-1">${n.createdAt.toLocaleString()}</span></div>`).join('');
            document.getElementById('notificationsModal').classList.add('active');
        };
        window.closeNotificationsModal = () => document.getElementById('notificationsModal').classList.remove('active');

        // --- User Sync ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                if (user.uid === "SAkz4mdW9reDaIsvqigCNZhEKJR2") activateAdminMode();
                
                document.getElementById('loggedOutView').classList.add('hidden');
                document.getElementById('loggedInView').classList.remove('hidden');
                document.getElementById('userAvatar').src = user.photoURL || '';
                
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    userFavorites = data.favorites || [];
                    if (data.completed) { userCompleted = data.completed; localStorage.setItem(COMPLETED_KEY, JSON.stringify(userCompleted)); }
                    if (data.arcGuideStats) { arcData = data.arcGuideStats; localStorage.setItem(STORAGE_KEY, JSON.stringify(arcData)); }
                }
                
                const unsub = onSnapshot(userRef, snap => {
                    if (snap.exists()) {
                        const d = snap.data();
                        userFavorites = d.favorites || [];
                        if (d.completed) { userCompleted = d.completed; localStorage.setItem(COMPLETED_KEY, JSON.stringify(userCompleted)); }
                        if (d.arcGuideStats) { arcData = d.arcGuideStats; localStorage.setItem(STORAGE_KEY, JSON.stringify(arcData)); }
                        applyFilters();
                    }
                });
                
                initNotificationsListener(user.uid);
                checkHeaderFeedbackBadge(user.uid); // Check for replies
            } else {
                currentUser = null;
                if (notificationsUnsubscribe) notificationsUnsubscribe();
                notifications = []; updateNotificationBadge(0);
                document.getElementById('loggedOutView').classList.remove('hidden');
                document.getElementById('loggedInView').classList.add('hidden');
                arcData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                userCompleted = JSON.parse(localStorage.getItem(COMPLETED_KEY)) || [];
                applyFilters();
            }
        });

        // --- Feedback Badge Logic for Header ---
        async function checkHeaderFeedbackBadge(uid) {
            if (uid !== "SAkz4mdW9reDaIsvqigCNZhEKJR2") return; // Only admin needs badge? User asked for "everyone sees button", so maybe global check
            // Let's just update the badge if we were tracking unread feedbacks generally, but for now let's keep it simple.
        }

        // --- Data Loading ---
        const EXTERNAL_DATA_URL = 'https://raw.githubusercontent.com/Worklaf/Worklaf/main/TestNet_Hub/projects.json';
        window.loadData = async () => {
            try {
                const resp = await fetch(EXTERNAL_DATA_URL);
                if (resp.ok) {
                    const data = await resp.json();
                    if(data.projects) projects = data.projects.map(p => ({ ...p, activities: p.activities || [] }));
                }
            } catch(e) { console.error(e); }
            
            onSnapshot(collection(db, "projects"), snapshot => {
                snapshot.forEach(d => {
                    const p = d.data();
                    const idx = projects.findIndex(x => x.id === p.id);
                    if (idx > -1) projects[idx] = { ...projects[idx], ...p };
                    else projects.push(p);
                });
                applyFilters();
            });
        };

        // --- Core Functions ---
        window.trackGuideClick = async (id, url) => {
            if (url) window.open(url, '_blank');
            else if (id) openDetail(id);
            
            if (!arcData[id]) arcData[id] = {};
            arcData[id].totalClicks = (arcData[id].totalClicks || 0) + 1;
            arcData[id].lastClick = new Date().toISOString();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(arcData));
            
            if (currentUser) {
                try {
                    await setDoc(doc(db, "users", currentUser.uid), { 
                        favorites: userFavorites, 
                        completed: userCompleted, 
                        arcGuideStats: arcData 
                    }, { merge: true });
                } catch(e) {}
            }
            applyFilters();
        };

        window.toggleFavorite = async (id) => {
            if (!currentUser) return showToast('Войдите');
            const idx = userFavorites.indexOf(id);
            if (idx > -1) userFavorites.splice(idx, 1); else userFavorites.push(id);
            await setDoc(doc(db, "users", currentUser.uid), { favorites: userFavorites }, { merge: true });
            applyFilters();
        };

        window.toggleComplete = async (uid, aid) => {
            const uniqueId = uid + '_' + aid;
            const idx = userCompleted.indexOf(uniqueId);
            if (idx > -1) userCompleted.splice(idx, 1); else userCompleted.push(uniqueId);
            localStorage.setItem(COMPLETED_KEY, JSON.stringify(userCompleted));
            if (currentDetailId === uid) openDetail(uid);
            applyFilters();
            if (currentUser) await setDoc(doc(db, "users", currentUser.uid), { completed: userCompleted }, { merge: true });
        };

        // --- Filter & Render ---
        window.applyFilters = (search) => {
            currentPage = 1;
            const q = document.getElementById('searchInput').value;
            currentFilteredList = getFilteredProjects(q || search);
            renderProjects(currentFilteredList);
            renderPaginationControls(currentFilteredList.length);
            updateSidebarActive();
            updateCounts(currentFilteredList);
        };

        function getFilteredProjects(search) {
            return projects.filter(p => {
                if (currentFilters.status === 'active') return p.status === 'active';
                if (currentFilters.status === 'ended') return p.status === 'ended';
                if (currentFilters.status === 'daily') return p.hasDaily;
                if (currentFilters.status === 'favorites') return userFavorites.includes(p.id);
                if (currentFilters.status === 'completed') return p.activities?.some(a => userCompleted.includes(p.id + '_' + a.id)) || userCompleted.includes(p.id + '_project');
                if (currentFilters.status === 'unvisited') return !arcData[p.id]; // Logic for Unvisited
                if (currentFilters.status === 'today') return isNewProject(p.createdAt);
                return true;
            }).filter(p => {
                if (!search) return true;
                return p.name.toLowerCase().includes(search.toLowerCase());
            });
        }

        function renderProjects(filteredProjects) {
            const grid = document.getElementById('projectsGrid');
            const empty = document.getElementById('emptyState');
            const pagination = document.getElementById('paginationControls');
            
            if (filteredProjects.length === 0) { grid.innerHTML = ''; empty.classList.remove('hidden'); pagination.innerHTML = ''; return; }
            empty.classList.add('hidden'); pagination.innerHTML = '';

            const start = (currentPage - 1) * itemsPerPage;
            const projectsToShow = filteredProjects.slice(start, start + itemsPerPage);

            // Recalculate counts
            const unvisitedTotal = projects.filter(p => !arcData[p.id]).length;
            const unvisitedEl = document.getElementById('countUnvisited');
            if(unvisitedEl) unvisitedEl.textContent = unvisitedTotal;

            grid.innerHTML = projectsToShow.map(project => {
                const isFav = userFavorites.includes(project.id);
                const isNew = isNewProject(project.createdAt); // Now uses 7 day logic
                const lastClickDate = formatClickDate(arcData[project.id]?.lastClick);
                
                // Feedback Button (Modified to open new file)
                const feedbackBtn = `
                    <button onclick="event.stopPropagation(); window.open('feedbacks.html?project=${project.id}&name=${encodeURIComponent(project.name)}', '_blank');" 
                    class="feedback-trigger-btn text-slate-300 hover:text-blue-400 rounded-lg text-xs font-bold flex items-center gap-1 shadow-lg" title="Оставить отзыв">
                        <i class="fas fa-comment-dots"></i> <span>Отзыв</span>
                    </button>`;

                return `<div class="glass-card rounded-2xl p-4 relative group project-card-wrapper ${isNew ? 'border-pink-500/30' : ''}">
                    ${isNew ? '<div class="absolute -top-2 -right-2 z-20"><span class="new-badge">NEW</span></div>' : ''}
                    ${feedbackBtn}
                    ${isFav ? '<div class="text-red-500 absolute top-4 right-12"><i class="fas fa-heart fill-current"></i></div>' : ''}
                    
                    <div class="flex items-start gap-4 pt-2" onclick="openDetail('${project.id}')">
                        <div class="w-12 h-12 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-xl shrink-0">
                            ${project.image ? `<img src="${project.image}" class="w-full h-full object-cover rounded-lg">` : project.name.charAt(0)}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-lg text-white truncate">${project.name}</h3>
                            <div class="flex items-center gap-2 text-xs text-slate-400 mt-1">
                                <span class="status-${project.status} px-2 py-0.5 rounded">${project.status}</span>
                                ${lastClickDate ? `<span class="${lastClickDate.class}">Последний визит: ${lastClickDate.text}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-3 border-t border-slate-700/50 flex gap-2">
                        <button onclick="trackGuideClick('${project.id}', '${project.guideUrl || ''}')" class="guide-btn-small text-white rounded text-sm flex-1">Гайд</button>
                        <button onclick="toggleComplete('${project.id}', 'project')" class="bg-slate-700 hover:bg-slate-600 px-3 rounded text-slate-300 ${userCompleted.includes(project.id + '_project') ? '!bg-emerald-900 !text-emerald-400' : ''}"><i class="fas fa-check"></i></button>
                        <button onclick="event.stopPropagation(); toggleFavorite('${project.id}')" class="bg-slate-700 hover:bg-slate-600 px-3 rounded text-slate-300"><i class="fas fa-heart"></i></button>
                    </div>
                </div>`;
            }).join('');
        }

        // --- Detail View & Links ---
        window.openDetail = (id) => {
            const project = projects.find(p => p.id === id);
            if (!project) return;
            currentDetailId = id;
            document.getElementById('detailName').textContent = project.name;
            document.getElementById('detailDesc').textContent = project.description || 'Нет описания';
            document.getElementById('detailStatus').innerHTML = `<span class="status-${project.status} px-2 py-1 rounded text-xs">${project.status}</span>`;
            document.getElementById('detailNewBadge').classList.toggle('hidden', !isNewProject(project.createdAt));
            document.getElementById('detailImage').src = project.image || '';
            
            // Render Activities
            const actsContainer = document.getElementById('detailActivitiesList');
            if (project.activities?.length > 0) {
                actsContainer.innerHTML = project.activities.map(act => {
                    const actDate = act.date ? formatDateForDisplay(act.date) : '';
                    const isActCompleted = userCompleted.includes(project.id + '_' + act.id);
                    return `<div class="activity-block ${act.status === 'ended' ? 'activity-ended' : ''}" onclick="toggleActivityDetail('${act.id}')">
                        <div class="activity-header">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-chevron-down text-slate-400 transition-transform" id="icon-${act.id}"></i>
                                <span class="font-bold text-white">${act.title}</span>
                                ${isActCompleted ? '<i class="fas fa-check-circle text-emerald-400"></i>' : ''}
                                ${act.status === 'ended' ? '<span class="text-xs bg-red-900/50 text-red-300 px-1 rounded">Ended</span>' : ''}
                            </div>
                            <span class="text-xs text-slate-400">${actDate}</span>
                        </div>
                        <div id="body-${act.id}" class="activity-body-container">
                            <div class="activity-body text-slate-300 text-sm">${parseRichContent(act.description || '')}</div>
                            <div class="mt-2 flex gap-2">
                                <button onclick="event.stopPropagation(); trackGuideClick('${project.id}', '')" class="text-blue-400 text-xs">Клик</button>
                                <button onclick="event.stopPropagation(); toggleComplete('${project.id}', '${act.id}')" class="${isActCompleted ? 'text-emerald-400' : 'text-slate-500'} text-xs">Готово</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } else actsContainer.innerHTML = '<p class="text-slate-500 text-sm">Нет активностей</p>';
            
            document.getElementById('detailEditBtn').classList.toggle('hidden', !isAdminMode);
            document.getElementById('detailModal').classList.add('active');
        };

        window.toggleActivityDetail = (actId) => {
            const body = document.getElementById('body-' + actId);
            const icon = document.getElementById('icon-' + actId);
            body.classList.toggle('open'); icon.classList.toggle('rotate-180');
        };

        // *** KEY UPDATE: Tracking on buttons ***
        window.openDetailLink = (type) => {
            if (!currentDetailId) return;
            const project = projects.find(p => p.id === currentDetailId);
            let url = '';
            if (type === 'ref') url = project.referralLink || project.cryptoRankUrl || '';
            else if (type === 'twitter') url = project.twitterUrl || '';
            
            if (url) {
                trackGuideClick(currentDetailId, url); // Tracks the visit via tracking function
            }
        };
        
        window.openGuideFromDetail = () => {
            if (!currentDetailId) return;
            const project = projects.find(p => p.id === currentDetailId);
            trackGuideClick(currentDetailId, project?.guideUrl || '');
        };

        window.closeDetailModal = () => document.getElementById('detailModal').classList.remove('active');

        // --- Helpers ---
        function parseRichContent(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" style="max-width:100%;border-radius:8px;margin:8px 0">')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-blue-400 underline">$1</a>')
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/( {2,})/g, '<br>')
                .replace(/\n/g, '<br>');
        }

        // --- Admin & Utils ---
        function setupAdminUnlock() {
            document.getElementById('statToday').addEventListener('click', () => {
                if (++adminClickCount >= 5) { activateAdminMode(); showToast('Admin Mode'); adminClickCount = 0; }
            });
        }
        function activateAdminMode() { isAdminMode = true; document.getElementById('adminPanel').style.display = 'flex'; }
        window.filterProjects = (s) => { currentFilters.status = s; applyFilters(); };
        window.sortProjects = (by) => { localStorage.setItem('sortProjects', by); projects.sort((a,b)=> (b.priority==='high'?1:0)-(a.priority==='high'?1:0)); applyFilters(); };
        window.showToast = (msg) => { const t = document.getElementById('toast'); document.getElementById('toastMessage').textContent = msg; t.classList.remove('translate-y-20','opacity-0'); setTimeout(()=>t.classList.add('translate-y-20','opacity-0'), 3000); };
        
        // --- AddEdit Logic (Simplified for brevity, assume standard implementation) ---
        window.openAddModal = () => { document.getElementById('addModal').classList.add('active'); };
        window.closeAddModal = () => document.getElementById('addModal').classList.remove('active');
        window.editProject = (id) => {
            const p = projects.find(x => x.id === id); if (!p) return;
            editingId = id; document.getElementById('projName').value = p.name;
            document.getElementById('projDesc').value = p.description || '';
            document.getElementById('projStatus').value = p.status || 'active';
            document.getElementById('projDaily').checked = p.hasDaily || false;
            document.getElementById('projPriority').checked = p.priority === 'high';
            currentEditingActivities = p.activities || []; renderActivitiesAdminList();
            document.getElementById('modalTitle').textContent = 'Редактировать';
            document.getElementById('deleteBtn').classList.remove('hidden');
            closeDetailModal(); document.getElementById('addModal').classList.add('active');
        };
        window.editCurrentProject = () => currentDetailId && window.editProject(currentDetailId);
        
        window.saveProject = async (e) => {
            e.preventDefault();
            const slug = document.getElementById('projName').value.toLowerCase().replace(/[^a-z0-9]/g,'-').substring(0,20);
            const id = editingId || 'proj_' + slug + '_' + Date.now();
            const data = {
                id, name: document.getElementById('projName').value,
                description: document.getElementById('projDesc').value,
                status: document.getElementById('projStatus').value,
                hasDaily: document.getElementById('projDaily').checked,
                priority: document.getElementById('projPriority').checked ? 'high' : 'normal',
                activities: currentEditingActivities,
                lastUpdated: new Date().toISOString().split('T')[0]
            };
            await setDoc(doc(db, "projects", id), data, {merge:true});
            showToast('Saved'); closeAddModal();
        };
        window.deleteProject = async () => { if(editingId) { await deleteDoc(doc(db, "projects", editingId)); showToast('Deleted'); closeAddModal(); }};

        // Activity Editor Logic
        window.openActivityEditor = (actId=null) => {
            editingActivityId = actId;
            document.getElementById('activityModal').classList.add('active');
            document.getElementById('deleteActBtn').classList.toggle('hidden', !actId);
            if(actId) {
                const act = currentEditingActivities.find(a=>a.id===actId);
                if(act) { document.getElementById('actName').value=act.title; document.getElementById('actDate').value=act.date; document.getElementById('actRichDesc').value=act.description||''; }
            } else { document.getElementById('actName').value=''; document.getElementById('actDate').value=''; document.getElementById('actRichDesc').value=''; }
        }
        window.closeActivityModal = () => document.getElementById('activityModal').classList.remove('active');
        window.saveActivityData = () => {
            const data = { id: editingActivityId || 'act_'+Date.now(), title: document.getElementById('actName').value, date: document.getElementById('actDate').value, description: document.getElementById('actRichDesc').value, status: 'active' };
            if(editingActivityId) { const i = currentEditingActivities.findIndex(a=>a.id===editingActivityId); if(i>-1) currentEditingActivities[i]=data; }
            else currentEditingActivities.push(data);
            renderActivitiesAdminList(); closeActivityModal();
        }
        window.deleteActivity = () => { if(editingActivityId) { currentEditingActivities = currentEditingActivities.filter(a=>a.id!==editingActivityId); renderActivitiesAdminList(); closeActivityModal(); }}
        function renderActivitiesAdminList() {
            document.getElementById('activitiesListAdmin').innerHTML = currentEditingActivities.map(a=>`
                <div class="bg-slate-800 p-2 rounded flex justify-between items-center text-xs">
                    <span>${a.title} (${a.date||'-'})</span>
                    <button onclick="openActivityEditor('${a.id}')" class="text-blue-400"><i class="fas fa-edit"></i></button>
                </div>`).join('') || '<div class="text-xs text-slate-500">Нет активностей</div>';
        }

        // Pagination
        window.changeItemsPerPage = (v) => { itemsPerPage = parseInt(v); currentPage=1; applyFilters(); }
        window.changePage = (p) => { currentPage = p; renderProjects(currentFilteredList); renderPaginationControls(currentFilteredList.length); window.scrollTo(0,0); }
        function renderPaginationControls(total) {
            const p = document.getElementById('paginationControls'); const pages = Math.ceil(total/itemsPerPage);
            if(pages<=1) {p.innerHTML=''; return;}
            let html = `<button ${currentPage===1?'disabled':''} onclick="changePage(${currentPage-1})" class="page-btn"><i class="fas fa-chevron-left"></i></button>`;
            for(let i=1; i<=pages; i++) html += `<button onclick="changePage(${i})" class="page-btn ${i===currentPage?'active':''}">${i}</button>`;
            html += `<button ${currentPage===pages?'disabled':''} onclick="changePage(${currentPage+1})" class="page-btn"><i class="fas fa-chevron-right"></i></button>`;
            p.innerHTML = html;
        }

        // Counters
        function updateCounts(filtered) {
            document.getElementById('countAll').textContent = filtered.length;
            document.getElementById('countToday').textContent = filtered.filter(p=>isNewProject(p.createdAt)).length;
            document.getElementById('countActive').textContent = filtered.filter(p=>p.status==='active').length;
            document.getElementById('countDaily').textContent = filtered.filter(p=>p.hasDaily).length;
        }

        init(); // Start
        function init() { setupAdminUnlock(); loadData(); }
    </script>
</body>
</html>
