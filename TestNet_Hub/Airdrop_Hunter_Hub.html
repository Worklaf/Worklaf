<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestNet Hub | Мои активности</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #151b2b;
            --bg-card: #1e2538;
            --accent: #3b82f6;
            --success: #10b981;
            --text-primary: #f1f5f9;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(30, 37, 56, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .sidebar-link {
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        
        .sidebar-link:hover, .sidebar-link.active {
            background: rgba(59, 130, 246, 0.1);
            border-left-color: var(--accent);
            color: white;
        }

        .status-active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status-soon { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .status-ended { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .tag {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            color: #60a5fa;
        }

        .new-badge {
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            color: white;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-xl { max-width: 1000px; }
        .modal-sm { max-width: 400px; }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }

        /* Project Rating Stars */
        .project-rating { display: flex; align-items: center; gap: 6px; }
        .project-rating .stars { display: flex; gap: 1px; font-size: 0.85rem; }
        .project-rating .stars i { color: #475569; }
        .project-rating .stars i.active { color: #fbbf24; }
        .project-rating .stars i.half { position: relative; }
        .project-rating .stars i.half::after {
            content: '\f5c0'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; left: 0; top: 0; width: 50%; overflow: hidden; color: #fbbf24;
        }
        .rating-value { font-size: 0.8rem; font-weight: 600; color: #fbbf24; }
        .rating-count { font-size: 0.7rem; color: #64748b; }
        
        .rate-btn {
            background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem;
            cursor: pointer; transition: all 0.2s;
        }
        .rate-btn:hover { background: rgba(251, 191, 36, 0.2); }
        .rate-btn.rated {
            background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); color: #34d399;
        }
        
        .rating-modal-stars { display: flex; justify-content: center; gap: 8px; font-size: 2.5rem; margin: 20px 0; }
        .rating-modal-stars .star { cursor: pointer; color: #475569; transition: all 0.2s; position: relative; }
        .rating-modal-stars .star:hover, .rating-modal-stars .star.active { color: #fbbf24; transform: scale(1.1); }
        .rating-modal-stars .star.half-active::before {
            content: '\f5c0'; position: absolute; left: 0; width: 50%; overflow: hidden; color: #fbbf24;
        }

        /* Activity Styles */
        .activity-block {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            margin-bottom: 1rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .activity-header {
            padding: 16px; cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; background: rgba(0,0,0,0.1); transition: background 0.2s; user-select: none;
        }
        .activity-header:hover { background: rgba(59, 130, 246, 0.1); }
        .activity-body-container {
            max-height: 0; opacity: 0; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); background: rgba(0,0,0,0.2);
        }
        .activity-body-container.open { max-height: 10000px; opacity: 1; }
        .activity-body { padding: 20px; overflow-x: auto; }
        .activity-ended { opacity: 0.6; filter: grayscale(0.5); }
        .rich-content img { max-width: 100%; border-radius: 8px; margin: 12px 0; display: block; }
        .rich-content a { color: #60a5fa; border-bottom: 1px dashed #60a5fa; }
        .rich-content blockquote { border-left: 3px solid #3b82f6; padding-left: 16px; margin: 12px 0; color: #94a3b8; font-style: italic; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .rotate-180 { transform: rotate(180deg); }
        .accordion-content { transition: max-height 0.3s ease-out, opacity 0.3s ease-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 2000px; opacity: 1; margin-top: 0.75rem; }
    </style>
</head>
<body class="antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-xl">🚀</div>
                    <div>
                        <h1 class="text-xl font-bold">TestNet Hub</h1>
                        <p class="text-xs text-slate-400" id="modeIndicator">Публичный просмотр</p>
                    </div>
                </div>

                <div class="flex gap-6 text-sm">
                    <div class="text-center cursor-pointer hover:opacity-80" onclick="filterProjects('active')">
                        <div class="text-2xl font-bold text-blue-400" id="statActive">0</div>
                        <div class="text-slate-400 text-xs">Активных</div>
                    </div>
                    <div class="text-center cursor-pointer hover:opacity-80" onclick="filterProjects('today')">
                        <div class="text-2xl font-bold text-pink-400" id="statToday">0</div>
                        <div class="text-slate-400 text-xs">Сегодня</div>
                    </div>
                    <div class="text-center cursor-pointer hover:opacity-80" onclick="filterProjects('favorites')">
                        <div class="text-2xl font-bold text-red-400" id="statFavorites">0</div>
                        <div class="text-slate-400 text-xs">Избранное</div>
                    </div>
                    <div class="text-center cursor-pointer hover:opacity-80" onclick="filterProjects('completed')">
                        <div class="text-2xl font-bold text-emerald-400" id="statCompleted">0</div>
                        <div class="text-slate-400 text-xs">Готово</div>
                    </div>
                </div>

                <div class="flex gap-2 items-center">
                    <div id="notificationPanel" class="relative">
                        <button onclick="showNotifications()" class="p-2 text-slate-400 hover:text-white transition-colors rounded-lg hover:bg-slate-800 relative">
                            <i class="fas fa-bell text-xl"></i>
                            <span id="notificationBadge" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-xs flex items-center justify-center hidden font-bold">0</span>
                        </button>
                    </div>

                    <div id="adminPanel" style="display: none;" class="flex gap-2 items-center">
                        <span class="bg-gradient-to-r from-blue-500 to-purple-600 text-xs px-2 py-1 rounded-lg font-bold text-white mr-2">ADMIN</span>
                        
                        <button onclick="openStats()" class="bg-purple-900/40 border border-purple-500/30 text-purple-400 hover:bg-purple-900/60 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                            <i class="fas fa-chart-pie"></i> <span class="hidden sm:inline">Статы</span>
                        </button>
                        <button onclick="window.open('reviews-admin.html', '_blank')" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                            <i class="fas fa-comments"></i> <span class="hidden sm:inline">Отзывы</span>
                            <span id="adminFeedbackBadge" class="hidden w-5 h-5 bg-red-500 rounded-full text-xs flex items-center justify-center font-bold text-white">0</span>
                        </button>
                        <!-- Кнопка "Добавить" теперь открывает отдельный файл -->
                        <button onclick="window.open('admin-editor.html', '_blank')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                            <i class="fas fa-plus"></i> <span class="hidden sm:inline">Добавить</span>
                        </button>
                    </div>

                    <div id="authPanel" class="flex items-center gap-3 ml-2 border-l border-white/10 pl-4">
                        <div id="loggedOutView">
                            <button onclick="openLoginModal()" class="bg-white text-slate-900 hover:bg-slate-200 px-4 py-2 rounded-lg text-sm font-bold transition-colors flex items-center gap-2">
                                <i class="fas fa-sign-in-alt"></i> Войти
                            </button>
                        </div>
                        <div id="loggedInView" class="hidden flex items-center gap-3">
                            <div class="text-right hidden sm:block">
                                <div id="userName" class="text-xs font-bold text-white">User</div>
                                <div class="text-[10px] text-emerald-400">Sync <i class="fas fa-check"></i></div>
                            </div>
                            <img id="userAvatar" src="" class="w-8 h-8 rounded-full border-2 border-blue-500 object-cover" alt="Avatar">
                            <button onclick="logout()" class="text-slate-400 hover:text-white transition-colors">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6 flex gap-6">
        <aside class="hidden lg:block w-64 shrink-0">
            <div class="glass-card rounded-2xl p-4 sticky top-24">
                <div class="mb-6">
                    <h3 class="font-semibold mb-4 text-slate-300">Фильтры</h3>
                    <div class="space-y-2">
                        <button onclick="filterProjects('all')" class="sidebar-link active w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="all">
                            <span><i class="fas fa-layer-group mr-2 w-5"></i>Все проекты</span>
                            <span class="bg-slate-700 px-2 py-0.5 rounded text-xs" id="countAll">0</span>
                        </button>
                        <button onclick="filterProjects('today')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="today">
                            <span><i class="fas fa-calendar-day mr-2 w-5 text-pink-400"></i>Сегодня</span>
                            <span class="bg-pink-900/50 text-pink-400 px-2 py-0.5 rounded text-xs" id="countToday">0</span>
                        </button>
                        <button onclick="filterProjects('active')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="active">
                            <span><i class="fas fa-play mr-2 w-5 text-emerald-400"></i>Активные</span>
                            <span class="bg-emerald-900/50 text-emerald-400 px-2 py-0.5 rounded text-xs" id="countActive">0</span>
                        </button>
                        <button onclick="filterProjects('favorites')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="favorites">
                            <span><i class="fas fa-heart mr-2 w-5 text-red-400"></i>Избранное</span>
                            <span class="bg-red-900/50 text-red-400 px-2 py-0.5 rounded text-xs" id="countFavoritesSidebar">0</span>
                        </button>
                        <button onclick="filterProjects('completed')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300 flex justify-between items-center" data-filter="completed">
                            <span><i class="fas fa-check-double mr-2 w-5 text-emerald-400"></i>Готово</span>
                            <span class="bg-emerald-900/50 text-emerald-400 px-2 py-0.5 rounded text-xs" id="countCompletedSidebar">0</span>
                        </button>
                    </div>
                </div>
                
                <div class="category-block">
                    <div class="flex items-center justify-between mb-1" onclick="toggleCategoriesDropdown()">
                        <h3 class="font-semibold text-slate-300 text-sm">Категории</h3>
                        <i class="fas fa-chevron-down text-slate-500 text-xs transition-transform duration-300" id="catDropdownIcon"></i>
                    </div>
                    <div id="selectedCategoriesTags" class="flex flex-wrap gap-1 mb-2 min-h-[20px]">
                        <span class="text-xs text-slate-500 italic">Все</span>
                    </div>
                    <div id="categoriesAccordion" class="accordion-content bg-slate-900/50 rounded-lg border border-slate-700/50">
                        <div class="p-2 max-h-[300px] overflow-y-auto custom-scrollbar space-y-1">
                            <div id="categoryCheckboxesList"></div>
                        </div>
                    </div>
                </div>

                <div class="category-block mt-4">
                    <h3 class="font-semibold text-slate-300 text-sm mb-3"><i class="fas fa-star mr-2 text-yellow-400"></i>Рейтинг</h3>
                    <div class="space-y-2">
                        <button onclick="filterByRating('all')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300" data-rating="all"><span>Все</span></button>
                        <button onclick="filterByRating('4plus')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300" data-rating="4plus"><span>⭐⭐⭐⭐+ (4.0+)</span></button>
                        <button onclick="filterByRating('3plus')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm text-slate-300" data-rating="3plus"><span>⭐⭐⭐+ (3.0+)</span></button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="flex-1">
            <div class="mb-6 flex flex-col md:flex-row gap-3 items-center justify-between">
                <div class="relative flex-1 w-full md:max-w-md">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Поиск проектов..." 
                           class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:border-blue-500 focus:outline-none transition-colors">
                </div>
                <div class="flex gap-3 items-center w-full md:w-auto">
                    <select id="itemsPerPageSelect" onchange="changeItemsPerPage(this.value)" class="bg-slate-800/50 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 outline-none cursor-pointer">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                    <select onchange="sortProjects(this.value)" id="sortSelect" class="bg-slate-800/50 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 outline-none cursor-pointer">
                        <option value="newest">Сначала новые</option>
                        <option value="priority">По приоритету</option>
                        <option value="name">По названию</option>
                        <option value="rating">По рейтингу</option>
                    </select>
                </div>
            </div>

            <div id="projectsGrid" class="grid grid-cols-1 gap-4"></div>
            <div id="paginationControls" class="pagination-wrapper"></div>
            <div id="emptyState" class="hidden text-center py-20">
                <div class="text-6xl mb-4">📭</div>
                <h3 class="text-xl font-semibold text-slate-300">Ничего не найдено</h3>
                <button onclick="resetFilters()" class="mt-4 bg-blue-600 px-4 py-2 rounded-lg text-sm">Сбросить фильтры</button>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="loginModal" class="modal">
        <div class="modal-content modal-sm p-6 relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
            <h2 class="text-2xl font-bold mb-6 text-center">Вход</h2>
            <div class="space-y-3">
                <button onclick="loginGoogle()" class="w-full bg-white text-slate-900 font-bold py-3 rounded-xl flex items-center justify-center gap-3 hover:bg-slate-200"><i class="fab fa-google text-red-500"></i> Google</button>
                <button onclick="loginTwitter()" class="w-full bg-[#1DA1F2] text-white font-bold py-3 rounded-xl flex items-center justify-center gap-3 hover:opacity-90"><i class="fab fa-twitter"></i> Twitter</button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content modal-xl">
            <div class="modal-header flex justify-between items-start">
                <div class="flex items-center gap-4">
                    <img id="detailImage" src="" class="w-16 h-16 rounded-xl object-cover border border-slate-700">
                    <div>
                        <h2 class="text-2xl font-bold" id="detailName">Название</h2>
                        <div class="flex gap-2 mt-1 flex-wrap" id="detailCategory"></div>
                    </div>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="modal-body">
                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700 mb-6">
                    <p id="detailDesc" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line"></p>
                </div>
                <h3 class="text-lg font-bold text-white mb-4">Активности</h3>
                <div id="detailActivitiesList" class="space-y-4"></div>
            </div>
            <div class="modal-footer">
                <div class="flex gap-3 pt-4 w-full justify-center">
                    <button id="detailEditBtn" onclick="editCurrentProject()" class="hidden bg-blue-600/20 text-blue-400 px-3 py-2 rounded-lg text-sm">Редактировать</button>
                    <button onclick="openDetailLink('twitter')" class="bg-sky-600 px-6 py-2 rounded-lg text-sm font-bold">Twitter</button>
                </div>
            </div>
        </div>
    </div>

    <div id="notificationsModal" class="modal">
        <div class="modal-content modal-sm p-6 relative">
            <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-bold">Уведомления</h2><button onclick="closeNotificationsModal()"><i class="fas fa-times"></i></button></div>
            <div id="notificationsList" class="space-y-3 max-h-[60vh] overflow-y-auto"></div>
        </div>
    </div>

    <div id="ratingModal" class="modal">
        <div class="modal-content modal-sm">
            <div class="modal-header flex justify-between"><h3 id="ratingProjectName" class="font-bold">Оценить</h3><button onclick="closeRatingModal()"><i class="fas fa-times"></i></button></div>
            <div class="modal-body text-center">
                <div class="rating-modal-stars" id="ratingModalStars"></div>
                <div id="ratingValueDisplay" class="text-3xl font-bold text-yellow-400">0.0</div>
            </div>
            <div class="modal-footer"><button onclick="saveProjectRating()" class="w-full bg-yellow-600 py-2 rounded-lg font-bold">Сохранить</button></div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 border border-slate-700 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <i class="fas fa-check-circle text-emerald-400"></i><span id="toastMessage">Готово</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, TwitterAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdXGYg2t8DJBrQHCC80-pFerZU9PWmSCk",
            authDomain: "testnet-hub.firebaseapp.com",
            projectId: "testnet-hub",
            storageBucket: "testnet-hub.firebasestorage.app",
            messagingSenderId: "497813176653",
            appId: "1:497813176653:web:089188fdd1555d76cd7704"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_ID = "SAkz4mdW9reDaIsvqigCNZhEKJR2";
        const STORAGE_KEY = 'arc_tracker_v3';
        const COMPLETED_KEY = 'arc_completed_v1';
        
        let projects = [];
        let categories = ['DeFi', 'Gaming', 'Infra', 'L1/L2', 'NFT', 'Social', 'Other'];
        let currentFilters = { status: 'all', categories: [] };
        let currentDetailId = null;
        let isAdminMode = false;
        let currentUser = null;
        let userFavorites = [];
        let userCompleted = [];
        let arcData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        let adminClickCount = 0;
        let notifications = [];
        let unreadNotificationsCount = 0;
        let projectRatings = {};
        let userProjectRatings = {};
        let currentRatingProjectId = null;
        let tempRatingValue = 0;
        let currentRatingFilter = 'all';
        let itemsPerPage = 10;
        let currentPage = 1;

        // --- Auth ---
        window.openLoginModal = () => document.getElementById('loginModal').classList.add('active');
        window.closeLoginModal = () => document.getElementById('loginModal').classList.remove('active');
        window.loginGoogle = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); closeLoginModal(); } catch(e) { console.error(e); } };
        window.loginTwitter = async () => { try { await signInWithPopup(auth, new TwitterAuthProvider()); closeLoginModal(); } catch(e) { console.error(e); } };
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                if (user.uid === ADMIN_ID) activateAdminMode();
                document.getElementById('loggedOutView').classList.add('hidden');
                document.getElementById('loggedInView').classList.remove('hidden');
                document.getElementById('userAvatar').src = user.photoURL || 'https://ui-avatars.com/api/?name=' + user.email;
                document.getElementById('userName').textContent = user.displayName || user.email.split('@')[0];
                
                // Load user data
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        const d = snap.data();
                        userFavorites = d.favorites || [];
                        userCompleted = d.completed || [];
                        applyFilters();
                    }
                });
                
                // Ratings
                onSnapshot(doc(db, "userRatings", user.uid), (snap) => {
                    if (snap.exists()) {
                        userProjectRatings = snap.data() || {};
                        applyFilters();
                    }
                });
            } else {
                currentUser = null;
                isAdminMode = false;
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('loggedOutView').classList.remove('hidden');
                document.getElementById('loggedInView').classList.add('hidden');
                userFavorites = [];
                userCompleted = JSON.parse(localStorage.getItem(COMPLETED_KEY)) || [];
                applyFilters();
            }
        });

        // --- Data Loading ---
        onSnapshot(collection(db, "projects"), (snapshot) => {
            const fireProjects = [];
            snapshot.forEach(doc => fireProjects.push({ ...doc.data(), id: doc.id }));
            
            // Merge with potentially local data or just replace
            // For simplicity, we use firestore data as source of truth here
            projects = fireProjects;
            
            // Extract categories
            const cats = new Set(['DeFi', 'Gaming', 'Infra', 'L1/L2', 'NFT', 'Social', 'Other']);
            projects.forEach(p => p.categories?.forEach(c => cats.add(c)));
            categories = Array.from(cats).sort();
            
            applyFilters();
        });

        onSnapshot(doc(db, "ratings", "summary"), (snap) => {
            if (snap.exists()) {
                projectRatings = snap.data().projects || {};
                applyFilters();
            }
        });

        // --- Filtering & Rendering ---
        window.filterProjects = (status) => { currentFilters.status = status; applyFilters(); };
        window.filterByRating = (r) => { currentRatingFilter = r; applyFilters(); };
        
        window.applyFilters = () => {
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = projects.filter(p => {
                if (currentFilters.status === 'active' && p.status !== 'active') return false;
                if (currentFilters.status === 'favorites' && !userFavorites.includes(p.id)) return false;
                if (currentFilters.status === 'completed') {
                    return p.activities && p.activities.some(a => userCompleted.includes(p.id + '_' + a.id));
                }
                if (currentFilters.categories.length > 0 && !p.categories.some(c => currentFilters.categories.includes(c))) return false;
                if (search && !p.name.toLowerCase().includes(search)) return false;
                
                // Rating filter
                const r = projectRatings[p.id]?.avg || 0;
                if (currentRatingFilter === '4plus' && r < 4) return false;
                if (currentRatingFilter === '3plus' && r < 3) return false;
                
                return true;
            });

            // Sorting
            const sortVal = document.getElementById('sortSelect').value;
            if (sortVal === 'newest') filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
            if (sortVal === 'rating') filtered.sort((a,b) => (projectRatings[b.id]?.avg || 0) - (projectRatings[a.id]?.avg || 0));
            
            renderProjects(filtered);
            updateCounts(filtered);
        };

        function renderProjects(list) {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = list.slice(0, itemsPerPage).map(p => {
                const rating = projectRatings[p.id]?.avg || 0;
                const count = projectRatings[p.id]?.count || 0;
                
                return `
                <div class="glass-card rounded-2xl p-4 relative group">
                    <div class="flex items-start gap-4">
                        <img src="${p.image || ''}" class="w-12 h-12 rounded-lg object-cover bg-slate-800" onerror="this.src='https://ui-avatars.com/api/?name=${p.name}'">
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between">
                                <h3 class="font-bold text-lg text-white hover:text-blue-400 cursor-pointer" onclick="openDetail('${p.id}')">${p.name}</h3>
                                ${isAdminMode ? `<button onclick="editProject('${p.id}')" class="text-slate-500 hover:text-blue-400"><i class="fas fa-edit"></i></button>` : ''}
                            </div>
                            <div class="flex gap-2 text-xs text-slate-400 my-1">
                                <span class="text-yellow-400"><i class="fas fa-star"></i> ${rating.toFixed(1)} (${count})</span>
                                <span class="bg-slate-700 px-1.5 rounded">${p.status}</span>
                            </div>
                            <p class="text-sm text-slate-400 line-clamp-2">${p.description || ''}</p>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            if (list.length === 0) document.getElementById('emptyState').classList.remove('hidden');
            else document.getElementById('emptyState').classList.add('hidden');
        }

        // --- Logic ---
        window.openDetail = (id) => {
            const p = projects.find(proj => proj.id === id);
            if (!p) return;
            currentDetailId = id;
            document.getElementById('detailName').textContent = p.name;
            document.getElementById('detailDesc').textContent = p.description || '';
            document.getElementById('detailImage').src = p.image || '';
            
            // Render Activities
            const list = document.getElementById('detailActivitiesList');
            list.innerHTML = (p.activities || []).map(act => `
                <div class="activity-block">
                    <div class="activity-header" onclick="this.nextElementSibling.classList.toggle('open')">
                        <span class="font-bold text-white">${act.title}</span>
                        <i class="fas fa-chevron-down text-slate-400"></i>
                    </div>
                    <div class="activity-body-container">
                        <div class="activity-body rich-content text-slate-300 text-sm">
                            ${parseRichContent(act.description)}
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('detailEditBtn').classList.toggle('hidden', !isAdminMode);
            document.getElementById('detailModal').classList.add('active');
        };

        window.closeDetailModal = () => document.getElementById('detailModal').classList.remove('active');

        // NEW: Open external editor
        window.editProject = (id) => {
            window.open('admin-editor.html?edit=' + id, '_blank');
        };
        
        window.editCurrentProject = () => {
            if (currentDetailId) window.editProject(currentDetailId);
        };

        function activateAdminMode() {
            isAdminMode = true;
            document.getElementById('adminPanel').style.display = 'flex';
            document.getElementById('modeIndicator').textContent = 'Admin Mode';
            applyFilters();
        }

        function updateCounts(filtered) {
            document.getElementById('countAll').textContent = filtered.length;
            document.getElementById('statActive').textContent = filtered.filter(p => p.status === 'active').length;
        }

        function parseRichContent(text) {
            if (!text) return '';
            return text.replace(/\n/g, '<br>').replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
        }

        // Setup Helpers
        document.getElementById('searchInput').addEventListener('keyup', applyFilters);
    </script>
</body>
</html>
