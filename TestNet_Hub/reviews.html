<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestNet Hub | Отзывы — Админ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #151b2b;
            --bg-card: #1e2538;
            --accent: #3b82f6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            background-image:
                radial-gradient(circle at 20% 50%, rgba(59,130,246,0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16,185,129,0.1) 0%, transparent 50%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 37, 56, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .feedback-card {
            background: rgba(30, 37, 56, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }
        .feedback-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
        }
        .feedback-card.unread {
            border-left: 4px solid #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }
        .feedback-card.has-reply {
            border-left: 4px solid #10b981;
        }
        .admin-reply-box {
            background: rgba(59, 130, 246, 0.1);
            border-left: 3px solid #3b82f6;
            border-radius: 0 8px 8px 0;
            padding: 10px 14px;
            margin-top: 10px;
        }
        .filter-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(30,37,56,0.6);
            color: #94a3b8;
        }
        .filter-btn:hover, .filter-btn.active {
            background: rgba(59,130,246,0.2);
            border-color: #3b82f6;
            color: white;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            padding: 24px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .stats-card {
            background: rgba(30, 37, 56, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px 20px;
            text-align: center;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card border-b border-white/10">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-yellow-500 to-orange-600 flex items-center justify-center text-xl">💬</div>
                <div>
                    <h1 class="text-xl font-bold">Отзывы и предложения</h1>
                    <p class="text-xs text-slate-400">Админ-панель</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="authStatus" class="text-sm text-slate-400">Загрузка...</div>
                <a href="Airdrop_Hunter_Hub.html" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i>Назад
                </a>
            </div>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 py-6">

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="stats-card">
                <div class="text-2xl font-bold text-blue-400" id="statTotal">0</div>
                <div class="text-xs text-slate-400">Всего отзывов</div>
            </div>
            <div class="stats-card">
                <div class="text-2xl font-bold text-yellow-400" id="statUnread">0</div>
                <div class="text-xs text-slate-400">Непрочитанных</div>
            </div>
            <div class="stats-card">
                <div class="text-2xl font-bold text-emerald-400" id="statReplied">0</div>
                <div class="text-xs text-slate-400">С ответом</div>
            </div>
            <div class="stats-card">
                <div class="text-2xl font-bold text-purple-400" id="statProjects">0</div>
                <div class="text-xs text-slate-400">Проектов</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="flex flex-wrap gap-3 mb-6 items-center">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">
                <i class="fas fa-list mr-1"></i> Все
            </button>
            <button class="filter-btn" data-filter="unread" onclick="setFilter('unread')">
                <i class="fas fa-envelope mr-1"></i> Непрочитанные
            </button>
            <button class="filter-btn" data-filter="replied" onclick="setFilter('replied')">
                <i class="fas fa-reply mr-1"></i> С ответом
            </button>
            <button class="filter-btn" data-filter="noreplied" onclick="setFilter('noreplied')">
                <i class="fas fa-clock mr-1"></i> Без ответа
            </button>

            <div class="ml-auto">
                <select id="projectFilter" onchange="setProjectFilter(this.value)" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 outline-none cursor-pointer">
                    <option value="">Все проекты</option>
                </select>
            </div>

            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Поиск..." oninput="renderFeedback()" class="bg-slate-800 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-sm outline-none w-48 focus:border-blue-500">
            </div>
        </div>

        <!-- Feedback list -->
        <div id="feedbackContainer" class="space-y-3">
            <div class="text-center py-20 text-slate-500">
                <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                <p>Загрузка отзывов...</p>
            </div>
        </div>
    </div>

    <!-- Reply Modal -->
    <div id="replyModal" class="modal">
        <div class="modal-content">
            <h2 class="text-lg font-bold mb-2 flex items-center gap-2"><i class="fas fa-reply text-blue-400"></i> Ответить на отзыв</h2>
            <div id="replyOriginal" class="bg-slate-800/50 p-3 rounded-lg mb-4 text-sm text-slate-300"></div>
            <textarea id="replyText" rows="4" placeholder="Ваш ответ..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:border-blue-500 outline-none mb-4"></textarea>
            <div class="flex gap-3">
                <button onclick="closeReplyModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-sm">Отмена</button>
                <button onclick="submitReply()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2 rounded-lg text-sm font-bold">Отправить ответ</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 border border-slate-700 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <i class="fas fa-check-circle text-emerald-400"></i>
        <span id="toastMessage">OK</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, updateDoc, onSnapshot, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdXGYg2t8DJBrQHCC80-pFerZU9PWmSCk",
            authDomain: "testnet-hub.firebaseapp.com",
            projectId: "testnet-hub",
            storageBucket: "testnet-hub.firebasestorage.app",
            messagingSenderId: "497813176653",
            appId: "1:497813176653:web:089188fdd1555d76cd7704"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_UID = "SAkz4mdW9reDaIsvqigCNZhEKJR2";

        let allFeedback = [];
        let currentFilter = 'all';
        let currentProjectFilter = '';
        let currentUser = null;
        let replyingToId = null;
        let replyingToUserId = null;
        let replyingToProjectName = null;

        onAuthStateChanged(auth, function(user) {
            if (user && user.uid === ADMIN_UID) {
                currentUser = user;
                document.getElementById('authStatus').innerHTML = '<span class="text-emerald-400"><i class="fas fa-shield-alt mr-1"></i>Admin</span>';
                initFeedbackListener();
            } else {
                document.getElementById('authStatus').innerHTML = '<span class="text-red-400">Нет доступа</span>';
                document.getElementById('feedbackContainer').innerHTML = '<div class="text-center py-20"><div class="text-6xl mb-4">🔒</div><h3 class="text-xl text-slate-300 mb-2">Доступ запрещён</h3><p class="text-slate-500">Войдите как администратор на главной странице</p></div>';
            }
        });

        function initFeedbackListener() {
            const q = query(collection(db, "feedback"), orderBy("timestamp", "desc"));
            onSnapshot(q, function(snapshot) {
                allFeedback = snapshot.docs.map(function(d) {
                    const data = d.data();
                    return {
                        id: d.id,
                        ...data,
                        timestamp: data.timestamp && data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp || 0)
                    };
                });
                updateStats();
                populateProjectFilter();
                renderFeedback();
            });
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = allFeedback.length;
            document.getElementById('statUnread').textContent = allFeedback.filter(f => !f.read).length;
            document.getElementById('statReplied').textContent = allFeedback.filter(f => f.adminReply).length;
            const uniqueProjects = new Set(allFeedback.map(f => f.projectId));
            document.getElementById('statProjects').textContent = uniqueProjects.size;
        }

        function populateProjectFilter() {
            const select = document.getElementById('projectFilter');
            const projectNames = {};
            allFeedback.forEach(function(f) {
                if (f.projectId && f.projectName) projectNames[f.projectId] = f.projectName;
            });
            const current = select.value;
            select.innerHTML = '<option value="">Все проекты</option>';
            Object.entries(projectNames).sort((a, b) => a[1].localeCompare(b[1])).forEach(function([id, name]) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = name;
                select.appendChild(opt);
            });
            select.value = current;
        }

        window.setFilter = function(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.filter === filter);
            });
            renderFeedback();
        };

        window.setProjectFilter = function(val) {
            currentProjectFilter = val;
            renderFeedback();
        };

        window.renderFeedback = function() {
            const container = document.getElementById('feedbackContainer');
            const search = (document.getElementById('searchInput').value || '').toLowerCase();

            let filtered = allFeedback.filter(function(f) {
                if (currentFilter === 'unread') return !f.read;
                if (currentFilter === 'replied') return !!f.adminReply;
                if (currentFilter === 'noreplied') return !f.adminReply;
                return true;
            });

            if (currentProjectFilter) {
                filtered = filtered.filter(f => f.projectId === currentProjectFilter);
            }

            if (search) {
                filtered = filtered.filter(function(f) {
                    return (f.text && f.text.toLowerCase().includes(search)) ||
                           (f.userName && f.userName.toLowerCase().includes(search)) ||
                           (f.projectName && f.projectName.toLowerCase().includes(search));
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-16"><div class="text-5xl mb-3">📭</div><p class="text-slate-500">Нет отзывов по текущим фильтрам</p></div>';
                return;
            }

            container.innerHTML = filtered.map(function(fb) {
                const time = formatTime(fb.timestamp);
                const unreadClass = !fb.read ? 'unread' : '';
                const replyClass = fb.adminReply ? 'has-reply' : '';

                let replyHtml = '';
                if (fb.adminReply) {
                    const replyTime = fb.adminReplyTime ? formatTime(fb.adminReplyTime.toDate ? fb.adminReplyTime.toDate() : new Date(fb.adminReplyTime)) : '';
                    replyHtml = '<div class="admin-reply-box"><div class="text-xs text-blue-400 font-bold mb-1"><i class="fas fa-reply mr-1"></i>Ваш ответ ' + replyTime + '</div><div class="text-sm text-slate-300">' + escapeHtml(fb.adminReply) + '</div></div>';
                }

                return '<div class="feedback-card ' + unreadClass + ' ' + replyClass + '">' +
                    '<div class="flex items-start justify-between gap-3">' +
                    '<div class="flex items-center gap-3">' +
                    (fb.userPhoto ? '<img src="' + fb.userPhoto + '" class="w-9 h-9 rounded-full border border-slate-600">' : '<div class="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center text-sm font-bold">' + (fb.userName || '?')[0].toUpperCase() + '</div>') +
                    '<div>' +
                    '<div class="flex items-center gap-2 flex-wrap">' +
                    '<span class="font-bold text-white text-sm">' + (fb.userName || 'Аноним') + '</span>' +
                    '<span class="text-xs bg-blue-900/50 text-blue-300 px-2 py-0.5 rounded">' + (fb.projectName || fb.projectId) + '</span>' +
                    '</div>' +
                    '<div class="text-xs text-slate-500 mt-0.5">' + time + ' • ID: ' + fb.userId.substring(0,8) + '...</div>' +
                    '</div></div>' +
                    '<div class="flex items-center gap-2 shrink-0">' +
                    (!fb.read ? '<button onclick="markRead(\'' + fb.id + '\')" class="text-xs bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 px-3 py-1 rounded transition-colors">Прочитано</button>' : '') +
                    '<button onclick="openReplyModal(\'' + fb.id + '\')" class="text-xs bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 px-3 py-1 rounded transition-colors"><i class="fas fa-reply mr-1"></i>' + (fb.adminReply ? 'Изменить' : 'Ответить') + '</button>' +
                    '</div></div>' +
                    '<div class="mt-3 text-sm text-slate-300 leading-relaxed bg-slate-800/30 p-3 rounded-lg">' + escapeHtml(fb.text) + '</div>' +
                    replyHtml +
                    '</div>';
            }).join('');
        };

        window.markRead = async function(fbId) {
            try {
                await updateDoc(doc(db, "feedback", fbId), { read: true });
                showToast('Отмечено как прочитанное');
            } catch (e) { showToast('Ошибка'); console.error(e); }
        };

        window.openReplyModal = function(fbId) {
            const fb = allFeedback.find(f => f.id === fbId);
            if (!fb) return;
            replyingToId = fbId;
            replyingToUserId = fb.userId;
            replyingToProjectName = fb.projectName || fb.projectId;
            document.getElementById('replyOriginal').innerHTML =
                '<div class="flex items-center gap-2 mb-2"><span class="font-bold text-blue-400">' + (fb.userName || 'Аноним') + '</span><span class="text-slate-500 text-xs">о проекте ' + replyingToProjectName + '</span></div>' +
                '<div>' + escapeHtml(fb.text) + '</div>';
            document.getElementById('replyText').value = fb.adminReply || '';
            document.getElementById('replyModal').classList.add('active');
            document.getElementById('replyText').focus();
        };

        window.closeReplyModal = function() {
            document.getElementById('replyModal').classList.remove('active');
            replyingToId = null;
            replyingToUserId = null;
        };

        window.submitReply = async function() {
            if (!replyingToId) return;
            const replyText = document.getElementById('replyText').value.trim();
            if (!replyText) { showToast('Напишите ответ'); return; }

            try {
                // Save reply to feedback doc
                await updateDoc(doc(db, "feedback", replyingToId), {
                    adminReply: replyText,
                    adminReplyTime: new Date().toISOString(),
                    read: true
                });

                // Send notification to user
                if (replyingToUserId) {
                    await addDoc(collection(db, "notifications"), {
                        userId: replyingToUserId,
                        type: 'reply',
                        message: '💬 Ответ на ваш отзыв о «' + replyingToProjectName + '»: ' + replyText,
                        read: false,
                        createdAt: serverTimestamp()
                    });
                }

                closeReplyModal();
                showToast('Ответ отправлен и уведомление создано!');
            } catch (e) { showToast('Ошибка отправки'); console.error(e); }
        };

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        }

        function formatTime(date) {
            if (!date) return '';
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return 'только что';
            if (diff < 3600000) return Math.floor(diff/60000) + ' мин назад';
            if (diff < 86400000) return Math.floor(diff/3600000) + ' ч назад';
            return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(function() { t.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }
    </script>
</body>
</html>
