<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestNet Hub | Админ отзывы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #151b2b;
            --bg-card: #1e2538;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(30, 37, 56, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .back-btn {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .back-btn:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), rgba(139, 92, 246, 0.2));
        }

        .feedback-item {
            background: rgba(30, 37, 56, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .feedback-item:hover {
            border-color: rgba(59, 130, 246, 0.3);
        }

        .feedback-item.unread {
            border-left: 3px solid #3b82f6;
            background: rgba(59, 130, 246, 0.08);
        }

        .type-badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .type-suggestion { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .type-bug { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .type-review { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .type-question { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .type-other { background: rgba(148, 163, 184, 0.2); color: #94a3b8; }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(30, 37, 56, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: white;
        }

        .project-group {
            margin-bottom: 24px;
        }

        .project-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .project-header:hover {
            background: rgba(59, 130, 246, 0.15);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .notification-badge {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .stat-value {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="antialiased">
    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Header -->
        <header class="mb-8">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-4">
                    <a href="reviews.html" class="back-btn px-4 py-2 rounded-lg text-blue-400 hover:text-white transition-colors flex items-center gap-2">
                        <i class="fas fa-arrow-left"></i>
                        <span class="hidden sm:inline">К отзывам</span>
                    </a>
                    <div>
                        <h1 class="text-2xl font-bold flex items-center gap-3">
                            <i class="fas fa-shield-alt text-purple-400"></i>
                            Админ-панель отзывов
                        </h1>
                        <p class="text-slate-400 text-sm mt-1">Управление обратной связью</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <button onclick="loadData()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm transition-colors flex items-center gap-2">
                        <i class="fas fa-sync-alt"></i>
                        Обновить
                    </button>
                    <div id="userPanel" class="hidden flex items-center gap-3">
                        <img id="userAvatar" src="" class="w-10 h-10 rounded-full border-2 border-purple-500">
                        <button onclick="logout()" class="text-slate-400 hover:text-white">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Access Denied -->
        <div id="accessDenied" class="hidden text-center py-20">
            <div class="text-6xl mb-4">🚫</div>
            <h2 class="text-2xl font-bold mb-4">Доступ запрещён</h2>
            <p class="text-slate-400">Только для администраторов</p>
            <a href="reviews.html" class="inline-block mt-6 bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg text-sm font-medium transition-colors">
                Вернуться
            </a>
        </div>

        <!-- Admin Content -->
        <div id="adminContent" class="hidden">
            <!-- Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="glass-card rounded-2xl p-5 stats-card">
                    <div class="flex items-center justify-between mb-2">
                        <i class="fas fa-inbox text-blue-400 text-xl"></i>
                        <span id="unreadBadge" class="hidden notification-badge w-6 h-6 bg-red-500 rounded-full text-xs flex items-center justify-center font-bold">0</span>
                    </div>
                    <div class="stat-value text-3xl font-bold" id="statTotal">0</div>
                    <div class="text-slate-400 text-sm">Всего отзывов</div>
                </div>
                <div class="glass-card rounded-2xl p-5">
                    <div class="flex items-center justify-between mb-2">
                        <i class="fas fa-envelope-open text-yellow-400 text-xl"></i>
                    </div>
                    <div class="stat-value text-3xl font-bold text-yellow-400" id="statUnread">0</div>
                    <div class="text-slate-400 text-sm">Непрочитанных</div>
                </div>
                <div class="glass-card rounded-2xl p-5">
                    <div class="flex items-center justify-between mb-2">
                        <i class="fas fa-lightbulb text-emerald-400 text-xl"></i>
                    </div>
                    <div class="stat-value text-3xl font-bold text-emerald-400" id="statSuggestions">0</div>
                    <div class="text-slate-400 text-sm">Предложений</div>
                </div>
                <div class="glass-card rounded-2xl p-5">
                    <div class="flex items-center justify-between mb-2">
                        <i class="fas fa-bug text-red-400 text-xl"></i>
                    </div>
                    <div class="stat-value text-3xl font-bold text-red-400" id="statBugs">0</div>
                    <div class="text-slate-400 text-sm">Багов</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="mb-6 flex flex-wrap gap-2">
                <button onclick="filterFeedback('all')" class="filter-btn active" data-filter="all">
                    <i class="fas fa-list mr-2"></i>Все
                </button>
                <button onclick="filterFeedback('unread')" class="filter-btn" data-filter="unread">
                    <i class="fas fa-envelope mr-2"></i>Непрочитанные
                </button>
                <button onclick="filterFeedback('suggestion')" class="filter-btn" data-filter="suggestion">
                    <i class="fas fa-lightbulb mr-2"></i>Предложения
                </button>
                <button onclick="filterFeedback('bug')" class="filter-btn" data-filter="bug">
                    <i class="fas fa-bug mr-2"></i>Баги
                </button>
                <button onclick="filterFeedback('review')" class="filter-btn" data-filter="review">
                    <i class="fas fa-comment mr-2"></i>Отзывы
                </button>
                <button onclick="filterFeedback('question')" class="filter-btn" data-filter="question">
                    <i class="fas fa-question mr-2"></i>Вопросы
                </button>
            </div>

            <!-- Feedback List -->
            <div id="feedbackList" class="space-y-6">
                <!-- Will be rendered here -->
            </div>

            <!-- Empty state -->
            <div id="emptyState" class="hidden text-center py-20">
                <div class="text-6xl mb-4">📭</div>
                <h3 class="text-xl font-semibold text-slate-300 mb-2">Нет отзывов</h3>
                <p class="text-slate-500">Пока нет сообщений по выбранному фильтру</p>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-20">
            <div class="text-4xl mb-4 animate-pulse">📊</div>
            <p class="text-slate-400">Загрузка...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, getDocs, updateDoc, deleteDoc, query, orderBy, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdXGYg2t8DJBrQHCC80-pFerZU9PWmSCk",
            authDomain: "testnet-hub.firebaseapp.com",
            projectId: "testnet-hub",
            storageBucket: "testnet-hub.firebasestorage.app",
            messagingSenderId: "497813176653",
            appId: "1:497813176653:web:089188fdd1555d76cd7704"
        };

        const ADMIN_ID = "SAkz4mdW9reDaIsvqigCNZhEKJR2";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let allFeedback = [];
        let currentFilter = 'all';
        let projects = {};

        onAuthStateChanged(auth, async (user) => {
            document.getElementById('loading').classList.add('hidden');
            
            if (!user) {
                showLogin();
                return;
            }

            if (user.uid !== ADMIN_ID) {
                document.getElementById('accessDenied').classList.remove('hidden');
                return;
            }

            currentUser = user;
            document.getElementById('userPanel').classList.remove('hidden');
            document.getElementById('userAvatar').src = user.photoURL || `https://ui-avatars.com/api/?name=${user.email}&background=random`;
            document.getElementById('adminContent').classList.remove('hidden');
            
            await loadProjects();
            loadData();
        });

        function showLogin() {
            const content = document.getElementById('loading');
            content.innerHTML = `
                <div class="text-6xl mb-4">🔐</div>
                <h2 class="text-2xl font-bold mb-4">Требуется вход</h2>
                <button onclick="login()" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 mx-auto">
                    <i class="fab fa-google"></i> Войти через Google
                </button>
            `;
            content.classList.remove('hidden');
        }

        window.login = async () => {
            try {
                await signInWithPopup(auth, new GoogleAuthProvider());
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        };

        window.logout = () => signOut(auth);

        async function loadProjects() {
            const snap = await getDocs(collection(db, "projects"));
            projects = {};
            snap.forEach(d => {
                projects[d.id] = { id: d.id, ...d.data() };
            });
        }

        window.loadData = async () => {
            const q = query(collection(db, "feedback"), orderBy("createdAt", "desc"));
            const snap = await getDocs(q);
            
            allFeedback = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            updateStats();
            renderFeedback();
        };

        function updateStats() {
            const total = allFeedback.length;
            const unread = allFeedback.filter(f => !f.read).length;
            const suggestions = allFeedback.filter(f => f.type === 'suggestion').length;
            const bugs = allFeedback.filter(f => f.type === 'bug').length;
            
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statUnread').textContent = unread;
            document.getElementById('statSuggestions').textContent = suggestions;
            document.getElementById('statBugs').textContent = bugs;
            
            const badge = document.getElementById('unreadBadge');
            if (unread > 0) {
                badge.textContent = unread > 99 ? '99+' : unread;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function renderFeedback() {
            const container = document.getElementById('feedbackList');
            const empty = document.getElementById('emptyState');
            
            let filtered = allFeedback;
            if (currentFilter === 'unread') {
                filtered = allFeedback.filter(f => !f.read);
            } else if (currentFilter !== 'all') {
                filtered = allFeedback.filter(f => f.type === currentFilter);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            
            // Group by project
            const grouped = {};
            filtered.forEach(f => {
                const pid = f.projectId || 'unknown';
                if (!grouped[pid]) grouped[pid] = [];
                grouped[pid].push(f);
            });
            
            container.innerHTML = Object.entries(grouped).map(([pid, items]) => {
                const proj = projects[pid] || { name: 'Неизвестный проект', image: '' };
                const unreadCount = items.filter(i => !i.read).length;
                
                return `
                    <div class="project-group">
                        <div class="project-header" onclick="toggleProject('${pid}')">
                            <img src="${proj.image || ''}" class="w-10 h-10 rounded-lg object-cover" 
                                onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(proj.name)}&background=random&size=40'">
                            <div class="flex-1">
                                <div class="font-bold text-white">${proj.name}</div>
                                <div class="text-xs text-slate-400">${items.length} сообщений ${unreadCount > 0 ? `<span class="text-blue-400">(${unreadCount} новых)</span>` : ''}</div>
                            </div>
                            <i class="fas fa-chevron-down text-slate-400 transition-transform" id="icon-${pid}"></i>
                        </div>
                        <div id="items-${pid}" class="space-y-3 pl-4">
                            ${items.map(f => renderFeedbackItem(f)).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderFeedbackItem(f) {
            const typeLabels = {
                suggestion: 'Предложение',
                bug: 'Баг',
                review: 'Отзыв',
                question: 'Вопрос',
                other: 'Другое'
            };
            
            const date = f.createdAt?.toDate ? f.createdAt.toDate() : new Date();
            const timeStr = date.toLocaleString('ru-RU');
            
            return `
                <div class="feedback-item ${f.read ? '' : 'unread'}" id="item-${f.id}">
                    <div class="flex items-start justify-between gap-4 mb-3">
                        <div class="flex items-center gap-3">
                            <span class="type-badge type-${f.type}">${typeLabels[f.type] || f.type}</span>
                            <span class="text-xs text-slate-500">${timeStr}</span>
                        </div>
                        <div class="flex gap-2">
                            ${!f.read ? `<button onclick="markRead('${f.id}')" class="text-blue-400 hover:text-blue-300 text-sm" title="Отметить прочитанным"><i class="fas fa-check"></i></button>` : ''}
                            <button onclick="deleteFeedback('${f.id}')" class="text-red-400 hover:text-red-300 text-sm" title="Удалить"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="text-sm text-slate-300 mb-3 whitespace-pre-wrap">${escapeHtml(f.text)}</div>
                    <div class="flex items-center gap-2 text-xs text-slate-500 pt-3 border-t border-slate-700/50">
                        <i class="fas fa-user"></i>
                        <span>${escapeHtml(f.userName || 'Аноним')}</span>
                        <span class="text-slate-600">•</span>
                        <span>${escapeHtml(f.userEmail || 'no email')}</span>
                    </div>
                </div>
            `;
        }

        window.toggleProject = (pid) => {
            const items = document.getElementById(`items-${pid}`);
            const icon = document.getElementById(`icon-${pid}`);
            items.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        };

        window.filterFeedback = (filter) => {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderFeedback();
        };

        window.markRead = async (id) => {
            try {
                await updateDoc(doc(db, "feedback", id), { read: true });
                const item = allFeedback.find(f => f.id === id);
                if (item) {
                    item.read = true;
                    document.getElementById(`item-${id}`).classList.remove('unread');
                    updateStats();
                }
            } catch (e) {
                console.error('Error:', e);
            }
        };

        window.markAllRead = async () => {
            const unread = allFeedback.filter(f => !f.read);
            if (unread.length === 0) return;
            
            const batch = writeBatch(db);
            unread.forEach(f => {
                batch.update(doc(db, "feedback", f.id), { read: true });
            });
            
            await batch.commit();
            unread.forEach(f => f.read = true);
            renderFeedback();
            updateStats();
        };

        window.deleteFeedback = async (id) => {
            if (!confirm('Удалить это сообщение?')) return;
            try {
                await deleteDoc(doc(db, "feedback", id));
                allFeedback = allFeedback.filter(f => f.id !== id);
                renderFeedback();
                updateStats();
            } catch (e) {
                console.error('Error:', e);
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
