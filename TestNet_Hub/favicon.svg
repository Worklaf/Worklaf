<!-- favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <style>
        @media (prefers-color-scheme: dark) {
            .flask-bg { fill: #0F172A; } /* Темно-синий фон для темной темы */
            .flask-stroke { stroke: #22d3ee; } /* Бирюзовый контур */
        }
        @media (prefers-color-scheme: light) {
            .flask-bg { fill: #E2E8F0; } /* Светло-серый фон для светлой темы */
            .flask-stroke { stroke: #0891b2; } /* Темно-бирюзовый контур */
        }
    </style>
    <rect width="48" height="48" rx="8" class="flask-bg"/>
    <path class="flask-stroke" d="M18 6h12M24 6v10M16 16l-4 16c-1 4 2 8 6 8h12c4 0 7-4 6-8l-4-16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="24" cy="28" r="2.5" class="flask-stroke" fill="currentColor" opacity="0.7"/>
</svg>