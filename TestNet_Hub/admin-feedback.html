<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestNet Hub | Админ: Отзывы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0b0f19; color: #f1f5f9; background-image: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%); min-height: 100vh; }
        .glass-card { background: rgba(30, 37, 56, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 20px; transition: all 0.3s ease; }
        .glass-card:hover { transform: translateY(-2px); border-color: #3b82f6; }
        .status-new { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .status-replied { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-2xl font-bold text-white hover:text-blue-400 transition"><i class="fas fa-arrow-left mr-2"></i>TestNet Hub <span class="text-slate-500 text-sm font-normal">/ Админ Панель</span></a>
            </div>
            <div id="userPanel" class="flex items-center gap-4 hidden">
                <span id="adminStatus" class="bg-purple-600 text-white px-3 py-1 rounded text-sm font-bold">ADMIN</span>
                <button onclick="logout()" class="text-slate-400 hover:text-white">Выйти</button>
            </div>
            <div id="loginPrompt">
                <button onclick="login()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded">Войти как Админ</button>
            </div>
        </header>

        <div id="mainContent" class="hidden">
            <div class="grid grid-cols-1 gap-6" id="feedbackList">
                <!-- Messages go here -->
                <div class="text-center text-slate-500 py-10">Загрузка сообщений...</div>
            </div>
        </div>

        <div id="emptyState" class="hidden text-center py-20">
            <div class="text-6xl mb-4">📭</div>
            <h3 class="text-xl font-semibold text-slate-300">Нет новых сообщений</h3>
        </div>
    </div>

    <!-- Reply Modal -->
    <div id="replyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="text-xl font-bold">Ответить пользователю</h2>
                <button onclick="closeReplyModal()" class="text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body space-y-4">
                <div class="bg-slate-800 p-3 rounded border border-slate-700">
                    <div class="text-xs text-slate-500 mb-1">Пользователь написал:</div>
                    <div id="originalMessage" class="text-sm text-slate-200"></div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Ваш ответ</label>
                    <textarea id="replyText" rows="5" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:border-blue-500 outline-none" placeholder="Текст ответа..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" onclick="closeReplyModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-sm">Отмена</button>
                <button type="button" onclick="sendReply()" class="flex-1 bg-purple-600 hover:bg-purple-500 py-2 rounded-lg text-sm font-bold">Отправить ответ</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 border border-slate-700 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <i class="fas fa-check-circle text-emerald-400"></i>
        <span id="toastMessage">Действие выполнено</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"; // getFirestore imported but not used directly here for simplicity in imports
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdXGYg2t8DJBrQHCC80-pFerZU9PWmSCk",
            authDomain: "testnet-hub.firebaseapp.com",
            projectId: "testnet-hub",
            storageBucket: "testnet-hub.firebasestorage.app",
            messagingSenderId: "497813176653",
            appId: "1:497813176653:web:089188fdd1555d76cd7704"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_UID = "SAkz4mdW9reDaIsvqigCNZhEKJR2"; // Ваш UID
        let currentReplyId = null;
        let feedbackData = [];

        window.login = function() { signInWithPopup(auth, new GoogleAuthProvider()); };
        window.logout = function() { signOut(auth).then(() => location.reload()); };

        onAuthStateChanged(auth, async function(user) {
            if (user && user.uid === ADMIN_UID) {
                document.getElementById('loginPrompt').classList.add('hidden');
                document.getElementById('userPanel').classList.remove('hidden');
                document.getElementById('userPanel').classList.add('flex');
                document.getElementById('mainContent').classList.remove('hidden');
                loadFeedback();
            } else {
                document.getElementById('loginPrompt').classList.remove('hidden');
                document.getElementById('userPanel').classList.add('hidden');
                document.getElementById('userPanel').classList.remove('flex');
                document.getElementById('mainContent').classList.add('hidden');
            }
        });

        function loadFeedback() {
            const q = query(collection(db, "feedback"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                feedbackData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data(), createdAt: doc.data().createdAt ? doc.data().createdAt.toDate() : new Date() }));
                renderFeedback();
            });
        }

        function renderFeedback() {
            const container = document.getElementById('feedbackList');
            const empty = document.getElementById('emptyState');
            
            if (feedbackData.length === 0) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            container.innerHTML = feedbackData.map(item => {
                const statusClass = item.status === 'new' ? 'status-new' : 'status-replied';
                const topicIcon = item.topic === 'bug' ? 'fa-bug' : (item.topic === 'suggestion' ? 'fa-lightbulb' : 'fa-comment');
                
                return `
                <div class="glass-card flex flex-col md:flex-row gap-4">
                    <div class="flex-1">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-bold text-white">${item.userName || 'Аноним'}</span>
                                <span class="text-xs text-slate-500">${item.projectId ? 'Проект: ' + item.projectId : 'Общее'}</span>
                                <span class="px-2 py-0.5 rounded text-xs font-bold ${statusClass}">${item.status === 'new' ? 'НОВОЕ' : 'ОТВЕЧЕНО'}</span>
                            </div>
                            <span class="text-xs text-slate-500">${item.createdAt.toLocaleString()}</span>
                        </div>
                        <div class="text-xs text-blue-400 mb-2 uppercase font-semibold"><i class="fas ${topicIcon} mr-1"></i> ${item.topic}</div>
                        <div class="text-slate-300 bg-slate-900/50 p-3 rounded border border-slate-700/50 mb-3">${item.message}</div>
                        
                        ${item.reply ? `
                        <div class="pl-4 border-l-2 border-purple-500 mt-2">
                            <div class="text-xs text-purple-400 font-bold mb-1">ВАШ ОТВЕТ:</div>
                            <div class="text-slate-300 text-sm">${item.reply}</div>
                        </div>` : ''}
                    </div>
                    <div class="flex md:flex-col justify-end gap-2 min-w-[120px]">
                        ${item.status === 'new' ? 
                        `<button onclick="openReplyModal('${item.id}', '${item.message.replace(/'/g, "\\'")}')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm font-medium transition-colors w-full"><i class="fas fa-reply mr-1"></i> Ответить</button>` : 
                        `<button onclick="openReplyModal('${item.id}', '${item.message.replace(/'/g, "\\'")}')" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded text-sm font-medium transition-colors w-full"><i class="fas fa-edit mr-1"></i> Изменить</button>`}
                    </div>
                </div>`;
            }).join('');
        }

        window.openReplyModal = function(id, message) {
            currentReplyId = id;
            document.getElementById('originalMessage').innerText = message.length > 300 ? message.substring(0, 300) + '...' : message;
            document.getElementById('replyText').value = '';
            const existingReply = feedbackData.find(f => f.id === id)?.reply;
            if (existingReply) document.getElementById('replyText').value = existingReply;
            
            document.getElementById('replyModal').classList.add('active');
        };
        window.closeReplyModal = function() { document.getElementById('replyModal').classList.remove('active'); currentReplyId = null; };

        window.sendReply = async function() {
            const replyText = document.getElementById('replyText').value;
            if (!replyText.trim()) { showToast('Введите текст ответа'); return; }
            
            const feedbackItem = feedbackData.find(f => f.id === currentReplyId);
            if (!feedbackItem) return;

            try {
                // Update feedback status
                await updateDoc(doc(db, "feedback", currentReplyId), {
                    status: 'replied',
                    reply: replyText,
                    repliedAt: serverTimestamp()
                });

                // Send notification to user
                if (feedbackItem.userId) {
                    await addDoc(collection(db, "notifications"), {
                        userId: feedbackItem.userId,
                        message: `Администратор ответил на ваше обращение (${feedbackItem.topic}): "${replyText.substring(0, 50)}..."`,
                        type: 'reply',
                        read: false,
                        createdAt: serverTimestamp()
                    });
                }

                showToast('Ответ отправлен!');
                closeReplyModal();
            } catch (e) {
                showToast('Ошибка отправки: ' + e.message);
                console.error(e);
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
