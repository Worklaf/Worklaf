<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Локальный генератор субтитров (Whisper WebGPU)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 10px;
    }
    textarea {
      width: 100%;
      height: 200px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 14px;
    }
    button {
      padding: 10px 16px;
      margin-top: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background: #888;
    }
  </style>
</head>
<body>

<h2>Локальный генератор субтитров (Whisper WebGPU)</h2>

<p>Работает полностью в браузере. Никакого сервера.</p>

<input type="file" id="fileInput" accept="audio/*,video/*">
<br><br>

<button id="startBtn" disabled>Распознать</button>

<p id="status">Статус: ожидаю файл…</p>

<textarea id="output" placeholder="Здесь появится текст"></textarea>

<button id="downloadBtn" disabled>Скачать .srt</button>

<script src="https://cdn.jsdelivr.net/npm/whisper-webgpu@latest/dist/whisper-webgpu.js"></script>

<script>
let whisper = null;
let audioBuffer = null;
let segments = [];

const fileInput = document.getElementById("fileInput");
const startBtn = document.getElementById("startBtn");
const status = document.getElementById("status");
const output = document.getElementById("output");
const downloadBtn = document.getElementById("downloadBtn");

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;

  status.textContent = "Статус: загружаю файл…";

  const arrayBuffer = await file.arrayBuffer();
  const audioCtx = new AudioContext();
  audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

  status.textContent = "Статус: файл готов. Можно распознавать.";
  startBtn.disabled = false;
});

startBtn.addEventListener("click", async () => {
  if (!audioBuffer) return;

  startBtn.disabled = true;
  status.textContent = "Статус: загружаю модель… (первый запуск может занять 20–40 секунд)";

  if (!whisper) {
    whisper = await WhisperWebGPU.loadModel("https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin");
  }

  status.textContent = "Статус: распознаю…";

  const pcm = audioBuffer.getChannelData(0);

  const result = await whisper.transcribe(pcm, {
    language: "pl", // польский
    task: "transcribe"
  });

  segments = result.segments;

  const text = segments.map(s => s.text).join(" ");
  output.value = text;

  status.textContent = "Статус: готово!";
  downloadBtn.disabled = false;
});

downloadBtn.addEventListener("click", () => {
  const srt = segmentsToSrt(segments);
  const blob = new Blob([srt], { type: "text/plain" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "subtitles.srt";
  a.click();

  URL.revokeObjectURL(url);
});

function segmentsToSrt(segments) {
  return segments.map((seg, i) => {
    return (
      (i + 1) + "\n" +
      toTime(seg.start) + " --> " + toTime(seg.end) + "\n" +
      seg.text.trim() + "\n"
    );
  }).join("\n");
}

function toTime(sec) {
  const ms = Math.floor((sec % 1) * 1000);
  const s = Math.floor(sec % 60);
  const m = Math.floor((sec / 60) % 60);
  const h = Math.floor(sec / 3600);

  return (
    String(h).padStart(2, "0") + ":" +
    String(m).padStart(2, "0") + ":" +
    String(s).padStart(2, "0") + "," +
    String(ms).padStart(3, "0")
  );
}
</script>

</body>
</html>
