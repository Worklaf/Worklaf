name: Twitter NFT Parser
on:
  # 🔥 Ручной запуск из админки
  repository_dispatch:
    types: [run-twitter-parser]
  
  # 🔥 Автоматический запуск каждые 30 минут
  schedule:
    - cron: '0 0 */4 * *'
  
  # 🔥 Ручной запуск из GitHub UI
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run parser'
        required: false
        default: 'true'

jobs:
  parse-twitter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 🌐 Setup Chrome Browser
        uses: browser-actions/setup-chrome@latest
        
      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium beautifulsoup4 requests webdriver-manager

      - name: 🔐 Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Twitter Parser Bot"

      - name: 🐦 Run Twitter Parser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python twitter_parser_github.py

      - name: 📤 Commit and push results
        run: |
          git add twitter_results.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🐦 Twitter NFT update $(date +'%d.%m %H:%M')"
            git push
          fi
