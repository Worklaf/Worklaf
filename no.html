<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Web Visualizer</title>
    <style>
        /* --- Основные стили --- */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        /* Фоновое изображение */
        #bgImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.4; /* Затемнение фона */
            filter: blur(4px); /* Размытие для красоты */
            transition: opacity 0.5s;
        }

        /* Канвас визуализатора */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            /* Смешивание цветов для яркости */
            mix-blend-mode: screen; 
        }

        /* --- Интерфейс (UI) --- */
        
        /* Кнопка настроек (шестеренка) */
        .settings-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        /* Панель настроек (скрыта по умолчанию) */
        .controls-panel {
            position: absolute;
            top: 0;
            right: -320px; /* Спрятана за экраном */
            width: 300px;
            height: 100%;
            background: rgba(15, 15, 20, 0.95);
            backdrop-filter: blur(15px);
            z-index: 15;
            padding: 20px;
            box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .controls-panel.open {
            right: 0;
        }

        /* Стили внутри панели */
        h2 { margin-top: 50px; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .control-group { margin-bottom: 20px; }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: #2a2a35;
            border: 1px solid #444;
            color: #ccc;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }
        .btn:hover { background: #3a3a45; color: white; }
        .btn.active { background: linear-gradient(90deg, #ff00cc, #3333ff); color: white; border: none;}
        
        input[type="file"] { display: none; }
        label.btn { text-align: center; }

        /* --- Нижний бар плеера --- */
        .player-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 20px;
        }

        /* Прогресс бар (Timeline) */
        .progress-container {
            width: 90%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            margin: 0 auto 10px auto;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: #00e5ff;
            width: 0%;
            border-radius: 3px;
            box-shadow: 0 0 10px #00e5ff;
            pointer-events: none; /* Чтобы клик проходил сквозь полоску */
        }
        .time-display {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }

        /* Статус */
        .status-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #aaa;
            z-index: 5;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <img id="bgImage" src="" alt="" style="display: none;">
    
    <canvas id="visualizer"></canvas>

    <div class="status-msg" id="startMessage">
        <h1>Music Visualizer Pro</h1>
        <p>Откройте настройки (⚙️) чтобы загрузить музыку</p>
    </div>

    <div class="settings-toggle" onclick="togglePanel()">⚙️</div>

    <div class="controls-panel" id="panel">
        <h2>🎵 Аудио</h2>
        <label class="btn">
            📂 Загрузить MP3
            <input type="file" id="audioInput" accept="audio/*">
        </label>

        <h2>🖼 Фон</h2>
        <label class="btn">
            🌄 Загрузить Картинку
            <input type="file" id="bgInput" accept="image/*">
        </label>
        <button class="btn" onclick="document.getElementById('bgImage').style.display='none'">❌ Убрать фон</button>

        <h2>🎨 Стиль</h2>
        <button class="btn active" onclick="setSpectrum('vortex')" id="btn-vortex">🌀 Неоновый Вихрь</button>
        <button class="btn" onclick="setSpectrum('spaceTunnel')" id="btn-spaceTunnel">🌌 3D Туннель</button>
        <button class="btn" onclick="setSpectrum('waveLine')" id="btn-waveLine">〰️ Волна</button>
        <button class="btn" onclick="setSpectrum('bars')" id="btn-bars">📊 Спектр</button>

        <h2>🎥 Запись</h2>
        <button class="btn" style="background:#b71c1c" id="recBtn" onclick="toggleRecord()">⏺ Начать запись (WebM)</button>
    </div>

    <div class="player-bar">
        <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
        <div class="progress-container" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
        // --- Переменные ---
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const bgImage = document.getElementById('bgImage');
        const audioInput = document.getElementById('audioInput');
        const bgInput = document.getElementById('bgInput');
        const progressContainer = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');
        const recBtn = document.getElementById('recBtn');

        let audioCtx, analyser, source, dataArray;
        let audio = new Audio();
        let animationId;
        let currentEffect = 'vortex'; // По умолчанию
        
        // Переменные для записи
        let mediaRecorder;
        let chunks = [];
        let isRecording = false;

        // Настройка размера
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Аудио Логика ---
        audioInput.onchange = function() {
            const files = this.files;
            if (files.length === 0) return;
            
            audio.src = URL.createObjectURL(files[0]);
            audio.load();
            audio.play();
            
            document.getElementById('startMessage').style.display = 'none';
            setupAudioContext();
            togglePanel(); // Закрыть панель после выбора
        };

        function setupAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; // Высокое разрешение для красивых волн
                
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                draw();
            }
        }

        // --- Управление фоном ---
        bgInput.onchange = function() {
            if (this.files.length > 0) {
                bgImage.src = URL.createObjectURL(this.files[0]);
                bgImage.style.display = 'block';
            }
        }

        // --- Управление плеером (Timeline) ---
        audio.ontimeupdate = () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                timeDisplay.innerText = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
            }
        };

        progressContainer.onclick = (e) => {
            if (!audio.duration) return;
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            audio.currentTime = (clickX / width) * audio.duration;
        };

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ":" + (sec < 10 ? "0" + sec : sec);
        }

        // --- UI Панель ---
        function togglePanel() {
            document.getElementById('panel').classList.toggle('open');
        }

        function setSpectrum(type) {
            currentEffect = type;
            // Обновляем кнопки
            document.querySelectorAll('.controls-panel .btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + type).classList.add('active');
        }

        // ==========================================
        // === ЛОГИКА ОТРИСОВКИ (VISUALIZERS) ===
        // ==========================================

        function draw() {
            animationId = requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            // Очистка экрана (с легким шлейфом для плавности)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; 
            ctx.fillRect(0, 0, w, h);

            if (currentEffect === 'vortex') drawVortex(cx, cy, dataArray);
            else if (currentEffect === 'spaceTunnel') drawSpaceTunnel(w, h, cx, cy, dataArray);
            else if (currentEffect === 'waveLine') drawWaveLine(w, h, dataArray);
            else drawBars(w, h, dataArray);
        }

        // 1. ВИХРЬ (VORTEX) - Как на твоей картинке
        function drawVortex(cx, cy, data) {
            const radius = 80; // Размер пустой дыры в центре
            const bars = 100; // Количество "перьев"
            const step = Math.floor(data.length / bars);

            for (let i = 0; i < bars; i++) {
                const val = data[i * step];
                const amplitude = (val / 255) * 300; // Длина пера
                
                // Угол
                const angle = (i / bars) * Math.PI * 2;
                
                // Координаты начала (на круге)
                const x1 = cx + Math.cos(angle) * radius;
                const y1 = cy + Math.sin(angle) * radius;

                // Координаты конца (со смещением угла для эффекта закручивания)
                // angle + 0.5 создает изгиб
                const x2 = cx + Math.cos(angle + (val/500) + 0.3) * (radius + amplitude);
                const y2 = cy + Math.sin(angle + (val/500) + 0.3) * (radius + amplitude);

                // Контрольная точка для кривой Безье (чтобы линия была изогнутой)
                const xControl = cx + Math.cos(angle + 0.8) * (radius + amplitude * 0.5);
                const yControl = cy + Math.sin(angle + 0.8) * (radius + amplitude * 0.5);

                ctx.beginPath();
                // Цвет: градиент от фиолетового к голубому и оранжевому
                const hue = (i / bars) * 360 + (val/2); 
                ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.8)`;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';

                ctx.moveTo(x1, y1);
                ctx.quadraticCurveTo(xControl, yControl, x2, y2);
                ctx.stroke();
                
                // Светящаяся точка на конце
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(x2, y2, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 2. 3D ТУННЕЛЬ (ПРОСТРАНСТВЕННЫЙ)
        // Массив звезд/частиц для 3D
        let stars = [];
        for(let i=0; i<300; i++) stars.push({
            x: (Math.random()-0.5)*2000, 
            y: (Math.random()-0.5)*2000, 
            z: Math.random()*2000
        });

        function drawSpaceTunnel(w, h, cx, cy, data) {
            // Получаем среднюю громкость басов (первые 40 частот)
            let bass = 0;
            for(let i=0; i<40; i++) bass += data[i];
            bass = bass / 40; // Среднее 0-255
            
            const speed = 5 + (bass / 10); // Скорость полета зависит от баса

            stars.forEach((star, index) => {
                // Двигаем звезду к камере
                star.z -= speed;
                if (star.z <= 0) {
                    star.z = 2000;
                    star.x = (Math.random()-0.5)*2000;
                    star.y = (Math.random()-0.5)*2000;
                }

                // Проекция 3D на 2D
                // x2d = x / z * scale
                const scale = 500 / (star.z); 
                const x2d = cx + star.x * scale;
                const y2d = cy + star.y * scale;

                // Размер и цвет зависят от приближения и звука
                const size = (1 - star.z/2000) * 8 + (bass/50);
                const alpha = (1 - star.z/2000);

                // Берем частоту для цвета
                const freqIndex = Math.floor(Math.abs(star.x + star.y) % 200);
                const freqVal = data[freqIndex];

                ctx.beginPath();
                ctx.fillStyle = `hsla(${bass + freqIndex}, 100%, 70%, ${alpha})`;
                ctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                ctx.fill();

                // Рисуем линии, соединяющие близкие точки, если бас сильный
                if (bass > 150 && index > 0 && index % 5 === 0) {
                    ctx.beginPath();
                    ctx.moveTo(x2d, y2d);
                    ctx.lineTo(cx, cy); // Линии к центру
                    ctx.strokeStyle = `rgba(255,255,255, ${alpha * 0.2})`;
                    ctx.stroke();
                }
            });
        }

        // 3. Простая волна
        function drawWaveLine(w, h, data) {
            ctx.beginPath();
            ctx.moveTo(0, h/2);
            for (let i = 0; i < data.length; i++) {
                const x = (i / data.length) * w;
                const y = h/2 - (data[i] / 255) * (h/3) * (i%2==0 ? 1 : -1); 
                ctx.lineTo(x, y);
            }
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // 4. Столбики
        function drawBars(w, h, data) {
            const barWidth = (w / data.length) * 2.5;
            let x = 0;
            for(let i = 0; i < data.length; i++) {
                const barHeight = data[i];
                ctx.fillStyle = `rgb(${barHeight+50}, 50, 150)`;
                ctx.fillRect(x, h - barHeight*1.5, barWidth, barHeight*1.5);
                x += barWidth + 1;
            }
        }

        // --- Функция Записи Видео ---
        function toggleRecord() {
            if (isRecording) {
                mediaRecorder.stop();
                recBtn.innerText = "⏺ Начать запись (WebM)";
                recBtn.style.background = "#b71c1c";
                isRecording = false;
            } else {
                if (!audioCtx) return alert("Сначала запустите музыку!");
                
                const stream = canvas.captureStream(60);
                const dest = audioCtx.createMediaStreamDestination();
                source.connect(dest);
                source.connect(analyser); // Reconnect to hear it
                
                if (dest.stream.getAudioTracks().length > 0) {
                    stream.addTrack(dest.stream.getAudioTracks()[0]);
                }

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
                chunks = [];
                
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = e => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'vizualization.webm';
                    a.click();
                };

                mediaRecorder.start();
                recBtn.innerText = "⏹ Остановить запись";
                recBtn.style.background = "#2e7d32";
                isRecording = true;
            }
        }

    </script>
</body>
</html>
