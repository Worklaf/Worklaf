<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Advanced Music Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000; /* Fallback background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            position: relative; /* Для фонового изображения */
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4) blur(3px); /* Затемнение и размытие фона */
            z-index: -1;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            filter: contrast(1.2); /* Применяем контраст к визуализатору */
            z-index: 0;
        }

        .controls {
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 90%; /* Ограничение ширины для мобильных */
            box-sizing: border-box;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        input[type="file"] { display: none; }

        .btn {
            background: linear-gradient(45deg, #a855f7, #6366f1);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            color: white;
            border: none;
            margin: 5px;
            display: inline-block;
        }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }

        .btn.active {
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            box-shadow: 0 0 15px rgba(255, 0, 204, 0.7);
        }
        .btn-record { background: linear-gradient(45deg, #e74c3c, #c0392b); }
        .btn-record.recording { background: linear-gradient(45deg, #27ae60, #2ecc71); }


        #spectrumSelector button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: #eee;
            margin: 5px;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        #spectrumSelector button:hover {
            background: rgba(255,255,255,0.2);
        }
        #spectrumSelector button.active {
            background: linear-gradient(45deg, #4CAF50, #8BC34A);
            border-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        #status { font-size: 12px; margin-top: 15px; color: #aaa; }
    </style>
</head>
<body>

    <img id="backgroundImage" class="background-image" src="" alt="Background" style="display: none;">
    <canvas id="visualizer"></canvas>

    <div class="controls">
        <h2 style="margin-top:0">Музыкальный Визуализатор</h2>

        <div class="control-group">
            <label for="audioInput" class="btn">Выбрать музыку</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <div class="control-group">
            <label for="bgImageInput" class="btn">Фоновое изображение</label>
            <input type="file" id="bgImageInput" accept="image/*">
        </div>

        <div class="control-group">
            <label>Выбор спектра:</label>
            <div id="spectrumSelector">
                <button class="btn active" data-spectrum="romanticWave">Волновой вихрь</button>
                <button class="btn" data-spectrum="circularBars">Круговые столбики</button>
                <button class="btn" data-spectrum="barSpectrum">Классический спектр</button>
                <button class="btn" data-spectrum="particleField">Поле частиц</button>
            </div>
        </div>

        <div class="control-group">
            <button id="recordBtn" class="btn btn-record">Запись (WebM)</button>
            <button id="stopRecordBtn" class="btn btn-record" style="display: none;">Остановить запись</button>
        </div>

        <p id="status">Загрузите музыку для старта</p>
    </div>

    <script>
        const audioInput = document.getElementById('audioInput');
        const bgImageInput = document.getElementById('bgImageInput');
        const backgroundImage = document.getElementById('backgroundImage');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const spectrumSelector = document.getElementById('spectrumSelector');
        const statusText = document.getElementById('status');
        const recordBtn = document.getElementById('recordBtn');
        const stopRecordBtn = document.getElementById('stopRecordBtn');

        let audioCtx, analyser, source, dataArray, audioPlayer;
        let animationFrameId;
        let currentSpectrum = 'romanticWave'; // Дефолтный спектр
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- Audio Setup ---
        function setupAudio(audioElement) {
            if (audioCtx) {
                audioCtx.close(); // Закрываем предыдущий контекст, если был
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            analyser.fftSize = 512; // Можно менять для детализации
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
        }

        audioInput.onchange = function() {
            const files = this.files;
            if (files.length === 0) return;

            if (audioPlayer) {
                audioPlayer.pause();
                audioPlayer = null;
            }

            audioPlayer = new Audio();
            audioPlayer.src = URL.createObjectURL(files[0]);
            audioPlayer.load();
            audioPlayer.play();

            audioPlayer.onended = () => {
                statusText.innerText = `Воспроизведение '${files[0].name}' завершено.`;
                if (isRecording) stopRecording();
            };

            setupAudio(audioPlayer);
            statusText.innerText = `Воспроизведение: ${files[0].name}`;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            drawVisualizer();
        };

        // --- Background Image ---
        bgImageInput.onchange = function() {
            const files = this.files;
            if (files.length === 0) {
                backgroundImage.style.display = 'none';
                backgroundImage.src = '';
                return;
            }
            backgroundImage.src = URL.createObjectURL(files[0]);
            backgroundImage.style.display = 'block';
        };

        // --- Spectrum Selection ---
        spectrumSelector.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                document.querySelectorAll('#spectrumSelector button').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentSpectrum = e.target.dataset.spectrum;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                if (audioPlayer && !audioPlayer.paused) {
                    drawVisualizer(); // Перезапускаем отрисовку с новым спектром
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height); // Очищаем канвас, если музыки нет
                }
            }
        });

        // --- Drawing Logic ---
        function drawVisualizer() {
            animationFrameId = requestAnimationFrame(drawVisualizer);
            if (!analyser || !dataArray) return;

            analyser.getByteFrequencyData(dataArray);

            // Очистка с эффектом шлейфа
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Более темный шлейф для эффекта
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            switch (currentSpectrum) {
                case 'romanticWave':
                    drawRomanticWave(centerX, centerY, dataArray);
                    break;
                case 'circularBars':
                    drawCircularBars(centerX, centerY, dataArray);
                    break;
                case 'barSpectrum':
                    drawBarSpectrum(dataArray);
                    break;
                case 'particleField':
                    drawParticleField(centerX, centerY, dataArray);
                    break;
            }
        }

        // --- Spectrum Implementations ---

        // 1. Волновой вихрь (Romantic Wave)
        function drawRomanticWave(centerX, centerY, data) {
            const baseRadius = 120;
            const path = new Path2D();

            for (let i = 0; i < data.length; i += 4) { // Уменьшаем количество линий для плавности
                const v = data[i] / 128.0;
                const angle = (i * Math.PI * 2) / data.length;
                
                const length = v * 180;
                const xStart = centerX + Math.cos(angle) * baseRadius;
                const yStart = centerY + Math.sin(angle) * baseRadius;
                
                const xEnd = centerX + Math.cos(angle + v * 0.5) * (baseRadius + length);
                const yEnd = centerY + Math.sin(angle + v * 0.5) * (baseRadius + length);

                ctx.beginPath();
                ctx.strokeStyle = `hsla(${i * 0.8 + 200}, 80%, 60%, 0.8)`; 
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                
                ctx.moveTo(xStart, yStart);
                ctx.quadraticCurveTo(
                    centerX + Math.cos(angle + 0.2) * (baseRadius + length/2),
                    centerY + Math.sin(angle + 0.2) * (baseRadius + length/2),
                    xEnd, yEnd
                );
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(xEnd, yEnd, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
            }
        }

        // 2. Круговые столбики (Circular Bars)
        function drawCircularBars(centerX, centerY, data) {
            const baseRadius = 100;
            const barWidth = Math.PI * 2 / data.length * 0.8; // Ширина бара в радианах

            for (let i = 0; i < data.length; i += 2) {
                const v = data[i] / 255.0; // Нормализованное значение
                const angle = (i * Math.PI * 2) / data.length;
                const barHeight = v * 150; // Высота бара

                const startAngle = angle - barWidth / 2;
                const endAngle = angle + barWidth / 2;

                ctx.beginPath();
                ctx.strokeStyle = `hsla(${i * 0.5}, 100%, 50%, 0.9)`;
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                
                ctx.arc(centerX, centerY, baseRadius + barHeight / 2, startAngle, endAngle);
                ctx.stroke();
            }
        }

        // 3. Классический спектр (Bar Spectrum)
        function drawBarSpectrum(data) {
            const barWidth = (canvas.width / data.length) * 2.5; // Увеличим ширину бара
            let x = 0;

            for (let i = 0; i < data.length; i++) {
                const barHeight = data[i] * 1.5; // Увеличим высоту

                ctx.fillStyle = `rgb(${barHeight + 100}, 50, ${255 - barHeight})`; // Цвета меняются
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        // 4. Поле частиц (Particle Field)
        const particles = [];
        const numParticles = 150;
        function createParticles() {
            particles.length = 0; // Очищаем при смене
            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    radius: Math.random() * 2 + 1,
                    color: `hsla(${Math.random() * 360}, 100%, 70%, 0.8)`
                });
            }
        }
        createParticles(); // Инициализация частиц при старте

        function drawParticleField(centerX, centerY, data) {
            // Движение частиц
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                p.x += p.vx;
                p.y += p.vy;

                // Отталкивание от центра при громком звуке
                if (data[Math.floor(i % data.length)] > 150) {
                    const dx = p.x - centerX;
                    const dy = p.y - centerY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 200) { // Если частица близко к центру
                        p.x += dx / dist * 5; // Отталкиваем
                        p.y += dy / dist * 5;
                    }
                }

                // Перезапуск частиц, если вышли за границы
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    p.x = Math.random() * canvas.width;
                    p.y = Math.random() * canvas.height;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }
        }


        // --- Recording Functionality ---
        recordBtn.onclick = function() {
            if (!audioPlayer || audioPlayer.paused) {
                statusText.innerText = "Сначала загрузите и запустите музыку!";
                return;
            }

            isRecording = true;
            recordBtn.style.display = 'none';
            stopRecordBtn.style.display = 'inline-block';
            statusText.innerText = "Идет запись...";
            recordedChunks = [];

            // Получаем поток с Canvas
            // Можно настроить frameRate для 9:16 или 16:9, но это повлияет на отрисовку
            const stream = canvas.captureStream(60); // 60 FPS
            
            // Если нужно записать звук вместе с видео
            if (audioCtx && audioPlayer.captureStream) {
                 const audioStream = audioCtx.createMediaStreamDestination();
                 // Подключаем наш источник звука к аудио-потоку
                 source.disconnect(analyser); // Отключаем от анализатора временно
                 source.connect(audioStream); // Подключаем к потоку записи
                 source.connect(analyser); // Снова подключаем к анализатору для визуализации

                 stream.addTrack(audioStream.stream.getAudioTracks()[0]);
            }

            mediaRecorder = new MediaRecorder(stream, {
                mimeType: 'video/webm; codecs=vp8' // WebM с VP8 - наиболее поддерживаемый
                // Для H.264/MP4 требуется 'video/mp4; codecs=avc1' но поддержка браузерами разная
            });

            mediaRecorder.ondataavailable = function(event) {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = function() {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                document.body.appendChild(a);
                a.style.display = 'none';
                a.href = url;
                a.download = `visualizer_${new Date().toISOString()}.webm`; // Имя файла
                a.click();
                window.URL.revokeObjectURL(url);
                statusText.innerText = "Запись сохранена как webm!";

                // Восстанавливаем подключение источника звука, если оно было изменено для записи
                if (audioCtx && audioPlayer.captureStream) {
                    source.disconnect(audioCtx.destination); // Отключаем от потока записи
                    source.connect(analyser); // Подключаем обратно к анализатору и динамикам
                    analyser.connect(audioCtx.destination);
                }
            };

            mediaRecorder.start();
        };

        stopRecordBtn.onclick = function() {
            stopRecording();
        };

        function stopRecording() {
            if (isRecording && mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.style.display = 'inline-block';
                stopRecordBtn.style.display = 'none';
            }
        }


        // --- Resizing Canvas ---
        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (currentSpectrum === 'particleField') createParticles(); // Пересоздаем частицы
        };
    </script>
</body>
</html>
