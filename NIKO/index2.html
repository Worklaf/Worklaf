<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудио Визуализатор v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #visualizer {
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
            cursor: grab;
        }

        #visualizer:active {
            cursor: grabbing;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
        }

        input[type="range"] {
            width: 200px;
            margin-bottom: 5px;
        }

        input[type="file"] {
            width: 200px;
            font-size: 12px;
            color: #fff;
        }

        select, button {
            width: 200px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;
            font-size: 12px;
        }

        button {
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .viz-list {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            padding: 5px;
        }

        .viz-item {
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 11px;
        }

        .viz-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .viz-item.active {
            background: #0080ff;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            backdrop-filter: blur(10px);
        }

        .timer {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            font-size: 20px;
            font-weight: bold;
            color: #0ff;
        }

        #backgroundImage, #overlayImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        #backgroundImage {
            z-index: 1;
            opacity: 0.3;
        }

        #overlayImage {
            z-index: 50;
            opacity: 0.2;
            mix-blend-mode: overlay;
        }
    </style>
</head>
<body>
    <div class="container">
        <img id="backgroundImage" style="display: none;">
        <canvas id="visualizer"></canvas>
        <img id="overlayImage" style="display: none;">
        
        <div class="controls">
            <div class="control-group">
                <label>Аудио файл</label>
                <input type="file" id="audioFile" accept="audio/*">
            </div>
            
            <div class="control-group">
                <label>Фон</label>
                <input type="file" id="backgroundFile" accept="image/*">
                <button onclick="clearBackground()">Очистить фон</button>
            </div>
            
            <div class="control-group">
                <label>Оверлей</label>
                <input type="file" id="overlayFile" accept="image/*">
                <button onclick="clearOverlay()">Очистить оверлей</button>
            </div>
            
            <div class="control-group">
                <label>Визуализатор</label>
                <div class="viz-list" id="vizList"></div>
            </div>
            
            <div class="control-group">
                <label>Размер: <span id="scaleValue">1.0</span></label>
                <input type="range" id="vizScale" min="0.1" max="3" step="0.1" value="1">
            </div>
            
            <div class="control-group">
                <label>Свечение: <span id="glowValue">10</span></label>
                <input type="range" id="vizGlow" min="0" max="50" step="1" value="10">
            </div>
            
            <div class="control-group">
                <label>Скорость: <span id="speedValue">1.0</span></label>
                <input type="range" id="vizSpeed" min="0.1" max="5" step="0.1" value="1">
            </div>
            
            <div class="control-group">
                <button onclick="toggleFullscreen()">Полный экран</button>
                <button onclick="resetSettings()">Сброс</button>
            </div>
        </div>
        
        <div class="timer" id="timer">00:00</div>
        
        <div class="info">
            <div>Визуализатор: <span id="currentViz">circular</span></div>
            <div>Клик - смена визуализатора | Колесо мыши - масштаб</div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let audioContext, analyser, dataArray, source;
        let canvas, ctx;
        let isPlaying = false;
        let currentAudio = null;
        let animationId = null;
        let startTime = 0;
        let rotation = 0;
        let time = 0;

        // Конфигурация
        const config = {
            width: window.innerWidth,
            height: window.innerHeight,
            fftSize: 512,
            smoothingTimeConstant: 0.8
        };

        // Состояние визуализатора
        const state = {
            currentViz: 0,
            vizScale: 1.0,
            vizGlow: 10,
            vizSpeed: 1.0,
            mouseX: 0,
            mouseY: 0
        };

        // Список всех визуализаторов
        const visualizerNames = [
            'circular', 'radial', 'neon', 'tunnel', 'ringWave', 'mirrorWave', 
            'hudTech3D', 'landscape3D', 'electricWave', 'soundPressure3D', 
            'waveformCircle', 'purpleSpiral', 'eyeSpectrum3D', 'centralBars', 
            'doubleBars', 'modernSpectrum', 'snowFlake', 'rippleWaves', 
            'galaxySpiral', 'particleField', 'heartBeat', 'matrix3D', 
            'dnaHelix', 'quantumField', 'neurNetwork', 'cosmicRing', 
            'synthWave', 'hologram3D'
        ];

        // Утилиты
        function hexToRgba(hex, alpha = 1) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            if (result) {
                const r = parseInt(result[1], 16);
                const g = parseInt(result[2], 16);
                const b = parseInt(result[3], 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }
            return `rgba(255, 255, 255, ${alpha})`;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Визуализаторы
        const visualizers = {
            circular(ctx, centerX, centerY, dataArray) {
                const radius = Math.min(config.width, config.height) * 0.2 * state.vizScale;
                const barCount = dataArray.length;
                
                for (let i = 0; i < barCount; i++) {
                    const angle = (i / barCount) * Math.PI * 2;
                    const barHeight = (dataArray[i] / 255) * radius;
                    
                    const x1 = centerX + Math.cos(angle) * radius;
                    const y1 = centerY + Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle) * (radius + barHeight);
                    const y2 = centerY + Math.sin(angle) * (radius + barHeight);
                    
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    
                    const hue = (i / barCount) * 360;
                    ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = state.vizGlow;
                    ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            },

            radial(ctx, centerX, centerY, dataArray) {
                const maxRadius = Math.min(config.width, config.height) * 0.4 * state.vizScale;
                
                for (let i = 0; i < dataArray.length; i += 2) {
                    const value = dataArray[i];
                    const radius = (value / 255) * maxRadius;
                    const hue = (i / dataArray.length) * 360;
                    
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = `hsla(${hue}, 100%, 50%, 0.6)`;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = state.vizGlow;
                    ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            },

            neon(ctx, centerX, centerY, dataArray) {
                const barWidth = config.width / dataArray.length;
                
                for (let i = 0; i < dataArray.length; i++) {
                    const barHeight = (dataArray[i] / 255) * config.height * 0.8 * state.vizScale;
                    const x = i * barWidth;
                    const y = centerY - barHeight / 2;
                    
                    const gradient = ctx.createLinearGradient(x, y, x, y + barHeight);
                    gradient.addColorStop(0, '#ff0080');
                    gradient.addColorStop(0.5, '#0080ff');
                    gradient.addColorStop(1, '#00ff80');
                    
                    ctx.fillStyle = gradient;
                    ctx.shadowBlur = state.vizGlow;
                    ctx.shadowColor = '#ff0080';
                    ctx.fillRect(x, y, barWidth - 1, barHeight);
                }
                ctx.shadowBlur = 0;
            },

            tunnel(ctx, centerX, centerY, dataArray) {
                const maxRings = 20;
                const maxRadius = Math.min(config.width, config.height) * 0.5 * state.vizScale;
                
                for (let ring = 0; ring < maxRings; ring++) {
                    const ringProgress = ring / maxRings;
                    const radius = maxRadius * (1 - ringProgress);
                    const dataIndex = Math.floor(ringProgress * dataArray.length);
                    const intensity = dataArray[dataIndex] / 255;
                    
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    
                    const alpha = intensity * (1 - ringProgress);
                    const hue = ringProgress * 360 + time * 50;
                    ctx.strokeStyle = `hsla(${hue}, 100%, 50%, ${alpha})`;
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = state.vizGlow * intensity;
                    ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            },

            ringWave(ctx, centerX, centerY, dataArray) {
                const rings = 10;
                const baseRadius = Math.min(config.width, config.height) * 0.1 * state.vizScale;
                
                for (let ring = 0; ring < rings; ring++) {
                    const radius = baseRadius * (ring + 1);
                    const segments = 60;
                    
                    ctx.beginPath();
                    for (let i = 0; i <= segments; i++) {
                        const angle = (i / segments) * Math.PI * 2 + rotation * (ring + 1) * 0.1;
                        const dataIndex = Math.floor((i + ring * 10) / (segments + rings * 10) * dataArray.length);
                        const wave = (dataArray[dataIndex] / 255) * 20;
                        
                        const x = centerX + Math.cos(angle) * (radius + wave);
                        const y = centerY + Math.sin(angle) * (radius + wave);
                        
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    
                    const hue = (ring / rings) * 360;
                    ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = state.vizGlow;
                    ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            },

            mirrorWave(ctx, centerX, centerY, dataArray) {
                const waveHeight = config.height * 0.3 * state.vizScale;
                const waveWidth = config.width;
                const step = waveWidth / dataArray.length;
                
                // Верхняя волна
                ctx.beginPath();
                for (let i = 0; i < dataArray.length; i++) {
                    const x = i * step;
                    const y = centerY - (dataArray[i] / 255) * waveHeight;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                
                const gradient1 = ctx.createLinearGradient(0, centerY - waveHeight, 0, centerY);
                gradient1.addColorStop(0, '#ff006e');
                gradient1.addColorStop(1, 'rgba(255, 0, 110, 0)');
                ctx.strokeStyle = gradient1;
                ctx.lineWidth = 3;
                ctx.shadowBlur = state.vizGlow;
                ctx.shadowColor = '#ff006e';
                ctx.stroke();
                
                // Нижняя волна (зеркальная)
                ctx.beginPath();
                for (let i = 0; i < dataArray.length; i++) {
                    const x = i * step;
                    const y = centerY + (dataArray[i] / 255) * waveHeight;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                
                const gradient2 = ctx.createLinearGradient(0, centerY, 0, centerY + waveHeight);
                gradient2.addColorStop(0, 'rgba(0, 255, 200, 0)');
                gradient2.addColorStop(1, '#00ffc8');
                ctx.strokeStyle = gradient2;
                ctx.stroke();
                ctx.shadowBlur = 0;
            },

            hudTech3D(ctx, centerX, centerY, dataArray) {
                const gridSize = 50;
                const bassValue = dataArray.slice(0, 10).reduce((a, b) => a + b, 0) / 10;
                
                // Сетка
                ctx.strokeStyle = `rgba(0, 255, 255, ${0.3 + bassValue / 255 * 0.4})`;
                ctx.lineWidth = 1;
                
                for (let x = 0; x < config.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, config.height);
                    ctx.stroke();
                }
                
                for (let y = 0; y < config.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(config.width, y);
                    ctx.stroke();
                }
                
                // Центральный элемент
                const size = 100 * state.vizScale + bassValue / 2;
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(rotation);
                
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.shadowBlur = state.vizGlow;
                ctx.shadowColor = '#00ffff';
                
                ctx.strokeRect(-size/2, -size/2, size, size);
                ctx.strokeRect(-size/4, -size/4, size/2, size/2);
                
                ctx.restore();
                ctx.shadowBlur = 0;
            },

            landscape3D(ctx, centerX, centerY, dataArray) {
                const horizon = centerY + 50;
                const mountains = 5;
                const mountainWidth = config.width / mountains;
                
                for (let m = 0; m < mountains; m++) {
                    const startX = m * mountainWidth;
                    const peaks = 20;
                    
                    ctx.beginPath();
                    ctx.moveTo(startX, horizon);
                    
                    for (let p = 0; p <= peaks; p++) {
                        const x = startX + (p / peaks) * mountainWidth;
                        const dataIndex = Math.floor((m * peaks + p) / (mountains * peaks) * dataArray.length);
                        const height = (dataArray[dataIndex] / 255) * config.height * 0.4 * state.vizScale;
                        const y = horizon - height;
                        ctx.lineTo(x, y);
                    }
                    
                    ctx.lineTo(startX + mountainWidth, horizon);
                    
                    const gradient = ctx.createLinearGradient(0, horizon - config.height * 0.4, 0, horizon);
                    gradient.addColorStop(0, `hsl(${200 + m * 40}, 80%, 60%)`);
                    gradient.addColorStop(1, `hsla(${200 + m * 40}, 80%, 20%, 0.3)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    ctx.strokeStyle = `hsl(${200 + m * 40}, 100%, 70%)`;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = state.vizGlow;
                    ctx.shadowColor = `hsl(${200 + m * 40}, 100%, 70%)`;
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            },

            electricWave(ctx, centerX, centerY, dataArray) {
                const segments = dataArray.length;
                const amplitude = config.height * 0.2 * state.vizScale;
                
                for (let wave = 0; wave < 3; wave++) {
                    ctx.beginPath();
                    
                    for (let i = 0; i < segments; i++) {
                        const x = (i / segments) * config.width;
                        const waveOffset = wave * Math.PI / 3;
                        const baseY = centerY + Math.sin(i * 0.05 + time + waveOffset) * 20;
                        const dataY = (dataArray[i] / 255) * amplitude * Math.sin(i * 0.1 + time);
                        const y = baseY + dataY;
                        
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    
                    const colors = ['#ff0080', '#0080ff', '#80ff00'];
                    ctx.strokeStyle = colors[wave];
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = state.vizGlow;
                    ctx.shadowColor = colors[wave];
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
            },

            soundPressure3D(ctx, centerX, centerY, dataArray) {
                const cubes = 15;
                const cubeSize = 30 * state.vizScale;
                const spacing = 40;
                const startX = centerX - (cubes * spacing) / 2;
                
                for (let i = 0; i < cubes; i++) {
                    for (let j = 0; j < cubes; j++) {
                        const x = startX + i * spacing;
                        const y = centerY - (cubes * spacing) / 2 + j * spacing;
                        const dataIndex = Math.floor(((i + j) / (cubes * 2)) * dataArray.length);
                        const pressure = dataArray[dataIndex] / 255;
                        
                        if (pressure > 0.1) {
                            const size = cubeSize * pressure;
                            const depth = size * 0.5;
                            
                            // Основной куб
                            ctx.fillStyle = `hsl(${pressure * 360}, 100%, ${50 + pressure * 30}%)`;
                            ctx.shadowBlur = state.vizGlow * pressure;
                            ctx.shadowColor = `hsl(${pressure * 360}, 100%, 50%)`;
                            ctx.fillRect(x - size/2, y - size/2, size, size);
                            
                            // 3D эффект
                            ctx.fillStyle = `hsl(${pressure * 360}, 100%, ${30 + pressure * 20}%)`;
                            ctx.fillRect(x - size/2 + depth, y - size/2 - depth, size, size);
                            
                            // Соединительные линии
                            ctx.strokeStyle = `hsl(${pressure * 360}, 100%, 70%)`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(x - size/2, y - size/2);
                            ctx.lineTo(x - size/2 + depth, y - size/2 - depth);
                            ctx.moveTo(x + size/2, y - size/2);
                            ctx.lineTo(x + size/2 + depth, y - size/2 - depth);
                            ctx.moveTo(x - size/2, y + size/2);
                            ctx.lineTo(x - size/2 + depth, y + size/2 - depth);
                            ctx.moveTo(x + size/2, y + size/2);
                            ctx.lineTo(x + size/2 + depth, y + size/2 - depth);
                            ctx.stroke();
                        }
                    }
                }
                ctx.shadowBlur = 0;
            },

            waveformCircle(ctx, centerX, centerY, dataArray) {
                const radius = Math.min(config.width, config.height) * 0.25 * state.vizScale;
                const segments = 120;
                
                ctx.beginPath();
                for (let i = 0; i < segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    const dataIndex = Math.floor((i / segments) * dataArray.length);
                    const wave = (dataArray[dataIndex] / 255) * 50;
                    const waveRadius = radius + wave * Math.sin(i * 0.2 + time);
                    
                    const x = centerX + Math.cos(angle) * waveRadius;
                    const y = centerY + Math.sin(angle) * waveRadius;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius + 50);
                gradient.addColorStop(0, 'rgba(255, 100, 200, 0.8)');
                gradient.addColorStop(0.7, 'rgba(100, 200, 255, 0.5)');
                gradient.addColorStop(1, 'rgba(100, 255, 100, 0.2)');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 4;
                ctx.shadowBlur = state.vizGlow;
                ctx.shadowColor = '#ff64c8';
                ctx.stroke();
                ctx.shadowBlur = 0;
            },

            purpleSpiral(ctx, centerX, centerY, dataArray) {
                const maxRadius = Math.min(config.width, config.height) * 0.3 * state.vizScale;
                const turns = 5;
                const points = dataArray.length;
                
                ctx.beginPath();
                for (let i = 0; i < points; i++) {
                    const t = i / points;
                    const angle = t * turns * Math.PI * 2 + rotation;
                    const spiralRadius = t * maxRadius;
                    const wave = (dataArray[i] / 255) * 20;
                    const finalRadius = spiralRadius + wave;
                    
                    const x = centerX + Math.cos(angle) * finalRadius;
                    const y = centerY + Math.sin(angle) * finalRadius;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
                gradient.addColorStop(0, '#8A2BE2');
                gradient.addColorStop(0.5, '#DA70D6');
                gradient.addColorStop(1, '#9370DB');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 3;
                ctx.shadowBlur = state.vizGlow;
                ctx.shadowColor = '#8A2BE2';
                ctx.stroke();
                ctx.shadowBlur = 0;
            },

            eyeSpectrum3D(ctx, centerX, centerY, dataArray) {
                const eyeWidth = 200 * state.vizScale;
                const eyeHeight = 100 * state.vizScale;
                const bass = dataArray.slice(0, 10).reduce((a, b) => a + b, 0) / 10;
                
                // Внешний контур глаза
                ctx.beginPath();
                ctx.ellipse(centerX, centerY, eyeWidth, eyeHeight, 0, 0, Math.PI * 2);
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.shadowBlur = state.vizGlow;
                ctx.shadowColor = '#00ffff';
                ctx.stroke();
                
                // Зрачок с анимацией
                const pupilSize = 30 + bass / 10;
                ctx.beginPath();
                ctx.arc(centerX, centerY, pupilSize, 0, Math.PI * 2);
                ctx.fillStyle = '#000';
				                ctx.fill();
                
                // Радужка
                const irisGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, pupilSize * 2);
                irisGradient.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
                irisGradient.addColorStop(1, 'rgba(0, 150, 255, 0.3)');
                ctx.beginPath();
                ctx.arc(centerX, centerY, pupilSize * 2, 0, Math.PI * 2);
                ctx.fillStyle = irisGradient;
                ctx.fill();
                
                // Спектральные лучи
                for (let i = 0; i < dataArray.length; i += 4) {
                    const angle = (i / dataArray.length) * Math.PI * 2;
                    const intensity = dataArray[i] / 255;
                    const rayLength = intensity * eyeWidth;
                    
                    if (rayLength > 10) {
                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY);
                        ctx.lineTo(
                            centerX + Math.cos(angle) * rayLength,
                            centerY + Math.sin(angle) * rayLength
                        );
                        ctx.strokeStyle = `hsla(${(i / dataArray.length) * 360}, 100%, 70%, ${intensity})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
                ctx.shadowBlur = 0;
            },

            centralBars(ctx, centerX, centerY, dataArray) {
                const barCount = 64;
                const maxBarHeight = config.height * 0.4 * state.vizScale;
                const barWidth = 8;
                const totalWidth = barCount * (barWidth + 2);
                const startX = centerX - totalWidth / 2;
                
                for (let i = 0; i < barCount; i++) {
                    const dataIndex = Math.floor((i / barCount) * dataArray.length);
                    const barHeight = (dataArray[dataIndex] / 255) * maxBarHeight;
                    const x = startX + i * (barWidth + 2);
                    const y = centerY - barHeight / 2;
                    
                    const gradient = ctx.createLinearGradient(x, y, x, y + barHeight);
                    gradient.addColorStop(0, '#ff4757');
                    gradient.addColorStop(0.5, '#ffa502');
                    gradient.addColorStop(1, '#ff6b6b');
                    
                    ctx.fillStyle = gradient;
                    ctx.shadowBlur = state.vizGlow;
                    ctx.shadowColor = '#ff4757';
                    ctx.fillRect(x, y, barWidth, barHeight);
                }
                ctx.shadowBlur = 0;
            },

            doubleBars(ctx, centerX, centerY, dataArray) {
                const barCount = 32;
                const maxBarHeight = config.height * 0.35 * state.vizScale;
                const barWidth = 10;
                const spacing = 15;
                
                for (let i = 0; i < barCount; i++) {
                    const dataIndex = Math.floor((i / barCount) * dataArray.length);
                    const barHeight = (dataArray[dataIndex] / 255) * maxBarHeight;
                    
                    // Левые бары
                    const leftX = centerX - (barCount / 2 * spacing) + i * spacing;
                    ctx.fillStyle = `hsl(${200 + i * 5}, 100%, 60%)`;
                    ctx.shadowBlur = state.vizGlow;
                    ctx.shadowColor = `hsl(${200 + i * 5}, 100%, 60%)`;
                    ctx.fillRect(leftX, centerY - barHeight, barWidth, barHeight);
                    
                    // Правые бары (зеркальные)
                    ctx.fillRect(leftX, centerY, barWidth, barHeight);
                }
                ctx.shadowBlur = 0;
            },

            modernSpectrum(ctx, centerX, centerY, dataArray) {
                const barCount = 128;
                const maxHeight = config.height * 0.6 * state.vizScale;
                const barWidth = config.width / barCount;
                
                for (let i = 0; i < barCount; i++) {
                    const dataIndex = Math.floor((i / barCount) * dataArray.length);
                    const height = (dataArray[dataIndex] / 255) * maxHeight;
                    const x = i * barWidth;
                    const y = config.height - height;
                    
                    const hue = (i / barCount) * 360;
                    const gradient = ctx.createLinearGradient(x, y, x, config.height);
                    gradient.addColorStop(0, `hsla(${hue}, 100%, 70%, 0.9)`);
                    gradient.addColorStop(1, `hsla(${hue}, 100%, 30%, 0.3)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, y, barWidth - 1, height);
                    
                    // Свечение сверху
                    if (height > maxHeight * 0.7) {
                        ctx.shadowBlur = state.vizGlow;
                        ctx.shadowColor = `hsl(${hue}, 100%, 70%)`;
                        ctx.fillRect(x, y - 5, barWidth - 1, 5);
                        ctx.shadowBlur = 0;
                    }
                }
            },

            snowFlake(ctx, centerX, centerY, dataArray) {
                const arms = 8;
                const maxLength = Math.min(config.width, config.height) * 0.3 * state.vizScale;
                
                for (let arm = 0; arm < arms; arm++) {
                    const angle = (arm / arms) * Math.PI * 2 + rotation * 0.1;
                    const segments = 20;
                    
                    for (let seg = 0; seg < segments; seg++) {
                        const t = seg / segments;
                        const dataIndex = Math.floor((arm * segments + seg) / (arms * segments) * dataArray.length);
                        const intensity = dataArray[dataIndex] / 255;
                        const length = t * maxLength * intensity;
                        
                        const x = centerX + Math.cos(angle) * length;
                        const y = centerY + Math.sin(angle) * length;
                        
                        // Основная ветка
                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY);
                        ctx.lineTo(x, y);
                        ctx.strokeStyle = `hsla(${200 + intensity * 60}, 100%, 80%, ${intensity})`;
                        ctx.lineWidth = 3 * intensity;
                        ctx.shadowBlur = state.vizGlow * intensity;
                        ctx.shadowColor = `hsl(${200 + intensity * 60}, 100%, 80%)`;
                        ctx.stroke();
                        
                        // Боковые веточки
                        if (seg % 3 === 0 && intensity > 0.3) {
                            const branchLength = length * 0.3;
                            const branchAngle1 = angle + Math.PI / 6;
                            const branchAngle2 = angle - Math.PI / 6;
                            
                            ctx.beginPath();
                            ctx.moveTo(x, y);
                            ctx.lineTo(x + Math.cos(branchAngle1) * branchLength, y + Math.sin(branchAngle1) * branchLength);
                            ctx.moveTo(x, y);
                            ctx.lineTo(x + Math.cos(branchAngle2) * branchLength, y + Math.sin(branchAngle2) * branchLength);
                            ctx.lineWidth = 2 * intensity;
                            ctx.stroke();
                        }
                    }
                }
                ctx.shadowBlur = 0;
            },

            rippleWaves(ctx, centerX, centerY, dataArray) {
                const maxRipples = 15;
                const maxRadius = Math.min(config.width, config.height) * 0.6;
                const bassAvg = dataArray.slice(0, 20).reduce((a, b) => a + b, 0) / 20;
                
                for (let i = 0; i < maxRipples; i++) {
                    const rippleTime = (time * state.vizSpeed + i * 0.5) % 10;
                    const radius = (rippleTime / 10) * maxRadius;
                    const dataIndex = Math.floor((i / maxRipples) * dataArray.length);
                    const intensity = (dataArray[dataIndex] / 255) * (1 - rippleTime / 10);
                    
                    if (intensity > 0.1) {
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                        
                        const alpha = intensity * (1 - rippleTime / 10);
                        const hue = (rippleTime * 36 + bassAvg) % 360;
                        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
                        ctx.lineWidth = 3 * intensity;
                        ctx.shadowBlur = state.vizGlow * intensity;
                        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
                        ctx.stroke();
                    }
                }
                ctx.shadowBlur = 0;
            },

            galaxySpiral(ctx, centerX, centerY, dataArray) {
                const arms = 3;
                const maxRadius = Math.min(config.width, config.height) * 0.4 * state.vizScale;
                const points = dataArray.length;
                
                for (let arm = 0; arm < arms; arm++) {
                    const armOffset = (arm / arms) * Math.PI * 2;
                    ctx.beginPath();
                    
                    for (let i = 0; i < points; i++) {
                        const t = i / points;
                        const spiralRadius = t * maxRadius;
                        const angle = t * 4 * Math.PI + armOffset + rotation * 0.5;
                        const intensity = dataArray[i] / 255;
                        
                        const x = centerX + Math.cos(angle) * spiralRadius;
                        const y = centerY + Math.sin(angle) * spiralRadius;
                        
                        if (intensity > 0.2) {
                            ctx.beginPath();
                            ctx.arc(x, y, intensity * 4, 0, Math.PI * 2);
                            
                            const hue = (t * 360 + arm * 120) % 360;
                            ctx.fillStyle = `hsla(${hue}, 100%, 70%, ${intensity})`;
                            ctx.shadowBlur = state.vizGlow * intensity;
                            ctx.shadowColor = `hsl(${hue}, 100%, 70%)`;
                            ctx.fill();
                        }
                    }
                }
                ctx.shadowBlur = 0;
            },

            particleField(ctx, centerX, centerY, dataArray) {
                const particleCount = 200;
                const fieldSize = Math.min(config.width, config.height) * 0.8;
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2;
                    const distance = Math.random() * fieldSize * 0.5;
                    const dataIndex = Math.floor((i / particleCount) * dataArray.length);
                    const intensity = dataArray[dataIndex] / 255;
                    
                    if (intensity > 0.1) {
                        const x = centerX + Math.cos(angle + time * 0.1) * distance;
                        const y = centerY + Math.sin(angle + time * 0.1) * distance;
                        const size = intensity * 8 * state.vizScale;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, size, 0, Math.PI * 2);
                        
                        const hue = (intensity * 360 + time * 50) % 360;
                        ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${intensity})`;
                        ctx.shadowBlur = state.vizGlow * intensity;
                        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
                        ctx.fill();
                    }
                }
                ctx.shadowBlur = 0;
            },

            heartBeat(ctx, centerX, centerY, dataArray) {
                const bassValue = dataArray.slice(0, 10).reduce((a, b) => a + b, 0) / 10;
                const heartSize = (50 + bassValue / 2) * state.vizScale;
                const pulse = Math.sin(time * 8) * 0.2 + 1;
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.scale(pulse, pulse);
                
                // Рисуем сердце
                ctx.beginPath();
                ctx.moveTo(0, heartSize * 0.3);
                
                // Левая половина сердца
                ctx.bezierCurveTo(-heartSize * 0.5, -heartSize * 0.2, -heartSize, -heartSize * 0.2, -heartSize * 0.5, heartSize * 0.1);
                ctx.bezierCurveTo(-heartSize * 0.5, heartSize * 0.3, 0, heartSize * 0.7, 0, heartSize);
                
                // Правая половина сердца
                ctx.bezierCurveTo(0, heartSize * 0.7, heartSize * 0.5, heartSize * 0.3, heartSize * 0.5, heartSize * 0.1);
                ctx.bezierCurveTo(heartSize, -heartSize * 0.2, heartSize * 0.5, -heartSize * 0.2, 0, heartSize * 0.3);
                
                const intensity = bassValue / 255;
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, heartSize);
                gradient.addColorStop(0, `rgba(255, 20, 147, ${0.8 + intensity * 0.2})`);
                gradient.addColorStop(1, `rgba(220, 20, 60, ${0.3 + intensity * 0.3})`);
                
                ctx.fillStyle = gradient;
                ctx.shadowBlur = state.vizGlow * (1 + intensity);
                ctx.shadowColor = '#ff1493';
                ctx.fill();
                
                ctx.restore();
                ctx.shadowBlur = 0;
            },

            matrix3D(ctx, centerX, centerY, dataArray) {
                const cols = 20;
                const rows = 15;
                const cellSize = 25 * state.vizScale;
                const startX = centerX - (cols * cellSize) / 2;
                const startY = centerY - (rows * cellSize) / 2;
                
                for (let col = 0; col < cols; col++) {
                    for (let row = 0; row < rows; row++) {
                        const dataIndex = Math.floor(((col + row) / (cols + rows)) * dataArray.length);
                        const intensity = dataArray[dataIndex] / 255;
                        
                        if (intensity > 0.3) {
                            const x = startX + col * cellSize;
                            const y = startY + row * cellSize;
                            const char = String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96));
                            
                            ctx.font = `${cellSize * 0.8}px monospace`;
                            ctx.fillStyle = `hsla(120, 100%, ${50 + intensity * 50}%, ${intensity})`;
                            ctx.shadowBlur = state.vizGlow * intensity;
                            ctx.shadowColor = '#00ff00';
                            ctx.fillText(char, x, y + cellSize);
                        }
                    }
                }
                ctx.shadowBlur = 0;
            },

            dnaHelix(ctx, centerX, centerY, dataArray) {
                const helixHeight = config.height * 0.8;
                const helixWidth = 100 * state.vizScale;
                const segments = dataArray.length / 2;
                
                for (let i = 0; i < segments; i++) {
                    const t = i / segments;
                    const y = centerY - helixHeight / 2 + t * helixHeight;
                    const angle = t * Math.PI * 8 + time;
                    
                    const intensity1 = dataArray[i * 2] / 255;
                    const intensity2 = dataArray[i * 2 + 1] / 255;
                    
                    // Левая спираль
                    const x1 = centerX + Math.cos(angle) * helixWidth * intensity1;
                    ctx.beginPath();
                    ctx.arc(x1, y, 3 * intensity1, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(200, 100%, 60%, ${intensity1})`;
                    ctx.shadowBlur = state.vizGlow * intensity1;
                    ctx.shadowColor = '#00bfff';
                    ctx.fill();
                    
                    // Правая спираль
                    const x2 = centerX + Math.cos(angle + Math.PI) * helixWidth * intensity2;
                    ctx.beginPath();
                    ctx.arc(x2, y, 3 * intensity2, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(300, 100%, 60%, ${intensity2})`;
                    ctx.shadowColor = '#ff00ff';
                    ctx.fill();
                    
                    // Соединительные линии
                    if (intensity1 > 0.2 && intensity2 > 0.2) {
                        ctx.beginPath();
                        ctx.moveTo(x1, y);
                        ctx.lineTo(x2, y);
                        ctx.strokeStyle = `hsla(${t * 360}, 100%, 70%, ${(intensity1 + intensity2) / 2})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
                ctx.shadowBlur = 0;
            },

            quantumField(ctx, centerX, centerY, dataArray) {
                const gridSize = 40;
                const cols = Math.floor(config.width / gridSize);
                const rows = Math.floor(config.height / gridSize);
                
                for (let x = 0; x < cols; x++) {
                    for (let y = 0; y < rows; y++) {
                        const posX = x * gridSize;
                        const posY = y * gridSize;
                        const dataIndex = Math.floor(((x + y) / (cols + rows)) * dataArray.length);
                        const intensity = dataArray[dataIndex] / 255;
                        
                        if (intensity > 0.1) {
                            const waveX = Math.sin((x + time) * 0.1) * 10;
                            const waveY = Math.cos((y + time) * 0.1) * 10;
                            
                            ctx.beginPath();
                            ctx.arc(posX + waveX, posY + waveY, intensity * 15, 0, Math.PI * 2);
                            
                            const hue = ((x + y) * 10 + time * 50) % 360;
                            ctx.fillStyle = `hsla(${hue}, 100%, 50%, ${intensity * 0.7})`;
                            ctx.shadowBlur = state.vizGlow * intensity;
                            ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                            ctx.fill();
                            
                            // Квантовые связи
                            if (Math.random() < intensity * 0.1) {
                                const targetX = (x + Math.floor(Math.random() * 3 - 1)) * gridSize;
                                const targetY = (y + Math.floor(Math.random() * 3 - 1)) * gridSize;
                                
                                ctx.beginPath();
                                ctx.moveTo(posX + waveX, posY + waveY);
                                ctx.lineTo(targetX, targetY);
                                ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${intensity * 0.3})`;
                                ctx.lineWidth = 1;
                                ctx.stroke();
                            }
                        }
                    }
                }
                ctx.shadowBlur = 0;
            },

            neurNetwork(ctx, centerX, centerY, dataArray) {
                const neurons = 50;
                const maxDistance = Math.min(config.width, config.height) * 0.4;
                const nodes = [];
                
                // Создаем узлы
                for (let i = 0; i < neurons; i++) {
                    const angle = (i / neurons) * Math.PI * 2;
                    const distance = Math.random() * maxDistance;
                    const dataIndex = Math.floor((i / neurons) * dataArray.length);
                    const activity = dataArray[dataIndex] / 255;
                    
                    nodes.push({
                        x: centerX + Math.cos(angle) * distance,
                        y: centerY + Math.sin(angle) * distance,
                        activity: activity,
                        size: 3 + activity * 7
                    });
                }
                
                // Рисуем связи
                ctx.lineWidth = 1;
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const node1 = nodes[i];
                        const node2 = nodes[j];
                        const distance = Math.hypot(node1.x - node2.x, node1.y - node2.y);
                        
                        if (distance < 150 && (node1.activity > 0.2 || node2.activity > 0.2)) {
                            const strength = Math.min(node1.activity, node2.activity);
                            ctx.beginPath();
                            ctx.moveTo(node1.x, node1.y);
                            ctx.lineTo(node2.x, node2.y);
                            ctx.strokeStyle = `hsla(60, 100%, 50%, ${strength * 0.5})`;
                            ctx.stroke();
                        }
                    }
                }
                
                // Рисуем узлы
                nodes.forEach((node, i) => {
                    if (node.activity > 0.1) {
                        ctx.beginPath();
                        ctx.arc(node.x, node.y, node.size * state.vizScale, 0, Math.PI * 2);
                        
                        const hue = (i * 10 + node.activity * 100) % 360;
                        ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${node.activity})`;
                        ctx.shadowBlur = state.vizGlow * node.activity;
                        ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
                        ctx.fill();
                    }
                });
                ctx.shadowBlur = 0;
            },

            cosmicRing(ctx, centerX, centerY, dataArray) {
                const rings = 12;
                const maxRadius = Math.min(config.width, config.height) * 0.4 * state.vizScale;
                
                for (let ring = 0; ring < rings; ring++) {
                    const ringRadius = ((ring + 1) / rings) * maxRadius;
                    const segments = 60;
                    const dataSlice = Math.floor((ring / rings) * dataArray.length);
                    const intensity = dataArray[dataSlice] / 255;
                    
                    if (intensity > 0.1) {
                        ctx.beginPath();
                        for (let seg = 0; seg <= segments; seg++) {
                            const angle = (seg / segments) * Math.PI * 2 + rotation * (ring + 1) * 0.05;
                            const wave = Math.sin(seg * 0.2 + time + ring) * intensity * 10;
                            const finalRadius = ringRadius + wave;
                            
                            const x = centerX + Math.cos(angle) * finalRadius;
                            const y = centerY + Math.sin(angle) * finalRadius;
                            
                            if (seg === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        
                        const hue = (ring * 30 + time * 20) % 360;
                        const gradient = ctx.createRadialGradient(centerX, centerY, ringRadius - 10, centerX, centerY, ringRadius + 10);
                        gradient.addColorStop(0, `hsla(${hue}, 100%, 70%, ${intensity})`);
                        gradient.addColorStop(1, `hsla(${hue + 60}, 100%, 50%, ${intensity * 0.3})`);
                        
                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = state.vizGlow * intensity;
                        ctx.shadowColor = `hsl(${hue}, 100%, 70%)`;
                        ctx.stroke();
                    }
                }
                ctx.shadowBlur = 0;
            },

            synthWave(ctx, centerX, centerY, dataArray) {
                const horizon = centerY + 100;
                const gridSpacing = 30;
                const bassValue = dataArray.slice(0, 20).reduce((a, b) => a + b, 0) / 20;
                
                // Фоновая сетка
                ctx.strokeStyle = `rgba(255, 0, 128, ${0.3 + bassValue / 500})`;
                ctx.lineWidth = 1;
                
                // Вертикальные линии
                for (let x = 0; x < config.width; x += gridSpacing) {
                    ctx.beginPath();
                    ctx.moveTo(x, horizon);
                    ctx.lineTo(x, config.height);
                    ctx.stroke();
                }
                
                // Горизонтальные линии с перспективой
                for (let y = horizon; y < config.height; y += gridSpacing) {
                    const perspective = (y - horizon) / (config.height - horizon);
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(config.width, y);
                    ctx.globalAlpha = 1 - perspective * 0.7;
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
                
                // Горы на горизонте
                const mountains = 8;
                const mountainWidth = config.width / mountains;
                
                ctx.beginPath();
                ctx.moveTo(0, horizon);
                
                for (let m = 0; m <= mountains; m++) {
                    const x = (m / mountains) * config.width;
                    const dataIndex = Math.floor((m / mountains) * dataArray.length);
                    const height = (dataArray[dataIndex] / 255) * 150 * state.vizScale;
                    const y = horizon - height;
                    
                    ctx.lineTo(x, y);
                }
                
                ctx.lineTo(config.width, horizon);
                ctx.closePath();
                
                const mountainGradient = ctx.createLinearGradient(0, horizon - 150, 0, horizon);
                mountainGradient.addColorStop(0, 'rgba(255, 20, 147, 0.8)');
                mountainGradient.addColorStop(1, 'rgba(138, 43, 226, 0.4)');
                
                ctx.fillStyle = mountainGradient;
                ctx.fill();
                
                // Солнце
                const sunSize = 60 + bassValue / 5;
                ctx.beginPath();
                ctx.arc(centerX, horizon - 80, sunSize, 0, Math.PI * 2);
                
                const sunGradient = ctx.createRadialGradient(centerX, horizon - 80, 0, centerX, horizon - 80, sunSize);
                sunGradient.addColorStop(0, '#ffff00');
                sunGradient.addColorStop(0.7, '#ff4500');
                sunGradient.addColorStop(1, 'rgba(255, 69, 0, 0)');
                
                ctx.fillStyle = sunGradient;
                ctx.shadowBlur = state.vizGlow * 2;
                ctx.shadowColor = '#ff4500';
                ctx.fill();
                ctx.shadowBlur = 0;
            },

            hologram3D(ctx, centerX, centerY, dataArray) {
                const layers = 8;
                const maxSize = Math.min(config.width, config.height) * 0.3 * state.vizScale;
                
                for (let layer = 0; layer < layers; layer++) {
                    const layerProgress = layer / layers;
                    const size = maxSize * (1 - layerProgress * 0.3);
                    const depth = layer * 15;
                    const dataIndex = Math.floor(layerProgress * dataArray.length);
                    const intensity = dataArray[dataIndex] / 255;
                    
                    if (intensity > 0.1) {
                        ctx.save();
                        ctx.translate(centerX + depth, centerY - depth);
                        ctx.rotate(rotation + layerProgress);
                        
                        // Основная фигура
                        ctx.beginPath();
                        ctx.rect(-size/2, -size/2, size, size);
                                                const alpha = intensity * (1 - layerProgress * 0.5);
                        const hue = (layerProgress * 180 + time * 30) % 360;
                        
                        ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${alpha})`;
                        ctx.lineWidth = 2;
                        ctx.shadowBlur = state.vizGlow * alpha;
                        ctx.shadowColor = `hsl(${hue}, 100%, 70%)`;
                        ctx.stroke();
                        
                        // Голографические линии
                        const lines = 8;
                        for (let i = 0; i < lines; i++) {
                            const lineProgress = i / lines;
                            const y = -size/2 + lineProgress * size;
                            
                            ctx.beginPath();
                            ctx.moveTo(-size/2, y);
                            ctx.lineTo(size/2, y);
                            ctx.strokeStyle = `hsla(${hue + 60}, 100%, 80%, ${alpha * 0.5})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                        
                        ctx.restore();
                    }
                }
                ctx.shadowBlur = 0;
            }
        };

        // Функция выбора случайного визуализатора
        function getRandomVisualizer() {
            const keys = Object.keys(visualizers);
            return keys[Math.floor(Math.random() * keys.length)];
        }

        // Инициализация Canvas
        function initCanvas() {
            canvas.width = config.width;
            canvas.height = config.height;
            ctx.imageSmoothingEnabled = true;
        }

        // Основная функция рендеринга
        function render() {
            if (!isPlaying) return;

            analyser.getByteFrequencyData(dataArray);
            
            // Очистка canvas с эффектом следа
            if (state.vizTrail) {
                ctx.fillStyle = `rgba(${bgColors.r}, ${bgColors.g}, ${bgColors.b}, ${1 - state.vizTrail})`;
                ctx.fillRect(0, 0, config.width, config.height);
            } else {
                ctx.clearRect(0, 0, config.width, config.height);
                
                // Градиентный фон
                if (state.vizBackground) {
                    const bgGradient = ctx.createLinearGradient(0, 0, config.width, config.height);
                    bgGradient.addColorStop(0, `rgba(${bgColors.r}, ${bgColors.g}, ${bgColors.b}, 0.1)`);
                    bgGradient.addColorStop(1, `rgba(${bgColors.r + 20}, ${bgColors.g + 20}, ${bgColors.b + 20}, 0.05)`);
                    ctx.fillStyle = bgGradient;
                    ctx.fillRect(0, 0, config.width, config.height);
                }
            }

            // Обновление времени и вращения
            time = performance.now() * 0.001;
            rotation += state.vizSpeed * 0.02;

            // Вычисление центра
            const centerX = config.width / 2;
            const centerY = config.height / 2;

            // Рендер текущего визуализатора
            ctx.save();
            
            if (visualizers[state.currentVisualizer]) {
                visualizers[state.currentVisualizer](ctx, centerX, centerY, dataArray);
            }

            // Автосмена визуализатора
            if (state.autoChange && time - lastVisualizerChange > state.changeInterval) {
                state.currentVisualizer = getRandomVisualizer();
                lastVisualizerChange = time;
                
                // Обновление UI
                const select = document.getElementById('visualizerSelect');
                if (select) {
                    select.value = state.currentVisualizer;
                }
            }

            ctx.restore();

            // Информационная панель
            if (state.showInfo) {
                drawInfo();
            }

            requestAnimationFrame(render);
        }

        // Функция отображения информации
        function drawInfo() {
            const bassLevel = dataArray.slice(0, 10).reduce((a, b) => a + b, 0) / 10;
            const midLevel = dataArray.slice(10, 50).reduce((a, b) => a + b, 0) / 40;
            const trebleLevel = dataArray.slice(50).reduce((a, b) => a + b, 0) / (dataArray.length - 50);

            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(10, 10, 200, 120);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px Arial';
            ctx.fillText(`Визуализатор: ${state.currentVisualizer}`, 20, 30);
            ctx.fillText(`Бас: ${Math.round(bassLevel)}`, 20, 50);
            ctx.fillText(`Средние: ${Math.round(midLevel)}`, 20, 70);
            ctx.fillText(`Высокие: ${Math.round(trebleLevel)}`, 20, 90);
            ctx.fillText(`FPS: ${Math.round(1000 / 16)}`, 20, 110);
            ctx.restore();
        }

        // Инициализация приложения
        function init() {
            initCanvas();
            
            // Создание элементов управления
            createControls();
            
            // Настройка Canvas для полноэкранного режима
            function resizeCanvas() {
                if (state.fullscreen) {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    config.width = canvas.width;
                    config.height = canvas.height;
                } else {
                    canvas.width = config.width;
                    canvas.height = config.height;
                }
            }

            window.addEventListener('resize', resizeCanvas);
            
            // Обработчики клавиш
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case ' ':
                        e.preventDefault();
                        togglePlayPause();
                        break;
                    case 'f':
                    case 'F':
                        toggleFullscreen();
                        break;
                    case 'n':
                    case 'N':
                        state.currentVisualizer = getRandomVisualizer();
                        document.getElementById('visualizerSelect').value = state.currentVisualizer;
                        break;
                    case 'i':
                    case 'I':
                        state.showInfo = !state.showInfo;
                        document.getElementById('showInfo').checked = state.showInfo;
                        break;
                }
            });

            console.log('Visualizer Pro загружен. Выберите аудиофайл для начала.');
        }

        // Создание элементов управления
        function createControls() {
            const container = document.getElementById('controls');
            
            container.innerHTML = `
                <div class="control-group">
                    <label for="audioFile">Выбрать аудиофайл:</label>
                    <input type="file" id="audioFile" accept="audio/*">
                    <button id="playPause">▶ Play</button>
                </div>

                <div class="control-group">
                    <label for="visualizerSelect">Визуализатор:</label>
                    <select id="visualizerSelect">
                        ${Object.keys(visualizers).map(key => 
                            `<option value="${key}">${key}</option>`
                        ).join('')}
                    </select>
                </div>

                <div class="control-group">
                    <label for="autoChange">Автосмена:</label>
                    <input type="checkbox" id="autoChange" ${state.autoChange ? 'checked' : ''}>
                    
                    <label for="changeInterval">Интервал (сек):</label>
                    <input type="range" id="changeInterval" min="5" max="60" value="${state.changeInterval}" step="5">
                    <span id="intervalValue">${state.changeInterval}s</span>
                </div>

                <div class="control-group">
                    <label for="vizScale">Масштаб:</label>
                    <input type="range" id="vizScale" min="0.1" max="3" value="${state.vizScale}" step="0.1">
                    <span id="scaleValue">${state.vizScale}</span>
                </div>

                <div class="control-group">
                    <label for="vizSpeed">Скорость:</label>
                    <input type="range" id="vizSpeed" min="0.1" max="5" value="${state.vizSpeed}" step="0.1">
                    <span id="speedValue">${state.vizSpeed}</span>
                </div>

                <div class="control-group">
                    <label for="vizGlow">Свечение:</label>
                    <input type="range" id="vizGlow" min="0" max="50" value="${state.vizGlow}" step="1">
                    <span id="glowValue">${state.vizGlow}</span>
                </div>

                <div class="control-group">
                    <label for="vizTrail">След:</label>
                    <input type="range" id="vizTrail" min="0" max="0.95" value="${state.vizTrail}" step="0.05">
                    <span id="trailValue">${state.vizTrail}</span>
                </div>

                <div class="control-group">
                    <input type="checkbox" id="showInfo" ${state.showInfo ? 'checked' : ''}>
                    <label for="showInfo">Показать инфо</label>
                    
                    <input type="checkbox" id="vizBackground" ${state.vizBackground ? 'checked' : ''}>
                    <label for="vizBackground">Фон</label>
                    
                    <button id="fullscreen">⛶ Полный экран</button>
                    <button id="randomViz">🎲 Случайный</button>
                </div>

                <div class="control-group">
                    <label>Горячие клавиши:</label>
                    <small>Пробел - Play/Pause, F - полный экран, N - случайный визуализатор, I - инфо</small>
                </div>
            `;

            // Привязка событий
            document.getElementById('audioFile').addEventListener('change', loadAudio);
            document.getElementById('playPause').addEventListener('click', togglePlayPause);
            document.getElementById('visualizerSelect').addEventListener('change', (e) => {
                state.currentVisualizer = e.target.value;
            });
            
            document.getElementById('autoChange').addEventListener('change', (e) => {
                state.autoChange = e.target.checked;
            });
            
            document.getElementById('changeInterval').addEventListener('input', (e) => {
                state.changeInterval = parseInt(e.target.value);
                document.getElementById('intervalValue').textContent = state.changeInterval + 's';
            });

            document.getElementById('vizScale').addEventListener('input', (e) => {
                state.vizScale = parseFloat(e.target.value);
                document.getElementById('scaleValue').textContent = state.vizScale;
            });

            document.getElementById('vizSpeed').addEventListener('input', (e) => {
                state.vizSpeed = parseFloat(e.target.value);
                document.getElementById('speedValue').textContent = state.vizSpeed;
            });

            document.getElementById('vizGlow').addEventListener('input', (e) => {
                state.vizGlow = parseInt(e.target.value);
                document.getElementById('glowValue').textContent = state.vizGlow;
            });

            document.getElementById('vizTrail').addEventListener('input', (e) => {
                state.vizTrail = parseFloat(e.target.value);
                document.getElementById('trailValue').textContent = state.vizTrail;
            });

            document.getElementById('showInfo').addEventListener('change', (e) => {
                state.showInfo = e.target.checked;
            });

            document.getElementById('vizBackground').addEventListener('change', (e) => {
                state.vizBackground = e.target.checked;
            });

            document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);
            document.getElementById('randomViz').addEventListener('click', () => {
                state.currentVisualizer = getRandomVisualizer();
                document.getElementById('visualizerSelect').value = state.currentVisualizer;
            });
        }

        // Функция переключения полноэкранного режима
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    state.fullscreen = true;
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    config.width = canvas.width;
                    config.height = canvas.height;
                });
            } else {
                document.exitFullscreen().then(() => {
                    state.fullscreen = false;
                    canvas.width = 800;
                    canvas.height = 600;
                    config.width = canvas.width;
                    config.height = canvas.height;
                });
            }
        }

        // Загрузка аудиофайла
        function loadAudio(event) {
            const file = event.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            
            if (audio) {
                audio.pause();
                audio.src = '';
                URL.revokeObjectURL(audio.src);
            }

            audio = new Audio(url);
            audio.crossOrigin = 'anonymous';
            
            audio.addEventListener('loadeddata', () => {
                setupAudioContext();
                document.getElementById('playPause').disabled = false;
                console.log('Аудиофайл загружен:', file.name);
            });

            audio.addEventListener('error', (e) => {
                console.error('Ошибка загрузки аудиофайла:', e);
                alert('Не удалось загрузить аудиофайл. Проверьте формат файла.');
            });
        }

        // Настройка аудиоконтекста
        function setupAudioContext() {
            if (audioContext) {
                audioContext.close();
            }

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.8;

            const source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        // Переключение воспроизведения
        function togglePlayPause() {
            if (!audio) {
                alert('Сначала выберите аудиофайл');
                return;
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            if (audio.paused) {
                audio.play();
                isPlaying = true;
                document.getElementById('playPause').textContent = '⏸ Pause';
                if (!animationStarted) {
                    render();
                    animationStarted = true;
                }
            } else {
                audio.pause();
                isPlaying = false;
                document.getElementById('playPause').textContent = '▶ Play';
            }
        }

        // Запуск приложения
        init();

    </script>
</body>
</html>
