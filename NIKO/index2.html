<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>N1K∅ Super Video Creator — Love-Edition 2025</title>
<style>
:root{
  --bg:#07060a;
  --card:#0b0b10;
  --border:#1a1a20;
  --accent:#ff4da6;
  --accent2:#00d1ff;
  --text:#eaeaf2;
  --muted:#8a8a9a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
.sidebar{width:320px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-header{padding:20px;background:linear-gradient(180deg,#000,var(--card));border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:18px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:8px}
.tabs{display:flex;background:#000;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px 8px;background:none;border:none;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none;padding:16px}
.tab-content.active{display:block}
.section{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.section:last-child{border:none;margin-bottom:0}
.section-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:700}
.input,select,input[type=file]{width:100%;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;margin-bottom:10px;transition:all .2s}
.input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,77,166,.1)}
input[type=color]{width:100%;height:40px;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:transparent}
.slider-group{margin-bottom:12px}
.slider-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.slider{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.1);outline:none;-webkit-appearance:none;cursor:pointer}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(255,77,166,.5)}
.slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:none;box-shadow:0 0 10px rgba(255,77,166,.5)}
.viz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.viz-card{background:rgba(255,255,255,.03);border:2px solid var(--border);border-radius:10px;padding:16px 12px;cursor:pointer;text-align:center;transition:all .2s}
.viz-card:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.viz-card.active{background:linear-gradient(135deg,rgba(255,77,166,.2),rgba(0,209,255,.2));border-color:var(--accent);box-shadow:0 0 20px rgba(255,77,166,.3)}
.viz-icon{font-size:26px;margin-bottom:8px;display:block}
.viz-name{font-size:11px;font-weight:600;color:var(--text)}
.btn{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;margin-bottom:8px}
.btn:hover:not(:disabled){background:rgba(255,255,255,.1);transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;box-shadow:0 4px 12px rgba(255,77,166,.3)}
.btn-primary:hover{box-shadow:0 6px 20px rgba(255,77,166,.5)}
.rec-indicator{position:fixed;top:30px;right:30px;background:rgba(255,0,0,.9);color:#fff;padding:12px 20px;border-radius:10px;font-weight:700;font-size:14px;display:none;align-items:center;gap:10px;z-index:9999;box-shadow:0 4px 20px rgba(255,0,0,.5);animation:pulse 2s infinite}
.rec-indicator.active{display:flex}
.rec-dot{width:10px;height:10px;background:#fff;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.main-area{flex:1;display:flex;flex-direction:column;padding:20px;gap:16px}
.canvas-container{flex:1;background:#000;border-radius:12px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 50px rgba(0,0,0,.8);border:2px solid var(--border)}
#canvas{max-width:100%;max-height:100%;display:block}
.timeline-area{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border)}
.playback{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.play-btn{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(255,77,166,.4);transition:all .2s}
.play-btn:hover{transform:scale(1.1);box-shadow:0 6px 25px rgba(255,77,166,.6)}
.time{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:100px}
.timeline{flex:1;height:40px;background:rgba(255,255,255,.05);border-radius:8px;position:relative;cursor:pointer;overflow:hidden}
.timeline-progress{position:absolute;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .1s linear}
.timeline-handle{position:absolute;top:50%;right:-8px;transform:translateY(-50%);width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 0 10px rgba(255,255,255,.5)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.05)}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}
@media(max-width:900px){body{flex-direction:column;height:auto;overflow:auto}.sidebar{width:100%;max-height:50vh;border-right:none;border-bottom:1px solid var(--border)}.main-area{padding:12px}.canvas-container{height:50vh}}
</style>
</head>
<body>

<div class="rec-indicator" id="recIndicator"><div class="rec-dot"></div>REC</div>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar">
  <div class="sidebar-header"><h1>N1K∅ Video Creator — Love-Edition</h1></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('project',this)">Project</button>
    <button class="tab" onclick="switchTab('audio',this)">Audio</button>
    <button class="tab" onclick="switchTab('viz',this)">Spectrum</button>
    <button class="tab" onclick="switchTab('fx',this)">Effects</button>
  </div>

  <!-- TAB PROJECT -->
  <div class="tab-content active" id="tab-project">
    <div class="section">
      <div class="section-title">Canvas Settings</div>
      <select id="resolution" class="input" onchange="updateResolution()">
        <option value="1920:1080">1920×1080 (16:9 Full HD)</option>
        <option value="1280:720">1280×720 (16:9 HD)</option>
        <option value="720:1280">720×1280 (9:16 TikTok)</option>
        <option value="1080:1920">1080×1920 (9:16 Reels)</option>
        <option value="1080:1080">1080×1080 (1:1 Instagram)</option>
      </select>
      <select id="fps" class="input"><option value="24">24 FPS</option><option value="30" selected>30 FPS</option><option value="60">60 FPS</option></select>
    </div>

    <div class="section">
      <div class="section-title">Background</div>
      <input type="file" id="bgImage" accept="image/*"/>
      <input type="color" id="bgColor" value="#000000"/>
      <div class="slider-group"><div class="slider-label"><span>Blur</span><span id="blurVal">0</span></div><input type="range" class="slider" id="bgBlur" min="0" max="20" value="0"></div>
      <div class="slider-group"><div class="slider-label"><span>Brightness</span><span id="brightVal">100%</span></div><input type="range" class="slider" id="bgBright" min="0" max="200" value="100"></div>
      <div class="slider-group"><div class="slider-label"><span>Reactiveness</span><span id="bgReactVal">0.05</span></div><input type="range" class="slider" id="bgReact" min="0" max="0.3" step="0.01" value="0.05"></div>
      <label style="display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer;"><input type="checkbox" id="videoReact"/><span style="font-size:12px">Video-Reaction (canvas pulse)</span></label>
    </div>

    <div class="section">
      <div class="section-title">Emblem / Overlay</div>
      <input type="file" id="emblemImage" accept="image/*"/>
      <div class="slider-group"><div class="slider-label"><span>Size</span><span id="emblemSizeVal">0.3</span></div><input type="range" class="slider" id="emblemSize" min="0.1" max="1" step="0.01" value="0.3"></div>
      <div class="slider-group"><div class="slider-label"><span>X Position</span><span id="emblemXVal">0.5</span></div><input type="range" class="slider" id="emblemX" min="0" max="1" step="0.01" value="0.5"></div>
      <div class="slider-group"><div class="slider-label"><span>Y Position</span><span id="emblemYVal">0.5</span></div><input type="range" class="slider" id="emblemY" min="0" max="1" step="0.01" value="0.5"></div>
      <label style="display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer;"><input type="checkbox" id="emblemCircle" checked><span style="font-size:12px">Clip to Circle</span></label>
    </div>
  </div>

  <!-- TAB AUDIO -->
  <div class="tab-content" id="tab-audio">
    <div class="section">
      <div class="section-title">Audio File</div>
      <input type="file" id="audioFile" accept="audio/*"/>
      <div class="slider-group"><div class="slider-label"><span>Smoothing</span><span id="smoothVal">0.85</span></div><input type="range" class="slider" id="audioSmooth" min="0" max="0.99" step="0.01" value="0.85"></div>
    </div>
  </div>

  <!-- TAB VISUALIZER -->
  <div class="tab-content" id="tab-viz">
    <div class="section">
      <div class="section-title">Spectrum Style</div>
      <div class="viz-grid" id="vizGrid"></div>
    </div>
    <div class="section">
      <div class="section-title">Settings</div>
      <input type="color" id="vizColor" value="#00a2ff" style="margin-bottom:10px">
      <div class="slider-group"><div class="slider-label"><span>Glow</span><span id="glowVal">15</span></div><input type="range" class="slider" id="vizGlow" min="0" max="50" value="15"></div>
      <div class="slider-group"><div class="slider-label"><span>Scale</span><span id="scaleVal">1.0</span></div><input type="range" class="slider" id="vizScale" min="0.3" max="2" step="0.1" value="1"></div>
      <div class="slider-group"><div class="slider-label"><span>Position Y</span><span id="vizYVal">0.5</span></div><input type="range" class="slider" id="vizY" min="0" max="1" step="0.01" value="0.5"></div>
      <div class="slider-group"><div class="slider-label"><span>Love-Palette</span></div>
        <select id="lovePalette" class="input">
          <option value="romantic">Romantic (Rose-Gold)</option>
          <option value="passion">Passion (Wine-Red)</option>
          <option value="candy">Candy (Pink-Cyan)</option>
          <option value="custom">Custom</option>
        </select>
      </div>
    </div>
  </div>

  <!-- TAB EFFECTS -->
  <div class="tab-content" id="tab-fx">
    <div class="section">
      <div class="section-title">Particles</div>
      <select id="partType" class="input">
        <option value="none">None</option>
        <option value="hearts">Hearts</option>
        <option value="stars">Stars</option>
        <option value="bubbles">Bubbles</option>
        <option value="fireflies">Fireflies</option>
        <option value="rose">Rose Petals</option>
      </select>
      <div class="slider-group"><div class="slider-label"><span>Amount</span><span id="partAmountVal">150</span></div><input type="range" class="slider" id="partAmount" min="0" max="500" value="150"></div>
    </div>
    <div class="section">
      <div class="section-title">Screen FX</div>
      <label style="display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer;"><input type="checkbox" id="fxFlicker"><span style="font-size:12px">Flicker on Bass</span></label>
      <label style="display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer;"><input type="checkbox" id="fxRGB"><span style="font-size:12px">RGB Shift</span></label>
    </div>
  </div>
</div>

<!-- ===== MAIN AREA ===== -->
<div class="main-area">
  <div class="canvas-container"><canvas id="canvas"></canvas></div>
  <div class="timeline-area">
    <div class="playback">
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶️</button>
      <div class="time" id="timeDisplay" style="font-size:18px;font-weight:700;color:var(--accent)">0:00 / 0:00</div>
      <div class="timeline" id="timeline" onclick="seekTimeline(event)">
        <div id="progress" class="timeline-progress"><div class="timeline-handle"></div></div>
      </div>
    </div>
    <button class="btn btn-primary" id="recordBtn" onclick="toggleRecord()">⏺️ Start Recording</button>
  </div>
</div>

<script>
/* ===== CORE STATE ===== */
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let config={width:1920,height:1080,fps:30},audioCtx,analyser,source,dataArray,audioBuffer,isPlaying=false,startTime=0,pauseTime=0,currentTime=0,duration=0,bgImage=null,emblemImage=null,particles=[],rotation=0,time=0,mediaRecorder,recordedChunks=[],isRecording=false,recordDest=null,programmaticStop=false;
let state={
  visualizer:'love3D',
  bgColor:'#000',bgBlur:0,bgBright:100,bgReact:0.05,
  vizColor:'#ff4da6',vizGlow:15,vizScale:1,vizY:0.5,
  audioSmooth:0.85,
  partType:'none',partAmount:150,
  emblemSize:0.3,emblemX:0.5,emblemY:0.5,emblemCircle:true,
  videoReact:false
};

/* ===== HELPERS ===== */
const hex2rgba=(hex,a)=>{
  hex=hex.replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return`rgba(${r},${g},${b},${a})`;
};
const lovePalettes={
  romantic:['#ff4da6','#ffb3d9','#ffe6f2'],
  passion:['#8b0000','#ff1744','#ff6f91'],
  candy:['#ff00ff','#00ffff','#ff69b4']
};

/* ===== VISUALIZERS (7 новых) ===== */
const Visualizers={
  /* 1. 3D Love-Cylinder */
  love3D(ctx,cx,cy,data){
    const bars=90,maxR=Math.min(config.width,config.height)*.35*state.vizScale,h=config.height*.3;
    for(let i=0;i<bars;i++){
      const f=i/bars,a=f*Math.PI*2,v=data[Math.floor(f*data.length)]/255;
      const barH=v*h,xx=cx+Math.cos(a)*maxR,yy=cy-Math.sin(a+rotation)*barH/2;
      const grad=ctx.createLinearGradient(xx,yy,xx,yy+barH);
      grad.addColorStop(0,hex2rgba(state.vizColor,0));
      grad.addColorStop(1,hex2rgba(state.vizColor,.9));
      ctx.fillStyle=grad;
      ctx.fillRect(xx-4,yy,8,barH);
      ctx.shadowBlur=state.vizGlow;
      ctx.shadowColor=state.vizColor;
      ctx.fillRect(xx-4,yy,8,barH);
      ctx.shadowBlur=0;
    }
  },
  /* 2. Neon Heartbeat */
  heartPulse(ctx,cx,cy,data){
    const bass=data[2]/255,r=60*state.vizScale+bass*40;
    ctx.save();
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r*2);
    grad.addColorStop(0,hex2rgba(state.vizColor,.8));
    grad.addColorStop(1,hex2rgba(state.vizColor,0));
    ctx.fillStyle=grad;
    // heart shape
    ctx.beginPath();
    ctx.moveTo(cx,cy+r);
    ctx.bezierCurveTo(cx-r,cy-r/2,cx-r,cy-r/2,cx,cy-r/4);
    ctx.bezierCurveTo(cx+r,cy-r/2,cx+r,cy-r/2,cx,cy+r);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  },
  /* 3. Rose-Gold Rings */
  roseRings(ctx,cx,cy,data){
    const rings=8,maxR=Math.min(config.width,config.height)*.4*state.vizScale;
    for(let i=0;i<rings;i++){
      const f=i/rings,r=maxR*(1-f*.7),v=data[Math.floor(f*data.length)]/255;
      ctx.beginPath();
      ctx.arc(cx,cy,r+v*30,0,Math.PI*2);
      ctx.strokeStyle=hex2rgba(lovePalettes.romantic[i%3],.6+v*.4);
      ctx.lineWidth=4+v*6;
      ctx.shadowBlur=state.vizGlow+v*10;
      ctx.shadowColor=lovePalettes.romantic[i%3];
      ctx.stroke();
      ctx.shadowBlur=0;
    }
  },
  /* 4. Love-Wave Landscape */
  loveMirror(ctx,cx,cy,data){
    const samples=120,w=config.width*.9,x0=(config.width-w)/2,amp=config.height*.15*state.vizScale;
    const grad=ctx.createLinearGradient(0,cy-amp,0,cy+amp);
    grad.addColorStop(0,hex2rgba(state.vizColor,.8));
    grad.addColorStop(1,hex2rgba(state.vizColor,.2));
    // top
    ctx.beginPath();ctx.moveTo(x0,cy);
    for(let i=0;i<=samples;i++){
      const t=i/samples,v=data[Math.floor(t*data.length)]/255;
      ctx.lineTo(x0+t*w,cy-Math.sin(t*Math.PI*3+time)*amp*v);
    }
    ctx.lineTo(x0+w,cy);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    // reflection
    ctx.save();ctx.scale(1,-1);ctx.translate(0,-cy*2);
    ctx.globalAlpha=.3;ctx.fill();ctx.restore();
  },
  /* 5. Passion HUD */
  passionHUD(ctx,cx,cy,data){
    const r=Math.min(config.width,config.height)*.2*state.vizScale,bars=60;
    for(let i=0;i<bars;i++){
      const a=(i/bars)*Math.PI*2+rotation,v=data[Math.floor(i/bars*data.length*.6)]/255;
      const len=v*r;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
      ctx.lineTo(cx+Math.cos(a)*(r+len),cy+Math.sin(a)*(r+len));
      ctx.strokeStyle=`hsl(${10+i*3},100%,${50+v*30}%)`;
      ctx.lineWidth=3;
      ctx.shadowBlur=state.vizGlow;
      ctx.shadowColor=`hsl(${10+i*3},100%,50%)`;
      ctx.stroke();
      ctx.shadowBlur=0;
    }
  },
  /* 6. Candy Spiral */
  candySpiral(ctx,cx,cy,data){
    const maxR=Math.min(config.width,config.height)*.35*state.vizScale,segs=200;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(rotation);
    for(let i=0;i<segs;i++){
      const t=i/segs,a=t*Math.PI*4,r=maxR*t,v=data[Math.floor(t*data.length)]/255;
      const x=Math.cos(a)*r,y=Math.sin(a)*r;
      ctx.beginPath();
      ctx.arc(x,y,3+v*7,0,Math.PI*2);
      ctx.fillStyle=hex2rgba(lovePalettes.candy[i%3],.8);
      ctx.shadowBlur=state.vizGlow;
      ctx.shadowColor=lovePalettes.candy[i%3];
      ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.restore();
  },
  /* 7. Infinity Love Tunnel */
  infinityLove(ctx,cx,cy,data){
    const bass=data[2]/255,layers=5;
    for(let l=0;l<layers;l++){
      const depth=1-l/layers,r=80*state.vizScale+l*60;
      for(let i=0;i<36;i++){
        const a=(i/36)*Math.PI*2+rotation*(l+1),v=data[Math.floor(i/36*data.length)]/255;
        const barW=10*depth,barH=(v*40+5)*depth;
        ctx.save();
        ctx.translate(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
        ctx.rotate(a);
        ctx.fillStyle=hex2rgba(lovePalettes.passion[l%3],depth);
        ctx.fillRect(0,-barW/2,barH,barW);
        ctx.restore();
      }
    }
    // center glow
    ctx.beginPath();
    ctx.arc(cx,cy,30+bass*20,0,Math.PI*2);
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,30+bass*20);
    g.addColorStop(0,'#fff');
    g.addColorStop(1,hex2rgba(state.vizColor,0));
    ctx.fillStyle=g;
    ctx.fill();
  }
};

/* ===== PARTICLES ===== */
const Effects={
  initParticles(){
    particles=[];
    for(let i=0;i<500;i++)particles.push({x:Math.random()*config.width,y:Math.random()*config.height,size:Math.random()*3+1,speed:Math.random()*2+.5,opacity:Math.random(),angle:Math.random()*Math.PI*2,hue:Math.random()*360,noteType:Math.floor(Math.random()*3),char:'♥'});
  },
  drawParticles(ctx,bass){
    if(state.partType==='none')return;
    const count=Math.min(state.partAmount,particles.length);
    if(state.partType==='hearts'){
      for(let i=0;i<count;i++){
        let p=particles[i];
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.scale(p.size*.5,p.size*.5);
        ctx.fillStyle=`hsla(${p.hue},100%,50%,${p.opacity})`;
        ctx.beginPath();
        ctx.moveTo(0,-5);
        ctx.bezierCurveTo(-5,-10,-10,-5,-10,0);
        ctx.bezierCurveTo(-10,5,-5,10,0,15);
        ctx.bezierCurveTo(5,10,10,5,10,0);
        ctx.bezierCurveTo(10,-5,5,-10,0,-5);
        ctx.fill();
        ctx.restore();
        p.y-=p.speed;
        p.x+=Math.sin(p.angle);
        p.angle+=.05;
        p.hue=(p.hue+1)%360;
        if(p.y<-20){p.y=config.height+20;p.x=Math.random()*config.width;}
      }
    }
    if(state.partType==='rose'){
      for(let i=0;i<count;i++){
        let p=particles[i];
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.angle);
        ctx.font=`${p.size*10}px Arial`;
        ctx.fillStyle=`rgba(255,100,150,${p.opacity})`;
        ctx.fillText('🌹',0,0);
        ctx.restore();
        p.y+=p.speed;
        if(p.y>config.height+20){p.y=-20;p.x=Math.random()*config.width;}
      }
    }
  },
  drawFlicker(ctx,bass){
    if(document.getElementById('fxFlicker').checked&&bass>200){
      ctx.fillStyle=`rgba(255,255,255,${(bass-200)/500})`;
      ctx.fillRect(0,0,config.width,config.height);
    }
  }
};

/* ===== AUDIO ===== */
document.getElementById('audioFile').onchange=async(e)=>{
  const file=e.target.files[0];if(!file)return;
  try{
    if(audioCtx)audioCtx.close();
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=state.audioSmooth;
    const buf=await file.arrayBuffer();
    audioBuffer=await audioCtx.decodeAudioData(buf);
    duration=audioBuffer.duration;
    dataArray=new Uint8Array(analyser.frequencyBinCount);
    currentTime=0;pauseTime=0;updateTimeDisplay();
  }catch(err){alert('Audio load error: '+err.message);}
};

/* ===== PLAYBACK ===== */
function startPlayback(){
  if(!audioBuffer||!audioCtx||!analyser)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(source){programmaticStop=true;try{source.stop(0)}catch(e){}}
  source=audioCtx.createBufferSource();source.buffer=audioBuffer;
  source.connect(analyser);analyser.connect(audioCtx.destination);
  if(isRecording&&recordDest)source.connect(recordDest);
  source.onended=()=>{if(!programmaticStop){isPlaying=false;document.getElementById('playBtn').textContent='▶️';currentTime=0;pauseTime=0;updateTimeDisplay();}programmaticStop=false;};
  startTime=audioCtx.currentTime-pauseTime;source.start(0,pauseTime);isPlaying=true;document.getElementById('playBtn').textContent='⏸️';animate();
}
function togglePlay(){
  if(!audioBuffer){alert('Load audio first!');return;}
  if(!audioCtx)return;
  isPlaying?(()=>{isPlaying=false;document.getElementById('playBtn').textContent='▶️';programmaticStop=true;try{source.stop(0)}catch(e){};pauseTime=audioCtx.currentTime-startTime;})():startPlayback();
}
function seekToPercent(p,restart){
  if(!audioBuffer||!audioCtx)return;
  p=Math.max(0,Math.min(1,p));const newPause=p*duration;
  const was=isPlaying;
  if(was){programmaticStop=true;try{source.stop(0)}catch(e){};isPlaying=false;}
  pauseTime=newPause;currentTime=pauseTime;updateTimeDisplay();
  if(was&&restart)startPlayback();
}
function seekTimeline(e){
  if(!audioBuffer)return;
  const rect=e.currentTarget.getBoundingClientRect();
  seekToPercent((e.clientX-rect.left)/rect.width,true);
}
function updateTimeDisplay(){
  const fmt=s=>`${Math.floor(s/60)||0}:${(Math.floor(s%60)||0).toString().padStart(2,'0')}`;
  document.getElementById('timeDisplay').textContent=`${fmt(currentTime)} / ${fmt(duration||0)}`;
  document.getElementById('progress').style.width=(duration?currentTime/duration*100:0)+'%';
}

/* ===== RENDER ===== */
function animate(){
  if(!isPlaying)return;
  requestAnimationFrame(animate);
  if(analyser&&dataArray){
    analyser.smoothingTimeConstant=state.audioSmooth;
    analyser.getByteFrequencyData(dataArray);
  }
  currentTime=audioCtx.currentTime-startTime;
  updateTimeDisplay();
  rotation+=0.005;time+=0.01;
  render();
}
function render(){
  const cx=config.width/2,cy=config.height*state.vizY,bass=dataArray?dataArray[2]:0;

  // background
  ctx.fillStyle=state.bgColor;
  ctx.fillRect(0,0,config.width,config.height);

  // bg image
  if(bgImage){
    ctx.save();
    const scale=1+(bass/255)*state.bgReact;
    ctx.filter=`blur(${state.bgBlur}px) brightness(${state.bgBright}%)`;
    ctx.translate(config.width/2,config.height/2);
    ctx.scale(scale,scale);
    const asp=bgImage.width/bgImage.height;
    let dw,dh;if(config.width/config.height>asp){dw=config.width;dh=dw/asp;}else{dh=config.height;dw=dh*asp;}
    ctx.drawImage(bgImage,-dw/2,-dh/2,dw,dh);
    ctx.restore();ctx.filter='none';
  }

  // particles
  Effects.drawParticles(ctx,bass);

  // visualizer
  if(dataArray&&Visualizers[state.visualizer])Visualizers[state.visualizer](ctx,cx,cy,dataArray);

  // video-reaction (whole canvas pulse)
  if(state.videoReact&&bass>150){
    const scale=1+(bass-150)/800;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);
    ctx.translate(-cx,-cy);
    ctx.globalAlpha=0.9;
    ctx.drawImage(canvas,0,0);
    ctx.restore();
  }

  // emblem
  if(emblemImage){
    const size=config.width*state.emblemSize*(1+bass/1000),x=config.width*state.emblemX,y=config.height*state.emblemY;
    ctx.save();ctx.translate(x,y);
    if(state.emblemCircle){ctx.beginPath();ctx.arc(0,0,size/2,0,Math.PI*2);ctx.clip();}
    ctx.drawImage(emblemImage,-size/2,-size/2,size,size);
    ctx.restore();
  }

  Effects.drawFlicker(ctx,bass);
}
function continuousRender(){
  if(!isPlaying)render();
  requestAnimationFrame(continuousRender);
}

/* ===== IMAGES ===== */
document.getElementById('bgImage').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>bgImage=img;img.src=URL.createObjectURL(f);};
document.getElementById('emblemImage').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>emblemImage=img;img.src=URL.createObjectURL(f);};

/* ===== RECORDING ===== */
function toggleRecord(){
  if(isRecording){
    mediaRecorder.stop();isRecording=false;recordDest=null;
    document.getElementById('recordBtn').innerHTML='⏺️ Start Recording';
    document.getElementById('recIndicator').classList.remove('active');
    if(isPlaying)togglePlay();
  }else{
    if(!audioBuffer)return alert('Load audio first!');
    recordedChunks=[];
    const stream=canvas.captureStream(config.fps);
    if(audioCtx){
      recordDest=audioCtx.createMediaStreamDestination();
      stream.addTrack(recordDest.stream.getAudioTracks()[0]);
    }
    mediaRecorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus'});
    mediaRecorder.ondataavailable=e=>recordedChunks.push(e.data);
    mediaRecorder.onstop=()=>{const blob=new Blob(recordedChunks,{type:'video/webm'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`love-video-${Date.now()}.webm`;a.click();};
    mediaRecorder.start();isRecording=true;
    document.getElementById('recordBtn').innerHTML='⏹️ Stop & Save';
    document.getElementById('recIndicator').classList.add('active');
    pauseTime=0;currentTime=0;startPlayback();
  }
}

/* ===== UI CONTROLS ===== */
function switchTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');document.getElementById('tab-'+tab).classList.add('active');
}
function selectViz(viz,el){
  state.visualizer=viz;
  document.querySelectorAll('.viz-card').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}
function updateResolution(){
  const[w,h]=document.getElementById('resolution').value.split(':').map(Number);
  config.width=w;config.height=h;canvas.width=w;canvas.height=h;
  Effects.initParticles();
}
// sliders
document.getElementById('bgBlur').oninput=e=>{state.bgBlur=e.target.value;document.getElementById('blurVal').textContent=e.target.value;};
document.getElementById('bgBright').oninput=e=>{state.bgBright=e.target.value;document.getElementById('brightVal').textContent=e.target.value+'%';};
document.getElementById('bgReact').oninput=e=>{state.bgReact=e.target.value;document.getElementById('bgReactVal').textContent=e.target.value;};
document.getElementById('bgColor').oninput=e=>state.bgColor=e.target.value;
document.getElementById('vizColor').oninput=e=>state.vizColor=e.target.value;
document.getElementById('vizGlow').oninput=e=>{state.vizGlow=e.target.value;document.getElementById('glowVal').textContent=e.target.value;};
document.getElementById('vizScale').oninput=e=>{state.vizScale=e.target.value;document.getElementById('scaleVal').textContent=parseFloat(e.target.value).toFixed(1);};
document.getElementById('vizY').oninput=e=>{state.vizY=e.target.value;document.getElementById('vizYVal').textContent=parseFloat(e.target.value).toFixed(2);};
document.getElementById('audioSmooth').oninput=e=>{state.audioSmooth=e.target.value;document.getElementById('smoothVal').textContent=e.target.value;};
document.getElementById('partType').onchange=e=>state.partType=e.target.value;
document.getElementById('partAmount').oninput=e=>{state.partAmount=e.target.value;document.getElementById('partAmountVal').textContent=e.target.value;};
document.getElementById('emblemSize').oninput=e=>{state.emblemSize=e.target.value;document.getElementById('emblemSizeVal').textContent=parseFloat(e.target.value).toFixed(2);};
document.getElementById('emblemX').oninput=e=>{state.emblemX=e.target.value;document.getElementById('emblemXVal').textContent=parseFloat(e.target.value).toFixed(2);};
document.getElementById('emblemY').oninput=e=>{state.emblemY=e.target.value;document.getElementById('emblemYVal').textContent=parseFloat(e.target.value).toFixed(2);};
document.getElementById('emblemCircle').onchange=e=>state.emblemCircle=e.target.checked;
document.getElementById('videoReact').onchange=e=>state.videoReact=e.target.checked;
document.getElementById('lovePalette').onchange=e=>{
  const pal=lovePalettes[e.target.value];
  if(pal)state.vizColor=pal[0];
};
document.getElementById('fps').onchange=e=>config.fps=parseInt(e.target.value);

/* ===== KEYBOARD ===== */
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!e.target.matches('input,textarea')){e.preventDefault();togglePlay();}
});

/* ===== INIT ===== */
function init(){
  canvas.width=config.width;canvas.height=config.height;
  Effects.initParticles();continuousRender();
  // build viz grid
  const vizes=[
    {id:'love3D',icon:'💗',name:'3D Love'},
    {id:'heartPulse',icon:'💓',name:'Heart Pulse'},
    {id:'roseRings',icon:'🌹',name:'Rose Rings'},
    {id:'loveMirror',icon:'💕',name:'Love Mirror'},
    {id:'passionHUD',icon:'🔥',name:'Passion HUD'},
    {id:'candySpiral',icon:'🍭',name:'Candy Spiral'},
    {id:'infinityLove',icon:'♾️',name:'Infinity Love'}
  ];
  const grid=document.getElementById('vizGrid');
  vizes.forEach(v=>{
    const card=document.createElement('div');
    card.className='viz-card'+(v.id==='love3D'?' active':'');
    card.innerHTML=`<span class="viz-icon">${v.icon}</span><div class="viz-name">${v.name}</div>`;
    card.onclick=()=>selectViz(v.id,card);
    grid.appendChild(card);
  });
}
init();
</script>
