<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>N1K∅ — Tracks</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-normalize/modern-normalize.css">
  <style>
    :root{
      --bg:#07060a;
      --card:#0b0b10;
      --muted:#bfc3d6;
      --accent:#ff4da6;
      --accent2:#00d1ff;
      --radius:12px;
      --maxw:980px;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:#eaeaf2;
      padding:28px;
      display:flex;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{width:100%;max-width:var(--maxw);position:relative;z-index:1}
    header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    h1{margin:0;font-size:24px;color:#fff}

    .search-wrap{margin-left:auto;display:flex;gap:8px;align-items:center}
    .search-input{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff;min-width:220px}
    .search-select{padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff}

    .list{display:flex;flex-direction:column;gap:14px}
    .track{
      background:linear-gradient(180deg,var(--card),#0a0910);
      border-radius:var(--radius);
      padding:12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      box-shadow:0 10px 30px rgba(0,0,0,.6);
      position:relative;
      border:1px solid rgba(255,255,255,0.02);
    }
    .thumb{width:120px;height:200px;object-fit:cover;border-radius:8px;flex:0 0 120px}
    .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
    .title{font-weight:700;color:#fff;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta{color:var(--muted);font-size:13px}

    .play-row{display:flex;align-items:center;gap:10px;margin-top:6px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
    .btn.icon{padding:8px;border-radius:50%}
    .btn:hover{transform:translateY(-3px);color:#fff}
    .btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#07060a;border-color:transparent}

    /* Counts (clickable in top list) */
    .counts{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
    .likes-count, .dislikes-count, .play-count {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 8px;
      border-radius:10px;
      transition: background .12s ease, color .12s ease, box-shadow .12s ease, transform .08s ease;
      user-select: none;
      border:1px solid rgba(255,255,255,0.03);
      cursor:default;
    }
    .likes-count .num, .dislikes-count .num, .play-count .num {
      font-weight:700;
      color:var(--accent);
      min-width:28px;
      text-align:center;
    }

    /* Make likes/dislikes visually interactive (non-active hover) */
    .likes-count:hover, .dislikes-count:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.28); color:#fff; cursor:pointer; }

    /* Active look (match mini-player) */
    .likes-count.active, .dislikes-count.active {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #07060a;
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(255,77,166,0.12);
      transform: translateY(-2px);
    }

    /* mini player */
    #mini-player{position:fixed;left:20px;right:20px;bottom:20px;background:linear-gradient(180deg,#0b0b10,#07060a);padding:12px;border-radius:12px;display:none;align-items:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:9999}
    #mini-thumb{width:72px;height:96px;object-fit:cover;border-radius:8px}
    #mini-center{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
    #mini-title{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #mini-wave{height:48px;border-radius:8px;background:linear-gradient(180deg,#05050a,#0b0b10)}
    .mini-controls{display:flex;align-items:center;justify-content:center;gap:18px}
    .control-btn{background:transparent;border:0;color:var(--muted);padding:10px;border-radius:50%;cursor:pointer}

    /* side panel */
    .side-panel{position:fixed;right:0;top:0;height:100%;width:360px;background:#0b0b10;color:#eaeaf2;padding:18px;box-shadow:-20px 0 40px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .28s ease;z-index:10001;overflow:auto}
    .side-panel.open{transform:translateX(0)}
    .side-panel h3{margin-top:0}

    /* comments modal */
    .modal{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:10002}
    .panel{width:min(720px,95%);background:#0b0b10;border-radius:12px;padding:16px;color:#eaeaf2;box-shadow:0 20px 60px rgba(0,0,0,.7)}

    /* pointer fixes */
    .container, .list, .track { pointer-events: auto; }
    #mini-player, .modal, .side-panel { pointer-events: auto; }
    .overlay, .backdrop, .invisible-overlay { pointer-events: none !important; display: none !important; }

    @media (max-width:880px){
      .thumb{width:96px;height:160px}
      #mini-player{left:12px;right:12px;bottom:12px}
      .side-panel{width:100%}
    }
  </style>
</head>

  <main>
    <div class="list" id="tracksList">

    </div>

</div>

  <!-- Мини-плеер -->

  <!-- Comments modal -->

  </div>

  <!-- Модальное окно добавления трека -->
  <div id="add-track-modal" class="modal">
    <div class="panel">
      <h3>Добавить трек</h3>

      <input id="t-title" class="search-input" placeholder="Название трека"><br><br>

  <!-- Wavesurfer + player logic -->

  <!-- UI glue: search, play dispatch, share, open text, comments dispatch, counters init -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('siteSearch');
    const genreSelect = document.getElementById('siteGenre');
    const tracks = Array.from(document.querySelectorAll('.track'));
    const sidePanel = document.getElementById('side-panel');
    const sideTitle = document.getElementById('side-title');
    const sideContent = document.getElementById('side-content');
    const sideClose = document.getElementById('side-close');

    function normalize(s){ return (s||'').toString().toLowerCase().trim(); }

function normalize(s){ return (s||'').toString().toLowerCase().trim(); }

function applyFilters(){
  const q = normalize(searchInput?.value);
  const g = normalize(genreSelect?.value);

  const currentTracks = Array.from(document.querySelectorAll('.track'));

  currentTracks.forEach(t => {
    const title = normalize(t.dataset.title || '');
    const artist = normalize(t.dataset.artist || '');
    const genreRaw = (t.dataset.genre || '');
    const genres = genreRaw.split(',').map(s => normalize(s)).filter(Boolean);

    // поиск по названию, артисту или жанру (подстрока)
    const matchQ = !q || title.includes(q) || artist.includes(q) || genres.some(gg => gg.includes(q) || q.includes(gg));

    // фильтр по селекту жанра (если выбран)
    let matchG = true;
    if (g) {
      if (genres.length === 0) matchG = false;
      else matchG = genres.some(gg => gg === g || gg.includes(g) || g.includes(gg));
    }

    t.style.display = (matchQ && matchG) ? '' : 'none';
  });
}


// привязки
if (genreSelect) genreSelect.addEventListener('change', applyFilters);
if (searchInput) searchInput.addEventListener('input', applyFilters);
applyFilters();



    const getCount = k => parseInt(localStorage.getItem(k) || '0', 10);
    const setCount = (k,v) => localStorage.setItem(k, String(v));
    const incCount = k => { const v = getCount(k)+1; setCount(k,v); return v; };

    // init counters UI
    document.querySelectorAll('.likes-count').forEach(el => { const key = el.dataset.key; if(key){ const n = el.querySelector('.num'); if(n) n.textContent = getCount('likes:' + key); }});
    document.querySelectorAll('.dislikes-count').forEach(el => { const key = el.dataset.key; if(key){ const n = el.querySelector('.num'); if(n) n.textContent = getCount('dislikes:' + key); }});
    document.querySelectorAll('.play-count').forEach(el => { const key = el.dataset.key; if(key){ const n = el.querySelector('.num'); if(n) n.textContent = getCount('plays:' + key); }});

    // play buttons -> dispatch track-play
    document.querySelectorAll('.play-btn').forEach((btn, idx) => {
      btn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const trackEl = btn.closest('.track'); if(!trackEl) return;
        const src = trackEl.dataset.src;
        window.dispatchEvent(new CustomEvent('track-play', { detail: { src, index: idx } }));
        document.querySelectorAll('.play-btn').forEach(b => b.classList.remove('playing'));
        btn.classList.add('playing');
      });
    });

    // open text
    document.querySelectorAll('.open-text-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const track = btn.closest('.track'); if(!track) return;
        sideTitle.textContent = track.dataset.title || 'Full text';
        sideContent.textContent = track.dataset.lyrics || '(No text)';
        sidePanel.classList.add('open'); sidePanel.setAttribute('aria-hidden','false');
      });
    });
    sideClose.addEventListener('click', ()=> { sidePanel.classList.remove('open'); sidePanel.setAttribute('aria-hidden','true'); });

    // share buttons
    document.querySelectorAll('.share-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const track = btn.closest('.track'); if(!track) return;
        const page = track.dataset.page || '';
        const url = location.origin + '/' + page;
        if(navigator.share) navigator.share({ title: track.dataset.title || '', url }).catch(()=>{});
        else window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent(track.dataset.title||'')}`, '_blank');
      });
    });

    // comment buttons -> dispatch open-comments (player.js handles modal)
    document.querySelectorAll('.comment-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const track = btn.closest('.track'); if(!track) return;
        const src = track.dataset.src; const title = track.dataset.title || '';
        window.dispatchEvent(new CustomEvent('open-comments', { detail: { src, title } }));
      });
    });

    // Expose small API for player.js
    window.__SITE_UI = window.__SITE_UI || {};
    window.__SITE_UI.updatePlayCountUI = function(src, total){
      document.querySelectorAll('.play-count').forEach(el => { if(el.dataset.key === src){ const n = el.querySelector('.num'); if(n) n.textContent = total; }});
    };
    window.__SITE_UI.syncLikeFromTop = function(src){
      const val = localStorage.getItem('like:user:' + src);
      // update mini buttons (player.js will call this)
      const miniLike = document.getElementById('mini-like');
      const miniDislike = document.getElementById('mini-dislike');
      if(miniLike) miniLike.classList.toggle('active', val === 'like');
      if(miniDislike) miniDislike.classList.toggle('active', val === 'dislike');
      // update top counts and visual state
      document.querySelectorAll('.likes-count').forEach(el => {
        if(el.dataset.key === src){
          const n = el.querySelector('.num'); if(n) n.textContent = getCount('likes:' + src);
          el.classList.toggle('active', val === 'like');
        }
      });
      document.querySelectorAll('.dislikes-count').forEach(el => {
        if(el.dataset.key === src){
          const n = el.querySelector('.num'); if(n) n.textContent = getCount('dislikes:' + src);
          el.classList.toggle('active', val === 'dislike');
        }
      });
    };
  });
  </script>

  <!-- Make top counters clickable and visually toggle like/dislike (no new elements added) -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const getCount = k => parseInt(localStorage.getItem(k) || '0', 10);
    const setCount = (k, v) => localStorage.setItem(k, String(v));
    const refreshCountsFor = (src) => {
      document.querySelectorAll('.likes-count').forEach(el => {
        if(el.dataset.key === src){ const n = el.querySelector('.num'); if(n) n.textContent = getCount('likes:' + src); }
      });
      document.querySelectorAll('.dislikes-count').forEach(el => {
        if(el.dataset.key === src){ const n = el.querySelector('.num'); if(n) n.textContent = getCount('dislikes:' + src); }
      });
    };

    function updateVisual(src){
      // update numbers and active classes
      const val = localStorage.getItem('like:user:' + src);
      document.querySelectorAll('.likes-count').forEach(el => {
        if(el.dataset.key === src){
          const n = el.querySelector('.num'); if(n) n.textContent = getCount('likes:' + src);
          el.classList.toggle('active', val === 'like');
        }
      });
      document.querySelectorAll('.dislikes-count').forEach(el => {
        if(el.dataset.key === src){
          const n = el.querySelector('.num'); if(n) n.textContent = getCount('dislikes:' + src);
          el.classList.toggle('active', val === 'dislike');
        }
      });
      // sync mini-player if available
      if(window.__SITE_UI && typeof window.__SITE_UI.syncLikeFromTop === 'function'){
        try { window.__SITE_UI.syncLikeFromTop(src); } catch(e) {}
      }
    }

    function toggleLikeFor(src){
      const userKey = 'like:user:' + src;
      const cur = localStorage.getItem(userKey);
      if(cur === 'like'){
        localStorage.removeItem(userKey);
        setCount('likes:' + src, Math.max(0, getCount('likes:' + src) - 1));
      } else {
        if(cur === 'dislike') setCount('dislikes:' + src, Math.max(0, getCount('dislikes:' + src) - 1));
        localStorage.setItem(userKey, 'like');
        setCount('likes:' + src, getCount('likes:' + src) + 1);
      }
      updateVisual(src);
    }

    function toggleDislikeFor(src){
      const userKey = 'like:user:' + src;
      const cur = localStorage.getItem(userKey);
      if(cur === 'dislike'){
        localStorage.removeItem(userKey);
        setCount('dislikes:' + src, Math.max(0, getCount('dislikes:' + src) - 1));
      } else {
        if(cur === 'like') setCount('likes:' + src, Math.max(0, getCount('likes:' + src) - 1));
        localStorage.setItem(userKey, 'dislike');
        setCount('dislikes:' + src, getCount('dislikes:' + src) + 1);
      }
      updateVisual(src);
    }

    // Bind click/keyboard to existing counts
    document.querySelectorAll('.likes-count, .dislikes-count').forEach(el => {
      const isLike = el.classList.contains('likes-count');
      const src = el.dataset.key;
      if(!src) return;
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.style.cursor = 'pointer';

      el.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        if(isLike) toggleLikeFor(src); else toggleDislikeFor(src);
      });
      el.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          if(isLike) toggleLikeFor(src); else toggleDislikeFor(src);
        }
      });

      // initialize visual state
      const val = localStorage.getItem('like:user:' + src);
      el.classList.toggle('active', (isLike && val === 'like') || (!isLike && val === 'dislike'));
    });

    // Expose helper for external sync
    window.__REFRESH_TOP_LIKES = function(src){
      updateVisual(src);
    };

    console.log('Top counters clickable and visual sync enabled');
  });
  </script>

  <!-- ЛОГИКА ДОБАВЛЕНИЯ ТРЕКОВ И ЭКСПОРТА JSON -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    // Скрываем кнопки админа для обычных пользователей
    if (!location.search.includes('admin')) {
      document.getElementById('addTrackBtn')?.remove();
      document.getElementById('exportJsonBtn')?.remove();
    }

    // Функции для работы с черновиками
    function getDraftTracks() {
      return JSON.parse(localStorage.getItem('draftTracks') || '[]');
    }

    function saveDraftTracks(tracks) {
      localStorage.setItem('draftTracks', JSON.stringify(tracks));
    }

    // Отрисовка черновиков с ВСЕМИ кнопками
    function renderDraftTracks() {
      const list = document.getElementById('tracksList');
      const tracks = getDraftTracks();
      
      list.innerHTML = '';

      tracks.forEach((track, index) => {
        const div = document.createElement('div');
        div.className = 'track';
        div.dataset.src = track.audio;
        div.dataset.title = track.title;
        div.dataset.genre = track.genre;
        div.dataset.lyrics = track.lyrics;

        div.innerHTML = `
          <img class="thumb" src="${track.cover}" alt="${track.title}">
          <div class="info">
            <div class="title">${track.title}</div>
            <div class="meta">${track.genre} · ${track.duration}</div>
            
            <!-- ВСЕ КНОПКИ КАК БЫЛО -->
            <div class="counts">
              <div class="play-count" data-key="${track.audio}">
                <span class="num">0</span> plays
              </div>
              <div class="likes-count" data-key="${track.audio}">
                <span class="num">0</span> ❤
              </div>
              <div class="dislikes-count" data-key="${track.audio}">
                <span class="num">0</span> 👎
              </div>
            </div>

            <div class="play-row">
              <button class="btn icon play-btn" type="button" aria-label="Play">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 3v18l15-9L5 3z" fill="currentColor"/></svg>
              </button>
              <button class="btn icon open-text-btn" aria-label="Open full text">Text</button>
              <button class="btn icon comment-btn" aria-label="Comments">💬</button>
              <button class="btn icon share-btn" aria-label="Share">🔗</button>
            </div>
          </div>
        `;

        list.appendChild(div);
      });

      // Переинициализируем ВСЕ кнопки
      document.querySelectorAll('.play-btn').forEach((btn, idx) => {
        btn.addEventListener('click', e => {
          e.preventDefault(); e.stopPropagation();
          const trackEl = btn.closest('.track');
          if (!trackEl) return;
          const src = trackEl.dataset.src;
          window.dispatchEvent(new CustomEvent('track-play', { 
            detail: { src, index: idx } 
          }));
          document.querySelectorAll('.play-btn').forEach(b => b.classList.remove('playing'));
          btn.classList.add('playing');
        });
      });

      // Инициализируем счетчики
      document.querySelectorAll('.likes-count').forEach(el => {
        const key = el.dataset.key;
        if(key){
          const n = el.querySelector('.num');
          if(n) n.textContent = parseInt(localStorage.getItem('likes:' + key) || '0');
        }
      });
      document.querySelectorAll('.dislikes-count').forEach(el => {
        const key = el.dataset.key;
        if(key){
          const n = el.querySelector('.num');
          if(n) n.textContent = parseInt(localStorage.getItem('dislikes:' + key) || '0');
        }
      });
      document.querySelectorAll('.play-count').forEach(el => {
        const key = el.dataset.key;
        if(key){
          const n = el.querySelector('.num');
          if(n) n.textContent = parseInt(localStorage.getItem('plays:' + key) || '0');
        }
      });
    }

    // Модальное окно добавления трека
    const addBtn = document.getElementById('addTrackBtn');
    const modal = document.getElementById('add-track-modal');
    const addCancel = document.getElementById('add-cancel');
    const addSave = document.getElementById('add-save');

    if (addBtn && modal) {
      addBtn.onclick = () => modal.style.display = 'flex';
      addCancel.onclick = () => modal.style.display = 'none';
      
      addSave.onclick = () => {
        const title = document.getElementById('t-title').value.trim();
        const audio = document.getElementById('t-audio').value.trim();
        const cover = document.getElementById('t-cover').value.trim();
        const genre = document.getElementById('t-genre').value;
        const lyrics = document.getElementById('t-lyrics').value;

        if (!title || !audio || !cover) {
          alert('Название, mp3 и обложка обязательны');
          return;
        }

        const track = {
          title,
          audio,
          cover,
          genre,
          lyrics,
          duration: '—'
        };

        const tracks = getDraftTracks();
        tracks.push(track);
        saveDraftTracks(tracks);

        // Очищаем форму
        document.getElementById('t-title').value = '';
        document.getElementById('t-audio').value = '';
        document.getElementById('t-cover').value = '';
        document.getElementById('t-lyrics').value = '';

        modal.style.display = 'none';
        renderDraftTracks();
      };
    }

    // Экспорт в JSON
    const exportBtn = document.getElementById('exportJsonBtn');
    if (exportBtn) {
      exportBtn.onclick = () => {
        const tracks = getDraftTracks();
        
        if (!tracks.length) {
          alert('Нет треков для экспорта');
          return;
        }

        const json = JSON.stringify(tracks, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'tracks.json';
        a.click();

        URL.revokeObjectURL(url);
      };
    }

    // Инициализация
    renderDraftTracks();
  });
  </script>
  
</body>
</html>
