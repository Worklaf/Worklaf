<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>N1K∅ — Tracks</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-normalize/modern-normalize.css">
  <style>
    :root{
      --bg:#07060a;
      --card:#0b0b10;
      --muted:#bfc3d6;
      --accent:#ff4da6;
      --accent2:#00d1ff;
      --radius:12px;
      --maxw:980px;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:#eaeaf2;
      padding:28px;
      display:flex;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{width:100%;max-width:var(--maxw);position:relative;z-index:1}
    header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    h1{margin:0;font-size:24px;color:#fff}

    .search-wrap{margin-left:auto;display:flex;gap:8px;align-items:center}
    .search-input{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff;min-width:220px}
    .search-select{padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff}

    .list{display:flex;flex-direction:column;gap:14px}
    .track{
      background:linear-gradient(180deg,var(--card),#0a0910);
      border-radius:var(--radius);
      padding:12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      box-shadow:0 10px 30px rgba(0,0,0,.6);
      position:relative;
      border:1px solid rgba(255,255,255,0.02);
    }
    .thumb{width:120px;height:200px;object-fit:cover;border-radius:8px;flex:0 0 120px}
    .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
    .title{font-weight:700;color:#fff;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta{color:var(--muted);font-size:13px}

    .play-row{display:flex;align-items:center;gap:10px;margin-top:6px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
    .btn.icon{padding:8px;border-radius:50%}
    .btn:hover{transform:translateY(-3px);color:#fff}
    .btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#07060a;border-color:transparent}

    .counts{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
    .likes-count, .dislikes-count, .play-count {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 8px;
      border-radius:10px;
      transition: background .12s ease, color .12s ease, box-shadow .12s ease, transform .08s ease;
      user-select: none;
      border:1px solid rgba(255,255,255,0.03);
      cursor:pointer;
    }
    .likes-count .num, .dislikes-count .num, .play-count .num {
      font-weight:700;
      color:var(--accent);
      min-width:28px;
      text-align:center;
    }

    .likes-count:hover, .dislikes-count:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.28); color:#fff; }

    .likes-count.active, .dislikes-count.active {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #07060a;
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(255,77,166,0.12);
      transform: translateY(-2px);
    }

    #mini-player{position:fixed;left:20px;right:20px;bottom:20px;background:linear-gradient(180deg,#0b0b10,#07060a);padding:12px;border-radius:12px;display:none;align-items:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:9999}
    #mini-center{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
    #mini-title{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #mini-wave{height:48px;border-radius:8px;background:linear-gradient(180deg,#05050a,#0b0b10);position:relative}
    .mini-controls{display:flex;align-items:center;justify-content:center;gap:18px}
    .control-btn{background:transparent;border:0;color:var(--muted);padding:10px;border-radius:50%;cursor:pointer;transition:all .2s}
    .control-btn:hover{color:#fff;transform:scale(1.1)}
    .control-btn.active{color:var(--accent);background:rgba(255,77,166,0.1)}
    .time-display{color:var(--muted);font-size:13px;white-space:nowrap;margin-top:4px}

    .side-panel{position:fixed;right:0;top:0;height:100%;width:360px;background:#0b0b10;color:#eaeaf2;padding:18px;box-shadow:-20px 0 40px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .28s ease;z-index:10001;overflow:auto}
    .side-panel.open{transform:translateX(0)}
    .side-panel h3{margin-top:0}

    .side-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .side-panel-actions {
      display: flex;
      gap: 8px;
    }

    #copy-text, #edit-text {
      background: linear-gradient(90deg, #ff4da6, #00d1ff);
      color: #07060a;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(255, 77, 166, 0.3);
    }

    #copy-text:hover, #edit-text:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 77, 166, 0.4);
    }

    #edit-text {
      background: linear-gradient(90deg, #00d1ff, #ff4da6);
    }

    .edit-mode-actions {
      display: none;
      gap: 8px;
      margin-top: 12px;
    }

    .edit-mode-actions.active {
      display: flex;
      justify-content: flex-end;
    }

    #side-content-editor {
      display: none;
      width: 100%;
      min-height: 400px;
      padding: 12px;
      border-radius: 8px;
      background: #07060a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #eaeaf2;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
    }

    .modal{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:10002}
    .modal.open{display:flex}
    .panel{width:min(720px,95%);background:#0b0b10;border-radius:12px;padding:16px;color:#eaeaf2;box-shadow:0 20px 60px rgba(0,0,0,.7);max-height:80vh;overflow:auto}

    .emoji-popup-modal {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #0b0b10;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      z-index: 10003;
      width: min(400px, 90%);
      max-height: 500px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .emoji-popup-modal.open {
      display: block;
    }

    .emoji-popup-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      max-height: 350px;
      overflow-y: auto;
      padding: 8px;
      margin-top: 12px;
    }

    .emoji-popup-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
    }

    .emoji-popup-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.1);
    }

    .emoji-quick-access {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
    }

    .emoji-quick-access .emoji-btn {
      background: rgba(255,255,255,0.05);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .emoji-quick-access .emoji-btn:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.05);
    }

    .delete-comment {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,77,166,0.1);
      border: none;
      border-radius: 4px;
      color: var(--accent);
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .comment-item:hover .delete-comment {
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state h2 {
      color: #fff;
      margin-bottom: 12px;
    }

    .empty-state p {
      margin: 8px 0;
    }

    .empty-state code {
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    @media (max-width:880px){
      body{padding:12px;padding-bottom:160px}
      h1{font-size:18px}
      
      header{
        flex-direction:column;
        align-items:stretch;
        gap:8px;
        margin-bottom:12px;
      }
      
      .search-wrap{
        width:100%;
        margin-left:0;
        flex-direction:column;
        gap:8px;
      }
      
      .search-input,.search-select{
        width:100%;
        min-width:auto;
        font-size:14px;
        padding:8px 10px;
      }
      
      .track{
        flex-direction:row;
        padding:8px;
        gap:10px;
        align-items:center;
      }
      
      .thumb{
        width:60px;
        height:90px;
        flex:none;
      }
      
      .info{
        flex:1;
        gap:6px;
      }
      
      .title{
        font-size:14px;
        line-height:1.3;
        white-space:normal;
        display:-webkit-box;
        -webkit-line-clamp:2;
        -webkit-box-orient:vertical;
        overflow:hidden;
      }
      
      .meta{
        font-size:11px;
      }
      
      .counts{
        flex-wrap:wrap;
        gap:4px;
        font-size:10px;
      }
      
      .likes-count,.dislikes-count,.play-count{
        padding:3px 6px;
        font-size:10px;
      }
      
      .likes-count .num,.dislikes-count .num,.play-count .num{
        min-width:20px;
        font-size:11px;
      }
      
      .play-row{
        flex-wrap:wrap;
        gap:4px;
      }
      
      .btn{
        padding:5px 8px;
        font-size:11px;
      }
      
      .btn.icon{
        padding:5px;
        width:28px;
        height:28px;
      }

      header > div[style*="flex"] {
        order: 3;
        width: 100%;
        justify-content: center;
        margin-top: 8px;
      }

      header > div[style*="flex"] button {
        flex: 1;
        max-width: 80px;
      }
      
      #mini-player{
        left:0;
        right:0;
        bottom:0;
        padding:8px;
        gap:8px;
        flex-direction:column;
        border-radius:12px 12px 0 0;
      }
      
      #mini-center{
        width:100%;
        order:1;
      }
      
      #mini-title{
        font-size:13px;
        margin-bottom:4px;
      }
      
      #mini-wave{
        height:36px;
        position:relative;
        margin-left:40px;
      }
      
      #mini-wave img{
        position:absolute;
        left:-40px;
        top:0;
        width:36px;
        height:36px;
      }
      
      .mini-controls{
        gap:10px;
        margin-top:4px;
      }
      
      .control-btn{
        padding:6px;
        font-size:16px;
      }
      
      .time-display{
        font-size:10px;
        text-align:center;
      }
      
      #mini-right{
        width:100%;
        order:2;
      }
      
      .icon-row{
        justify-content:space-around;
        flex-wrap:nowrap;
        gap:4px;
        align-items:center;
      }
      
      #mini-right .btn.icon{
        padding:6px;
        font-size:14px;
        width:32px;
        height:32px;
        display:inline-flex;
        align-items:center;
        justify-content:center;
      }
      
      #mini-volume{
        width:50px !important;
        height:20px;
        margin-right:8px;
      }
      
      .side-panel{
        width:100%;
        padding:12px;
      }
      
      .emoji-popup-grid{
        grid-template-columns:repeat(6,1fr);
        gap:6px;
      }
      
      .emoji-popup-btn{
        padding:8px;
        font-size:18px;
      }
      
      .panel{
        padding:12px;
        width:95%;
        max-height:90vh;
      }
      
      .modal{
        padding:8px;
      }
      
      .list{
        gap:8px;
      }
    }
/* Визуализатор - стили кнопок */
.visualizer-type-btn {
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.08);
  color: #fff;
  padding: 10px 20px;
  border-radius: 50px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 700;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(20px);
  letter-spacing: 0.5px;
  white-space: nowrap;
  flex-shrink: 0;
}

.visualizer-type-btn:hover {
  background: rgba(255,255,255,0.12);
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 8px 30px rgba(236, 72, 153, 0.4); /* Розовый/Маджента */
  border-color: rgba(236, 72, 153, 0.5);
}

.visualizer-type-btn.active {
  background: linear-gradient(135deg, #EC4899 0%, #3B82F6 50%, #06B6D4 100%);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 8px 30px rgba(236, 72, 153, 0.6), 0 0 50px rgba(6, 182, 212, 0.3);
  animation: neonPulse 2s ease-in-out infinite;
}

@keyframes neonPulse {
  0%, 100% { 
    box-shadow: 0 8px 30px rgba(236, 72, 153, 0.6), 0 0 50px rgba(6, 182, 212, 0.3);
    filter: brightness(1);
  }
  50% { 
    box-shadow: 0 12px 40px rgba(236, 72, 153, 0.8), 0 0 70px rgba(6, 182, 212, 0.5);
    filter: brightness(1.1);
  }
}
/* Визуализация */
#audio-visualizer {
  filter: blur(1px);
  mix-blend-mode: screen;
}

#audio-visualizer.active {
  opacity: 0.8 !important;
}

/* Кнопка визуализации в мини-плеере */
.visualizer-btn {
  position: relative;
}

.visualizer-btn.active::after {
  content: '';
  position: absolute;
  top: -2px;
  right: -2px;
  width: 8px;
  height: 8px;
  background: #00ff00;
  border-radius: 50%;
  box-shadow: 0 0 10px #00ff00;
}
    @media (max-width:480px){
      body{padding:8px;padding-bottom:150px}
      
      h1{font-size:16px}
      
      .track{padding:6px;gap:8px}
      
      .thumb{
        width:50px;
        height:75px;
      }
      
      .title{font-size:13px}
      .meta{font-size:10px}
      
      .counts{gap:3px}
      .likes-count,.dislikes-count,.play-count{
        padding:2px 4px;
        font-size:9px;
      }
      
      .btn.icon{
        width:24px;
        height:24px;
        padding:4px;
      }
      
      #mini-player{padding:6px}
      #mini-wave{height:32px}
      .control-btn{padding:5px;font-size:14px}
      
      .emoji-popup-grid{grid-template-columns:repeat(5,1fr)}
      .search-input,.search-select{font-size:13px;padding:6px 8px}
    }
  </style>
</head>
<body>
  <div class="container">
  <header>
    <h1>N1K∅ — Tracks</h1>
    
    <div style="display:flex;gap:4px;margin-left:8px;flex-wrap:wrap">
      <button id="lang-en" class="btn icon" style="padding:4px 8px;font-size:11px;border-radius:6px" title="English">EN</button>
      <button id="lang-pl" class="btn icon" style="padding:4px 8px;font-size:11px;border-radius:6px" title="Polski">PL</button>
      <button id="lang-ua" class="btn icon" style="padding:4px 8px;font-size:11px;border-radius:6px" title="Українська">UA</button>
    </div>

    <div class="search-wrap" role="search" aria-label="Search tracks">
      <input id="siteSearch" class="search-input" placeholder="Search: title, artist or genre">
      <select id="siteGenre" class="search-select" aria-label="Genre">
        <option value="">All genres</option>
      </select>
    </div>

    <button id="addTrackBtn" class="btn">⬆ Upload Track</button>
    <button id="exportJsonBtn" class="btn">📦 Export JSON</button>
  </header>

  <main>
    <div class="list" id="tracksList">
      <div class="loading-state">
        <h2>⏳ Loading tracks...</h2>
      </div>
    </div>
  </main>
</div>

  <div id="mini-player" style="display:none" role="region" aria-label="Mini player">
    <div id="mini-center">
      <div id="mini-title">—</div>
      <div style="display:flex;align-items:center;gap:8px;position:relative">
        <img id="mini-thumb" src="" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:4px;position:absolute;left:0">
        <div id="mini-wave" style="flex:1;margin-left:40px"></div>
      </div>
      <div id="mini-controls" class="mini-controls">
        <button id="mini-prev" class="control-btn" aria-label="Previous" title="Previous">◀</button>
        <button id="mini-play" class="control-btn" aria-label="Play/Pause" title="Play/Pause">
          <svg id="mini-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18l15-9L5 3z"/></svg>
        </button>
        <button id="mini-next" class="control-btn" aria-label="Next" title="Next">▶</button>
        <button id="shuffle-btn" class="control-btn" aria-label="Shuffle" title="Sequential"><span id="shuffle-icon">🔁</span></button>
      </div>
      <div class="time-display" id="mini-time">0:00 / 0:00</div>
    </div>

    <div id="mini-right" class="mini-actions">
      <div class="row icon-row" style="display:flex;gap:8px;align-items:center">
        <input id="mini-volume" type="range" min="0" max="1" step="0.01" value="1" style="width:50px;height:20px" title="Volume">
        <button id="mini-open-text" class="btn icon" aria-label="Open full text" title="Text">📄</button>
        <button id="mini-like" class="btn icon" aria-label="Like" title="Like">❤</button>
        <button id="mini-dislike" class="btn icon" aria-label="Dislike" title="Dislike">👎</button>
		  <button id="mini-visualizer" class="btn icon visualizer-btn" aria-label="Visualizer" title="Visualizer">🌀</button>
        <button id="mini-comment" class="btn icon" aria-label="Comments" title="Comments">💬</button>
        <button id="mini-share" class="btn icon" aria-label="Share" title="Share">🔗</button>
        <a id="mini-download" class="btn icon" href="#" download aria-label="Download" title="Download">⬇️</a>
      </div>
    </div>
  </div>

  <div id="comments-modal" class="modal" role="dialog" aria-hidden="true">
    <div class="panel" role="document">
      <h3 id="comments-title">Comments</h3>
      <div id="comments-list" class="comments-list" style="max-height:320px;overflow:auto;margin-top:8px;border-radius:8px;padding:8px;background:rgba(255,255,255,0.02)"></div>
      
      <div class="emoji-quick-access" style="margin-top:12px;display:flex;gap:6px;">
        <button class="emoji-btn quick-emoji" data-emoji="🔥">🔥</button>
        <button class="emoji-btn quick-emoji" data-emoji="😍">😍</button>
        <button class="emoji-btn quick-emoji" data-emoji="😱">😱</button>
        <button class="emoji-btn quick-emoji" data-emoji="🙌">🙌</button>
        <button class="emoji-btn quick-emoji" data-emoji="👍">👍</button>
        <button class="emoji-btn quick-emoji" data-emoji="🥵">🥵</button>
        <button class="emoji-btn" id="emoji-show-all" style="background:transparent;border:1px solid rgba(255,255,255,0.1);font-size:14px;padding:8px 12px">+ More</button>
      </div>

      <div style="position:relative;margin-top:12px">
        <textarea id="comment-input" placeholder="Write a comment..." style="width:100%;min-height:80px;padding:12px;border-radius:8px;background:#07060a;border:1px solid rgba(255,255,255,0.08);color:#eaeaf2"></textarea>
      </div>
      
      <div class="row" style="justify-content:flex-end;display:flex;gap:8px;margin-top:12px">
        <button id="comment-cancel" class="btn">Cancel</button>
        <button id="comment-send" class="btn active">Send</button>
      </div>
    </div>
  </div>

  <div id="emoji-popup-modal" class="emoji-popup-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0">Emoji</h3>

  async function loadTracksFromJSON() {
    const paths = ['./tracks.json', '/tracks.json', 'tracks.json'];
    
    for (const path of paths) {
      try {
        const response = await fetch(path + '?t=' + Date.now());
        if (response.ok) {
          const tracks = JSON.parse(await response.text());
          console.log('✅ Loaded', tracks.length, 'from', path);
          return tracks;
        }
      } catch (e) {}
    }
    return null;
  }

  async function getDraftTracks() {
    const jsonTracks = await loadTracksFromJSON();
    
    if (jsonTracks && jsonTracks.length > 0) {
      globalTracks = jsonTracks;
      localStorage.setItem('cachedTracks', JSON.stringify(jsonTracks));
      return jsonTracks;
    }
    
    const cached = localStorage.getItem('cachedTracks');
    if (cached) {
      globalTracks = JSON.parse(cached);
      return globalTracks;
    }
    
    const stored = localStorage.getItem('draftTracks');
    if (stored && stored !== '[]') {
      globalTracks = JSON.parse(stored);
      return globalTracks;
    }
    
    return [];
  }

  function saveDraftTracks(tracks) {
    globalTracks = tracks;
    localStorage.setItem('draftTracks', JSON.stringify(tracks));
  }

  async function loadCommentsFromServer(trackSrc) {
  console.log('📥 Loading comments for:', trackSrc);
  
  if (!USE_JSONBIN) {
    const comments = JSON.parse(localStorage.getItem('comments:' + trackSrc) || '[]');
    console.log('📦 Local:', comments.length);
    return comments;
  }

  try {
    console.log('🌐 Fetching from JSONBin (no cache)...');
    
    // ВАЖНО: используем те же заголовки что и при сохранении!
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      method: 'GET',
      headers: { 
        'X-Master-Key': JSONBIN_API_KEY
      },
      cache: 'no-store' // Отключаем кэш браузера
    });
    
    console.log('📡 Response status:', response.status);
    
    if (!response.ok) {
      console.error('❌ Response error:', response.status);
      const errorText = await response.text();
      console.error('❌ Error text:', errorText);
      return [];
    }
    
    const data = await response.json();
    console.log('📦 Full response:', data);
    
    const allComments = data.record?.comments || {};
    
    console.log('📊 All comment keys:', Object.keys(allComments));
    console.log('🔍 Looking for:', trackSrc);
    console.log('📋 Full comments object:', allComments);
    
    const trackComments = allComments[trackSrc] || [];
    
    console.log('✅ Found:', trackComments.length, 'comments');
    if (trackComments.length > 0) {
      console.log('📝 Comments:', trackComments);
    }
    
    return trackComments;
  } catch (e) {
    console.error('❌ Exception:', e);
    return [];
  }
}

  async function saveCommentToServer(trackSrc, comment) {
  console.log('💾 Saving for:', trackSrc);
  console.log('📝 Comment:', comment);
  
  if (!USE_JSONBIN) {
    const key = 'comments:' + trackSrc;
    const comments = JSON.parse(localStorage.getItem(key) || '[]');
    comments.push(comment);
    localStorage.setItem(key, JSON.stringify(comments));
    console.log('✅ Local saved');
    return true;
  }

  try {
    // 1. ПОЛУЧИТЬ ТЕКУЩИЕ ДАННЫЕ
    console.log('📥 Fetching current data...');
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      method: 'GET',
      headers: { 
        'X-Master-Key': JSONBIN_API_KEY
      },
      cache: 'no-store'
    });
    
    let record = { comments: {}, counts: {} };
    
    if (response.ok) {
      const data = await response.json();
      record = data.record || { comments: {}, counts: {} };
      console.log('📦 Current keys:', Object.keys(record.comments || {}));
    }
    
    // 2. ДОБАВИТЬ КОММЕНТАРИЙ
    if (!record.comments) record.comments = {};
    if (!record.comments[trackSrc]) record.comments[trackSrc] = [];
    
    record.comments[trackSrc].push(comment);
    console.log('➕ Total for this track:', record.comments[trackSrc].length);
    
    // 3. СОХРАНИТЬ
    console.log('💾 Sending PUT...');
    
    const updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(record)
    });
    
    console.log('📡 PUT status:', updateResponse.status);
    
    if (!updateResponse.ok) {
      console.error('❌ PUT failed');
      return false;
    }
    
    console.log('✅ Saved!');
    
    // 4. ПОДОЖДАТЬ НЕМНОГО ДЛЯ СИНХРОНИЗАЦИИ
    await new Promise(resolve => setTimeout(resolve, 500));
    
    return true;
  } catch (e) {
    console.error('❌ Exception:', e);
    return false;
  }
}

  async function deleteCommentFromServer(trackSrc, index) {
    if (!USE_JSONBIN) {
      const key = 'comments:' + trackSrc;
      const comments = JSON.parse(localStorage.getItem(key) || '[]');
      comments.splice(index, 1);
      localStorage.setItem(key, JSON.stringify(comments));
      return true;
    }

    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest?t=${Date.now()}`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      
      if (!response.ok) return false;
      
      const data = await response.json();
      const record = data.record || { comments: {}, counts: {} };
      
      if (record.comments?.[trackSrc]?.[index]) {
        record.comments[trackSrc].splice(index, 1);
        
        const updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify(record)
        });
        
        return updateResponse.ok;
      }
    } catch (e) {
      console.error('❌', e);
    }
    return false;
  }

  async function loadCountsFromServer() {
    if (!USE_JSONBIN) return;

    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      
      if (response.ok) {
        const data = await response.json();
        const counts = data.record?.counts || {};
        globalCounts = counts;
        Object.keys(counts).forEach(key => localStorage.setItem(key, String(counts[key])));
        
        document.querySelectorAll('.play-count, .likes-count, .dislikes-count').forEach(el => {
          const key = el.dataset.key;
          if (key) {
            const type = el.classList.contains('play-count') ? 'plays:' : 
                        el.classList.contains('likes-count') ? 'likes:' : 'dislikes:';
            const num = el.querySelector('.num');
            if (num) num.textContent = getCount(type + key);
          }
        });
      }
    } catch (e) {}
  }

  async function saveCountToServer(key, value) {
    if (!USE_JSONBIN) return;

    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      
      let record = { comments: {}, counts: {} };
      if (response.ok) {
        const data = await response.json();
        record = data.record || { comments: {}, counts: {} };
      }
      
      if (!record.counts) record.counts = {};
      record.counts[key] = value;
      globalCounts[key] = value;
      
      await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_API_KEY
        },
        body: JSON.stringify(record)
      });
    } catch (e) {}
  }

  window.toggleLike = function(src) {
    const userKey = 'like:user:' + src;
    const cur = localStorage.getItem(userKey);
    if(cur === 'like'){
      localStorage.removeItem(userKey);
      const newCount = Math.max(0, getCount('likes:' + src) - 1);
      setCount('likes:' + src, newCount);
      saveCountToServer('likes:' + src, newCount);
    } else {
      if(cur === 'dislike') {
        const dislikeCount = Math.max(0, getCount('dislikes:' + src) - 1);
        setCount('dislikes:' + src, dislikeCount);
        saveCountToServer('dislikes:' + src, dislikeCount);
      }
      localStorage.setItem(userKey, 'like');
      const newCount = getCount('likes:' + src) + 1;
      setCount('likes:' + src, newCount);
      saveCountToServer('likes:' + src, newCount);
    }
    updateCountUI(src);
  }

  window.toggleDislike = function(src) {
    const userKey = 'like:user:' + src;
    const cur = localStorage.getItem(userKey);
    if(cur === 'dislike'){
      localStorage.removeItem(userKey);
      const newCount = Math.max(0, getCount('dislikes:' + src) - 1);
      setCount('dislikes:' + src, newCount);
      saveCountToServer('dislikes:' + src, newCount);
    } else {
      if(cur === 'like') {
        const likeCount = Math.max(0, getCount('likes:' + src) - 1);
        setCount('likes:' + src, likeCount);
        saveCountToServer('likes:' + src, likeCount);
      }
      localStorage.setItem(userKey, 'dislike');
      const newCount = getCount('dislikes:' + src) + 1;
      setCount('dislikes:' + src, newCount);
      saveCountToServer('dislikes:' + src, newCount);
    }
    updateCountUI(src);
  }

  function updateTrackDuration(src, duration) {
    const trackIndex = globalTracks.findIndex(t => t.audio === src);
    if (trackIndex !== -1) {
      const minutes = Math.floor(duration / 60);
      const seconds = Math.floor(duration % 60);
      const formatted = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      
      globalTracks[trackIndex].duration = formatted;
      saveDraftTracks(globalTracks);
      
      const trackEl = document.querySelector(`.track[data-src="${src}"]`);
      if (trackEl) {
        const metaEl = trackEl.querySelector('.meta');
        if (metaEl) {
          const genre = globalTracks[trackIndex].genre || '';
          metaEl.textContent = `${genre} · ${formatted}`;
        }
      }
      
      if (window.currentTrackSrc === src) updateTimeDisplay(duration);
    }
  }

  function updateTimeDisplay(duration) {
    const miniTime = document.getElementById('mini-time');
    if (miniTime && wavesurfer) {
      const current = wavesurfer.getCurrentTime();
      const total = duration || wavesurfer.getDuration();
      
      const formatTime = (time) => {
        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);
        return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      };
      
      miniTime.textContent = `${formatTime(current)} / ${formatTime(total)}`;
    }
  }

  function playTrack(trackEl) {
  // Предотвращаем двойную загрузку
  if (window.isLoadingTrack) {
    console.log('⏳ Already loading track, please wait...');
    return;
  }
  
  window.isLoadingTrack = true;
  console.log('🎵 Starting playTrack...');
  
  const src = trackEl.dataset.src;
  const title = trackEl.dataset.title;
  const cover = trackEl.querySelector('.thumb').src;
  const index = parseInt(trackEl.dataset.index);

  currentTrackSrc = src;
  currentTrackIndex = index;
  window.currentTrackSrc = src;

  console.log('📀 Loading track:', title, 'Index:', index);

  document.getElementById('mini-title').textContent = title;
  document.getElementById('mini-thumb').src = cover;
  document.getElementById('mini-player').style.display = 'flex';

  // Обновляем активный трек в списке
  document.querySelectorAll('.track').forEach(t => t.classList.remove('playing'));
  trackEl.classList.add('playing');

  // Останавливаем текущее воспроизведение
  if (wavesurfer) {
    wavesurfer.stop();
  }
  
  // ЗАДЕРЖКА перед загрузкой следующего трека (избегаем AbortError)
  setTimeout(() => {
    console.log('⏳ Loading audio file...');
    
    wavesurfer.load(src);
    
    // Снимаем флаг загрузки через 500ms
    setTimeout(() => {
      window.isLoadingTrack = false;
      console.log('✅ Loading flag cleared');
    }, 500);
    
  }, 150); // Задержка 150ms

  // Увеличиваем счетчик прослушиваний
  const playKey = 'plays:' + src;
  const newCount = getCount(playKey) + 1;
  setCount(playKey, newCount);
  saveCountToServer(playKey, newCount);
  updateCountUI(src);

  updateMiniPlayerButtons();
  
  // Обновляем название в полноэкранном визуализаторе
  const vizTitle = document.getElementById('visualizer-track-title');
  if (vizTitle) {
    vizTitle.textContent = title;
  }

  // Media Session API для управления с экрана блокировки и уведомлений
  if ('mediaSession' in navigator) {
    const track = globalTracks[index];
    
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: 'N1K∅',
      album: track.genre || 'Music',
      artwork: [
        { 
          src: track.cover, 
          sizes: '512x512', 
          type: 'image/jpeg' 
        }
      ]
    });
    
    // Обработчики управления
    navigator.mediaSession.setActionHandler('play', () => {
      console.log('📱 Media Session: Play');
      wavesurfer.play();
    });
    
    navigator.mediaSession.setActionHandler('pause', () => {
      console.log('📱 Media Session: Pause');
      wavesurfer.pause();
    });
    
    navigator.mediaSession.setActionHandler('previoustrack', () => {
      console.log('📱 Media Session: Previous');
      playPrev();
    });
    
    navigator.mediaSession.setActionHandler('nexttrack', () => {
      console.log('📱 Media Session: Next');
      playNext();
    });
    
    navigator.mediaSession.setActionHandler('seekbackward', (details) => {
      console.log('📱 Media Session: Seek backward');
      const currentTime = wavesurfer.getCurrentTime();
      wavesurfer.seekTo(Math.max(0, currentTime - 10) / wavesurfer.getDuration());
    });
    
    navigator.mediaSession.setActionHandler('seekforward', (details) => {
      console.log('📱 Media Session: Seek forward');
      const currentTime = wavesurfer.getCurrentTime();
      const duration = wavesurfer.getDuration();
      wavesurfer.seekTo(Math.min(duration, currentTime + 10) / duration);
    });
    
    console.log('📱 Media Session API initialized');
  }
  
  // Открываем текст песни
  const lyricsText = globalTracks[index]?.lyrics || 'No lyrics available';
  const lyricsContent = document.getElementById('lyrics-content');
  if (lyricsContent) {
    lyricsContent.textContent = lyricsText;
  }
}

      const trackIndex = globalTracks.findIndex(t => t.audio === currentEditingSrc);
      if (trackIndex !== -1) {
        globalTracks[trackIndex].lyrics = newLyrics;
        saveDraftTracks(globalTracks);
        
        const trackEl = document.querySelector(`.track[data-src="${currentEditingSrc}"]`);
        if (trackEl) trackEl.dataset.lyrics = newLyrics;
        
        document.getElementById('side-content').textContent = newLyrics;
        document.getElementById('side-content').style.display = 'block';
        document.getElementById('side-content-editor').style.display = 'none';
        document.getElementById('edit-mode-actions').classList.remove('active');
        
        alert('💾 ' + t('commentSaved'));
      }
    });

    document.getElementById('comment-cancel').addEventListener('click', () => {
      document.getElementById('comments-modal').classList.remove('open');
    });

    document.getElementById('comment-send').addEventListener('click', async () => {
      const input = document.getElementById('comment-input');
      const text = input.value.trim();
      
      if (!text) {
        alert('❌ ' + t('writeComment'));
        return;
      }
      
      const sendBtn = document.getElementById('comment-send');
      const originalText = sendBtn.textContent;
      sendBtn.textContent = '⏳...';
      sendBtn.disabled = true;
      
      const comment = {
        text: text,
        author: 'User',
        timestamp: Date.now()
      };
      
      console.log('💬 Sending:', comment);
      
      const success = await saveCommentToServer(currentTrackSrc, comment);
      
      if (success) {
        console.log('✅ Saved!');
        input.value = '';
        
        await loadComments(currentTrackSrc);
        
        sendBtn.textContent = '✅';
        setTimeout(() => {
          sendBtn.textContent = originalText;
          sendBtn.disabled = false;
        }, 1000);
      } else {
        console.error('❌ Failed');
        alert(t('commentError'));
        sendBtn.textContent = originalText;
        sendBtn.disabled = false;
      }
    });

    if (isAdmin) {
      document.getElementById('addTrackBtn').addEventListener('click', () => {
        document.getElementById('add-track-modal').classList.add('open');
      });

      document.getElementById('add-cancel').addEventListener('click', () => {
        document.getElementById('add-track-modal').classList.remove('open');
      });

      document.getElementById('add-save').addEventListener('click', () => {
        const title = document.getElementById('t-title').value.trim();
        const audio = document.getElementById('t-audio').value.trim();
        const cover = document.getElementById('t-cover').value.trim();
        const genre = document.getElementById('t-genre').value.trim();
        const lyrics = document.getElementById('t-lyrics').value.trim();

        if (!title || !audio || !cover) {
          alert(t('required'));
          return;
        }

        const newTrack = { title, audio, cover, genre, lyrics, duration: '—' };
        globalTracks.push(newTrack);
        saveDraftTracks(globalTracks);
        renderDraftTracks();

        document.getElementById('t-title').value = '';
        document.getElementById('t-audio').value = '';
        document.getElementById('t-cover').value = '';
        document.getElementById('t-genre').value = '';
        document.getElementById('t-lyrics').value = '';
        document.getElementById('add-track-modal').classList.remove('open');
      });

      document.getElementById('exportJsonBtn').addEventListener('click', () => {
        if (globalTracks.length === 0) {
          alert(t('noTracks'));
          return;
        }

        const json = JSON.stringify(globalTracks, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'tracks.json';
        a.click();
        URL.revokeObjectURL(url);

        alert(`✅ ${t('exported')} ${globalTracks.length} ${t('tracks')}\n\n📤 ${t('uploadGithub')}\n🔄 ${t('refreshPage')}`);
      });
    } else {
      document.getElementById('addTrackBtn').style.display = 'none';
      document.getElementById('exportJsonBtn').style.display = 'none';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const trackParam = urlParams.get('track');
    
    if (trackParam) {
      setTimeout(() => {
        const trackEl = document.querySelector(`.track[data-src="${decodeURIComponent(trackParam)}"]`);
        if (trackEl) playTrack(trackEl);
      }, 500);
    }
  });

// ========================================
// 🎭 MODERN NEON VISUALIZERS
// ========================================

let visualizerActive = false;
let visualizerFullscreen = false;
let visualizerType = 'circle';
let audioContext = null;
let analyser = null;
let dataArray = null;
let animationId = null;
let rotation = 0;

const neonPalette = {
  pink: '#EC4899',
  cyan: '#06B6D4',
  blue: '#3B82F6',
  white: '#FFFFFF'
};

function initAudioVisualizer() {
  const canvas = document.getElementById('audio-visualizer');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  // Адаптивный размер
  canvas.width = Math.min(window.innerWidth * 0.9, 900);
  canvas.height = Math.min(window.innerHeight * 0.5, 600);
  
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.8;
    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    
    if (wavesurfer && wavesurfer.getMediaElement) {
      try {
        const mediaElement = wavesurfer.getMediaElement();
        const source = audioContext.createMediaElementSource(mediaElement);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
      } catch (e) { console.log('⚠️ Audio link ready'); }
    }
  }
  
  function draw() {
    if (!visualizerActive) return;
    animationId = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);
    
    // Эффект шлейфа (motion blur)
    ctx.fillStyle = 'rgba(10, 10, 15, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    
    switch (visualizerType) {
      case 'circle':
        drawModernCircle(ctx, centerX, centerY, canvas);
        break;
      case '3d_wave':
        draw3DWave(ctx, centerX, centerY, canvas);
        break;
      case 'neural':
        drawNeuralPulse(ctx, centerX, centerY, canvas);
        break;
      case 'tunnel':
        drawCyberTunnel(ctx, centerX, centerY, canvas);
        break;
    }
    rotation += 0.005;
  }

  // 1. ⭕ MODERN CIRCLE (Толстые неоновые бары)
  function drawModernCircle(ctx, centerX, centerY, canvas) {
    const bars = 64;
    const radius = Math.min(canvas.width, canvas.height) * 0.22;
    const angleStep = (Math.PI * 2) / bars;
    
    const avg = dataArray.slice(0, 10).reduce((a, b) => a + b, 0) / 10;
    const pulse = (avg / 255) * 30;

    // Внутреннее свечение
    const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius + pulse);
    glow.addColorStop(0, 'rgba(6, 182, 212, 0.1)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius + pulse, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < bars; i++) {
      const val = dataArray[i] || 0;
      const norm = val / 255;
      const h = norm * 100;
      const angle = i * angleStep + rotation;
      
      const x1 = centerX + Math.cos(angle) * radius;
      const y1 = centerY + Math.sin(angle) * radius;
      const x2 = centerX + Math.cos(angle) * (radius + h);
      const y2 = centerY + Math.sin(angle) * (radius + h);
      
      ctx.beginPath();
      ctx.strokeStyle = i % 2 === 0 ? neonPalette.cyan : neonPalette.pink;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.shadowBlur = 15;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  // 2. 🌊 3D WAVE (Твой любимый стиль)
  function draw3DWave(ctx, centerX, centerY, canvas) {
    const waveCount = 5;
    for (let w = 0; w < waveCount; w++) {
      const norm = (dataArray[w * 10] || 0) / 255;
      ctx.beginPath();
      ctx.strokeStyle = w % 2 === 0 ? neonPalette.cyan : neonPalette.pink;
      ctx.lineWidth = 3 + norm * 5;
      ctx.shadowBlur = 10 + norm * 15;
      ctx.shadowColor = ctx.strokeStyle;
      
      const offset = norm * 50;
      for (let x = 0; x <= canvas.width; x += 10) {
        const t = x / canvas.width;
        const y = centerY + Math.sin(t * Math.PI * 3 + rotation * 5 + w) * (40 + norm * 80);
        ctx.lineTo(x + offset, y + offset);
      }
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  // 3. 🧠 NEURAL PULSE (AI / Технологичный стиль)
  function drawNeuralPulse(ctx, centerX, centerY, canvas) {
    const points = 20;
    const norm = (dataArray[5] || 0) / 255;
    
    ctx.shadowBlur = 15;
    ctx.shadowColor = neonPalette.cyan;
    
    for (let i = 0; i < points; i++) {
      const angle = (i / points) * Math.PI * 2 + rotation;
      const r = 100 + Math.sin(rotation * 2 + i) * 50 + norm * 100;
      const x = centerX + Math.cos(angle) * r;
      const y = centerY + Math.sin(angle) * r;
      
      // Рисуем узлы
      ctx.fillStyle = neonPalette.white;
      ctx.beginPath();
      ctx.arc(x, y, 3 + norm * 5, 0, Math.PI * 2);
      ctx.fill();
      
      // Связи (Neural connections)
      ctx.beginPath();
      ctx.strokeStyle = `rgba(6, 182, 212, ${0.2 + norm * 0.5})`;
      ctx.lineWidth = 1;
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  // 4. 🚀 CYBER TUNNEL (Эффект полета)
  function drawCyberTunnel(ctx, centerX, centerY, canvas) {
    const norm = (dataArray[10] || 0) / 255;
    const count = 10;
    
    for (let i = 0; i < count; i++) {
      const size = ((rotation * 100 + i * 50) % 500);
      const alpha = 1 - (size / 500);
      const pulseSize = size * (1 + norm * 0.5);
      
      ctx.beginPath();
      ctx.strokeStyle = i % 2 === 0 ? `rgba(6, 182, 212, ${alpha})` : `rgba(236, 72, 153, ${alpha})`;
      ctx.lineWidth = 2 + norm * 10;
      ctx.rect(centerX - pulseSize / 2, centerY - pulseSize / 2, pulseSize, pulseSize);
      ctx.stroke();
      
      // Маленькие частицы внутри
      if (norm > 0.6) {
        ctx.fillStyle = neonPalette.white;
        ctx.fillRect(centerX + (Math.random()-0.5)*size, centerY + (Math.random()-0.5)*size, 2, 2);
      }
    }
  }

  draw();
}
  </script>
