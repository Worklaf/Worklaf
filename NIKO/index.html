<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>N1K∅ — Tracks</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-normalize/modern-normalize.css">
  <style>
    :root{
      --bg:#07060a;
      --card:#0b0b10;
      --muted:#bfc3d6;
      --accent:#ff4da6;
      --accent2:#00d1ff;
      --radius:12px;
      --maxw:980px;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:#eaeaf2;
      padding:28px;
      display:flex;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{width:100%;max-width:var(--maxw);position:relative;z-index:1}
    header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    h1{margin:0;font-size:24px;color:#fff}

    .search-wrap{margin-left:auto;display:flex;gap:8px;align-items:center}
    .search-input{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff;min-width:220px}
    .search-select{padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff}

    .list{display:flex;flex-direction:column;gap:14px}
    .track{
      background:linear-gradient(180deg,var(--card),#0a0910);
      border-radius:var(--radius);
      padding:12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      box-shadow:0 10px 30px rgba(0,0,0,.6);
      position:relative;
      border:1px solid rgba(255,255,255,0.02);
    }
    .thumb{width:120px;height:200px;object-fit:cover;border-radius:8px;flex:0 0 120px}
    .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
    .title{font-weight:700;color:#fff;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta{color:var(--muted);font-size:13px}

    .play-row{display:flex;align-items:center;gap:10px;margin-top:6px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
    .btn.icon{padding:8px;border-radius:50%}
    .btn:hover{transform:translateY(-3px);color:#fff}
    .btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#07060a;border-color:transparent}

    .counts{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
    .likes-count, .dislikes-count, .play-count {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 8px;
      border-radius:10px;
      user-select: none;
      border:1px solid rgba(255,255,255,0.03);
      cursor:pointer;
    }
    .likes-count .num, .dislikes-count .num, .play-count .num {
      font-weight:700;
      color:var(--accent);
      min-width:28px;
      text-align:center;
    }

    #mini-player{position:fixed;left:20px;right:20px;bottom:20px;background:linear-gradient(180deg,#0b0b10,#07060a);padding:12px;border-radius:12px;display:none;align-items:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:9999}
    #mini-center{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
    #mini-title{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #mini-wave{height:48px;border-radius:8px;background:linear-gradient(180deg,#05050a,#0b0b10);position:relative}
    .mini-controls{display:flex;align-items:center;justify-content:center;gap:18px}
    .control-btn{background:transparent;border:0;color:var(--muted);padding:10px;border-radius:50%;cursor:pointer;transition:all .2s}
    .control-btn.active{color:var(--accent);background:rgba(255,77,166,0.1)}
    .time-display{color:var(--muted);font-size:13px;white-space:nowrap;margin-top:4px}

    .side-panel{position:fixed;right:0;top:0;height:100%;width:360px;background:#0b0b10;color:#eaeaf2;padding:18px;box-shadow:-20px 0 40px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .28s ease;z-index:10001;overflow:auto}
    .side-panel.open{transform:translateX(0)}

    .modal{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:10002}
    .modal.open{display:flex}
    .panel{width:min(720px,95%);background:#0b0b10;border-radius:12px;padding:16px;color:#eaeaf2;box-shadow:0 20px 60px rgba(0,0,0,.7);max-height:80vh;overflow:auto}

    .viz-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .viz-dot.active {
      background: rgba(255,255,255,0.8);
      transform: scale(1.3);
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    @media (max-width:880px){
      body{padding:12px;padding-bottom:160px}
      #mini-player{left:0;right:0;bottom:0;padding:8px;gap:8px;flex-direction:column;border-radius:12px 12px 0 0;}
      #mini-wave{margin-left:40px;}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>N1K∅ — Tracks</h1>
      <div style="display:flex;gap:4px;margin-left:8px;flex-wrap:wrap">
        <button id="lang-en" class="btn icon" title="English">EN</button>
        <button id="lang-pl" class="btn icon" title="Polski">PL</button>
        <button id="lang-ua" class="btn icon" title="Українська">UA</button>
      </div>
      <div class="search-wrap">
        <input id="siteSearch" class="search-input" placeholder="Search...">
        <select id="siteGenre" class="search-select"><option value="">All genres</option></select>
      </div>
      <button id="addTrackBtn" class="btn">⬆ Upload</button>
      <button id="exportJsonBtn" class="btn">📦 Export</button>
    </header>

    <main>
      <div class="list" id="tracksList">
        <div class="loading-state"><h2>⏳ Loading tracks...</h2></div>
      </div>
    </main>
  </div>

  <div id="mini-player">
    <div id="mini-center">
      <div id="mini-title">—</div>
      <div style="display:flex;align-items:center;gap:8px;position:relative">
        <img id="mini-thumb" src="" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:4px;position:absolute;left:0">
        <div id="mini-wave" style="flex:1;margin-left:40px"></div>
      </div>
      <div id="mini-controls" class="mini-controls">
        <button id="mini-prev" class="control-btn">◀</button>
        <button id="mini-play" class="control-btn"><svg id="mini-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18l15-9L5 3z"/></svg></button>
        <button id="mini-next" class="control-btn">▶</button>
        <button id="shuffle-btn" class="control-btn"><span id="shuffle-icon">🔁</span></button>
      </div>
      <div class="time-display" id="mini-time">0:00 / 0:00</div>
    </div>
    <div id="mini-right" class="mini-actions">
      <div class="row icon-row" style="display:flex;gap:8px;align-items:center">
        <input id="mini-volume" type="range" min="0" max="1" step="0.01" value="1" style="width:50px">
        <button id="mini-open-text" class="btn icon">📄</button>
        <button id="mini-like" class="btn icon">❤</button>
        <button id="mini-visualizer" class="btn icon visualizer-btn">🌀</button>
        <button id="mini-comment" class="btn icon">💬</button>
        <button id="mini-share" class="btn icon">🔗</button>
        <a id="mini-download" class="btn icon" href="#" download>⬇️</a>
      </div>
    </div>
  </div>

  <!-- ВИЗУАЛИЗАТОР -->
  <div id="visualizer-fullscreen" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 9998; display: none; flex-direction: column; touch-action: pan-y;">
    <div style="position: absolute; top: 20px; left: 0; right: 0; text-align: center; z-index: 51; font-size: 16px; color: #fff;" id="visualizer-name-indicator">Visualizer</div>
    <button id="visualizer-close" style="position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: 1px solid #444; color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; z-index: 100;">✕ Close</button>
    
    <div style="position: absolute; top: 50%; left: 15px; transform: translateY(-50%); z-index: 51; color: #fff; cursor: pointer; font-size: 30px;" id="viz-prev-btn">◀</div>
    <div style="position: absolute; top: 50%; right: 15px; transform: translateY(-50%); z-index: 51; color: #fff; cursor: pointer; font-size: 30px;" id="viz-next-btn">▶</div>
    
    <div style="position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 51;" id="visualizer-dots"></div>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 50px;">
      <canvas id="audio-visualizer" style="max-width: 100%; max-height: 75vh;"></canvas>
      <div style="color: #fff; font-size: 20px; font-weight: 700; margin-top: 20px; text-align: center;" id="visualizer-track-title">Track Name</div>
    </div>
  </div>

  <script src="https://unpkg.com/wavesurfer.js@7"></script>

  <script>
  // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
  const JSONBIN_BIN_ID = '69639cdbae596e708fd480b8';
  const JSONBIN_API_KEY = '$2a$10$bFqRmZpCLczC7XIO9esnl.N/54Ak.9fs.MvRFMQGMAUuHKnPeXUiG';
  const USE_JSONBIN = true;

  let globalTracks = [];
  let currentTrackIndex = -1;
  let currentTrackSrc = '';
  let wavesurfer;
  let isShuffleMode = localStorage.getItem('shuffleMode') === 'true';

  // Визуализация
  let visualizerActive = false;
  let visualizerFullscreen = false;
  let visualizerType = localStorage.getItem('visualizerType') || 'circular';
  let audioContext = null;
  let analyser = null;
  let dataArray = null;
  let sourceNode = null; // Важно: храним узел источника отдельно
  let animationId = null;
  let time = 0, rotation = 0;
  
  // Частицы
  let bubbles = [], dnaPoints = [], auroras = [], lasers = [], raindrops = [], nebulaParticles = [], gridPoints = [];

  const visualizerTypes = [
    { id: 'circular', name: '⭕ Circular Spectrum' },
    { id: 'radial', name: '🌈 Radial Spectrum' },
    { id: 'neon', name: '💫 Neon Circle' },
    { id: 'golden', name: '🔶 Golden Wave' },
    { id: 'nebula', name: '🌌 Nebula' },
    { id: 'aurora', name: '🌠 Aurora' },
    { id: 'bubbles', name: '🫧 Bubbles' },
    { id: 'dna', name: '🧬 Music DNA' },
    { id: 'laser', name: '⚡ Laser Show' },
    { id: 'rain', name: '💦 Particle Rain' },
    { id: 'grid', name: '🌐 Cyber Grid' }
  ];

  // === ИНИЦИАЛИЗАЦИЯ АУДИО И ВИЗУАЛИЗАЦИИ ===
  function initAudioVisualizer() {
    const canvas = document.getElementById('audio-visualizer');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    canvas.width = Math.min(window.innerWidth * 0.9, 1000);
    canvas.height = Math.min(window.innerHeight * 0.6, 600);

    // Создаем контекст ОДИН РАЗ
    if (!audioContext) {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.8;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) { console.error(e); }
    }

    // Подключаем wavesurfer к контексту ТОЛЬКО ОДИН РАЗ
    if (wavesurfer && !sourceNode) {
      const mediaElement = wavesurfer.getMediaElement();
      if (mediaElement) {
        sourceNode = audioContext.createMediaElementSource(mediaElement);
        sourceNode.connect(analyser);
        analyser.connect(audioContext.destination);
      }
    }

    if (audioContext && audioContext.state === 'suspended') audioContext.resume();

    initParticles(canvas);

    function draw() {
      if (!visualizerActive || !analyser) return;
      animationId = requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2, cy = canvas.height / 2;
      time += 0.01; rotation += 0.005;

      switch (visualizerType) {
        case 'circular': drawCircular(ctx, cx, cy); break;
        case 'radial': drawRadial(ctx, cx, cy); break;
        case 'neon': drawNeon(ctx, cx, cy); break;
        case 'grid': drawGrid(ctx, cx, cy); break;
        case 'nebula': drawNebula(ctx, cx, cy); break;
        case 'aurora': drawAurora(ctx, cx, cy); break;
        case 'bubbles': drawBubbles(ctx, cx, cy); break;
        case 'dna': drawDNA(ctx, cx, cy); break;
        case 'laser': drawLaser(ctx, cx, cy); break;
        case 'rain': drawRain(ctx, cx, cy); break;
        case 'golden': drawGolden(ctx, cx, cy); break;
      }
    }
    if (animationId) cancelAnimationFrame(animationId);
    draw();
  }

  // === ФУНКЦИИ РИСОВАНИЯ (УПРОЩЕННЫЕ ДЛЯ КРАТКОСТИ) ===
  function drawCircular(ctx, cx, cy) {
    const r = 100;
    for(let i=0; i<64; i++){
      const val = dataArray[i*2] / 255;
      const h = val * 80;
      const ang = (i/64) * Math.PI * 2;
      ctx.strokeStyle = `hsl(${i*5}, 100%, 50%)`;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang)*r, cy + Math.sin(ang)*r);
      ctx.lineTo(cx + Math.cos(ang)*(r+h), cy + Math.sin(ang)*(r+h));
      ctx.stroke();
    }
  }
  function drawRadial(ctx, cx, cy) {
    for(let i=0; i<128; i++){
      const val = dataArray[i] / 255;
      const ang = (i/128) * Math.PI * 2 + rotation;
      ctx.strokeStyle = `hsla(${i*2}, 100%, 50%, 0.5)`;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(ang)*val*300, cy + Math.sin(ang)*val*300);
      ctx.stroke();
    }
  }
  function drawNeon(ctx, cx, cy) {
    const bass = dataArray[5]/255;
    ctx.beginPath(); ctx.arc(cx, cy, 100 + bass*30, 0, Math.PI*2);
    ctx.strokeStyle = '#00f2ff'; ctx.lineWidth = 5; ctx.shadowBlur = 20; ctx.shadowColor = '#00f2ff';
    ctx.stroke(); ctx.shadowBlur = 0;
  }
  function drawGolden(ctx, cx, cy) {
    ctx.strokeStyle = '#FFD700'; ctx.beginPath();
    for(let x=0; x<ctx.canvas.width; x+=10){
      const val = dataArray[x%128]/255;
      const y = cy + Math.sin(x*0.02 + time)*50 + (val-0.5)*100;
      x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  function drawNebula(ctx, cx, cy) {
    nebulaParticles.forEach((p, i) => {
      const v = dataArray[i%64]/255;
      ctx.fillStyle = p.color; ctx.beginPath();
      ctx.arc(p.x, p.y, p.size + v*15, 0, Math.PI*2); ctx.fill();
    });
  }
  function drawAurora(ctx, cx, cy) {
    auroras.forEach((a, i) => {
      const v = dataArray[i*5]/255;
      ctx.strokeStyle = a.color; ctx.beginPath();
      for(let x=0; x<ctx.canvas.width; x+=20){
        const y = a.baseY + Math.sin(x*0.01 + time)*a.amplitude*(1+v);
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
    });
  }
  function drawBubbles(ctx, cx, cy) {
    bubbles.forEach((b, i) => {
      const v = dataArray[i%32]/255;
      b.y -= b.speed * (1+v); if(b.y < -50) b.y = ctx.canvas.height+50;
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius*(1+v), 0, Math.PI*2); ctx.fill();
    });
  }
  function drawDNA(ctx, cx, cy) {
    dnaPoints.forEach((p, i) => {
      const v = dataArray[i*2]/255;
      const y = (p.y + time*40)%ctx.canvas.height;
      const x1 = cx + Math.sin(y*0.02)*80*(1+v);
      const x2 = cx - Math.sin(y*0.02)*80*(1+v);
      ctx.fillStyle = '#ff00ff'; ctx.beginPath(); ctx.arc(x1, y, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(x2, y, 5, 0, Math.PI*2); ctx.fill();
    });
  }
  function drawLaser(ctx, cx, cy) {
    lasers.forEach((l, i) => {
      const v = dataArray[i*8]/255;
      l.angle += 0.01;
      ctx.strokeStyle = l.color; ctx.beginPath(); ctx.moveTo(l.startX, l.startY);
      ctx.lineTo(l.startX + Math.cos(l.angle)*400*(1+v), l.startY + Math.sin(l.angle)*400*(1+v)); ctx.stroke();
    });
  }
  function drawRain(ctx, cx, cy) {
    raindrops.forEach((d, i) => {
      const v = dataArray[i%64]/255;
      d.y += d.speed*(1+v); if(d.y > ctx.canvas.height) d.y = -20;
      ctx.strokeStyle = d.color; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y+15); ctx.stroke();
    });
  }
  function drawGrid(ctx, cx, cy) {
    ctx.strokeStyle = '#00ffff';
    for(let i=0; i<20; i++){
      const x = (i/20)*ctx.canvas.width;
      const v = dataArray[i*2]/255;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, ctx.canvas.height + v*50); ctx.stroke();
    }
  }

  function initParticles(canvas) {
    if(nebulaParticles.length === 0) for(let i=0; i<50; i++) nebulaParticles.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, color: `hsl(${Math.random()*360},70%,50%)`});
    if(bubbles.length === 0) for(let i=0; i<30; i++) bubbles.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, radius: 10+Math.random()*15, speed: 1+Math.random(), color: 'rgba(255,255,255,0.3)'});
    if(auroras.length === 0) for(let i=0; i<3; i++) auroras.push({baseY: canvas.height/2 + i*40, amplitude: 30, speed: 0.5, color: i===0?'#0f9':(i===1?'#0cf':'#90f')});
    if(dnaPoints.length === 0) for(let i=0; i<20; i++) dnaPoints.push({y: i*30});
    if(lasers.length === 0) for(let i=0; i<5; i++) lasers.push({startX: Math.random()*canvas.width, startY: Math.random()*canvas.height, angle: Math.random()*Math.PI, color: '#f0f'});
    if(raindrops.length === 0) for(let i=0; i<100; i++) raindrops.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, speed: 5+Math.random()*5, color: '#0af'});
  }

  // === ПЛЕЕР И НАВИГАЦИЯ ===
  function playTrack(trackEl) {
    if (window.isLoadingTrack) return;
    window.isLoadingTrack = true;
    
    const src = trackEl.dataset.src;
    const title = trackEl.dataset.title;
    const index = parseInt(trackEl.dataset.index);

    currentTrackSrc = src;
    currentTrackIndex = index;

    document.getElementById('mini-title').textContent = title;
    document.getElementById('mini-thumb').src = trackEl.querySelector('.thumb').src;
    document.getElementById('mini-player').style.display = 'flex';

    if (wavesurfer) wavesurfer.stop();
    
    setTimeout(() => {
      wavesurfer.load(src);
      window.isLoadingTrack = false;
    }, 100);

    if (visualizerFullscreen) {
      document.getElementById('visualizer-track-title').textContent = title;
      // Просто убеждаемся что контекст запущен, не пересоздавая его
      if (audioContext && audioContext.state === 'suspended') audioContext.resume();
    }
  }

  function playNext() {
    if (!globalTracks.length) return;
    let next = isShuffleMode ? Math.floor(Math.random() * globalTracks.length) : (currentTrackIndex + 1) % globalTracks.length;
    const el = document.querySelector(`.track[data-index="${next}"]`);
    if (el) playTrack(el);
  }

  function playPrev() {
    if (!globalTracks.length) return;
    let prev = (currentTrackIndex - 1 + globalTracks.length) % globalTracks.length;
    const el = document.querySelector(`.track[data-index="${prev}"]`);
    if (el) playTrack(el);
  }

  // === УПРАВЛЕНИЕ ВИЗУАЛИЗАТОРОМ ===
  function toggleVisualizerFullscreen() {
    visualizerFullscreen = !visualizerFullscreen;
    const el = document.getElementById('visualizer-fullscreen');
    if (visualizerFullscreen) {
      el.style.display = 'flex';
      visualizerActive = true;
      document.getElementById('visualizer-track-title').textContent = document.getElementById('mini-title').textContent;
      initAudioVisualizer();
      createDotIndicators();
      updateIndicators();
    } else {
      el.style.display = 'none';
      visualizerActive = false;
      if (animationId) cancelAnimationFrame(animationId);
    }
  }

  function changeVisualizerType(type) {
    visualizerType = type;
    localStorage.setItem('visualizerType', type);
    updateIndicators();
    if (visualizerActive) initAudioVisualizer();
  }

  function createDotIndicators() {
    const container = document.getElementById('visualizer-dots');
    container.innerHTML = '';
    visualizerTypes.forEach(v => {
      const dot = document.createElement('div');
      dot.className = 'viz-dot' + (v.id === visualizerType ? ' active' : '');
      dot.onclick = () => changeVisualizerType(v.id);
      container.appendChild(dot);
    });
  }

  function updateIndicators() {
    const info = visualizerTypes.find(v => v.id === visualizerType);
    document.getElementById('visualizer-name-indicator').textContent = info ? info.name : '';
    document.querySelectorAll('.viz-dot').forEach(d => d.classList.toggle('active', d.dataset.id === visualizerType));
  }

  // === ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ ===
  document.addEventListener('DOMContentLoaded', async () => {
    wavesurfer = WaveSurfer.create({
      container: '#mini-wave',
      waveColor: '#444',
      progressColor: var(--accent),
      height: 40,
      barWidth: 2
    });

    wavesurfer.on('ready', () => wavesurfer.play());
    wavesurfer.on('finish', () => playNext());

    // Загрузка треков
    const tracks = await getDraftTracks();
    const list = document.getElementById('tracksList');
    list.innerHTML = '';
    globalTracks = tracks;

    tracks.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'track';
      div.dataset.src = t.audio; div.dataset.title = t.title; div.dataset.index = i;
      div.innerHTML = `<img class="thumb" src="${t.cover}"><div class="info"><div class="title">${t.title}</div><button class="btn play-btn">▶ Play</button></div>`;
      div.querySelector('.play-btn').onclick = () => playTrack(div);
      list.appendChild(div);
    });

    // Слушатели
    document.getElementById('mini-play').onclick = () => wavesurfer.playPause();
    document.getElementById('mini-next').onclick = playNext;
    document.getElementById('mini-prev').onclick = playPrev;
    document.getElementById('mini-visualizer').onclick = toggleVisualizerFullscreen;
    document.getElementById('visualizer-close').onclick = toggleVisualizerFullscreen;
    document.getElementById('viz-next-btn').onclick = () => {
       let idx = visualizerTypes.findIndex(v => v.id === visualizerType);
       changeVisualizerType(visualizerTypes[(idx + 1) % visualizerTypes.length].id);
    };
    document.getElementById('viz-prev-btn').onclick = () => {
       let idx = visualizerTypes.findIndex(v => v.id === visualizerType);
       changeVisualizerType(visualizerTypes[(idx - 1 + visualizerTypes.length) % visualizerTypes.length].id);
    };

    // Свайпы
    let ts;
    document.getElementById('visualizer-fullscreen').ontouchstart = e => ts = e.touches[0].clientX;
    document.getElementById('visualizer-fullscreen').ontouchend = e => {
      const te = e.changedTouches[0].clientX;
      if(ts - te > 50) document.getElementById('viz-next-btn').click();
      if(te - ts > 50) document.getElementById('viz-prev-btn').click();
    };
  });

  async function getDraftTracks() {
    const stored = localStorage.getItem('cachedTracks');
    if(stored) return JSON.parse(stored);
    try {
      const res = await fetch('./tracks.json');
      if(res.ok) {
        const data = await res.json();
        localStorage.setItem('cachedTracks', JSON.stringify(data));
        return data;
      }
    } catch(e) {}
    return [];
  }

  async function loadCountsFromServer() {} // Заглушка
  async function saveCommentToServer() {} // Заглушка
  </script>
</body>
</html>
