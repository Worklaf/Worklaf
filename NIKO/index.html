<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>N1K∅ — Tracks</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-normalize/modern-normalize.css">
  <style>
    :root{
      --bg:#07060a;
      --card:#0b0b10;
      --muted:#bfc3d6;
      --accent:#ff4da6;
      --accent2:#00d1ff;
      --radius:12px;
      --maxw:980px;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:#eaeaf2;
      padding:28px;
      display:flex;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{width:100%;max-width:var(--maxw);position:relative;z-index:1}
    header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    h1{margin:0;font-size:24px;color:#fff}

    .search-wrap{margin-left:auto;display:flex;gap:8px;align-items:center}
    .search-input{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff;min-width:220px}
    .search-select{padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff}

    .list{display:flex;flex-direction:column;gap:14px}
    .track{
      background:linear-gradient(180deg,var(--card),#0a0910);
      border-radius:var(--radius);
      padding:12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      box-shadow:0 10px 30px rgba(0,0,0,.6);
      position:relative;
      border:1px solid rgba(255,255,255,0.02);
    }
    .thumb{width:120px;height:200px;object-fit:cover;border-radius:8px;flex:0 0 120px}
    .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
    .title{font-weight:700;color:#fff;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta{color:var(--muted);font-size:13px}

    .play-row{display:flex;align-items:center;gap:10px;margin-top:6px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
    .btn.icon{padding:8px;border-radius:50%}
    .btn:hover{transform:translateY(-3px);color:#fff}
    .btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#07060a;border-color:transparent}

    .counts{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
    .likes-count, .dislikes-count, .play-count {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 8px;
      border-radius:10px;
      transition: background .12s ease, color .12s ease, box-shadow .12s ease, transform .08s ease;
      user-select: none;
      border:1px solid rgba(255,255,255,0.03);
      cursor:pointer;
    }
    .likes-count .num, .dislikes-count .num, .play-count .num {
      font-weight:700;
      color:var(--accent);
      min-width:28px;
      text-align:center;
    }

    .likes-count:hover, .dislikes-count:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.28); color:#fff; }

    .likes-count.active, .dislikes-count.active {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #07060a;
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(255,77,166,0.12);
      transform: translateY(-2px);
    }

    #mini-player{position:fixed;left:20px;right:20px;bottom:20px;background:linear-gradient(180deg,#0b0b10,#07060a);padding:12px;border-radius:12px;display:none;align-items:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:9999}
    #mini-center{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
    #mini-title{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #mini-wave{height:48px;border-radius:8px;background:linear-gradient(180deg,#05050a,#0b0b10);position:relative}
    .mini-controls{display:flex;align-items:center;justify-content:center;gap:18px}
    .control-btn{background:transparent;border:0;color:var(--muted);padding:10px;border-radius:50%;cursor:pointer;transition:all .2s}
    .control-btn:hover{color:#fff;transform:scale(1.1)}
    .control-btn.active{color:var(--accent);background:rgba(255,77,166,0.1)}
    .time-display{color:var(--muted);font-size:13px;white-space:nowrap;margin-top:4px}

    .side-panel{position:fixed;right:0;top:0;height:100%;width:360px;background:#0b0b10;color:#eaeaf2;padding:18px;box-shadow:-20px 0 40px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .28s ease;z-index:10001;overflow:auto}
    .side-panel.open{transform:translateX(0)}
    .side-panel h3{margin-top:0}

    .side-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .side-panel-actions {
      display: flex;
      gap: 8px;
    }

    #copy-text, #edit-text {
      background: linear-gradient(90deg, #ff4da6, #00d1ff);
      color: #07060a;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(255, 77, 166, 0.3);
    }

    #copy-text:hover, #edit-text:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 77, 166, 0.4);
    }

    #edit-text {
      background: linear-gradient(90deg, #00d1ff, #ff4da6);
    }

    .edit-mode-actions {
      display: none;
      gap: 8px;
      margin-top: 12px;
    }

    .edit-mode-actions.active {
      display: flex;
      justify-content: flex-end;
    }

    #side-content-editor {
      display: none;
      width: 100%;
      min-height: 400px;
      padding: 12px;
      border-radius: 8px;
      background: #07060a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #eaeaf2;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
    }

    .modal{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:10002}
    .modal.open{display:flex}
    .panel{width:min(720px,95%);background:#0b0b10;border-radius:12px;padding:16px;color:#eaeaf2;box-shadow:0 20px 60px rgba(0,0,0,.7);max-height:80vh;overflow:auto}

    .emoji-popup-modal {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #0b0b10;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      z-index: 10003;
      width: min(400px, 90%);
      max-height: 500px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .emoji-popup-modal.open {
      display: block;
    }

    .emoji-popup-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      max-height: 350px;
      overflow-y: auto;
      padding: 8px;
      margin-top: 12px;
    }

    .emoji-popup-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
    }

    .emoji-popup-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.1);
    }

    .emoji-quick-access {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
    }

    .emoji-quick-access .emoji-btn {
      background: rgba(255,255,255,0.05);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .emoji-quick-access .emoji-btn:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.05);
    }

    .delete-comment {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,77,166,0.1);
      border: none;
      border-radius: 4px;
      color: var(--accent);
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .comment-item:hover .delete-comment {
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state h2 {
      color: #fff;
      margin-bottom: 12px;
    }

    .empty-state p {
      margin: 8px 0;
    }

    .empty-state code {
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    @media (max-width:880px){
      body{padding:12px;padding-bottom:160px}
      h1{font-size:18px}
      
      header{
        flex-direction:column;
        align-items:stretch;
        gap:8px;
        margin-bottom:12px;
      }
      
      .search-wrap{
        width:100%;
        margin-left:0;
        flex-direction:column;
        gap:8px;
      }
      
      .search-input,.search-select{
        width:100%;
        min-width:auto;
        font-size:14px;
        padding:8px 10px;
      }
      
      .track{
        flex-direction:row;
        padding:8px;
        gap:10px;
        align-items:center;
      }
      
      .thumb{
        width:60px;
        height:90px;
        flex:none;
      }
      
      .info{
        flex:1;
        gap:6px;
      }
      
      .title{
        font-size:14px;
        line-height:1.3;
        white-space:normal;
        display:-webkit-box;
        -webkit-line-clamp:2;
        -webkit-box-orient:vertical;
        overflow:hidden;
      }
      
      .meta{
        font-size:11px;
      }
      
      .counts{
        flex-wrap:wrap;
        gap:4px;
        font-size:10px;
      }
      
      .likes-count,.dislikes-count,.play-count{
        padding:3px 6px;
        font-size:10px;
      }
      
      .likes-count .num,.dislikes-count .num,.play-count .num{
        min-width:20px;
        font-size:11px;
      }
      
      .play-row{
        flex-wrap:wrap;
        gap:4px;
      }
      
      .btn{
        padding:5px 8px;
        font-size:11px;
      }
      
      .btn.icon{
        padding:5px;
        width:28px;
        height:28px;
      }
      
      #mini-player{
        left:0;
        right:0;
        bottom:0;
        padding:8px;
        gap:8px;
        flex-direction:column;
        border-radius:12px 12px 0 0;
      }
      
      #mini-center{
        width:100%;
        order:1;
      }
      
      #mini-title{
        font-size:13px;
        margin-bottom:4px;
      }
      
      #mini-wave{
        height:36px;
        position:relative;
        margin-left:40px;
      }
      
      #mini-wave img{
        position:absolute;
        left:-40px;
        top:0;
        width:36px;
        height:36px;
      }
      
      .mini-controls{
        gap:10px;
        margin-top:4px;
      }
      
      .control-btn{
        padding:6px;
        font-size:16px;
      }
      
      .time-display{
        font-size:10px;
        text-align:center;
      }
      
      #mini-right{
        width:100%;
        order:2;
      }
      
      .icon-row{
        justify-content:space-around;
        flex-wrap:nowrap;
        gap:4px;
        align-items:center;
      }
      
      #mini-right .btn.icon{
        padding:6px;
        font-size:14px;
        width:32px;
        height:32px;
        display:inline-flex;
        align-items:center;
        justify-content:center;
      }
      
      #mini-volume{
        width:50px !important;
        height:20px;
        margin-right:8px;
      }
      
      .side-panel{
        width:100%;
        padding:12px;
      }
      
      .emoji-popup-grid{
        grid-template-columns:repeat(6,1fr);
        gap:6px;
      }
      
      .emoji-popup-btn{
        padding:8px;
        font-size:18px;
      }
      
      .panel{
        padding:12px;
        width:95%;
        max-height:90vh;
      }
      
      .modal{
        padding:8px;
      }
      
      .list{
        gap:8px;
      }
    }

    @media (max-width:480px){
      body{padding:8px;padding-bottom:150px}
      
      h1{font-size:16px}
      
      .track{padding:6px;gap:8px}
      
      .thumb{
        width:50px;
        height:75px;
      }
      
      .title{font-size:13px}
      .meta{font-size:10px}
      
      .counts{gap:3px}
      .likes-count,.dislikes-count,.play-count{
        padding:2px 4px;
        font-size:9px;
      }
      
      .btn.icon{
        width:24px;
        height:24px;
        padding:4px;
      }
      
      #mini-player{padding:6px}
      #mini-wave{height:32px}
      .control-btn{padding:5px;font-size:14px}
      
      .emoji-popup-grid{grid-template-columns:repeat(5,1fr)}
      .search-input,.search-select{font-size:13px;padding:6px 8px}
    }
  </style>
</head>
<body>
  <div class="container">
  <header>
    <h1>N1K∅ — Tracks</h1>
<div style="display:flex;gap:4px;margin-left:8px;flex-wrap:wrap">
  <button id="lang-en" class="btn icon" style="padding:4px 8px;font-size:11px;border-radius:6px" title="English">EN</button>
  <button id="lang-pl" class="btn icon" style="padding:4px 8px;font-size:11px;border-radius:6px" title="Polski">PL</button>
  <button id="lang-ua" class="btn icon" style="padding:4px 8px;font-size:11px;border-radius:6px" title="Українська">UA</button>
</div>

    <div class="search-wrap" role="search" aria-label="Search tracks">
      <input id="siteSearch" class="search-input" placeholder="Поиск: название, артист или жанр">
      <select id="siteGenre" class="search-select" aria-label="Genre">
        <option value="">Все жанры</option>
      </select>
    </div>

    <button id="addTrackBtn" class="btn">⬆ Загрузить трек</button>
    <button id="exportJsonBtn" class="btn">📦 Экспорт JSON</button>
  </header>

  <main>
    <div class="list" id="tracksList">
      <div class="loading-state">
        <h2>⏳ Загрузка треков...</h2>
      </div>
    </div>
  </main>
</div>

  <div id="mini-player" style="display:none" role="region" aria-label="Mini player">
    <div id="mini-center">
      <div id="mini-title">—</div>
      <div style="display:flex;align-items:center;gap:8px;position:relative">
        <img id="mini-thumb" src="" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:4px;position:absolute;left:0">
        <div id="mini-wave" style="flex:1;margin-left:40px"></div>
      </div>
      <div id="mini-controls" class="mini-controls">
        <button id="mini-prev" class="control-btn" aria-label="Previous" title="Previous">◀</button>
        <button id="mini-play" class="control-btn" aria-label="Play/Pause" title="Play/Pause">
          <svg id="mini-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18l15-9L5 3z"/></svg>
        </button>
        <button id="mini-next" class="control-btn" aria-label="Next" title="Next">▶</button>
        <button id="shuffle-btn" class="control-btn" aria-label="Shuffle" title="По порядку"><span id="shuffle-icon">▶️</span></button>
      </div>
      <div class="time-display" id="mini-time">0:00 / 0:00</div>
    </div>

    <div id="mini-right" class="mini-actions">
      <div class="row icon-row" style="display:flex;gap:8px;align-items:center">
        <input id="mini-volume" type="range" min="0" max="1" step="0.01" value="1" style="width:50px;height:20px" title="Volume">
        <button id="mini-open-text" class="btn icon" aria-label="Open full text" title="Text">📄</button>
        <button id="mini-like" class="btn icon" aria-label="Like" title="Like">❤</button>
        <button id="mini-dislike" class="btn icon" aria-label="Dislike" title="Dislike">👎</button>
        <button id="mini-comment" class="btn icon" aria-label="Comments" title="Comments">💬</button>
        <button id="mini-share" class="btn icon" aria-label="Share" title="Share">🔗</button>
        <a id="mini-download" class="btn icon" href="#" download aria-label="Download" title="Download">⬇️</a>
      </div>
    </div>
  </div>

  <div id="comments-modal" class="modal" role="dialog" aria-hidden="true">
    <div class="panel" role="document">
      <h3 id="comments-title">Comments</h3>
      <div id="comments-list" class="comments-list" style="max-height:320px;overflow:auto;margin-top:8px;border-radius:8px;padding:8px;background:rgba(255,255,255,0.02)"></div>
      
      <div class="emoji-quick-access" style="margin-top:12px;display:flex;gap:6px;">
        <button class="emoji-btn quick-emoji" data-emoji="🔥">🔥</button>
        <button class="emoji-btn quick-emoji" data-emoji="😍">😍</button>
        <button class="emoji-btn quick-emoji" data-emoji="😱">😱</button>
        <button class="emoji-btn quick-emoji" data-emoji="🙌">🙌</button>
        <button class="emoji-btn quick-emoji" data-emoji="👍">👍</button>
        <button class="emoji-btn quick-emoji" data-emoji="🥵">🥵</button>
        <button class="emoji-btn" id="emoji-show-all" style="background:transparent;border:1px solid rgba(255,255,255,0.1);font-size:14px;padding:8px 12px">+ More</button>
      </div>

      <div style="position:relative;margin-top:12px">
        <textarea id="comment-input" placeholder="Write a comment..." style="width:100%;min-height:80px;padding:12px;border-radius:8px;background:#07060a;border:1px solid rgba(255,255,255,0.08);color:#eaeaf2"></textarea>
      </div>
      
      <div class="row" style="justify-content:flex-end;display:flex;gap:8px;margin-top:12px">
        <button id="comment-cancel" class="btn">Cancel</button>
        <button id="comment-send" class="btn active">Send</button>
      </div>
    </div>
  </div>

  <div id="emoji-popup-modal" class="emoji-popup-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0">Emoji</h3>
      <button id="emoji-popup-close" class="btn" style="font-size:20px;padding:4px 8px">✕</button>
    </div>
    <div class="emoji-quick-access" id="emoji-quick-access-popup"></div>
    <div class="emoji-popup-grid" id="emoji-popup-grid"></div>
  </div>

  <div id="side-panel" class="side-panel" aria-hidden="true">
    <div class="side-panel-header" id="side-panel-view-header">
      <button id="side-close" class="btn">Close</button>
      <div class="side-panel-actions">
        <button id="copy-text">📋 Copy</button>
        <button id="edit-text" style="display:none">✏️ Edit</button>
      </div>
    </div>
    <h3 id="side-title">Full text</h3>
    <div id="side-content" style="white-space:pre-wrap;color:#eaeaf2;margin-top:8px"></div>
    <textarea id="side-content-editor"></textarea>
    <div class="edit-mode-actions" id="edit-mode-actions">
      <button id="edit-cancel" class="btn">Cancel</button>
      <button id="edit-save" class="btn active">💾 Save</button>
    </div>
  </div>

  <div id="add-track-modal" class="modal">
    <div class="panel">
      <h3>Добавить трек</h3>
      <input id="t-title" class="search-input" placeholder="Название трека" style="width:100%;margin-bottom:12px">
      <input id="t-audio" class="search-input" placeholder="Ссылка на mp3 (GitHub raw)" style="width:100%;margin-bottom:12px">
      <input id="t-cover" class="search-input" placeholder="Ссылка на обложку" style="width:100%;margin-bottom:12px">
      <input id="t-genre" class="search-input" placeholder="Жанры (через запятую)" style="width:100%;margin-bottom:12px">
      <textarea id="t-lyrics" placeholder="Текст песни" style="width:100%;min-height:120px;padding:8px;border-radius:8px;background:#07060a;border:1px solid rgba(255,255,255,0.04);color:#eaeaf2;margin-bottom:12px"></textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="add-cancel" class="btn">Cancel</button>
        <button id="add-save" class="btn active">Save</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/wavesurfer.js@7"></script>

  <script>
  const isAdmin = location.search.includes('admin');
  // === ПЕРЕВОДЫ / TRANSLATIONS ===
const translations = {
  en: {
    searchPlaceholder: "Search: title, artist or genre",
    allGenres: "All genres",

}
  // === НАСТРОЙКА JSONBIN.IO ===
  const JSONBIN_BIN_ID = '69639cdbae596e708fd480b8';
  const JSONBIN_API_KEY = '$2a$10$bFqRmZpCLczC7XIO9esnl.N/54Ak.9fs.MvRFMQGMAUuHKnPeXUiG';
  const USE_JSONBIN = true;
  // ============================
  
  let globalCounts = {};
  
  const getCount = k => {
    if (globalCounts[k] !== undefined) return globalCounts[k];
    return parseInt(localStorage.getItem(k) || '0', 10);

  async function loadTracksFromJSON() {
    const paths = ['./tracks.json', '/tracks.json', 'tracks.json'];
    
    for (const path of paths) {
      try {
        console.log('🔍 Trying:', path);
        const response = await fetch(path + '?t=' + Date.now());
        
        if (response.ok) {
          const text = await response.text();
          const tracks = JSON.parse(text);
          console.log('✅ Loaded', tracks.length, 'tracks from', path);
          return tracks;
        }
      } catch (e) {
        console.log('❌ Failed:', path);
      }
    }
    
    return null;
  }

  async function getDraftTracks() {
    const jsonTracks = await loadTracksFromJSON();
    
    if (jsonTracks && jsonTracks.length > 0) {
      console.log('📦 Using tracks.json');
      globalTracks = jsonTracks;
      localStorage.setItem('cachedTracks', JSON.stringify(jsonTracks));
      return jsonTracks;
    }
    
    const cached = localStorage.getItem('cachedTracks');
    if (cached) {
      console.log('💾 Using cached');
      globalTracks = JSON.parse(cached);
      return globalTracks;
    }
    
    const stored = localStorage.getItem('draftTracks');
    if (stored && stored !== '[]') {
      console.log('🗄️ Using localStorage');
      globalTracks = JSON.parse(stored);
      return globalTracks;
    }
    
    console.log('⚠️ No tracks found');
    return [];
  }

  function saveDraftTracks(tracks) {
    globalTracks = tracks;
    localStorage.setItem('draftTracks', JSON.stringify(tracks));
  }

  // === ФУНКЦИИ ДЛЯ ОБЩИХ КОММЕНТАРИЕВ ===
  async function loadCommentsFromServer(trackSrc) {
    if (!USE_JSONBIN) {
      return JSON.parse(localStorage.getItem('comments:' + trackSrc) || '[]');
    }

    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      
      if (response.ok) {
        const data = await response.json();
        const allComments = data.record?.comments || {};
        return allComments[trackSrc] || [];
      }
    } catch (e) {
      console.error('❌ Load comments error:', e);
    }
    
    return [];
  }

  async function saveCommentToServer(trackSrc, comment) {
    if (!USE_JSONBIN) {
      const key = 'comments:' + trackSrc;
      const comments = JSON.parse(localStorage.getItem(key) || '[]');
      comments.push(comment);
      localStorage.setItem(key, JSON.stringify(comments));
      return true;
    }

    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      
      let record = { comments: {}, counts: {} };
      if (response.ok) {
        const data = await response.json();
        record = data.record || { comments: {}, counts: {} };
      }
      
      if (!record.comments) record.comments = {};
      if (!record.comments[trackSrc]) record.comments[trackSrc] = [];
      record.comments[trackSrc].push(comment);
      
      const updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_API_KEY
        },
        body: JSON.stringify(record)
      });
      
      return updateResponse.ok;
    } catch (e) {
      console.error('❌ Save comment error:', e);
      return false;
    }
  }

  async function deleteCommentFromServer(trackSrc, index) {
    if (!USE_JSONBIN) {
      const key = 'comments:' + trackSrc;
      const comments = JSON.parse(localStorage.getItem(key) || '[]');
      comments.splice(index, 1);
      localStorage.setItem(key, JSON.stringify(comments));
      return true;
    }

    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      
      if (!response.ok) return false;
      
      const data = await response.json();
      const record = data.record || { comments: {}, counts: {} };
      
      if (record.comments && record.comments[trackSrc] && record.comments[trackSrc][index]) {
        record.comments[trackSrc].splice(index, 1);
        
        const updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify(record)
        });
        
        return updateResponse.ok;
      }
    } catch (e) {
      console.error('❌ Delete error:', e);
    }
    
    return false;
  }

  async function saveCountToServer(key, value) {
    if (!USE_JSONBIN) return;

    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });
      
      let record = { comments: {}, counts: {} };
      if (response.ok) {
        const data = await response.json();
        record = data.record || { comments: {}, counts: {} };
      }
      
      if (!record.counts) record.counts = {};
      record.counts[key] = value;
      globalCounts[key] = value;
      
      await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_API_KEY
        },
        body: JSON.stringify(record)
      });
      
      console.log('✅ Счетчик сохранен:', key, '=', value);
    } catch (e) {
      console.error('❌ Save count error:', e);
    }
  }

  function updateTrackDuration(src, duration) {
    const trackIndex = globalTracks.findIndex(t => t.audio === src);

      const minutes = Math.floor(duration / 60);
      const seconds = Math.floor(duration % 60);
      const formatted = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      
      globalTracks[trackIndex].duration = formatted;
      saveDraftTracks(globalTracks);
      
      const trackEl = document.querySelector(`.track[data-src="${src}"]`);
      if (trackEl) {
        const metaEl = trackEl.querySelector('.meta');
        if (metaEl) {
          const genre = globalTracks[trackIndex].genre || '';
          metaEl.textContent = `${genre} · ${formatted}`;
        }
      }
      
      if (window.currentTrackSrc === src) {
        updateTimeDisplay(duration);
      }
    }

        return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      };
      
      miniTime.textContent = `${formatTime(current)} / ${formatTime(total)}`;
    }
  }

  let wavesurfer;

  let durationInterval;

 function updateShuffleButton() {
  const btn = document.getElementById('shuffle-btn');
  const icon = document.getElementById('shuffle-icon');
  if (!btn || !icon) return;
  
  btn.classList.toggle('active', isShuffleMode);
  
  if (isShuffleMode) {
    btn.title = t('random');
    icon.textContent = '🔀';
  } else {
    btn.title = t('sequential');
    icon.textContent = '▶️';
  }
  
  console.log('🔀 Shuffle:', isShuffleMode ? 'ON' : 'OFF');
}

  function toggleShuffle() {
    isShuffleMode = !isShuffleMode;
    localStorage.setItem('shuffleMode', isShuffleMode);
    updateShuffleButton();
  }

  function initWavesurfer() {
    wavesurfer = WaveSurfer.create({
      container: '#mini-wave',
      waveColor: '#bfc3d6',
      progressColor: '#ff4da6',
      cursorColor: '#00d1ff',
      barWidth: 2,
      barRadius: 3,
      barGap: 2,
      height: 48,
      normalize: true
    });

    wavesurfer.on('ready', () => {
      console.log('🎵 Ready');
      wavesurfer.play();
      
      const duration = wavesurfer.getDuration();
      updateTrackDuration(currentTrackSrc, duration);
      
      if (durationInterval) clearInterval(durationInterval);
      durationInterval = setInterval(() => updateTimeDisplay(duration), 1000);
    });

    wavesurfer.on('play', () => {
      document.getElementById('mini-play-icon').innerHTML = '<path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>';
    });

    wavesurfer.on('pause', () => {
      document.getElementById('mini-play-icon').innerHTML = '<path d="M5 3v18l15-9L5 3z"/>';
    });

    wavesurfer.on('finish', () => {
      console.log('🏁 Track finished');
      
      if (durationInterval) {
        clearInterval(durationInterval);
      }
      
      handleTrackFinish();
    });
    
    wavesurfer.on('error', (err) => console.error('❌ Error:', err));
  }

  function handleTrackFinish() {
    if (!globalTracks || globalTracks.length === 0) {
      console.error('❌ No tracks to play');
      return;
    }
    
    console.log('▶️ handleTrackFinish called');
    
    let nextIndex;
    
    if (isShuffleMode) {
      nextIndex = Math.floor(Math.random() * globalTracks.length);
      console.log('🔀 Random next:', nextIndex);
    } else {
      nextIndex = (currentTrackIndex + 1) % globalTracks.length;
      console.log('➡️ Sequential next:', nextIndex);
    }
    
    setTimeout(() => {
      playTrack(nextIndex);
    }, 500);
  }

  function playTrack(index) {
    if (!globalTracks || globalTracks.length === 0) {
      console.error('❌ No tracks');
      return;
    }
    
    if (index < 0 || index >= globalTracks.length) {
      console.error('❌ Invalid index:', index);
      return;
    }
    
    currentTrackIndex = index;
    window.currentTrackIndex = index;
    const track = globalTracks[index];
    currentTrackSrc = track.audio;
    
    console.log('🎵 Playing', index + 1, '/', globalTracks.length, ':', track.title);
    
    wavesurfer.load(track.audio);
    
    document.getElementById('mini-title').textContent = track.title;
    const miniThumb = document.getElementById('mini-thumb');
    if (miniThumb) {
      miniThumb.src = track.cover;
      miniThumb.style.display = 'block';
    }
    document.getElementById('mini-download').href = track.audio;
    document.getElementById('mini-player').style.display = 'flex';
    
    const playKey = 'plays:' + track.audio;
    const newCount = getCount(playKey) + 1;
    setCount(playKey, newCount);
    saveCountToServer(playKey, newCount);
    updateCountUI(track.audio);
    
    const val = localStorage.getItem('like:user:' + track.audio);
    document.getElementById('mini-like').classList.toggle('active', val === 'like');
    document.getElementById('mini-dislike').classList.toggle('active', val === 'dislike');
    
    if (track.duration) {
      const [min, sec] = track.duration.split(':').map(Number);
      const duration = min * 60 + sec;
      updateTimeDisplay(duration);
    } else {
      document.getElementById('mini-time').textContent = '0:00 / 0:00';
    }
  }

  function playNext() {
    if (!globalTracks || globalTracks.length === 0) return;
    
    let nextIndex;
    if (isShuffleMode) {
      nextIndex = Math.floor(Math.random() * globalTracks.length);
      console.log('🔀 Manual random:', nextIndex);
    } else {
      nextIndex = (currentTrackIndex + 1) % globalTracks.length;
      console.log('➡️ Manual next:', nextIndex);
    }
    
    playTrack(nextIndex);
  }

  function playPrev() {
    if (!globalTracks || globalTracks.length === 0) return;
    
    let prevIndex;
    if (isShuffleMode) {
      prevIndex = Math.floor(Math.random() * globalTracks.length);
    } else {
      prevIndex = (currentTrackIndex - 1 + globalTracks.length) % globalTracks.length;
    }
    
    playTrack(prevIndex);
  }

  function initEmojiSystem() {
    document.querySelectorAll('.quick-emoji').forEach(btn => {

  async function loadComments(src) {
    const comments = await loadCommentsFromServer(src);
    const list = document.getElementById('comments-list');
    
    if (comments.length === 0) {
      list.innerHTML = `<p style="color:#bfc3d6;text-align:center;padding:20px">${t('noComments')}</p>`;
    } else {
      list.innerHTML = comments.map((c, idx) => `
        <div class="comment-item" style="position:relative;background:rgba(255,255,255,0.03);padding:10px;border-radius:8px;margin-bottom:8px">
          ${isAdmin ? `<button class="delete-comment" data-index="${idx}">✕</button>` : ''}
          <div style="color:#eaeaf2;margin-bottom:4px;font-size:16px">${c.text}</div>
          <div style="color:#bfc3d6;font-size:11px">${c.date}</div>
        </div>
      `).join('');
      
      if (isAdmin) {
        list.querySelectorAll('.delete-comment').forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            const index = parseInt(btn.dataset.index);
            if (confirm(t('deleteConfirm'))) {
              await deleteCommentFromServer(src, index);
              loadComments(src);
            }
          };
        });
      }
    }
  }

  function enterEditMode() {
    const viewDiv = document.getElementById('side-content');
    const editor = document.getElementById('side-content-editor');
    const editActions = document.getElementById('edit-mode-actions');
    const viewHeader = document.getElementById('side-panel-view-header');
    
    editor.value = viewDiv.textContent;
    viewDiv.style.display = 'none';
    editor.style.display = 'block';
    editActions.classList.add('active');
    viewHeader.style.display = 'none';
  }

  function exitEditMode(save = false) {
    const viewDiv = document.getElementById('side-content');
    const editor = document.getElementById('side-content-editor');
    const editActions = document.getElementById('edit-mode-actions');
    const viewHeader = document.getElementById('side-panel-view-header');
    
    if (save && currentEditingSrc) {
      const newLyrics = editor.value;
      const trackIndex = globalTracks.findIndex(t => t.audio === currentEditingSrc);
      
      if (trackIndex !== -1) {
        globalTracks[trackIndex].lyrics = newLyrics;
        saveDraftTracks(globalTracks);
        viewDiv.textContent = newLyrics;
        renderDraftTracks();
      }
    }
    
    editor.style.display = 'none';
    viewDiv.style.display = 'block';
    editActions.classList.remove('active');
    viewHeader.style.display = 'flex';
  }

      if (currentTrackIndex >= 0) {
        window.toggleDislike(globalTracks[currentTrackIndex].audio);
      }

      if (currentTrackIndex >= 0) {

      document.querySelectorAll('.track').forEach(track => {

        const genre = track.dataset.genre?.toLowerCase() || '';
        const matches = title.includes(query) || genre.includes(query);
        track.style.display = matches ? '' : 'none';
      });

          return;
        }
        const trackGenre = track.dataset.genre?.toLowerCase() || '';
        const matches = trackGenre.includes(genre);
        track.style.display = matches ? '' : 'none';
