<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>N1K∅ — Tracks</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-normalize/modern-normalize.css">
  <style>
    :root{
      --bg:#07060a;
      --card:#0b0b10;
      --muted:#bfc3d6;
      --accent:#ff4da6;
      --accent2:#00d1ff;
      --radius:12px;
      --maxw:980px;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:#eaeaf2;
      padding:28px;
      display:flex;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{width:100%;max-width:var(--maxw);position:relative;z-index:1}
    header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    h1{margin:0;font-size:24px;color:#fff}

    .search-wrap{margin-left:auto;display:flex;gap:8px;align-items:center}
    .search-input{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff;min-width:220px}
    .search-select{padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff}

    .list{display:flex;flex-direction:column;gap:14px}
    .track{
      background:linear-gradient(180deg,var(--card),#0a0910);
      border-radius:var(--radius);
      padding:12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      box-shadow:0 10px 30px rgba(0,0,0,.6);
      position:relative;
      border:1px solid rgba(255,255,255,0.02);
    }
    .thumb{width:120px;height:200px;object-fit:cover;border-radius:8px;flex:0 0 120px}
    .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
    .title{font-weight:700;color:#fff;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta{color:var(--muted);font-size:13px}

    .play-row{display:flex;align-items:center;gap:10px;margin-top:6px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
    .btn.icon{padding:8px;border-radius:50%}
    .btn:hover{transform:translateY(-3px);color:#fff}
    .btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#07060a;border-color:transparent}

    .counts{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
    .likes-count, .dislikes-count, .play-count {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 8px;
      border-radius:10px;
      transition: background .12s ease, color .12s ease, box-shadow .12s ease, transform .08s ease;
      user-select: none;
      border:1px solid rgba(255,255,255,0.03);
      cursor:pointer;
    }
    .likes-count .num, .dislikes-count .num, .play-count .num {
      font-weight:700;
      color:var(--accent);
      min-width:28px;
      text-align:center;
    }

    .likes-count:hover, .dislikes-count:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.28); color:#fff; }

    .likes-count.active, .dislikes-count.active {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #07060a;
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(255,77,166,0.12);
      transform: translateY(-2px);
    }

    #mini-player{position:fixed;left:20px;right:20px;bottom:20px;background:linear-gradient(180deg,#0b0b10,#07060a);padding:12px;border-radius:12px;display:none;align-items:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:9999}
    #mini-center{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
    #mini-title{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #mini-wave{height:48px;border-radius:8px;background:linear-gradient(180deg,#05050a,#0b0b10);position:relative}
    .mini-controls{display:flex;align-items:center;justify-content:center;gap:18px}
    .control-btn{background:transparent;border:0;color:var(--muted);padding:10px;border-radius:50%;cursor:pointer;transition:all .2s}
    .control-btn:hover{color:#fff;transform:scale(1.1)}
    .control-btn.active{color:var(--accent);background:rgba(255,77,166,0.1)}
    .time-display{color:var(--muted);font-size:13px;white-space:nowrap;margin-top:4px}

    .side-panel{position:fixed;right:0;top:0;height:100%;width:360px;background:#0b0b10;color:#eaeaf2;padding:18px;box-shadow:-20px 0 40px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .28s ease;z-index:10001;overflow:auto}
    .side-panel.open{transform:translateX(0)}
    .side-panel h3{margin-top:0}

    .side-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .side-panel-actions {
      display: flex;
      gap: 8px;
    }

    #copy-text, #edit-text {
      background: linear-gradient(90deg, #ff4da6, #00d1ff);
      color: #07060a;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(255, 77, 166, 0.3);
    }

    #copy-text:hover, #edit-text:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 77, 166, 0.4);
    }

    #edit-text {
      background: linear-gradient(90deg, #00d1ff, #ff4da6);
    }

    .edit-mode-actions {
      display: none;
      gap: 8px;
      margin-top: 12px;
    }

    .edit-mode-actions.active {
      display: flex;
      justify-content: flex-end;
    }

    #side-content-editor {
      display: none;
      width: 100%;
      min-height: 400px;
      padding: 12px;
      border-radius: 8px;
      background: #07060a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #eaeaf2;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
    }

    .modal{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:10002}
    .modal.open{display:flex}
    .panel{width:min(720px,95%);background:#0b0b10;border-radius:12px;padding:16px;color:#eaeaf2;box-shadow:0 20px 60px rgba(0,0,0,.7);max-height:80vh;overflow:auto}

    .emoji-popup-modal {display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#0b0b10;border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,0.7);z-index:10003;width:min(400px,90%);max-height:500px;border:1px solid rgba(255,255,255,0.08)}
    .emoji-popup-modal.open{display:block}
    .emoji-popup-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;max-height:350px;overflow-y:auto;padding:8px;margin-top:12px}
    .emoji-popup-btn{background:rgba(255,255,255,0.05);border:none;border-radius:8px;padding:10px;font-size:22px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;aspect-ratio:1}
    .emoji-popup-btn:hover{background:rgba(255,255,255,0.15);transform:scale(1.1)}
    .emoji-quick-access{display:flex;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08);flex-wrap:wrap}
    .emoji-quick-access .emoji-btn{background:rgba(255,255,255,0.05);border:none;border-radius:8px;padding:8px 12px;font-size:20px;cursor:pointer;transition:all 0.2s}
    .emoji-quick-access .emoji-btn:hover{background:rgba(255,255,255,0.15);transform:scale(1.05)}

    .delete-comment{position:absolute;top:8px;right:8px;background:rgba(255,77,166,0.1);border:none;border-radius:4px;color:var(--accent);width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;opacity:0;transition:opacity 0.2s}
    .comment-item:hover .delete-comment{opacity:1}

    .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty-state h2{color:#fff;margin-bottom:12px}
    .empty-state p{margin:8px 0}
    .empty-state code{background:rgba(255,255,255,0.05);padding:2px 6px;border-radius:4px;font-size:12px}

    .loading-state{text-align:center;padding:60px 20px;color:var(--muted)}

    @media (max-width:880px){
      body{padding:12px;padding-bottom:160px}
      h1{font-size:18px}
      header{flex-direction:column;align-items:stretch;gap:8px;margin-bottom:12px}
      .search-wrap{width:100%;margin-left:0;flex-direction:column;gap:8px}
      .search-input,.search-select{width:100%;min-width:auto;font-size:14px;padding:8px 10px}
      .track{flex-direction:row;padding:8px;gap:10px;align-items:center}
      .thumb{width:60px;height:90px;flex:none}
      .info{flex:1;gap:6px}
      .title{font-size:14px;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
      .meta{font-size:11px}
      .counts{flex-wrap:wrap;gap:4px;font-size:10px}
      .likes-count,.dislikes-count,.play-count{padding:3px 6px;font-size:10px}
      .likes-count .num,.dislikes-count .num,.play-count .num{min-width:20px;font-size:11px}
      .play-row{flex-wrap:wrap;gap:4px}
      .btn{padding:5px 8px;font-size:11px}
      .btn.icon{padding:5px;width:28px;height:28px}
      header > div[style*="flex"] {order: 3;width:100%;justify-content:center;margin-top:8px}
      header > div[style*="flex"] button {flex:1;max-width:80px}
      #mini-player{left:0;right:0;bottom:0;padding:8px;gap:8px;flex-direction:column;border-radius:12px 12px 0 0}
      #mini-center{width:100%;order:1}
      #mini-title{font-size:13px;margin-bottom:4px}
      #mini-wave{height:36px;position:relative;margin-left:40px}
      #mini-wave img{position:absolute;left:-40px;top:0;width:36px;height:36px}
      .mini-controls{gap:10px;margin-top:4px}
      .control-btn{padding:6px;font-size:16px}
      .time-display{font-size:10px;text-align:center}
      #mini-right{width:100%;order:2}
      .icon-row{justify-content:space-around;flex-wrap:nowrap;gap:4px;align-items:center}
      #mini-right .btn.icon{padding:6px;font-size:14px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center}
      #mini-volume{width:50px !important;height:20px;margin-right:8px}
      .side-panel{width:100%;padding:12px}
      .emoji-popup-grid{grid-template-columns:repeat(6,1fr);gap:6px}
      .emoji-popup-btn{padding:8px;font-size:18px}
      .panel{padding:12px;width:95%;max-height:90vh}
      .modal{padding:8px}
      .list{gap:8px}
    }
    /* Визуализатор */
    #audio-visualizer { filter: blur(1px); mix-blend-mode: screen; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    #viz-prev-btn, #viz-next-btn { transition: all 0.3s ease; }
    #viz-prev-btn:hover, #viz-next-btn:hover { opacity: 1; transform: translateY(-50%) scale(1.2); }
    .visualizer-btn { position: relative; }
    .visualizer-btn.active::after { content:''; position:absolute; top:-2px; right:-2px; width:8px; height:8px; background:#00ff00; border-radius:50%; box-shadow:0 0 10px #00ff00; }
    .viz-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);transition:all 0.3s ease}
    .viz-dot.active{background:rgba(255,255,255,0.8);transform:scale(1.3);box-shadow:0 0 8px rgba(255,255,255,0.5)}
    @media (max-width:768px){ #viz-prev-btn, #viz-next-btn{font-size:24px} #visualizer-name-indicator{font-size:14px} .viz-dot{width:6px;height:6px} }
  </style>
</head>
<body>
  <div class="container">
  <header>
    <h1>N1K∅ — Tracks</h1>
    
    <div style="display:flex;gap:4px;margin-left:8px;flex-wrap:wrap">
      <button id="lang-en" class="btn icon" style="padding:4px 8px;font-size:11px;border-radius:6px" title="English">EN</button>
      <button id="lang-pl" class="btn icon" style="padding:4px 8px;font-size:11px;border-radius:6px" title="Polski">PL</button>
      <button id="lang-ua" class="btn icon" style="padding:4px 8px;font-size:11px;border-radius:6px" title="Українська">UA</button>
    </div>

    <div class="search-wrap" role="search" aria-label="Search tracks">
      <input id="siteSearch" class="search-input" placeholder="Search: title, artist or genre">
      <select id="siteGenre" class="search-select" aria-label="Genre">
        <option value="">All genres</option>
      </select>
    </div>

    <button id="addTrackBtn" class="btn">⬆ Upload Track</button>
    <button id="exportJsonBtn" class="btn">📦 Export JSON</button>
  </header>

  <main>
    <div class="list" id="tracksList">
      <div class="loading-state">
        <h2>⏳ Loading tracks...</h2>
      </div>
    </div>
  </main>
</div>

  <div id="mini-player" style="display:none" role="region" aria-label="Mini player">
    <div id="mini-center">
      <div id="mini-title">—</div>
      <div style="display:flex;align-items:center;gap:8px;position:relative">
        <img id="mini-thumb" src="" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:4px;position:absolute;left:0">
        <div id="mini-wave" style="flex:1;margin-left:40px"></div>
      </div>
      <div id="mini-controls" class="mini-controls">
        <button id="mini-prev" class="control-btn" aria-label="Previous" title="Previous">◀</button>
        <button id="mini-play" class="control-btn" aria-label="Play/Pause" title="Play/Pause">
          <svg id="mini-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18l15-9L5 3z"/></svg>
        </button>
        <button id="mini-next" class="control-btn" aria-label="Next" title="Next">▶</button>
        <button id="shuffle-btn" class="control-btn" aria-label="Shuffle" title="Sequential"><span id="shuffle-icon">🔁</span></button>
      </div>
      <div class="time-display" id="mini-time">0:00 / 0:00</div>
    </div>

    <div id="mini-right" class="mini-actions">
      <div class="row icon-row" style="display:flex;gap:8px;align-items:center">
        <input id="mini-volume" type="range" min="0" max="1" step="0.01" value="1" style="width:50px;height:20px" title="Volume">
        <button id="mini-open-text" class="btn icon" aria-label="Open full text" title="Text">📄</button>
        <button id="mini-like" class="btn icon" aria-label="Like" title="Like">❤</button>
        <button id="mini-dislike" class="btn icon" aria-label="Dislike" title="Dislike">👎</button>
        <button id="mini-visualizer" class="btn icon visualizer-btn" aria-label="Visualizer" title="Visualizer">🌀</button>
        <button id="mini-comment" class="btn icon" aria-label="Comments" title="Comments">💬</button>
        <button id="mini-share" class="btn icon" aria-label="Share" title="Share">🔗</button>
        <a id="mini-download" class="btn icon" href="#" download aria-label="Download" title="Download">⬇️</a>
      </div>
    </div>
  </div>

  <div id="comments-modal" class="modal" role="dialog" aria-hidden="true">
    <div class="panel" role="document">
      <h3 id="comments-title">Comments</h3>
      <div id="comments-list" class="comments-list" style="max-height:320px;overflow:auto;margin-top:8px;border-radius:8px;padding:8px;background:rgba(255,255,255,0.02)"></div>
      
      <div class="emoji-quick-access" style="margin-top:12px;display:flex;gap:6px;">
        <button class="emoji-btn quick-emoji" data-emoji="🔥">🔥</button>
        <button class="emoji-btn quick-emoji" data-emoji="😍">😍</button>
        <button class="emoji-btn quick-emoji" data-emoji="😱">😱</button>
        <button class="emoji-btn quick-emoji" data-emoji="🙌">🙌</button>
        <button class="emoji-btn quick-emoji" data-emoji="👍">👍</button>
        <button class="emoji-btn quick-emoji" data-emoji="🥵">🥵</button>
        <button class="emoji-btn" id="emoji-show-all" style="background:transparent;border:1px solid rgba(255,255,255,0.1);font-size:14px;padding:8px 12px">+ More</button>
      </div>

      <div style="position:relative;margin-top:12px">
        <textarea id="comment-input" placeholder="Write a comment..." style="width:100%;min-height:80px;padding:12px;border-radius:8px;background:#07060a;border:1px solid rgba(255,255,255,0.08);color:#eaeaf2"></textarea>
      </div>
      
      <div class="row" style="justify-content:flex-end;display:flex;gap:8px;margin-top:12px">
        <button id="comment-cancel" class="btn">Cancel</button>
        <button id="comment-send" class="btn active">Send</button>
      </div>
    </div>
  </div>

  <div id="emoji-popup-modal" class="emoji-popup-modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0">Emoji</h3>
      <button id="emoji-popup-close" class="btn" style="font-size:20px;padding:4px 8px">✕</button>
    </div>
    <div class="emoji-quick-access" id="emoji-quick-access-popup"></div>
    <div class="emoji-popup-grid" id="emoji-popup-grid"></div>
  </div>

  <div id="side-panel" class="side-panel" aria-hidden="true">
    <div class="side-panel-header" id="side-panel-view-header">
      <button id="side-close" class="btn">Close</button>
      <div class="side-panel-actions">
        <button id="copy-text">📋 Copy</button>
        <button id="edit-text" style="display:none">✏️ Edit</button>
      </div>
    </div>
    <h3 id="side-title">Full text</h3>
    <div id="side-content" style="white-space:pre-wrap;color:#eaeaf2;margin-top:8px"></div>
    <textarea id="side-content-editor"></textarea>
    <div class="edit-mode-actions" id="edit-mode-actions">
      <button id="edit-cancel" class="btn">Cancel</button>
      <button id="edit-save" class="btn active">💾 Save</button>
    </div>
  </div>

  <div id="add-track-modal" class="modal">
    <div class="panel">
      <h3>Add Track</h3>
      <input id="t-title" class="search-input" placeholder="Track title" style="width:100%;margin-bottom:12px">
      <input id="t-audio" class="search-input" placeholder="MP3 link (GitHub raw)" style="width:100%;margin-bottom:12px">
      <input id="t-cover" class="search-input" placeholder="Cover image URL" style="width:100%;margin-bottom:12px">
      <input id="t-genre" class="search-input" placeholder="Genres (comma separated)" style="width:100%;margin-bottom:12px">
      <textarea id="t-lyrics" placeholder="Lyrics" style="width:100%;min-height:120px;padding:8px;border-radius:8px;background:#07060a;border:1px solid rgba(255,255,255,0.04);color:#eaeaf2;margin-bottom:12px"></textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="add-cancel" class="btn">Cancel</button>
        <button id="add-save" class="btn active">Save</button>
      </div>
    </div>
  </div>

        ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.8+0.2})`; ctx.fill();
      }
      nebulaParticles.forEach((p, index) => {
        p.x += Math.sin(time * 0.5 + index) * p.speed;
        p.y += Math.cos(time * 0.3 + index) * p.speed;
        if (p.x < -20) p.x = canvas.width + 20;
        if (p.x > canvas.width + 20) p.x = -20;
        if (p.y < -20) p.y = canvas.height + 20;
        if (p.y > canvas.height + 20) p.y = -20;
        const freqIndex = Math.floor((index / nebulaParticles.length) * dataArray.length);
        const value = dataArray[freqIndex] / 255;
        const size = p.size + value * 10;
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 3);
        const rgba = (alpha)=> p.color.replace('rgb','rgba').replace(')',`, ${alpha})`);
        gradient.addColorStop(0, rgba(1));
        gradient.addColorStop(0.5, rgba(0.5));
        gradient.addColorStop(1, rgba(0));
        ctx.beginPath(); ctx.arc(p.x, p.y, size * 3, 0, Math.PI * 2);
        ctx.fillStyle = gradient; ctx.fill();
      });
      const bassAvg = dataArray.slice(0,10).reduce((a,b)=>a+b,0)/10/255;
      const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 150 + bassAvg * 100);
      glow.addColorStop(0, 'rgba(157, 0, 255, 0.4)');
      glow.addColorStop(0.5, 'rgba(157, 0, 255, 0.1)');
      glow.addColorStop(1, 'rgba(157, 0, 255, 0)');
      ctx.beginPath(); ctx.arc(centerX, centerY, 250, 0, Math.PI*2);
      ctx.fillStyle = glow; ctx.fill();
    }

  }

  function toggleVisualizerFullscreen() {
    visualizerFullscreen = !visualizerFullscreen;
    const fullscreenDiv = document.getElementById('visualizer-fullscreen');
    const container = document.querySelector('.container');
    const btn = document.getElementById('mini-visualizer');

    if (visualizerFullscreen) {
      fullscreenDiv.style.display = 'flex';
      container.style.display = 'none';
      btn.classList.add('active');
      visualizerActive = true;
      createDotIndicators();
      initSwipeNavigation();
      updateIndicators();
      if (audioContext && audioContext.state === 'suspended') audioContext.resume();
      const titleEl = document.getElementById('visualizer-track-title');
      if (titleEl && currentTrackIndex >= 0) {
        titleEl.textContent = globalTracks[currentTrackIndex]?.title || 'Track';
      }
      initAudioVisualizer();
    } else {
      fullscreenDiv.style.display = 'none';
      container.style.display = 'block';
      btn.classList.remove('active');
      visualizerActive = false;
      if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
    }
    localStorage.setItem('visualizerFullscreen', visualizerFullscreen);
  }

  function changeVisualizerType(type) {
    visualizerType = type;
    bubbles = []; dnaPoints = []; auroras = []; lasers = [];
    raindrops = []; nebulaParticles = []; gridPoints = [];
    rotation = 0; time = 0;
    updateIndicators();
    localStorage.setItem('visualizerType', type);
    if (visualizerActive) { if (animationId) cancelAnimationFrame(animationId); initAudioVisualizer(); }
  }

  document.addEventListener('DOMContentLoaded', function() {
    const savedType = localStorage.getItem('visualizerType') || 'circular';
    visualizerType = savedType;

    window.addEventListener('resize', () => {
      if (visualizerFullscreen) initAudioVisualizer();
    });
  });

  function playNext() {
    console.log('⏭️ Playing next track...');
    if (globalTracks.length === 0) return;
    if (window.isLoadingTrack) { setTimeout(() => playNext(), 300); return; }
    let nextIndex = isShuffleMode ? Math.floor(Math.random() * globalTracks.length)
      : (currentTrackIndex + 1) % globalTracks.length;
    const trackEl = document.querySelector(`.track[data-index="${nextIndex}"]`);
    if (trackEl) { setTimeout(() => { playTrack(trackEl); }, 200); }
  }

  function playPrev() {
    console.log('⏮️ Playing previous track...');
    if (globalTracks.length === 0) return;
    if (window.isLoadingTrack) { setTimeout(() => playPrev(), 300); return; }
    let prevIndex = isShuffleMode ? Math.floor(Math.random() * globalTracks.length)
      : (currentTrackIndex - 1 + globalTracks.length) % globalTracks.length;
    const trackEl = document.querySelector(`.track[data-index="${prevIndex}"]`);
    if (trackEl) { setTimeout(() => { playTrack(trackEl); }, 200); }
  }
  </script>
