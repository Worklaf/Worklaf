<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>N1K∅ — Tracks</title>
  <link rel="stylesheet" href="https://unpkg.com/modern-normalize/modern-normalize.css">
  <style>
    :root{
      --bg:#07060a;
      --card:#0b0b10;
      --muted:#bfc3d6;
      --accent:#ff4da6;
      --accent2:#00d1ff;
      --radius:12px;
      --maxw:980px;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:#eaeaf2;
      padding:28px;
      display:flex;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{width:100%;max-width:var(--maxw);position:relative;z-index:1}
    header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    h1{margin:0;font-size:24px;color:#fff}

    .search-wrap{margin-left:auto;display:flex;gap:8px;align-items:center}
    .search-input{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff;min-width:220px}
    .search-select{padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:rgba(11,11,16,0.6);color:#fff}

    .list{display:flex;flex-direction:column;gap:14px}
    .track{
      background:linear-gradient(180deg,var(--card),#0a0910);
      border-radius:var(--radius);
      padding:12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      box-shadow:0 10px 30px rgba(0,0,0,.6);
      position:relative;
      border:1px solid rgba(255,255,255,0.02);
    }
    .thumb{width:120px;height:200px;object-fit:cover;border-radius:8px;flex:0 0 120px}
    .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
    .title{font-weight:700;color:#fff;margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta{color:var(--muted);font-size:13px}

    .play-row{display:flex;align-items:center;gap:10px;margin-top:6px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 10px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .2s}
    .btn.icon{padding:8px;border-radius:50%}
    .btn:hover{transform:translateY(-3px);color:#fff}
    .btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#07060a;border-color:transparent}

    .counts{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
    .likes-count, .dislikes-count, .play-count {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 8px;
      border-radius:10px;
      transition: background .12s ease, color .12s ease, box-shadow .12s ease, transform .08s ease;
      user-select: none;
      border:1px solid rgba(255,255,255,0.03);
      cursor:pointer;
    }
    .likes-count .num, .dislikes-count .num, .play-count .num {
      font-weight:700;
      color:var(--accent);
      min-width:28px;
      text-align:center;
    }

    .likes-count:hover, .dislikes-count:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.28); color:#fff; }

    .likes-count.active, .dislikes-count.active {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #07060a;
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(255,77,166,0.12);
      transform: translateY(-2px);
    }

    #mini-player{position:fixed;left:20px;right:20px;bottom:20px;background:linear-gradient(180deg,#0b0b10,#07060a);padding:12px;border-radius:12px;display:none;align-items:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:9999}
    #mini-thumb{width:72px;height:96px;object-fit:cover;border-radius:8px}
    #mini-center{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
    #mini-title{font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #mini-wave{height:48px;border-radius:8px;background:linear-gradient(180deg,#05050a,#0b0b10)}
    .mini-controls{display:flex;align-items:center;justify-content:center;gap:18px}
    .control-btn{background:transparent;border:0;color:var(--muted);padding:10px;border-radius:50%;cursor:pointer}
    .time-display{color:var(--muted);font-size:13px;white-space:nowrap;margin-top:4px}

    .side-panel{position:fixed;right:0;top:0;height:100%;width:360px;background:#0b0b10;color:#eaeaf2;padding:18px;box-shadow:-20px 0 40px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .28s ease;z-index:10001;overflow:auto}
    .side-panel.open{transform:translateX(0)}
    .side-panel h3{margin:12px 0}
    
    /* Copy button - на одном уровне с Close */
    .side-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
    .copy-btn{
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      border:0;
      color:#07060a;
      padding:8px 16px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      transition:all .2s;
      font-size:13px;
    }
    .copy-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(255,77,166,0.3)}
    .copy-btn.copied{background:#0acf83}

    .modal{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;z-index:10002}
    .modal.open{display:flex}
    .panel{width:min(720px,95%);background:#0b0b10;border-radius:12px;padding:16px;color:#eaeaf2;box-shadow:0 20px 60px rgba(0,0,0,.7);max-height:80vh;overflow:auto}

    /* Emoji quick bar */
    .emoji-quick{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
    .emoji-btn {
      background: rgba(255,255,255,0.05);
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width:44px;
      min-height:44px;
    }
    .emoji-btn:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.1);
    }
    .emoji-btn.plus{
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      color:#fff;
      font-size:18px;
      font-weight:700;
    }

    /* Emoji modal (как в Telegram) */
    .emoji-modal{
      display:none;
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      background:#0b0b10;
      border-radius:12px;
      padding:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.8);
      z-index:10003;
      width:min(500px,90vw);
      max-height:70vh;
      overflow:auto;
      border:1px solid rgba(255,255,255,0.08);
    }
    .emoji-modal.open{display:block}
    .emoji-modal h3{margin-top:0;color:#fff}
    .emoji-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(48px,1fr));
      gap:6px;
      margin-bottom:16px;
    }
    .emoji-category{margin-bottom:20px}
    .emoji-category-title{
      color:var(--accent);
      font-size:13px;
      font-weight:700;
      margin-bottom:8px;
      text-transform:uppercase;
      letter-spacing:0.5px;
    }

    /* Delete comment button */
    .delete-comment {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,77,166,0.1);
      border: none;
      border-radius: 4px;
      color: var(--accent);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .comment-item{position:relative}
    .comment-item:hover .delete-comment {
      opacity: 1;
    }

    @media (max-width:880px){
      .thumb{width:96px;height:160px}
      #mini-player{left:12px;right:12px;bottom:12px}
      .side-panel{width:100%}
      .emoji-grid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}
    }
  </style>
</head>
<body>
  <div class="container">
  <header>
    <h1>N1K∅ — Tracks</h1>

    <div class="search-wrap" role="search" aria-label="Search tracks">
      <input id="siteSearch" class="search-input" placeholder="Поиск: название, артист или жанр">
      <select id="siteGenre" class="search-select" aria-label="Genre">
        <option value="">Все жанры</option>
      </select>
    </div>

    <button id="addTrackBtn" class="btn">⬆ Загрузить трек</button>
    <button id="exportJsonBtn" class="btn">📦 Экспорт JSON</button>
  </header>

  <main>
    <div class="list" id="tracksList"></div>
  </main>
</div>

  <div id="mini-player" style="display:none" role="region" aria-label="Mini player">
    <img id="mini-thumb" src="" alt="">
    <div id="mini-center">
      <div id="mini-title">—</div>
      <div id="mini-wave"></div>
      <div id="mini-controls" class="mini-controls">
        <button id="mini-prev" class="control-btn" aria-label="Previous">◀</button>
        <button id="mini-play" class="control-btn" aria-label="Play/Pause">
          <svg id="mini-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18l15-9L5 3z"/></svg>
        </button>
        <button id="mini-next" class="control-btn" aria-label="Next">▶</button>
      </div>
      <div class="time-display" id="mini-time">0:00 / 0:00</div>
    </div>

    <div id="mini-right" class="mini-actions">
      <div class="row icon-row" style="display:flex;gap:8px">
        <button id="mini-open-text" class="btn icon" aria-label="Open full text">Text</button>
        <button id="mini-like" class="btn icon" aria-label="Like">❤</button>
        <button id="mini-dislike" class="btn icon" aria-label="Dislike">👎</button>
        <button id="mini-comment" class="btn icon" aria-label="Comments">💬</button>
        <button id="mini-share" class="btn icon" aria-label="Share">🔗</button>
        <a id="mini-download" class="btn icon" href="#" download aria-label="Download">⬇️</a>
      </div>

      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <label style="color:var(--muted);font-size:13px">Vol</label>
        <input id="mini-volume" type="range" min="0" max="1" step="0.01" value="1" style="width:110px">
      </div>
    </div>
  </div>

  <div id="comments-modal" class="modal" role="dialog" aria-hidden="true">
    <div class="panel" role="document">
      <h3 id="comments-title">Comments</h3>
      <div id="comments-list" class="comments-list" style="max-height:320px;overflow:auto;margin-top:8px;border-radius:8px;padding:8px;background:rgba(255,255,255,0.02)"></div>
      
      <!-- Quick emoji bar -->
      <div class="emoji-quick">
        <button class="emoji-btn" data-emoji="🔥">🔥</button>
        <button class="emoji-btn" data-emoji="😍">😍</button>
        <button class="emoji-btn" data-emoji="😱">😱</button>
        <button class="emoji-btn" data-emoji="🙌">🙌</button>
        <button class="emoji-btn" data-emoji="👍">👍</button>
        <button class="emoji-btn" data-emoji="👎">👎</button>
        <button class="emoji-btn plus" id="open-emoji-modal">+</button>
      </div>

      <textarea id="comment-input" placeholder="Write a comment..." style="width:100%;min-height:80px;padding:8px;border-radius:8px;background:#07060a;border:1px solid rgba(255,255,255,0.04);color:#eaeaf2;margin-bottom:12px"></textarea>
      
      <div class="row" style="justify-content:flex-end;display:flex;gap:8px">
        <button id="comment-cancel" class="btn">Cancel</button>
        <button id="comment-send" class="btn active">Send</button>
      </div>
    </div>
  </div>

  <!-- Emoji modal (full) -->
  <div id="emoji-modal" class="emoji-modal">
    <h3>Выбрать эмодзи</h3>
    
    <div class="emoji-category">
      <div class="emoji-category-title">😊 Смайлы</div>
      <div class="emoji-grid" id="emoji-smiles"></div>
    </div>

    <div class="emoji-category">
      <div class="emoji-category-title">❤️ Эмоции</div>
      <div class="emoji-grid" id="emoji-hearts"></div>
    </div>

    <div class="emoji-category">
      <div class="emoji-category-title">🤘 Жесты</div>
      <div class="emoji-grid" id="emoji-hands"></div>
    </div>

    <div class="emoji-category">
      <div class="emoji-category-title">🔥 Символы</div>
      <div class="emoji-grid" id="emoji-symbols"></div>
    </div>

    <button id="close-emoji-modal" class="btn active" style="width:100%;margin-top:12px">Close</button>
  </div>

  <div id="side-panel" class="side-panel" aria-hidden="true">
    <div class="side-header">
      <button id="side-close" class="btn">Close</button>
      <button id="copy-text" class="copy-btn">📋 Copy</button>
    </div>
    <h3 id="side-title">Full text</h3>
    <div id="side-content" style="white-space:pre-wrap;color:#eaeaf2;margin-top:8px"></div>
  </div>

  <div id="add-track-modal" class="modal">
    <div class="panel">
      <h3>Добавить трек</h3>
      <input id="t-title" class="search-input" placeholder="Название трека" style="width:100%;margin-bottom:12px">
      <input id="t-audio" class="search-input" placeholder="Ссылка на mp3 (GitHub raw)" style="width:100%;margin-bottom:12px">
      <input id="t-cover" class="search-input" placeholder="Ссылка на обложку" style="width:100%;margin-bottom:12px">
      <input id="t-genre" class="search-input" placeholder="Жанры (через запятую, например: Gothic Piano Trap, Trap)" style="width:100%;margin-bottom:12px">
      <textarea id="t-lyrics" placeholder="Текст песни" style="width:100%;min-height:120px;padding:8px;border-radius:8px;background:#07060a;border:1px solid rgba(255,255,255,0.04);color:#eaeaf2;margin-bottom:12px"></textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="add-cancel" class="btn">Cancel</button>
        <button id="add-save" class="btn active">Save</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/wavesurfer.js@7"></script>

  <script>
  // === ГЛОБАЛЬНЫЕ ФУНКЦИИ ===
  const getCount = k => parseInt(localStorage.getItem(k) || '0', 10);
  const setCount = (k,v) => localStorage.setItem(k, String(v));

  function getDraftTracks() {
    return JSON.parse(localStorage.getItem('draftTracks') || '[]');
  }

  function saveDraftTracks(tracks) {
    localStorage.setItem('draftTracks', JSON.stringify(tracks));
  }

  function updateCountUI(src) {
    document.querySelectorAll('.likes-count').forEach(el => {
      if(el.dataset.key === src){
        const n = el.querySelector('.num');
        if(n) n.textContent = getCount('likes:' + src);
        const val = localStorage.getItem('like:user:' + src);
        el.classList.toggle('active', val === 'like');
      }
    });
    document.querySelectorAll('.dislikes-count').forEach(el => {
      if(el.dataset.key === src){
        const n = el.querySelector('.num');
        if(n) n.textContent = getCount('dislikes:' + src);
        const val = localStorage.getItem('like:user:' + src);
        el.classList.toggle('active', val === 'dislike');
      }
    });
    document.querySelectorAll('.play-count').forEach(el => {
      if(el.dataset.key === src){
        const n = el.querySelector('.num');
        if(n) n.textContent = getCount('plays:' + src);
      }
    });
    
    // Обновить мини-плеер
    const miniLike = document.getElementById('mini-like');
    const miniDislike = document.getElementById('mini-dislike');
    const val = localStorage.getItem('like:user:' + src);
    if(miniLike) miniLike.classList.toggle('active', val === 'like');
    if(miniDislike) miniDislike.classList.toggle('active', val === 'dislike');
  }

  window.toggleLike = function(src) {
    const userKey = 'like:user:' + src;
    const cur = localStorage.getItem(userKey);
    if(cur === 'like'){
      localStorage.removeItem(userKey);
      setCount('likes:' + src, Math.max(0, getCount('likes:' + src) - 1));
    } else {
      if(cur === 'dislike') setCount('dislikes:' + src, Math.max(0, getCount('dislikes:' + src) - 1));
      localStorage.setItem(userKey, 'like');
      setCount('likes:' + src, getCount('likes:' + src) + 1);
    }
    updateCountUI(src);
    console.log('❤️ Like toggled for', src);
  }

  window.toggleDislike = function(src) {
    const userKey = 'like:user:' + src;
    const cur = localStorage.getItem(userKey);
    if(cur === 'dislike'){
      localStorage.removeItem(userKey);
      setCount('dislikes:' + src, Math.max(0, getCount('dislikes:' + src) - 1));
    } else {
      if(cur === 'like') setCount('likes:' + src, Math.max(0, getCount('likes:' + src) - 1));
      localStorage.setItem(userKey, 'dislike');
      setCount('dislikes:' + src, getCount('dislikes:' + src) + 1);
    }
    updateCountUI(src);
    console.log('👎 Dislike toggled for', src);
  }

  function updateTrackDuration(src, duration) {
    const tracks = getDraftTracks();
    const trackIndex = tracks.findIndex(t => t.audio === src);
    if (trackIndex !== -1) {
      // Format duration as MM:SS
      const minutes = Math.floor(duration / 60);
      const seconds = Math.floor(duration % 60);
      const formatted = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      
      tracks[trackIndex].duration = formatted;
      saveDraftTracks(tracks);
      
      // Update UI if this track is displayed
      const trackEl = document.querySelector(`.track[data-src="${src}"]`);
      if (trackEl) {
        const metaEl = trackEl.querySelector('.meta');
        if (metaEl) {
          const genre = tracks[trackIndex].genre || '';
          metaEl.textContent = `${genre} · ${formatted}`;
        }
      }
      
      // Update mini player time display
      if (window.currentTrackSrc === src) {
        updateTimeDisplay(duration);
      }
      
      console.log(`⏱️ Updated duration for ${src}: ${formatted}`);
    }
  }

  function updateTimeDisplay(duration) {
    const miniTime = document.getElementById('mini-time');
    if (miniTime && wavesurfer) {
      const current = wavesurfer.getCurrentTime();
      const total = duration || wavesurfer.getDuration();
      
      const formatTime = (time) => {
        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);
        return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
      };
      
      miniTime.textContent = `${formatTime(current)} / ${formatTime(total)}`;
    }
  }

  function loadGenresToFilter() {
    const tracks = getDraftTracks();
    const genreSet = new Set();
    
    tracks.forEach(track => {
      if (track.genre) {
        // Split by comma and trim
        const genres = track.genre.split(',').map(g => g.trim()).filter(g => g);
        genres.forEach(g => genreSet.add(g));
      }
    });
    
    const genreSelect = document.getElementById('siteGenre');
    // Clear existing options except the first
    while (genreSelect.options.length > 1) {
      genreSelect.remove(1);
    }
    
    // Add unique genres sorted alphabetically
    Array.from(genreSet).sort().forEach(genre => {
      const option = document.createElement('option');
      option.value = genre.toLowerCase();
      option.textContent = genre;
      genreSelect.appendChild(option);
    });
  }

  function renderDraftTracks() {
    const list = document.getElementById('tracksList');
    const tracks = getDraftTracks();
    
    list.innerHTML = '';

    tracks.forEach((track, index) => {
      const div = document.createElement('div');
      div.className = 'track';
      div.dataset.src = track.audio;
      div.dataset.title = track.title;
      div.dataset.genre = track.genre;
      div.dataset.lyrics = track.lyrics || '';
      div.dataset.index = index;

      const val = localStorage.getItem('like:user:' + track.audio);

      div.innerHTML = `
        <img class="thumb" src="${track.cover}" alt="${track.title}">
        <div class="info">
          <div class="title">${track.title}</div>
          <div class="meta">${track.genre || ''} · ${track.duration || '—'}</div>
          
          <div class="counts">
            <div class="play-count" data-key="${track.audio}">
              <span class="num">${getCount('plays:' + track.audio)}</span> plays
            </div>
            <div class="likes-count ${val === 'like' ? 'active' : ''}" data-key="${track.audio}">
              <span class="num">${getCount('likes:' + track.audio)}</span> ❤
            </div>
            <div class="dislikes-count ${val === 'dislike' ? 'active' : ''}" data-key="${track.audio}">
              <span class="num">${getCount('dislikes:' + track.audio)}</span> 👎
            </div>
          </div>

          <div class="play-row">
            <button class="btn icon play-btn" type="button" aria-label="Play">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 3v18l15-9L5 3z" fill="currentColor"/></svg>
            </button>
            <button class="btn icon open-text-btn" aria-label="Open full text">Text</button>
            <button class="btn icon comment-btn" aria-label="Comments">💬</button>
            <button class="btn icon share-btn" aria-label="Share">🔗</button>
          </div>
        </div>
      `;

      list.appendChild(div);
    });

    loadGenresToFilter();
    console.log('✅ Rendered', tracks.length, 'tracks');
  }

  // === PLAYER ===
  let wavesurfer;
  let currentTrackIndex = -1;
  let currentTrackSrc = '';
  let tracks = [];
  let durationInterval;

  function initWavesurfer() {
    wavesurfer = WaveSurfer.create({
      container: '#mini-wave',
      waveColor: '#bfc3d6',
      progressColor: '#ff4da6',
      cursorColor: '#00d1ff',
      barWidth: 2,
      barRadius: 3,
      barGap: 2,
      height: 48,
      normalize: true
    });

    wavesurfer.on('ready', () => {
      console.log('🎵 Ready, playing...');
      wavesurfer.play();
      
      // Get duration and update track data
      const duration = wavesurfer.getDuration();
      updateTrackDuration(currentTrackSrc, duration);
      
      // Start updating time display
      if (durationInterval) clearInterval(durationInterval);
      durationInterval = setInterval(() => updateTimeDisplay(duration), 1000);
    });

    wavesurfer.on('play', () => {
      document.getElementById('mini-play-icon').innerHTML = '<path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>';
    });

    wavesurfer.on('pause', () => {
      document.getElementById('mini-play-icon').innerHTML = '<path d="M5 3v18l15-9L5 3z"/>';
    });

    wavesurfer.on('finish', () => playNext());
    
    wavesurfer.on('error', (err) => console.error('❌ Wavesurfer error:', err));
  }
// === ЭМОДЗИ ===
const EMOJI_CATEGORIES = {
  smiles: ['😀','😃','😄','😁','😆','😅','🤣','😂','🙂','🙃','😉','😊','😇','🥰','😍','🤩','😘','😗','☺️','😚','😙','🥲','😋','😛','😜','🤪','😝','🤑','🤗','🤭','🤫','🤔','🤐','🤨','😐','😑','😶','😏','😒','🙄','😬','😮‍💨','🤥','😌','😔','😪','🤤','😴','😷','🤒','🤕','🤢','🤮','🤧','🥵','🥶','🥴','😵','😵‍💫','🤯','🤠','🥳','🥸','😎','🤓','🧐'],
  hearts: ['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❤️‍🔥','❤️‍🩹','💕','💞','💓','💗','💖','💘','💝','💟','☮️','✝️','☪️','🕉️','☸️','✡️','🔯','🕎','☯️','☦️','🛐','⛎','♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'],
  hands: ['👋','🤚','🖐️','✋','🖖','👌','🤌','🤏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','👍','👎','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🤝','🙏','✍️','💅','🤳','💪','🦾','🦿','🦵','🦶'],
  symbols: ['🔥','⚡','💥','✨','💫','⭐','🌟','💢','💨','💦','💤','🕳️','💣','💬','👁️‍🗨️','🗨️','🗯️','💭','🎵','🎶','🎤','🎧','🎼','🎹','🥁','🎷','🎺','🎸','🪕','🎻','🎲','🎯','🎳','🎮','🎰','🧩']
};

function initEmojiModal() {
  Object.keys(EMOJI_CATEGORIES).forEach(category => {
    const container = document.getElementById(`emoji-${category}`);
    if (!container) return;
    
    container.innerHTML = '';
    EMOJI_CATEGORIES[category].forEach(emoji => {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.textContent = emoji;
      btn.onclick = () => {
        const input = document.getElementById('comment-input');
        input.value += emoji;
        input.focus();
      };
      container.appendChild(btn);
    });
  });
}

function initQuickEmoji() {
  document.querySelectorAll('.emoji-quick .emoji-btn[data-emoji]').forEach(btn => {
    btn.onclick = () => {
      const emoji = btn.dataset.emoji;
      const input = document.getElementById('comment-input');
      input.value += emoji;
      input.focus();
    };
  });
  
  document.getElementById('open-emoji-modal')?.addEventListener('click', () => {
    document.getElementById('emoji-modal').classList.add('open');
  });
  
  document.getElementById('close-emoji-modal')?.addEventListener('click', () => {
    document.getElementById('emoji-modal').classList.remove('open');
  });
}
  function playTrack(index) {
    if (tracks.length === 0) return;
    
    currentTrackIndex = index;
    window.currentTrackIndex = index;
    const track = tracks[index];
    currentTrackSrc = track.audio;
    
    console.log('🎵 Loading:', track.title, track.audio);
    
    wavesurfer.load(track.audio);
    
    document.getElementById('mini-title').textContent = track.title;
    document.getElementById('mini-thumb').src = track.cover;
    document.getElementById('mini-download').href = track.audio;
    document.getElementById('mini-player').style.display = 'flex';
    
    const playKey = 'plays:' + track.audio;
    const count = getCount(playKey) + 1;
    setCount(playKey, count);
    updateCountUI(track.audio);
    
    // Sync mini likes
    const val = localStorage.getItem('like:user:' + track.audio);
    document.getElementById('mini-like').classList.toggle('active', val === 'like');
    document.getElementById('mini-dislike').classList.toggle('active', val === 'dislike');
    
    // Update time display with existing duration
    if (track.duration) {
      // Parse duration from MM:SS format
      const [min, sec] = track.duration.split(':').map(Number);
      const duration = min * 60 + sec;
      updateTimeDisplay(duration);
    } else {
      document.getElementById('mini-time').textContent = '0:00 / 0:00';
    }
  }

  function playNext() {
    if (tracks.length === 0) return;
    playTrack((currentTrackIndex + 1) % tracks.length);
  }

  function playPrev() {
    if (tracks.length === 0) return;
    playTrack((currentTrackIndex - 1 + tracks.length) % tracks.length);
  }

  // === КОММЕНТАРИИ И СМАЙЛИКИ ===
  let currentTrackForComments = null;
  const EMOJIS = ['🔥', '😍', '😱', '🙌', '👍', '👎', '🥵', '😊', '❤️', '🎵', '👏', '😂', '😢', '🤔', '😎', '🤯', '🥳', '🤩', '😘', '😇'];

  function initEmojiPanel() {
    const emojiPanel = document.getElementById('emoji-panel');
    if (!emojiPanel) return;
    
    emojiPanel.innerHTML = '';
    EMOJIS.forEach(emoji => {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.textContent = emoji;
      btn.onclick = () => {
        const input = document.getElementById('comment-input');
        input.value += emoji;
        input.focus();
      };
      emojiPanel.appendChild(btn);
    });
  }

  function loadComments(src) {
    const commentsKey = 'comments:' + src;
    const comments = JSON.parse(localStorage.getItem(commentsKey) || '[]');
    const list = document.getElementById('comments-list');
    const isAdmin = location.search.includes('admin');
    
    if (comments.length === 0) {
      list.innerHTML = '<p style="color:#bfc3d6;text-align:center;padding:20px">Нет комментариев</p>';
    } else {
      list.innerHTML = comments.map((c, idx) => `
        <div class="comment-item" style="position:relative;background:rgba(255,255,255,0.03);padding:10px;border-radius:8px;margin-bottom:8px">
          ${isAdmin ? `<button class="delete-comment" data-index="${idx}">✕</button>` : ''}
          <div style="color:#eaeaf2;margin-bottom:4px;font-size:16px">${c.text}</div>
          <div style="color:#bfc3d6;font-size:11px">${c.date}</div>
        </div>
      `).join('');
      
      // Add delete handlers for admin
      if (isAdmin) {
        list.querySelectorAll('.delete-comment').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const index = parseInt(btn.dataset.index);
            if (confirm('Удалить этот комментарий?')) {
              deleteComment(src, index);
            }
          };
        });
      }
    }
  }

  function deleteComment(src, index) {
    const key = 'comments:' + src;
    const comments = JSON.parse(localStorage.getItem(key) || '[]');
    if (index >= 0 && index < comments.length) {
      comments.splice(index, 1);
      localStorage.setItem(key, JSON.stringify(comments));
      loadComments(src);
      console.log('🗑️ Comment deleted');
    }
  }

  // === INIT ===
  document.addEventListener('DOMContentLoaded', () => {
    console.log('🚀 Initializing...');
initEmojiModal();
initQuickEmoji();
    tracks = getDraftTracks();
    initWavesurfer();
    initEmojiPanel();
    renderDraftTracks();

    const tracksList = document.getElementById('tracksList');
    const sidePanel = document.getElementById('side-panel');
    const commentsModal = document.getElementById('comments-modal');

    // Делегирование кнопок в треках
    tracksList.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      const track = btn.closest('.track');
      if (!track) return;

      const src = track.dataset.src;
      const title = track.dataset.title;
      const lyrics = track.dataset.lyrics;
      const index = parseInt(track.dataset.index);

      if (btn.classList.contains('play-btn')) {
        e.preventDefault();
        console.log('🎵 Play clicked:', title);
        playTrack(index);
      }

      if (btn.classList.contains('open-text-btn')) {
        e.preventDefault();
        console.log('📄 Text clicked');
        document.getElementById('side-title').textContent = title;
        document.getElementById('side-content').textContent = lyrics || '(No text)';
        sidePanel.classList.add('open');
      }

      if (btn.classList.contains('comment-btn')) {
        e.preventDefault();
        console.log('💬 Comments clicked');
        currentTrackForComments = src;
        document.getElementById('comments-title').textContent = `Comments: ${title}`;
        loadComments(src);
        commentsModal.classList.add('open');
      }

      if (btn.classList.contains('share-btn')) {
        e.preventDefault();
        if(navigator.share) {
          navigator.share({ title, url: location.href }).catch(()=>{});
        } else {
          alert('Link: ' + location.href);
        }
      }
    });

    // Лайки/дизлайки в треках
    tracksList.addEventListener('click', (e) => {
      const el = e.target.closest('.likes-count, .dislikes-count');
      if (!el) return;
      e.preventDefault();
      const src = el.dataset.key;
      if (el.classList.contains('likes-count')) {
        window.toggleLike(src);
      } else {
        window.toggleDislike(src);
      }
    });

    // Мини-плеер кнопки
    document.getElementById('mini-play').onclick = () => wavesurfer?.playPause();
    document.getElementById('mini-next').onclick = playNext;
    document.getElementById('mini-prev').onclick = playPrev;
    document.getElementById('mini-volume').oninput = (e) => wavesurfer?.setVolume(parseFloat(e.target.value));

    document.getElementById('mini-open-text').onclick = () => {
      if (currentTrackIndex >= 0) {
        const track = tracks[currentTrackIndex];
        document.getElementById('side-title').textContent = track.title;
        document.getElementById('side-content').textContent = track.lyrics || '(No text)';
        sidePanel.classList.add('open');
      }
    };

    document.getElementById('mini-like').onclick = () => {
      if (currentTrackIndex >= 0) {
        window.toggleLike(tracks[currentTrackIndex].audio);
      }
    };

    document.getElementById('mini-dislike').onclick = () => {
      if (currentTrackIndex >= 0) {
        window.toggleDislike(tracks[currentTrackIndex].audio);
      }
    };

    document.getElementById('mini-comment').onclick = () => {
      if (currentTrackIndex >= 0) {
        const track = tracks[currentTrackIndex];
        currentTrackForComments = track.audio;
        document.getElementById('comments-title').textContent = `Comments: ${track.title}`;
        loadComments(track.audio);
        commentsModal.classList.add('open');
      }
    };

    // Смайлики
    document.getElementById('emoji-toggle').onclick = (e) => {
      e.stopPropagation();
      const panel = document.getElementById('emoji-panel');
      panel.classList.toggle('open');
    };
    
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#emoji-toggle') && !e.target.closest('#emoji-panel')) {
        document.getElementById('emoji-panel')?.classList.remove('open');
      }
    });

    // Отправка комментария
    document.getElementById('comment-send').onclick = () => {
      const text = document.getElementById('comment-input').value.trim();
      if (!text || !currentTrackForComments) return;

      const key = 'comments:' + currentTrackForComments;
      const comments = JSON.parse(localStorage.getItem(key) || '[]');
      comments.push({ text, date: new Date().toLocaleString('ru-RU') });
      localStorage.setItem(key, JSON.stringify(comments));
      
      document.getElementById('comment-input').value = '';
      loadComments(currentTrackForComments);
      console.log('💬 Comment saved');
    };

    // Копирование текста
document.getElementById('copy-text').onclick = () => {
  const text = document.getElementById('side-content').textContent;
  const btn = document.getElementById('copy-text');
  
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 Copy';
      btn.classList.remove('copied');
    }, 2000);
    console.log('📋 Text copied');
  });
};

    // Закрытие панелей
    document.getElementById('side-close').onclick = () => sidePanel.classList.remove('open');
    document.getElementById('comment-cancel').onclick = () => {
      commentsModal.classList.remove('open');
      document.getElementById('emoji-panel')?.classList.remove('open');
    };

    // Админ
    if (!location.search.includes('admin')) {
      document.getElementById('addTrackBtn')?.remove();
      document.getElementById('exportJsonBtn')?.remove();
    }

    const modal = document.getElementById('add-track-modal');
    document.getElementById('addTrackBtn')?.addEventListener('click', () => modal.classList.add('open'));
    document.getElementById('add-cancel').onclick = () => modal.classList.remove('open');
    
    document.getElementById('add-save').onclick = () => {
      const title = document.getElementById('t-title').value.trim();
      const audio = document.getElementById('t-audio').value.trim();
      const cover = document.getElementById('t-cover').value.trim();
      const genre = document.getElementById('t-genre').value.trim();
      const lyrics = document.getElementById('t-lyrics').value.trim();

      if (!title || !audio || !cover) {
        alert('Название, mp3 и обложка обязательны');
        return;
      }

      const track = { 
        title, 
        audio, 
        cover, 
        genre: genre || 'Uncategorized',
        lyrics, 
        duration: '—' 
      };
      
      tracks = getDraftTracks();
      tracks.push(track);
      saveDraftTracks(tracks);

      document.getElementById('t-title').value = '';
      document.getElementById('t-audio').value = '';
      document.getElementById('t-cover').value = '';
      document.getElementById('t-genre').value = '';
      document.getElementById('t-lyrics').value = '';

      modal.classList.remove('open');
      renderDraftTracks();
      console.log('✅ Track added');
    };

    document.getElementById('exportJsonBtn')?.addEventListener('click', () => {
      const t = getDraftTracks();
      if (!t.length) return alert('Нет треков');
      const blob = new Blob([JSON.stringify(t, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tracks.json';
      a.click();
    });

    // Поиск
    document.getElementById('siteSearch').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      document.querySelectorAll('.track').forEach(track => {
        const title = track.dataset.title?.toLowerCase() || '';
        const genre = track.dataset.genre?.toLowerCase() || '';
        const matches = title.includes(query) || genre.includes(query);
        track.style.display = matches ? '' : 'none';
      });
    });

    // Фильтр по жанру
    document.getElementById('siteGenre').addEventListener('change', (e) => {
      const genre = e.target.value.toLowerCase();
      document.querySelectorAll('.track').forEach(track => {
        if (!genre) {
          track.style.display = '';
          return;
        }
        const trackGenre = track.dataset.genre?.toLowerCase() || '';
        const matches = trackGenre.includes(genre);
        track.style.display = matches ? '' : 'none';
      });
    });

    console.log('✅ Initialized');
  });
  </script>
