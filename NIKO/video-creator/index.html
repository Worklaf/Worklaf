<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 Niko Cyberpunk Video Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- HEADER -->
  <header class="header">
    <h1>🎬 NIKO CYBERPUNK VIDEO EDITOR</h1>
    <div class="header-controls">
      <button id="exportProject" class="btn-icon">💾 Save</button>
      <button id="importProject" class="btn-icon">📂 Load</button>
      <select id="resolution">
        <option value="1920x1080">1920×1080 (Full HD)</option>
        <option value="1280x720">1280×720 (HD)</option>
        <option value="3840x2160">3840×2160 (4K)</option>
        <option value="2560x1440">2560×1440 (2K)</option>
      </select>
      <select id="fps">
        <option value="30">30 FPS</option>
        <option value="60" selected>60 FPS</option>
        <option value="120">120 FPS</option>
      </select>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="main-layout">
    
    <!-- LEFT PANEL - CONTROLS -->
    <aside class="left-panel">
      
      <!-- AUDIO -->
      <section class="panel-section">
        <h3>🎵 AUDIO</h3>
        <input type="file" id="audioUpload" accept="audio/*" />
      </section>
      
      <!-- BACKGROUND -->
      <section class="panel-section">
        <h3>🖼️ BACKGROUND</h3>
        <input type="file" id="bgUpload" accept="image/*" />
        
        <div class="control-group">
          <label>Color:</label>
          <input type="color" id="bgColor" value="#000033" />
        </div>
        
        <div class="control-group">
          <label>Blur: <span id="bgBlurValue">5</span></label>
          <input type="range" id="bgBlur" min="0" max="50" value="5" />
        </div>
        
        <div class="control-group">
          <label>Brightness: <span id="bgBrightValue">70</span>%</label>
          <input type="range" id="bgBright" min="0" max="200" value="70" />
        </div>
        
        <div class="control-group">
          <label>Zoom: <span id="bgZoomValue">1.0</span>×</label>
          <input type="range" id="bgZoom" min="1" max="2" step="0.01" value="1" />
        </div>
      </section>
      
      <!-- VISUALIZER -->
      <section class="panel-section">
        <h3>📊 VISUALIZER</h3>
        
        <div class="control-group">
          <label>Type:</label>
          <select id="vizType">
            <option value="bars">Bars</option>
            <option value="wave">Wave</option>
            <option value="circle">Circle</option>
            <option value="spiral">Spiral</option>
            <option value="particles">Particles</option>
            <option value="spectrum">Spectrum</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>Color:</label>
          <input type="color" id="vizColor" value="#00ffff" />
        </div>
        
        <div class="control-group">
          <label>Glow: <span id="vizGlowValue">20</span></label>
          <input type="range" id="vizGlow" min="0" max="50" value="20" />
        </div>
        
        <div class="control-group">
          <label>Scale: <span id="vizScaleValue">1.0</span></label>
          <input type="range" id="vizScale" min="0.1" max="3" step="0.1" value="1" />
        </div>
        
        <div class="control-group">
          <label>Y Position: <span id="vizYValue">0</span></label>
          <input type="range" id="vizY" min="-500" max="500" value="0" />
        </div>
      </section>
      
      <!-- PARTICLES -->
      <section class="panel-section">
        <h3>✨ PARTICLES</h3>
        
        <div class="control-group">
          <label>Type:</label>
          <select id="particleType">
            <option value="none">None</option>
            <option value="snow">Snow</option>
            <option value="stars">Stars</option>
            <option value="sparks">Sparks</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>Amount: <span id="particleAmountValue">100</span></label>
          <input type="range" id="particleAmount" min="0" max="500" value="100" />
        </div>
      </section>
      
      <!-- PRESETS -->
      <section class="panel-section">
        <h3>🎨 PRESETS</h3>
        <div id="presets" class="presets-grid"></div>
      </section>
      
    </aside>
    
    <!-- CENTER - CANVAS -->
    <main class="center-panel">
      <div class="canvas-container">
        <canvas id="canvas"></canvas>
      </div>
      
      <!-- PLAYBACK CONTROLS -->
      <div class="playback-controls">
        <button id="playBtn" class="btn-play">▶️</button>
        <input type="range" id="timelineSeek" min="0" max="100" value="0" class="seek-bar" />
        <span id="timeDisplay">0:00 / 0:00</span>
      </div>
      
      <!-- TIMELINE -->
      <div id="timeline" class="timeline">
        <div id="timelinePlayhead" class="timeline-playhead"></div>
        <div id="timelineTracks" class="timeline-tracks"></div>
      </div>
    </main>
    
    <!-- RIGHT PANEL - LAYERS -->
    <aside class="right-panel">
      
      <!-- LAYERS -->
      <section class="panel-section">
        <h3>📚 LAYERS</h3>
        <div class="layer-buttons">
          <button id="addTextBtn">📝 Text</button>
          <button id="addImageBtn">🖼️ Image</button>
        </div>
        <div id="layersList" class="layers-list"></div>
      </section>
      
      <!-- PROPERTIES -->
      <section class="panel-section">
        <h3>⚙️ PROPERTIES</h3>
        <div id="propertiesPanel" class="properties-panel">
          <p>Select a layer to edit</p>
        </div>
      </section>
      
      <!-- RECORDING -->
      <section class="panel-section">
        <h3>🎥 EXPORT</h3>
        <button id="recordBtn" class="btn-record">⏺️ Record</button>
        <button id="exportFrameBtn" class="btn-export">📸 Frame</button>
      </section>
      
    </aside>
    
  </div>
  
  <script type="module" src="main.js"></script>
</body>
</html>
