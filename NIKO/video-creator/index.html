<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 N1K∅ Super Video Creator Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- LEFT PANEL -->
    <div class="sidebar left">
      <h2>🎬 Creator Pro</h2>
      
      <!-- File Upload -->
      <div class="section">
        <h3>📁 Аудио</h3>
        <input type="file" id="audioFile" accept="audio/*">
        <button id="togglePlay" disabled>▶️ Play</button>
      </div>

      <!-- Resolution -->
      <div class="section">
        <h3>📐 Разрешение</h3>
        <select id="resolution">
          <option value="1920x1080">1920x1080 (Full HD)</option>
          <option value="1280x720">1280x720 (HD)</option>
          <option value="1080x1920">1080x1920 (TikTok/Reels)</option>
          <option value="1080x1080">1080x1080 (Instagram)</option>
          <option value="720x1280">720x1280 (Stories)</option>
        </select>
      </div>

      <!-- Visualizer Type -->
      <div class="section">
        <h3>🎨 Визуализатор</h3>
        <select id="visualizerType">
          <option value="circular">⭕ Circular</option>
          <option value="radial">🌈 Radial</option>
          <option value="neon">💫 Neon</option>
          <option value="tunnel">🚀 Cyber Tunnel</option>
        </select>
      </div>

      <!-- Background -->
      <div class="section">
        <h3>🎨 Фон</h3>
        <label>Цвет: <input type="color" id="bgColor" value="#000000"></label>
        <label>Blur: <input type="range" id="bgBlur" min="0" max="50" value="0"> <span id="blurVal">0</span></label>
        <label>Яркость: <input type="range" id="bgBright" min="0" max="200" value="100"> <span id="brightVal">100</span>%</label>
        <label>Реакция: <input type="range" id="bgReact" min="0" max="100" value="0"> <span id="bgReactVal">0</span></label>
      </div>

      <!-- Visualizer Settings -->
      <div class="section">
        <h3>⚙️ Визуализатор</h3>
        <label>Цвет: <input type="color" id="vizColor" value="#00d1ff"></label>
        <label>Glow: <input type="range" id="vizGlow" min="0" max="50" value="20"> <span id="glowVal">20</span></label>
        <label>Scale: <input type="range" id="vizScale" min="0.5" max="3" step="0.1" value="1"> <span id="scaleVal">1.0</span></label>
        <label>Y Pos: <input type="range" id="vizY" min="0" max="1" step="0.01" value="0.5"> <span id="vizYVal">0.50</span></label>
        <label>Smooth: <input type="range" id="audioSmooth" min="0" max="0.95" step="0.05" value="0.7"> <span id="smoothVal">0.7</span></label>
      </div>

      <!-- Particles -->
      <div class="section">
        <h3>❄️ Частицы</h3>
        <select id="partType">
          <option value="none">Нет</option>
          <option value="snow">❄️ Снег</option>
          <option value="stars">✨ Звезды</option>
        </select>
        <label>Кол-во: <input type="range" id="partAmount" min="0" max="200" value="50"> <span id="partAmountVal">50</span></label>
      </div>

      <!-- Emblem -->
      <div class="section">
        <h3>🖼️ Эмблема</h3>
        <input type="file" id="emblemFile" accept="image/*">
        <label>Размер: <input type="range" id="emblemSize" min="0.1" max="1" step="0.01" value="0.15"> <span id="emblemSizeVal">0.15</span></label>
        <label>X: <input type="range" id="emblemX" min="0" max="1" step="0.01" value="0.5"> <span id="emblemXVal">0.50</span></label>
        <label>Y: <input type="range" id="emblemY" min="0" max="1" step="0.01" value="0.5"> <span id="emblemYVal">0.50</span></label>
        <label><input type="checkbox" id="emblemCircle"> Круглая маска</label>
      </div>

      <!-- FPS -->
      <div class="section">
        <h3>🎥 FPS</h3>
        <select id="fps">
          <option value="30">30 FPS</option>
          <option value="60" selected>60 FPS</option>
        </select>
      </div>
    </div>

    <!-- CANVAS -->
    <div class="canvas-container">
      <canvas id="canvas"></canvas>
      <div id="overlay" class="overlay"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="sidebar right">
      <h3>🎯 Слои</h3>
      <div class="layers-buttons">
        <button id="addText">➕ Текст</button>
        <button id="addImage">🖼️ Изображение</button>
        <button id="addEmoji">😀 Эмодзи</button>
      </div>
      <div id="layersList" class="layers-list"></div>

      <div class="section">
        <h3>📹 Рендер</h3>
        <button id="startRecord">🔴 Начать запись</button>
        <button id="stopRecord" disabled>⏹️ Стоп</button>
        <div id="recordStatus"></div>
      </div>

      <div class="section">
        <h3>🎼 Таймлайн</h3>
        <canvas id="timeline" width="300" height="100"></canvas>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="core/state.js"></script>
  <script type="module" src="core/audio.js"></script>
  <script type="module" src="visualizers/index.js"></script>
  <script type="module" src="effects/index.js"></script>
  <script type="module" src="layers/layers.js"></script>
  <script type="module" src="core/timeline.js"></script>
  <script type="module" src="core/render.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
