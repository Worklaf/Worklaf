<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pro Video Visualizer</title>
    <style>
        :root {
            --bg-dark: #0f0f12;
            --panel-bg: #16161a;
            --accent: #00a2ff;
            --border: #2d2d33;
            --text: #e0e0e0;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            background: #000;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            border: none;
            background: none;
            color: #888;
            cursor: pointer;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        .controls-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .control-group {
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .group-title {
            font-size: 12px;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .group-title::before {
            content: '▾';
            margin-right: 5px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .control-row label { width: 40%; color: #aaa; }
        
        input[type="range"] { flex: 1; height: 4px; accent-color: var(--accent); }
        input[type="number"] { width: 50px; background: #222; border: 1px solid var(--border); color: var(--accent); font-size: 11px; }
        select { background: #222; color: #fff; border: 1px solid var(--border); padding: 2px; font-size: 11px; }

        /* --- PREVIEW AREA --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        #canvas-container {
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            background: #000;
            position: relative;
            max-width: 100%;
            max-height: 80vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- TIMELINE / BOTTOM --- */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 320px;
            right: 0;
            height: 80px;
            background: rgba(22, 22, 26, 0.95);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            margin-right: 20px;
        }

        .timeline {
            flex: 1;
            height: 4px;
            background: #333;
            position: relative;
            cursor: pointer;
        }

        .progress {
            position: absolute;
            height: 100%;
            background: var(--accent);
            width: 0%;
        }

        .recording-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            color: red;
            display: none;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }

        .dot { width: 10px; height: 10px; background: red; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('tab-project')">Project</button>
        <button class="tab-btn" onclick="showTab('tab-audio')">Audio</button>
        <button class="tab-btn" onclick="showTab('tab-viz')">Spectrum</button>
        <button class="tab-btn" onclick="showTab('tab-fx')">Effects</button>
    </div>

    <div class="controls-container">
        <!-- PROJECT TAB -->
        <div id="tab-project" class="tab-content">
            <div class="control-group">
                <div class="group-title">Canvas Settings</div>
                <div class="control-row">
                    <label>Ratio</label>
                    <select id="aspectRatio" onchange="updateCanvasSize()">
                        <option value="16:9">16:9 (YouTube)</option>
                        <option value="9:16">9:16 (TikTok)</option>
                        <option value="1:1">1:1 (Instagram)</option>
                        <option value="4:3">4:3 (Classic)</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>FPS</label>
                    <input type="number" id="fpsLimit" value="60">
                </div>
            </div>

            <div class="control-group">
                <div class="group-title">Background</div>
                <button onclick="document.getElementById('bgInput').click()" style="width:100%; background:#333; color:white; border:none; padding:5px; margin-bottom:10px;">Change Image</button>
                <input type="file" id="bgInput" hidden accept="image/*">
                <div class="control-row">
                    <label>Brightness</label>
                    <input type="range" id="bgBrightness" min="0" max="2" step="0.1" value="0.5">
                </div>
                <div class="control-row">
                    <label>Blur</label>
                    <input type="range" id="bgBlur" min="0" max="20" value="0">
                </div>
                <div class="control-row">
                    <label>Reactiveness</label>
                    <input type="range" id="bgReact" min="0" max="0.5" step="0.01" value="0.05">
                </div>
            </div>

            <div class="control-group">
                <div class="group-title">Emblem / Photo</div>
                <button onclick="document.getElementById('emblemInput').click()" style="width:100%; background:#333; color:white; border:none; padding:5px; margin-bottom:10px;">Add Overlay Photo</button>
                <input type="file" id="emblemInput" hidden accept="image/*">
                <div class="control-row">
                    <label>Clip to Circle</label>
                    <input type="checkbox" id="emblemCircle" checked>
                </div>
                <div class="control-row">
                    <label>Size</label>
                    <input type="range" id="emblemSize" min="0.1" max="1" step="0.01" value="0.3">
                </div>
                <div class="control-row">
                    <label>X Position</label>
                    <input type="range" id="emblemX" min="0" max="1" step="0.01" value="0.5">
                </div>
                <div class="control-row">
                    <label>Y Position</label>
                    <input type="range" id="emblemY" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>
        </div>

        <!-- AUDIO TAB -->
        <div id="tab-audio" class="tab-content" style="display:none">
            <div class="control-group">
                <div class="group-title">Audio File</div>
                <input type="file" id="audioInput" accept="audio/*" style="width:100%; font-size:10px;">
                <div class="control-row" style="margin-top:10px">
                    <label>Smoothing</label>
                    <input type="range" id="audioSmooth" min="0" max="0.99" step="0.01" value="0.8">
                </div>
            </div>
        </div>

        <!-- VISUALIZER TAB -->
        <div id="tab-viz" class="tab-content" style="display:none">
            <div class="control-group">
                <div class="group-title">Spectrum Style</div>
                <select id="vizType" style="width:100%; margin-bottom:10px;">
                    <option value="cyberTunnel">Cyber Tunnel</option>
                    <option value="bars">Classic Bars</option>
                    <option value="circle">Circular Bars</option>
                    <option value="neonLine">Neon Wave</option>
                </select>
                <div class="control-row">
                    <label>Color</label>
                    <input type="color" id="vizColor" value="#00a2ff">
                </div>
                <div class="control-row">
                    <label>Glow</label>
                    <input type="range" id="vizGlow" min="0" max="50" value="20">
                </div>
                <div class="control-row">
                    <label>Scale</label>
                    <input type="range" id="vizScale" min="0.1" max="3" step="0.1" value="1">
                </div>
                <div class="control-row">
                    <label>Position Y</label>
                    <input type="range" id="vizY" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>
        </div>

        <!-- EFFECTS TAB -->
        <div id="tab-fx" class="tab-content" style="display:none">
            <div class="control-group">
                <div class="group-title">Particles</div>
                <div class="control-row">
                    <label>Type</label>
                    <select id="partType">
                        <option value="none">None</option>
                        <option value="snow">Snowflakes</option>
                        <option value="stars">Stars</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Amount</label>
                    <input type="range" id="partCount" min="0" max="500" value="150">
                </div>
            </div>
            <div class="control-group">
                <div class="group-title">Screen FX</div>
                <div class="control-row">
                    <label>Flicker</label>
                    <input type="checkbox" id="fxFlicker">
                </div>
                <div class="control-row">
                    <label>RGB Shift</label>
                    <input type="checkbox" id="fxRGB">
                </div>
            </div>
        </div>
        
        <button id="recordBtn" style="width:100%; padding:15px; background: #e74c3c; color:white; border:none; font-weight:bold; cursor:pointer; margin-top:20px;">START RECORDING</button>
    </div>
</div>

<div class="main-content">
    <div class="recording-indicator" id="recInd">
        <div class="dot"></div> REC
    </div>
    
    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>
</div>

<div class="bottom-bar">
    <button class="play-btn" id="playBtn">▶</button>
    <div style="margin-right:15px; font-family:monospace; font-size:12px;" id="timeInfo">00:00 / 00:00</div>
    <div class="timeline" id="timeline">
        <div class="progress" id="progress"></div>
    </div>
</div>

<script>
    // --- CORE VARIABLES ---
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    let audioCtx, analyser, source, dataArray;
    let audio = new Audio();
    let isPlaying = false;
    let bgImage = new Image();
    let emblemImage = new Image();
    let particles = [];
    let tunnelZ = 0;

    // --- CONFIG ---
    const cfg = {
        width: 1280,
        height: 720,
        vizScale: 1,
        vizY: 0.5
    };

    // --- INITIALIZATION ---
    function init() {
        updateCanvasSize();
        createParticles();
        requestAnimationFrame(render);
    }

    function updateCanvasSize() {
        const ratio = document.getElementById('aspectRatio').value;
        const container = document.getElementById('canvas-container');
        
        if(ratio === '16:9') { cfg.width = 1280; cfg.height = 720; }
        else if(ratio === '9:16') { cfg.width = 720; cfg.height = 1280; }
        else if(ratio === '1:1') { cfg.width = 1080; cfg.height = 1080; }
        else if(ratio === '4:3') { cfg.width = 1024; cfg.height = 768; }

        canvas.width = cfg.width;
        canvas.height = cfg.height;
        
        // Visual adjustment to fit screen
        const screenH = window.innerHeight * 0.8;
        const scale = screenH / cfg.height;
        container.style.width = (cfg.width * scale) + 'px';
        container.style.height = screenH + 'px';
    }

    // --- AUDIO LOGIC ---
    document.getElementById('audioInput').onchange = function(e) {
        const file = e.target.files[0];
        if(!file) return;
        audio.src = URL.createObjectURL(file);
        setupAudioContext();
    };

    function setupAudioContext() {
        if(!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
        }
        analyser.fftSize = 1024;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
    }

    document.getElementById('playBtn').onclick = () => {
        if(audio.paused) {
            audio.play();
            if(audioCtx) audioCtx.resume();
            document.getElementById('playBtn').innerText = '⏸';
        } else {
            audio.pause();
            document.getElementById('playBtn').innerText = '▶';
        }
    };

    // --- IMAGE LOADING ---
    document.getElementById('bgInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => bgImage.src = ev.target.result;
        reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById('emblemInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => emblemImage.src = ev.target.result;
        reader.readAsDataURL(e.target.files[0]);
    };

    // --- PARTICLES ---
    function createParticles() {
        particles = [];
        for(let i=0; i<500; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                speed: Math.random() * 2 + 0.5,
                opacity: Math.random()
            });
        }
    }

    // --- RENDERING FUNCTIONS ---

    function drawBackground(bass) {
        ctx.save();
        const react = parseFloat(document.getElementById('bgReact').value);
        const blur = document.getElementById('bgBlur').value;
        const bright = document.getElementById('bgBrightness').value;
        
        const scale = 1 + (bass / 255) * react;
        
        ctx.filter = `blur(${blur}px) brightness(${bright})`;
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.scale(scale, scale);
        
        if(bgImage.src) {
            const aspect = bgImage.width / bgImage.height;
            let dw, dh;
            if(canvas.width / canvas.height > aspect) {
                dw = canvas.width; dh = dw / aspect;
            } else {
                dh = canvas.height; dw = dh * aspect;
            }
            ctx.drawImage(bgImage, -dw/2, -dh/2, dw, dh);
        } else {
            ctx.fillStyle = '#050505';
            ctx.fillRect(-canvas.width/2, -canvas.height/2, canvas.width, canvas.height);
        }
        ctx.restore();
    }

    function drawFX(bass) {
        const type = document.getElementById('partType').value;
        const count = document.getElementById('partCount').value;
        if(type === 'none') return;

        ctx.fillStyle = type === 'snow' ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,200,0.8)';
        for(let i=0; i<count; i++) {
            let p = particles[i];
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (1 + bass/500), 0, Math.PI*2);
            ctx.fill();
            
            p.y += p.speed * (1 + bass/200);
            if(p.y > canvas.height) p.y = -10;
        }

        if(document.getElementById('fxFlicker').checked && bass > 200) {
            ctx.fillStyle = `rgba(255,255,255,${(bass-200)/500})`;
            ctx.fillRect(0,0,canvas.width, canvas.height);
        }
    }

    function drawCyberTunnel(bass) {
        const color = document.getElementById('vizColor').value;
        const glow = document.getElementById('vizGlow').value;
        const scale = document.getElementById('vizScale').value;
        const yPos = canvas.height * document.getElementById('vizY').value;

        ctx.save();
        ctx.translate(canvas.width/2, yPos);
        ctx.scale(scale, scale);
        
        ctx.strokeStyle = color;
        ctx.shadowBlur = glow;
        ctx.shadowColor = color;
        ctx.lineWidth = 2;

        tunnelZ += 2 + (bass/50);
        
        for(let i=0; i<15; i++) {
            let z = (i * 100 - (tunnelZ % 100));
            let s = 500 / (z + 100);
            if(s < 0) continue;
            
            let w = canvas.width * s;
            let h = canvas.height * s;
            
            ctx.beginPath();
            ctx.rect(-w/2, -h/2, w, h);
            ctx.stroke();

            // Connecting lines
            if(i === 0) {
                ctx.beginPath();
                ctx.moveTo(-canvas.width, -canvas.height); ctx.lineTo(-w/2, -h/2);
                ctx.moveTo(canvas.width, -canvas.height); ctx.lineTo(w/2, -h/2);
                ctx.moveTo(-canvas.width, canvas.height); ctx.lineTo(-w/2, h/2);
                ctx.moveTo(canvas.width, canvas.height); ctx.lineTo(w/2, h/2);
                ctx.stroke();
            }
        }
        ctx.restore();
    }

    function drawBars(bass) {
        const color = document.getElementById('vizColor').value;
        const yPos = canvas.height * document.getElementById('vizY').value;
        const scale = document.getElementById('vizScale').value;
        
        const barWidth = (canvas.width / dataArray.length) * 2;
        ctx.fillStyle = color;
        ctx.shadowBlur = document.getElementById('vizGlow').value;
        ctx.shadowColor = color;

        for(let i=0; i<dataArray.length; i++) {
            let h = dataArray[i] * scale;
            ctx.fillRect(i * barWidth, yPos - h/2, barWidth - 2, h);
        }
    }

    function drawEmblem(bass) {
        if(!emblemImage.src) return;
        
        const sizeInput = document.getElementById('emblemSize').value;
        const posX = document.getElementById('emblemX').value * canvas.width;
        const posY = document.getElementById('emblemY').value * canvas.height;
        const isCircle = document.getElementById('emblemCircle').checked;
        
        const size = (canvas.width * sizeInput) * (1 + bass/1000);
        
        ctx.save();
        ctx.translate(posX, posY);
        
        if(isCircle) {
            ctx.beginPath();
            ctx.arc(0, 0, size/2, 0, Math.PI*2);
            ctx.clip();
        }
        
        ctx.drawImage(emblemImage, -size/2, -size/2, size, size);
        ctx.restore();
    }

    // --- MAIN RENDER LOOP ---
    function render() {
        if(analyser) {
            analyser.smoothingTimeConstant = document.getElementById('audioSmooth').value;
            analyser.getByteFrequencyData(dataArray);
        } else {
            dataArray = new Uint8Array(512).fill(0);
        }

        const bass = dataArray ? dataArray[2] : 0;
        
        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. Background
        drawBackground(bass);
        
        // 2. FX
        drawFX(bass);
        
        // 3. Visualizer
        const type = document.getElementById('vizType').value;
        if(type === 'cyberTunnel') drawCyberTunnel(bass);
        else if(type === 'bars') drawBars(bass);
        else if(type === 'circle') {
             // Logic for circular bars...
             drawBars(bass); // Fallback
        }

        // 4. Emblem
        drawEmblem(bass);

        // Update UI
        if(audio.duration) {
            const p = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('timeInfo').innerText = 
                formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
        }

        requestAnimationFrame(render);
    }

    function formatTime(s) {
        const m = Math.floor(s/60);
        const sec = Math.floor(s%60);
        return m.toString().padStart(2,'0') + ":" + sec.toString().padStart(2,'0');
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        event.target.classList.add('active');
    }

    // --- RECORDING LOGIC ---
    let mediaRecorder;
    let recordedChunks = [];
    document.getElementById('recordBtn').onclick = () => {
        if(mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            document.getElementById('recordBtn').innerText = "START RECORDING";
            document.getElementById('recInd').style.display = "none";
        } else {
            recordedChunks = [];
            const stream = canvas.captureStream(60);
            
            // Add audio to stream
            if(audioCtx) {
                const dest = audioCtx.createMediaStreamDestination();
                source.connect(dest);
                stream.addTrack(dest.stream.getAudioTracks()[0]);
            }

            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'viz_video.webm'; a.click();
            };
            mediaRecorder.start();
            document.getElementById('recordBtn').innerText = "STOP & SAVE";
            document.getElementById('recInd').style.display = "flex";
            if(audio.paused) document.getElementById('playBtn').click();
        }
    };

    init();
</script>

</body>
</html>
