<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Deep Audio Visualizer 5D</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }
        canvas {
            display: block;
        }
        
        /* UI Container */
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.3s;
        }

        /* Timeline */
        .timeline-container {
            width: 100%;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #timeline {
            flex-grow: 1;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        #timeline::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #00ffcc;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px #00ffcc;
        }
        .time-display {
            font-size: 12px;
            font-family: monospace;
            min-width: 80px;
            text-align: center;
        }

        /* Controls Grid */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            align-items: center;
        }

        button, select, input[type="file"] {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover { background: rgba(255, 255, 255, 0.2); }
        button.active { background: #00ffcc; color: #000; }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="ui-layer">
        <!-- Таймлайн -->
        <div class="timeline-container">
            <span id="currentTime" class="time-display">00:00</span>
            <input type="range" id="timeline" min="0" max="100" value="0" step="0.1">
            <span id="duration" class="time-display">00:00</span>
        </div>

        <!-- Контроллеры -->
        <div class="controls">
            <input type="file" id="audioFile" accept="audio/*">
            <button id="playBtn">▶ Play</button>
            
            <select id="vizSelect">
                <option value="deepSpace">🌌 Deep Space (5D)</option>
                <option value="quantumField">⚛️ Quantum Field</option>
                <option value="romanticHeart">💖 Romantic Soul</option>
                <option value="loveTunnel">🌹 Love Tunnel</option>
                <option value="hyperCube">🧊 Hyper Cube</option>
                <option value="matrixRain">🧬 Digital Rain</option>
            </select>

            <button id="fullscreenBtn">⛶ Fullscreen</button>
            <button id="autoCamBtn">🎥 Auto Cam</button>
        </div>
    </div>

    <!-- Подключаем скрипты в правильном порядке -->
    <script src="visualizers.js"></script>
    <script src="main.js"></script>
</body>
</html>
