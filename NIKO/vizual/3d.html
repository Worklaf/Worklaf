<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>N1K∅ Cinema Visualizer & Recorder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        canvas { display: block; }

        /* UI Overlay */
        #ui-root { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .interactive { pointer-events: auto; }

        /* Sidebar */
        .sidebar { position: absolute; right: 0; top: 0; width: 300px; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); padding: 20px; border-left: 1px solid rgba(255,255,255,0.1); overflow-y: auto; }
        
        /* Bottom Player */
        .player-bar { position: absolute; bottom: 0; left: 0; width: calc(100% - 300px); background: rgba(0,0,0,0.9); padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .progress-container { width: 100%; height: 6px; background: #333; cursor: pointer; border-radius: 3px; margin-bottom: 10px; position: relative; }
        .progress-fill { height: 100%; background: #ff2d55; width: 0%; border-radius: 3px; }

        /* Recording Preview Mode */
        #record-frame { 
            position: fixed; top: 50%; left: 40%; transform: translate(-50%, -50%); 
            border: 2px solid #ff2d55; display: none; box-shadow: 0 0 50px rgba(255,45,85,0.5);
        }

        .btn { background: #ff2d55; border: none; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin: 5px 0; }
        .btn:hover { background: #ff5e7e; }
        .btn.secondary { background: #333; }
        
        label { font-size: 12px; color: #aaa; margin-top: 10px; display: block; }
        select, input { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 8px; margin-top: 5px; border-radius: 4px; }

        .status-rec { color: #ff2d55; font-weight: bold; animation: blink 1s infinite; display: none; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

<div id="ui-root">
    <!-- Sidebar -->
    <div class="sidebar interactive">
        <h2 style="color: #ff2d55">N1K∅ PRO</h2>
        
        <label>1. АУДИО</label>
        <input type="file" id="audio-input" accept="audio/*">
        
        <label>2. 3D ФОН (ФОТО)</label>
        <input type="file" id="image-input" accept="image/*">

        <label>3. ВИЗУАЛИЗАТОР</label>
        <select id="viz-type">
            <option value="crystalHearts">💎 Crystal Hearts (Романтика)</option>
            <option value="spatialImage">🌌 Spatial Photo (Объемное фото)</option>
            <option value="nebulaLove">☁️ Nebula Love (Туманность)</option>
            <option value="hyperCubePulse">🧊 HyperCube Pulse (4D/5D)</option>
        </select>

        <label>РЕЖИМ ДВИЖЕНИЯ</label>
        <select id="movement-mode">
            <option value="orbit">Орбита</option>
            <option value="spin">Вращение</option>
            <option value="pulse">Пульсация</option>
            <option value="chaos">Хаос</option>
        </select>

        <label>ИЗМЕРЕНИЯ</label>
        <select id="dimension-mode">
            <option value="2D">2D проекция</option>
            <option value="3D" selected>3D</option>
            <option value="4D">4D проекция</option>
            <option value="5D">5D проекция</option>
        </select>

        <label>ИНТЕНСИВНОСТЬ 3D</label>
        <input type="range" id="depth-range" min="1" max="50" value="20">

        <div style="margin-top: 30px;">
            <div id="rec-status" class="status-rec">● ИДЕТ ЗАПИСЬ...</div>
            <button class="btn" id="start-rec">НАЧАТЬ ЗАПИСЬ ВИДЕО</button>
            <button class="btn secondary" id="stop-rec" style="display:none">ОСТАНОВИТЬ И СОХРАНИТЬ</button>
        </div>
    </div>

    <!-- Player Bar -->
    <div class="player-bar interactive">
        <div class="progress-container" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button id="play-btn" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">▶</button>
            <div id="time-display">00:00 / 00:00</div>
            <div style="font-size: 12px; color: #666;">Spatial Engine v2.5</div>
        </div>
    </div>
</div>

<!-- Рамка для предпросмотра записи -->
<div id="record-frame"></div>

<script>
let scene, camera, renderer, analyser, dataArray, audio, audioContext;
let visualizerGroup, backgroundParticles;
let isPlaying = false;
let recorder, recordedChunks = [];
let spatialPoints = null;

let currentViz = 'crystalHearts';
let movementMode = 'orbit';
let dimensionMode = '3D';

// данные для гиперкуба
let hyperCubeGroup = null;
let hyperCubeVertices4D = [];

// Инициализация
function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 300) / window.innerHeight, 0.1, 1000);
    camera.position.z = 50;

    renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth - 300, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    visualizerGroup = new THREE.Group();
    scene.add(visualizerGroup);

    window.addEventListener('resize', onWindowResize);
    setupAudioControls();
    setupVisualizerChange();
    setupModeControls();
    animate();
}

// 1. ТЕХНОЛОГИЯ: ОБЪЕМНОЕ ФОТО (Spatial Image)
function createSpatialImage(imgElement) {
    if (spatialPoints) scene.remove(spatialPoints);
    
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const w = 128, h = 128; // Плотность точек
    canvas.width = w; canvas.height = h;
    ctx.drawImage(imgElement, 0, 0, w, h);
    const imageData = ctx.getImageData(0, 0, w, h).data;

    const geometry = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            const r = imageData[idx] / 255;
            const g = imageData[idx+1] / 255;
            const b = imageData[idx+2] / 255;

            positions.push((x - w/2) * 0.5, (h/2 - y) * 0.5, 0);
            colors.push(r, g, b);
        }
    }

    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    
    const material = new THREE.PointsMaterial({ size: 0.2, vertexColors: true });
    spatialPoints = new THREE.Points(geometry, material);
    scene.add(spatialPoints);
}

// 2. РОМАНТИЧЕСКИЙ ВИЗУАЛИЗАТОР: Crystal Hearts
function createHearts() {
    visualizerGroup.clear();
    hyperCubeGroup = null;

    const heartShape = new THREE.Shape();
    heartShape.moveTo(0, 0);
    heartShape.bezierCurveTo(0, -3, -5, -3, -5, 0);
    heartShape.bezierCurveTo(-5, 5, 0, 8, 0, 12);
    heartShape.bezierCurveTo(0, 8, 5, 5, 5, 0);
    heartShape.bezierCurveTo(5, -3, 0, -3, 0, 0);

    for(let i=0; i<30; i++) {
        const geom = new THREE.ExtrudeGeometry(heartShape, { depth: 1, bevelEnabled: true });
        const mat = new THREE.MeshPhongMaterial({ color: 0xff2d55, shininess: 100 });
        const heart = new THREE.Mesh(geom, mat);
        heart.rotation.x = Math.PI;
        heart.position.set(Math.random()*60-30, Math.random()*40-20, Math.random()*20-10);
        heart.scale.set(0.2, 0.2, 0.2);
        visualizerGroup.add(heart);
    }
    const light = new THREE.PointLight(0xffffff, 1);
    light.position.set(0,0,20);
    visualizerGroup.add(light);
}

// 3. ТУМАННОСТЬ: Nebula Love
function createNebula() {
    visualizerGroup.clear();
    hyperCubeGroup = null;

    const geometry = new THREE.BufferGeometry();
    const count = 4000;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
        const r = 20 * Math.random();
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);

        positions[i*3] = x;
        positions[i*3+1] = y;
        positions[i*3+2] = z;

        const c = 0.4 + Math.random() * 0.6;
        colors[i*3] = c;
        colors[i*3+1] = c * 0.4;
        colors[i*3+2] = 1.0;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 0.25,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
    });

    const points = new THREE.Points(geometry, material);
    visualizerGroup.add(points);
}

// 4. МОЙ ВИЗУАЛИЗАТОР: HyperCube Pulse (4D/5D)
function createHyperCube() {
    visualizerGroup.clear();
    hyperCubeGroup = new THREE.Group();
    visualizerGroup.add(hyperCubeGroup);

    hyperCubeVertices4D = [];

    // вершины 4D-гиперкуба (tesseract): все комбинации ±1 по 4 осям
    const size = 6;
    const base = [-1, 1];
    const vertices = [];
    for (let x of base) for (let y of base) for (let z of base) for (let w of base) {
        vertices.push([x, y, z, w]);
    }

    hyperCubeVertices4D = vertices.map(v => v.map(c => c * size * 0.5));

    const material = new THREE.LineBasicMaterial({ color: 0x66ccff, transparent: true, opacity: 0.9 });

    // рёбра: соединяем вершины, отличающиеся на 1 координату
    const edges = [];
    for (let i = 0; i < hyperCubeVertices4D.length; i++) {
        for (let j = i+1; j < hyperCubeVertices4D.length; j++) {
            let diff = 0;
            for (let k = 0; k < 4; k++) {
                if (hyperCubeVertices4D[i][k] !== hyperCubeVertices4D[j][k]) diff++;
            }
            if (diff === 1) edges.push([i, j]);
        }
    }

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(edges.length * 2 * 3);
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const lineSegments = new THREE.LineSegments(geometry, material);
    hyperCubeGroup.add(lineSegments);
}

// 4D вращение
function rotate4D(point4, angleXY, angleXW) {
    let [x, y, z, w] = point4;

    // XY
    let cosA = Math.cos(angleXY), sinA = Math.sin(angleXY);
    let x1 = x * cosA - y * sinA;
    let y1 = x * sinA + y * cosA;

    // XW
    let cosB = Math.cos(angleXW), sinB = Math.sin(angleXW);
    let x2 = x1 * cosB - w * sinB;
    let w1 = x1 * sinB + w * cosB;

    return [x2, y1, z, w1];
}

// 4D -> 3D
function project4Dto3D(point4, distance = 8) {
    const [x, y, z, w] = point4;
    const k = distance / (distance - w);
    return new THREE.Vector3(x * k, y * k, z * k);
}

// 5D -> 3D (добавляем параметр v как масштаб)
function project5Dto3D(point5, distance = 8) {
    const [x, y, z, w, v] = point5;
    const k = distance / (distance - w);
    const scale = 1 + v * 0.4;
    return new THREE.Vector3(x * k * scale, y * k * scale, z * k * scale);
}

// УПРАВЛЕНИЕ АУДИО И ПЕРЕМОТКА
function setupAudioControls() {
    const audioInput = document.getElementById('audio-input');
    const playBtn = document.getElementById('play-btn');
    const progressFill = document.getElementById('progress-fill');
    const progressBar = document.getElementById('progress-bar');
    const timeDisplay = document.getElementById('time-display');

    audio = new Audio();
    
    audioInput.onchange = (e) => {
        const file = e.target.files[0];
        audio.src = URL.createObjectURL(file);
        initAudioContext();
    };

    playBtn.onclick = () => {
        if (audio.paused) { audio.play(); playBtn.innerText = '⏸'; }
        else { audio.pause(); playBtn.innerText = '▶'; }
    };

    audio.ontimeupdate = () => {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = pct + '%';
        timeDisplay.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    };

    progressBar.onclick = (e) => {
        const rect = progressBar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        audio.currentTime = pct * audio.duration;
    };

    // Загрузка фото
    document.getElementById('image-input').onchange = (e) => {
        const img = new Image();
        img.src = URL.createObjectURL(e.target.files[0]);
        img.onload = () => createSpatialImage(img);
    };
}

function initAudioContext() {
    if (audioContext) return;
    audioContext = new AudioContext();
    analyser = audioContext.createAnalyser();
    const source = audioContext.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioContext.destination);
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
}

// СИСТЕМА ЗАПИСИ
const startRecBtn = document.getElementById('start-rec');
const stopRecBtn = document.getElementById('stop-rec');
const recStatus = document.getElementById('rec-status');

startRecBtn.onclick = async () => {
    const format = document.getElementById('export-format').value;
    let w = 1080, h = 1920; // Default 9:16
    
    if (format === '16/9') { w = 1920; h = 1080; }
    if (format === '1/1') { w = 1080; h = 1080; }

    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    const stream = renderer.domElement.captureStream(60);
    // Добавляем аудиодорожку
    if (audioContext) {
        const dest = audioContext.createMediaStreamDestination();
        analyser.connect(dest);
        stream.addTrack(dest.stream.getAudioTracks()[0]);
    }

    recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
    recordedChunks = [];
    recorder.ondataavailable = e => recordedChunks.push(e.data);
    recorder.onstop = saveVideo;
    recorder.start();

    startRecBtn.style.display = 'none';
    stopRecBtn.style.display = 'block';
    recStatus.style.display = 'block';
};

stopRecBtn.onclick = () => {
    recorder.stop();
    startRecBtn.style.display = 'block';
    stopRecBtn.style.display = 'none';
    recStatus.style.display = 'none';
    onWindowResize(); // вернуть размер
};

function saveVideo() {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Visualizer_${Date.now()}.webm`;
    a.click();
}

function setupVisualizerChange() {
    const select = document.getElementById('viz-type');
    select.onchange = (e) => {
        currentViz = e.target.value;
        if (currentViz === 'crystalHearts') createHearts();
        else if (currentViz === 'nebulaLove') createNebula();
        else if (currentViz === 'hyperCubePulse') createHyperCube();
        else if (currentViz === 'spatialImage') {
            visualizerGroup.clear();
            hyperCubeGroup = null;
        }
    };
}

function setupModeControls() {
    document.getElementById('movement-mode').onchange = (e) => {
        movementMode = e.target.value;
    };
    document.getElementById('dimension-mode').onchange = (e) => {
        dimensionMode = e.target.value;
    };
}

function animate() {
    requestAnimationFrame(animate);

    let bass = 0, mid = 0, high = 0;

    if (analyser) {
        analyser.getByteFrequencyData(dataArray);
        bass = dataArray[2] / 255;
        mid = dataArray[10] / 255;
        high = dataArray[40] / 255;

        // Spatial Image
        if (spatialPoints) {
            const depth = document.getElementById('depth-range').value;
            const positions = spatialPoints.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i + 2] = Math.sin(i + Date.now() * 0.001) * (bass * depth);
            }
            spatialPoints.geometry.attributes.position.needsUpdate = true;
            spatialPoints.rotation.y = Math.sin(Date.now() * 0.0005) * 0.2;
        }

        // Hearts
        visualizerGroup.children.forEach((obj) => {
            if (obj.type === "Mesh" && currentViz === 'crystalHearts') {
                obj.scale.setScalar(0.2 + bass * 0.3);
                obj.rotation.y += 0.01 + (mid * 0.05);
            }
        });

        // Nebula
        if (currentViz === 'nebulaLove' && visualizerGroup.children[0] && visualizerGroup.children[0].isPoints) {
            const points = visualizerGroup.children[0];
            const positions = points.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                const r = Math.sqrt(positions[i]*positions[i] + positions[i+1]*positions[i+1] + positions[i+2]*positions[i+2]);
                const factor = 1 + bass * 0.4 * Math.sin(Date.now()*0.001 + r*0.1);
                positions[i] *= factor * 0.999;
                positions[i+1] *= factor * 0.999;
                positions[i+2] *= factor * 0.999;
            }
            points.geometry.attributes.position.needsUpdate = true;
            visualizerGroup.rotation.y += 0.001 + mid * 0.01;
        }

        // HyperCube Pulse
        if (currentViz === 'hyperCubePulse' && hyperCubeGroup && hyperCubeGroup.children[0]) {
            const lineSegments = hyperCubeGroup.children[0];
            const positions = lineSegments.geometry.attributes.position.array;

            const time = Date.now() * 0.001;
            const angleXY = time * 0.5;
            const angleXW = time * 0.3 + high * 2;

            const depth = 8;
            const vExtra = bass * 2;

            let idx = 0;
            // пересчёт рёбер
            const edges = [];
            for (let i = 0; i < hyperCubeVertices4D.length; i++) {
                for (let j = i+1; j < hyperCubeVertices4D.length; j++) {
                    let diff = 0;
                    for (let k = 0; k < 4; k++) {
                        if (hyperCubeVertices4D[i][k] !== hyperCubeVertices4D[j][k]) diff++;
                    }
                    if (diff === 1) edges.push([i, j]);
                }
            }

            edges.forEach(([a, b]) => {
                let pA4 = rotate4D(hyperCubeVertices4D[a], angleXY, angleXW);
                let pB4 = rotate4D(hyperCubeVertices4D[b], angleXY, angleXW);

                let pA3, pB3;

                if (dimensionMode === '3D') {
                    pA3 = project4Dto3D(pA4, depth);
                    pB3 = project4Dto3D(pB4, depth);
                } else if (dimensionMode === '2D') {
                    const pA = project4Dto3D(pA4, depth);
                    const pB = project4Dto3D(pB4, depth);
                    pA3 = new THREE.Vector3(pA.x, pA.y, 0);
                    pB3 = new THREE.Vector3(pB.x, pB.y, 0);
                } else if (dimensionMode === '4D') {
                    pA3 = project4Dto3D(pA4, depth);
                    pB3 = project4Dto3D(pB4, depth);
                } else { // 5D
                    const pA5 = [pA4[0], pA4[1], pA4[2], pA4[3], vExtra];
                    const pB5 = [pB4[0], pB4[1], pB4[2], pB4[3], vExtra];
                    pA3 = project5Dto3D(pA5, depth);
                    pB3 = project5Dto3D(pB5, depth);
                }

                // движение
                if (movementMode === 'orbit') {
                    const r = 1 + bass * 0.5;
                    pA3.x *= r; pA3.y *= r; pA3.z *= r;
                    pB3.x *= r; pB3.y *= r; pB3.z *= r;
                } else if (movementMode === 'pulse') {
                    const s = 1 + Math.sin(time * 4) * bass * 0.8;
                    pA3.multiplyScalar(s);
                    pB3.multiplyScalar(s);
                } else if (movementMode === 'spin') {
                    const rot = time * 0.7;
                    const cosR = Math.cos(rot), sinR = Math.sin(rot);
                    const ax = pA3.x * cosR - pA3.z * sinR;
                    const az = pA3.x * sinR + pA3.z * cosR;
                    const bx = pB3.x * cosR - pB3.z * sinR;
                    const bz = pB3.x * sinR + pB3.z * cosR;
                    pA3.x = ax; pA3.z = az;
                    pB3.x = bx; pB3.z = bz;
                } else if (movementMode === 'chaos') {
                    pA3.x += (Math.random()-0.5) * bass;
                    pA3.y += (Math.random()-0.5) * bass;
                    pB3.x += (Math.random()-0.5) * bass;
                    pB3.y += (Math.random()-0.5) * bass;
                }

                positions[idx++] = pA3.x;
                positions[idx++] = pA3.y;
                positions[idx++] = pA3.z;
                positions[idx++] = pB3.x;
                positions[idx++] = pB3.y;
                positions[idx++] = pB3.z;
            });

            lineSegments.geometry.attributes.position.needsUpdate = true;
        }
    }

    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = (window.innerWidth - 300) / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth - 300, window.innerHeight);
}

function formatTime(seconds) {
    if (!seconds) return "00:00";
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
}

init();
createHearts(); // по умолчанию
</script>
</body>
</html>
