<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirdropLab - Crypto Airdrops Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white min-h-screen">

<!-- SVG Definitions -->
<svg style="display: none;">
    <!-- Lab Logo -->
    <symbol id="lab-logo" viewBox="0 0 24 24">
        <path fill="currentColor" d="M7,2V4H8V18A4,4 0 0,0 12,22A4,4 0 0,0 16,18V4H17V2H7M11,16C10.4,16 10,15.6 10,15C10,14.4 10.4,14 11,14C11.6,14 12,14.4 12,15C12,15.6 11.6,16 11,16M13,12C12.4,12 12,11.6 12,11C12,10.4 12.4,10 13,10C13.6,10 14,10.4 14,11C14,11.6 13.6,12 13,12M14,7H10V4H14V7Z"/>
    </symbol>
    
    <!-- Heart Icon -->
    <symbol id="lab-heart" viewBox="0 0 24 24">
        <circle class="heart-pulse" cx="12" cy="12" r="11" fill="none" stroke-width="0.5" opacity="0"/>
        <path class="heart-outline" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path class="heart-fill" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" opacity="0"/>
        <circle class="heart-particle-1" cx="12" cy="6" r="1.5" opacity="0"/>
        <circle class="heart-particle-2" cx="18" cy="10" r="1.5" opacity="0"/>
        <circle class="heart-particle-3" cx="6" cy="10" r="1.5" opacity="0"/>
    </symbol>
    
    <!-- Check Icon -->
    <symbol id="lab-check" viewBox="0 0 24 24">
        <circle class="check-bg" cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle class="check-fill" cx="12" cy="12" r="10" opacity="0"/>
        <path class="check-mark" d="M8 12.5l3 3 5-6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
    </symbol>
</svg>

<!-- Toast Notification -->
<div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 rounded-xl px-6 py-3 shadow-2xl z-[9999] flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300">
    <i class="fas fa-info-circle text-blue-400"></i>
    <span id="toastMessage" class="text-white font-medium"></span>
</div>

<!-- Loading Screen -->
<div id="loading" class="hidden">
    <div class="spinner"></div>
</div>

<!-- Header -->
<header class="bg-slate-900/50 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <svg class="w-6 h-6 text-white"><use href="#lab-logo"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">AirdropLab</h1>
                    <p class="text-xs text-slate-400">Crypto Airdrops Tracker</p>
                </div>
            </div>

            <!-- Auth Section -->
            <div id="authSection" class="flex items-center gap-3">
                <button onclick="window.openLoginModal()" class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 px-6 py-2.5 rounded-lg font-semibold transition-all shadow-lg shadow-cyan-500/20">
                    <i class="fas fa-sign-in-alt mr-2"></i>Войти
                </button>
            </div>

            <!-- User Section -->
            <div id="userSection" class="hidden flex items-center gap-3">
                <button onclick="window.openAddProjectModal()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg font-semibold transition-colors">
                    <i class="fas fa-plus mr-2"></i><span class="hidden sm:inline">Добавить</span>
                </button>
                
                <div class="relative">
                    <button onclick="window.toggleUserMenu()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg">
                        <img id="userAvatar" src="" alt="User" class="w-8 h-8 rounded-full border-2 border-slate-700">
                        <span id="userName" class="hidden sm:inline font-medium"></span>
                        <i class="fas fa-chevron-down text-xs"></i>
                    </button>
                    
                    <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-slate-800 rounded-lg shadow-xl border border-slate-700 overflow-hidden">
                        <button onclick="window.logout()" class="w-full px-4 py-3 text-left hover:bg-slate-700 transition-colors flex items-center gap-2">
                            <i class="fas fa-sign-out-alt text-red-400"></i>
                            <span>Выйти</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Main Container -->
<div class="main-container">
    <!-- Left Sidebar -->
    <aside class="w-64 flex-shrink-0 hidden lg:block">
        <div class="glass-card rounded-2xl p-4 sticky top-24">
            <h3 class="font-bold text-lg mb-4">Фильтры</h3>
            <div class="space-y-2">
                <button data-status="all" class="sidebar-link status-btn w-full text-left px-4 py-2 rounded-lg">
                    <i class="fas fa-list mr-2"></i>Все проекты <span id="countAll" class="float-right text-slate-500">0</span>
                </button>
                <button data-status="active" class="sidebar-link status-btn w-full text-left px-4 py-2 rounded-lg">
                    <i class="fas fa-check-circle mr-2"></i>Активные <span id="countActive" class="float-right text-slate-500">0</span>
                </button>
                <button data-status="ended" class="sidebar-link status-btn w-full text-left px-4 py-2 rounded-lg">
                    <i class="fas fa-times-circle mr-2"></i>Завершённые <span id="countEnded" class="float-right text-slate-500">0</span>
                </button>
                <button data-status="daily" class="sidebar-link status-btn w-full text-left px-4 py-2 rounded-lg">
                    <i class="fas fa-fire mr-2"></i>Ежедневные <span id="countDaily" class="float-right text-slate-500">0</span>
                </button>
                <button data-status="favorites" class="sidebar-link status-btn w-full text-left px-4 py-2 rounded-lg">
                    <i class="fas fa-heart mr-2"></i>Избранное <span id="countFavorites" class="float-right text-slate-500">0</span>
                </button>
                <button data-status="completed" class="sidebar-link status-btn w-full text-left px-4 py-2 rounded-lg">
                    <i class="fas fa-check-double mr-2"></i>Завершено мной <span id="countCompleted" class="float-right text-slate-500">0</span>
                </button>
                <button data-status="unvisited" class="sidebar-link status-btn w-full text-left px-4 py-2 rounded-lg">
                    <i class="fas fa-eye-slash mr-2"></i>Непросмотренные <span id="countUnvisited" class="float-right text-slate-500">0</span>
                </button>
                <button data-status="today" class="sidebar-link status-btn w-full text-left px-4 py-2 rounded-lg">
                    <i class="fas fa-clock mr-2"></i>Сегодня <span id="countToday" class="float-right text-slate-500">0</span>
                </button>
            </div>
            
            <div class="mt-6">
                <h4 class="font-semibold text-sm mb-3">Категории</h4>
                <div id="categoryFilters" class="flex flex-wrap gap-2"></div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 min-w-0">
        <!-- Stats -->
        <section class="mb-6">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div class="glass-card rounded-xl p-4">
                    <div class="text-2xl font-bold" id="totalProjects">0</div>
                    <div class="text-sm text-slate-400">Всего проектов</div>
                </div>
                <div class="glass-card rounded-xl p-4">
                    <div class="text-2xl font-bold text-green-400" id="activeProjects">0</div>
                    <div class="text-sm text-slate-400">Активных</div>
                </div>
                <div class="glass-card rounded-xl p-4">
                    <div class="text-2xl font-bold text-blue-400" id="completedProjects">0</div>
                    <div class="text-sm text-slate-400">Завершено</div>
                </div>
            </div>
        </section>

        <!-- Search & Controls -->
        <section class="mb-6">
            <div class="glass-card rounded-xl p-4">
                <div class="flex gap-4 flex-wrap">
                    <input type="text" id="searchInput" placeholder="Поиск проектов..." class="flex-1 min-w-[200px] bg-slate-900 border border-slate-700 rounded-lg px-4 py-2">
                    <select id="sortSelect" class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-2">
                        <option value="latest">Новые</option>
                        <option value="name">По названию</option>
                        <option value="priority">По приоритету</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Projects Grid -->
        <section id="projects">
            <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            
            <div id="emptyState" class="hidden text-center py-16">
                <i class="fas fa-inbox text-5xl text-slate-600 mb-4"></i>
                <h3 class="text-xl font-semibold text-slate-400">Проекты не найдены</h3>
            </div>

            <div id="paginationControls" class="pagination-wrapper mt-8"></div>
        </section>
    </main>

    <!-- Right Sidebar -->
    <aside class="right-sidebar hidden xl:block">
        <div class="lab-container">
            <!-- Crypto Bar -->
            <div id="cr-widget-marquee" data-coins="bitcoin,ethereum,tether,binancecoin,solana,ripple,usd-coin,staked-ether,dogecoin,cardano" data-theme="dark" data-show-symbol="true" data-show-icon="true" data-show-period-change="true" data-period-change="24H" data-api-url="https://api.cryptorank.io/v0"></div>
            <script defer src="https://widgets.cryptorank.io/widget/marquee.js"></script>

            <!-- Lab Content -->
            <div class="lab-specimens mt-6">
                <!-- Specimens будут добавлены через JS -->
            </div>
        </div>
    </aside>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="text-2xl font-bold">Вход</h2>
            <button onclick="window.closeLoginModal()" class="text-slate-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <div class="modal-body">
            <form onsubmit="window.handleEmailAuth(event)" class="space-y-4">
                <input type="email" id="emailInput" placeholder="Email" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2" required>
                <input type="password" id="passInput" placeholder="Пароль" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2" required>
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2 rounded-lg">Войти</button>
                    <button type="button" onclick="window.handleRegister()" class="flex-1 bg-green-600 hover:bg-green-500 py-2 rounded-lg">Регистрация</button>
                </div>
            </form>
            <div class="grid grid-cols-2 gap-3 mt-4">
                <button onclick="window.loginGoogle()" class="bg-slate-800 hover:bg-slate-700 py-2 rounded-lg">
                    <i class="fab fa-google text-red-400 mr-2"></i>Google
                </button>
                <button onclick="window.loginTwitter()" class="bg-slate-800 hover:bg-slate-700 py-2 rounded-lg">
                    <i class="fab fa-twitter text-blue-400 mr-2"></i>Twitter
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Detail Modal -->
<div id="detailModal" class="modal hidden">
    <div class="modal-content modal-large">
        <div class="modal-header">
            <h2 id="detailName" class="text-2xl font-bold"></h2>
            <button onclick="window.closeDetailModal()" class="text-slate-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <div class="modal-body">
            <p id="detailDesc" class="text-slate-400 mb-4"></p>
            <div id="detailCategory" class="flex flex-wrap gap-2 mb-4"></div>
            <span id="detailStatus" class="status-badge mb-4"></span>
            <div id="detailLinks" class="flex flex-wrap gap-2 mb-6"></div>
            <ul id="detailFeatures" class="space-y-2 mb-6"></ul>
            <div id="detailActivities"></div>
            <div id="detailScreenshots" class="hidden mt-6">
                <h3 class="font-semibold mb-3">Скриншоты</h3>
                <div id="screenshotsGrid" class="grid grid-cols-3 gap-2"></div>
            </div>
        </div>
    </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="image-modal hidden">
    <span class="image-modal-close" onclick="window.closeLightbox()">&times;</span>
    <img id="lightboxImage" class="image-modal-content" src="">
    <div class="image-caption" id="lightboxCounter"></div>
    <div class="image-modal-nav">
        <button id="lightboxPrev" onclick="window.prevImage()"><i class="fas fa-chevron-left"></i></button>
        <button id="lightboxNext" onclick="window.nextImage()"><i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<!-- Feedback Modal -->
<div id="feedbackModal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="text-xl font-bold">Отзыв о проекте <span id="feedbackProjectName"></span></h2>
            <button onclick="window.closeFeedbackModal()" class="text-slate-400 hover:text-white">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="feedbackForm" onsubmit="window.submitFeedback(); return false;">
                <div class="mb-4">
                    <label class="block mb-2">Оценка:</label>
                    <div class="flex gap-2">
                        <i class="rating-star fas fa-star text-2xl cursor-pointer" onclick="window.setFeedbackRating(1)"></i>
                        <i class="rating-star fas fa-star text-2xl cursor-pointer" onclick="window.setFeedbackRating(2)"></i>
                        <i class="rating-star fas fa-star text-2xl cursor-pointer" onclick="window.setFeedbackRating(3)"></i>
                        <i class="rating-star fas fa-star text-2xl cursor-pointer" onclick="window.setFeedbackRating(4)"></i>
                        <i class="rating-star fas fa-star text-2xl cursor-pointer" onclick="window.setFeedbackRating(5)"></i>
                    </div>
                </div>
                <textarea id="feedbackComment" placeholder="Комментарий..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 mb-4" rows="4"></textarea>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg">Отправить</button>
            </form>
        </div>
    </div>
</div>

<!-- Project Modal (Admin) -->
<div id="projectModal" class="modal hidden">
    <div class="modal-content modal-xl">
        <div class="modal-header">
            <h2 id="modalTitle">Добавить проект</h2>
            <button onclick="window.closeProjectModal()" class="text-slate-400 hover:text-white">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="projectForm" onsubmit="window.saveProject(); return false;">
                <!-- Form fields will be populated by admin.js -->
                <div id="activitiesList" class="space-y-2 mb-4"></div>
                <button type="button" onclick="window.addActivityField()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg mb-4">
                    <i class="fas fa-plus mr-2"></i>Добавить активность
                </button>
                
                <div id="screenshotsList" class="space-y-2 mb-4"></div>
                <button type="button" onclick="window.addScreenshotField()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg mb-4">
                    <i class="fas fa-plus mr-2"></i>Добавить скриншот
                </button>
                
                <div class="modal-footer">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg">
                        <i class="fas fa-save mr-2"></i>Сохранить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Admin Panel -->
<div id="adminPanel" class="hidden">
    <h3>Админ-панель</h3>
    <button onclick="window.openAddProjectModal()" class="admin-action-btn admin-btn-purple">
        <i class="fas fa-plus"></i><span>Добавить проект</span>
    </button>
</div>

<!-- Admin Badge -->
<div id="adminBadge" class="hidden">ADMIN</div>

<!-- Firebase Scripts (ES Modules) -->
<script type="module" src="firebase.js"></script>
<script type="module" src="config.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="ui.js"></script>
<script type="module" src="admin.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
