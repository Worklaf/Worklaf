<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
    <style>
        @media (prefers-color-scheme: dark) {
            .flask-bg { fill: #0F172A; }
            .flask-stroke { stroke: #22d3ee; }
            .flask-fill { fill: #22d3ee; } /* Цвет заливки для темной темы */
        }
        @media (prefers-color-scheme: light) {
            .flask-bg { fill: #E2E8F0; }
            .flask-stroke { stroke: #0891b2; }
            .flask-fill { fill: #0891b2; } /* Цвет заливки для светлой темы */
        }
    </style>
    <!-- Фон -->
    <rect width="48" height="48" rx="8" class="flask-bg"/>
    <!-- Контур колбы -->
    <path class="flask-stroke" d="M18 6h12M24 6v10M16 16l-4 16c-1 4 2 8 6 8h12c4 0 7-4 6-8l-4-16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Кружок внутри (теперь использует класс flask-fill) -->
    <circle cx="24" cy="28" r="2.5" class="flask-fill" opacity="0.7"/>
</svg>
