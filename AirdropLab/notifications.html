<div id="notification-overlay" class="notification-overlay hidden">
    <div class="notification-modal">
        <div class="notification-header">
            <span class="notification-icon" id="notif-icon">ℹ️</span>
            <h2 class="notification-title" id="notif-title">Уведомление</h2>
            <button class="notification-close" onclick="closeNotification()">✕</button>
        </div>
        
        <div class="notification-body" id="notif-body">
            <!-- Динамический контент -->
        </div>
        
        <div class="notification-footer">
            <button class="btn btn-primary" onclick="closeNotification()">Понятно</button>
            <button class="btn btn-secondary" id="notif-action" style="display: none;">Действие</button>
        </div>
    </div>
</div>
