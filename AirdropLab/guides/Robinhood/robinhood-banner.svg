<svg width="1400" height="350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1826;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1220;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d09e;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#00ffb8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a67e;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffb8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d09e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Фильтры для свечения -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Фон -->
  <rect width="1400" height="350" fill="url(#bgGradient)"/>
  
  <!-- Декоративная сетка -->
  <g opacity="0.08" stroke="#00d09e" stroke-width="0.5" fill="none">
    <line x1="0" y1="100" x2="1400" y2="100"/>
    <line x1="0" y1="250" x2="1400" y2="250"/>
    <line x1="200" y1="0" y2="350"/>
    <line x1="500" y1="0" y2="350"/>
    <line x1="900" y1="0" y2="350"/>
    <line x1="1200" y1="0" y2="350"/>
  </g>
  
  <!-- Светящиеся круги (декор) -->
  <circle cx="150" cy="175" r="100" fill="#00d09e" opacity="0.05" filter="url(#strongGlow)"/>
  <circle cx="1250" cy="175" r="120" fill="#00ffb8" opacity="0.06" filter="url(#strongGlow)"/>
  
  <!-- Геометрические элементы -->
  <g opacity="0.15">
    <rect x="50" y="50" width="60" height="60" fill="none" stroke="#00d09e" stroke-width="2" rx="8"/>
    <circle cx="1300" cy="80" r="30" fill="none" stroke="#00ffb8" stroke-width="2"/>
    <polygon points="1320,270 1350,320 1290,320" fill="none" stroke="#00d09e" stroke-width="2"/>
  </g>
  
  <!-- Верхняя линия акцента -->
  <rect x="0" y="0" width="1400" height="4" fill="url(#accentGlow)"/>
  
  <!-- Главный логотип / иконка слева -->
  <g transform="translate(100, 175)">
    <!-- Стрелка вверх в круге (символ роста) -->
    <circle r="50" fill="none" stroke="url(#accentGlow)" stroke-width="3" filter="url(#glow)"/>
    <path d="M 0,-25 L 15,-10 L 5,-10 L 5,25 L -5,25 L -5,-10 L -15,-10 Z" 
          fill="url(#accentGlow)" filter="url(#glow)"/>
  </g>
  
  <!-- Основной текст -->
  <g transform="translate(700, 175)" text-anchor="middle">
    <!-- ROBINHOOD CHAIN -->
    <text x="0" y="-30" 
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
          font-size="62" 
          font-weight="700" 
          fill="url(#textGradient)"
          filter="url(#glow)"
          letter-spacing="2">
      ROBINHOOD CHAIN
    </text>
    
    <!-- TESTNET -->
    <text x="0" y="20" 
          font-family="'Segoe UI', Arial, sans-serif" 
          font-size="28" 
          font-weight="600" 
          fill="#00d09e"
          letter-spacing="4">
      T E S T N E T
    </text>
    
    <!-- Подзаголовок -->
    <text x="0" y="55" 
          font-family="'Segoe UI', Arial, sans-serif" 
          font-size="16" 
          font-weight="400" 
          fill="#94a3b8"
          letter-spacing="1">
      Built for Onchain Finance • Layer 2 on Arbitrum
    </text>
  </g>
  
  <!-- Статус бейдж справа -->
  <g transform="translate(1260, 175)">
    <rect x="-65" y="-20" width="130" height="40" rx="20" 
          fill="rgba(0, 208, 158, 0.15)" 
          stroke="#00d09e" 
          stroke-width="2"/>
    <text x="0" y="7" 
          text-anchor="middle" 
          font-family="'Segoe UI', Arial, sans-serif" 
          font-size="14" 
          font-weight="700" 
          fill="#00ffb8"
          letter-spacing="1">
      LIVE NOW
    </text>
    <circle cx="-45" cy="0" r="5" fill="#00ffb8" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Нижняя декоративная линия -->
  <rect x="0" y="346" width="1400" height="4" fill="url(#accentGlow)" opacity="0.6"/>
  
  <!-- Точки-акценты -->
  <g fill="#00ffb8" opacity="0.6">
    <circle cx="350" cy="40" r="3"/>
    <circle cx="750" cy="310" r="3"/>
    <circle cx="1050" cy="40" r="3"/>
  </g>
</svg>
